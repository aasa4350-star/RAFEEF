<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
  :root{
    --accent:#0d9488; --accent-deep:#115e59;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:8px;margin:14px 0 8px}
  .chapsel button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 8px;border-radius:13px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:104px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.1rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .ax{direction:rtl;unicode-bidi:isolate;display:inline-block;font-weight:inherit}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.1rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"hasan").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ var s = Number(Math.abs(n)).toLocaleString('en-US'); return (n<0 ? "\u2212" : "")+s; } // فاصلة آلاف + إشارة سالب رياضية
function mn(s){ return '<span class="en">'+s+'</span>'; }
// خيارات رقمية مميّزة: الصحيح + مشتّتات
function numOpts(correct, cands){
  /* لا بدّ من ثلاثة خيارات متمايزة. المشتّتات المقترحة قد تتصادم مع الجواب
     أو ببعضها (مثلًا حين يتساوى الطرفان في معادلة)، فنُتبعها باحتياطيٍّ
     موسَّع. وإن لم تكتمل الثلاثة رجّعنا null فيتخطّى genN المولّد ويعيد
     المحاولة — أهون من عرض خيارين على الطفل. */
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([correct+1, correct-1, correct+2, correct-2, correct+3,
                           correct+5, correct+10, correct*2, correct*2+1, correct+100]);
  for(var i=0;i<pool.length && others.length<2;i++){
    var v=pool[i];
    if(v!==correct && v>=0 && isFinite(v) && !seen[v]){ seen[v]=1; others.push(v); }
  }
  if(others.length<2) return null;
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}

/* ============================================================
   رياضيات ثاني متوسط — الفصل ١: الجبر والدوال
   الدروس ١-١ و١-٢ و١-٣، مبنيّة من كتاب رفيف نفسه (ص ١٢–٢٤).
   كل مولّد فوقه رقم الدرس والصفحة التي أُخذ منها نوع السؤال.
   ============================================================ */
/* ===== دوالّ مساعدة ===== */
var SUP = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
function sup(n){ return String(n).split("").map(function(d){ return SUP[+d]; }).join(""); }
function pw(b,e){ return mn(b+sup(e)); }
function tmz(n, sing, plur){ return (n>=3 && n<=10) ? plur : sing; }
function ryl(n){ return tmz(n,"ريالًا","ريالات"); }
function ax(s){ return '<span class="ax">'+s+'</span>'; }   /* عبارة جبرية بحروف عربية: عزل RTL */
function pz(n){ return n<0 ? "("+fmt(n)+")" : fmt(n); }
/* خيارات لأعداد صحيحة (تسمح بالسالب) */
function zOpts(correct, cands){
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([-correct, correct+1, correct-1, correct+2, correct+10]);
  for(var i=0;i<pool.length && others.length<2;i++){ var v=pool[i]; if(v!==correct && !seen[v]){ seen[v]=1; others.push(v); } }
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}
/* خيارات نصّية متمايزة */
function sOpts(right, cands){
  /* كسابقتها: ثلاثة متمايزة أو null. المشتّتات هنا نصوص فلا يمكن توليد
     احتياطيٍّ لها، والبديل الوحيد أن يتخطّى genN هذه التوليدة. */
  var o=[right];
  for(var i=0;i<cands.length && o.length<3;i++){ if(cands[i]!=null && o.indexOf(cands[i])<0) o.push(cands[i]); }
  if(o.length<3) return null;
  shuffle(o); return [o, o.indexOf(right)];
}

/* ============================================================
   رياضيات ثالث متوسط — الفصل الأول: المعادلات الخطية (ص 10–29)
   ============================================================ */

var VARS9 = ["س","ص","ن","م","ق","ك","ل"];

/* ===== الدرس 1-1: المعادلات (ص 12–17) ===== */

/* ص13 مثال 2: حلّ معادلة بترتيب العمليات */
function gEqOrderOps(){
  var b = ri(2,6), e = 2, c = ri(2,9), dv = gp([2,4,5]);
  var inner = Math.pow(b,e) - c;
  if(inner <= 0 || inner % dv !== 0){ b = 5; c = 5; dv = 2; inner = 20; }
  var add = ri(2,15), r = add + inner/dv;
  var o = numOpts(r, [add + inner, inner/dv, add + Math.pow(b,e)]);
  return ["ما حلّ المعادلة: "+ax("ب = "+add+" + ("+b+sup(e)+" − "+c+") ÷ "+dv)+" ؟",
    o[0], o[1],
    "بترتيب العمليات: "+mn(b+sup(e)+" = "+Math.pow(b,e))+"، ثمّ "+mn(Math.pow(b,e)+" − "+c+" = "+inner)+"، ثمّ "+mn(inner+" ÷ "+dv+" = "+(inner/dv))+"، ثمّ الجمع ⇐ "+mn(r)+"."];
}

/* ص15: مجموعة الحلّ من مجموعة تعويض */
function gSolutionSet(){
  var a = ri(2,15), x = ri(10,20), b = x+a;
  var setv = [x-2,x-1,x,x+1,x+2];
  var right = "{ "+x+" }";
  var o = sOpts(right, ["{ "+(x+1)+" }", "{ "+(x-1)+" }", "{ "+b+" }"]);
  return ["أوجد مجموعة الحلّ للمعادلة "+ax("س + "+a+" = "+b)+" إذا كانت مجموعة التعويض "+ax("{ "+setv.join(" ، ")+" }")+" :",
    o[0].map(ax), o[1],
    "نعوّض كلّ عنصر: العنصر الوحيد الذي يجعل الجملة صحيحة هو "+mn(x)+" لأنّ "+mn(x+" + "+a+" = "+b)+" ⇐ مجموعة الحلّ "+ax(right)+"."];
}

/* ص14 مثال 4: متطابقة أم بلا حلّ */
function gIdentityOrNone(){
  var a = ri(2,6), b = ri(1,9), c = ri(1,9);
  var kind = gp([0,1]);   /* 0 = متطابقة، 1 = لا حلّ */
  var left, rightSide;
  if(kind===0){ left = a+"(س + "+b+")"; rightSide = a+"س + "+(a*b); }
  else { left = "س + "+b; rightSide = "س + "+(b+c); }
  var right = kind===0 ? "متطابقة، وحلّها مجموعة الأعداد الحقيقية" : "لا حلّ لها، ومجموعة حلّها Ø";
  var o = ["متطابقة، وحلّها مجموعة الأعداد الحقيقية", "لا حلّ لها، ومجموعة حلّها Ø", "لها حلٌّ واحدٌ فقط"]; shuffle(o);
  return ["صنّف المعادلة: "+ax(left+" = "+rightSide),
    o, o.indexOf(right),
    kind===0 ? ("بخاصيّة التوزيع: "+ax(left+" = "+a+"س + "+(a*b))+" — الطرفان متطابقان فهي صحيحة لأيّ قيمةٍ لـ"+ax("س")+".")
             : ("الطرفان لا يتساويان لأيّ قيمةٍ لـ"+ax("س")+": الأيمن أكبر من الأيسر بمقدار "+mn(c)+" دائمًا ⇐ لا حلّ.")];
}

/* ص14 مثال 5: معادلة بمتغيّرين — التعويض */
function gEqTwoVars(){
  var base = gp([20,25,30,35,40]), per = gp([3,4,5,6]), m = ri(4,12);
  var r = base + per*m;
  var o = numOpts(r, [base+per+m, per*m, base*per]);
  return ["يدفع مشترِكٌ "+mn(base)+" "+ryl(base)+" شهريًّا، بالإضافة إلى "+mn(per)+" "+ryl(per)+" عن كلّ رسالة. المعادلة "+ax("ك = "+base+" + "+per+"م")+" تُعطي الكلفة "+ax("ك")+" عند إرسال "+ax("م")+" رسالة. كم يدفع إذا أرسل "+mn(m)+" "+tmz(m,"رسالةً","رسائل")+"؟",
    o[0], o[1],
    "نعوّض عن "+ax("م")+" بـ"+mn(m)+": "+mn(base+" + "+per+" × "+m+" = "+base+" + "+(per*m)+" = "+r)+" "+ryl(r)+"."];
}

/* ص12–15: المصطلحات */
function gEqTerms9(){
  var C = [
    ["ما مجموعة التعويض؟", "مجموعة الأعداد التي نعوّض بها عن المتغيّر لإيجاد الحلّ", ["مجموعة الحلول الصحيحة فقط","مجموعة الأعداد الحقيقية دائمًا","مجموعة معاملات المعادلة"]],
    ["ما مجموعة الحلّ؟", "مجموعة عناصر مجموعة التعويض التي تجعل المعادلة صحيحة", ["كلّ عناصر مجموعة التعويض","مجموعة الأعداد الصحيحة","المتغيّرات في المعادلة"]],
    ["ما المتطابقة؟", "معادلةٌ صحيحةٌ لجميع قيم المتغيّر", ["معادلةٌ لا حلّ لها","معادلةٌ لها حلٌّ واحد","عبارةٌ جبريةٌ بلا يساوي"]],
    ["إذا لم يكن للمعادلة حلٌّ، فمجموعة حلّها:", "المجموعة الخالية Ø", ["مجموعة الأعداد الحقيقية","{ 0 }","لا تُكتب"]],
    ["ما الفرق بين المعادلة والعبارة الجبرية؟", "المعادلة فيها إشارة «يساوي» أمّا العبارة فلا", ["العبارة فيها متغيّر والمعادلة بلا متغيّر","المعادلة لا تُحلّ","لا فرق بينهما"]]
  ];
  var c = gp(C), o = [c[1]].concat(c[2]); shuffle(o);
  return [c[0], o, o.indexOf(c[1]),
    "مجموعة التعويض ما نجرّبه، ومجموعة الحلّ ما نجح منه. والمتطابقة صحيحةٌ لكلّ القيم، وما لا حلّ له مجموعة حلّه Ø."];
}

/* ===== الدرس 1-2: حلّ المعادلات ذات الخطوة الواحدة (ص 20–25) ===== */

/* ص21 مثال 1: خاصيّة الجمع في المساواة */
function gOneStepAdd(){
  var v = gp(VARS9), a = ri(3,60), x = ri(-20,80), b = x+a;
  var o = zOpts(x, [b+a, a-b, b]);
  return ["حُلَّ المعادلة: "+ax(v+" + "+a+" = "+fmt(b)),
    o[0], o[1],
    "بخاصيّة الطرح في المساواة نطرح "+mn(a)+" من الطرفين ⇐ "+mn(fmt(b)+" − "+a+" = "+fmt(x))+"."];
}
/* ص21 مثال 2 */
function gOneStepSub(){
  var v = gp(VARS9), a = ri(3,60), b = ri(-20,80), x = b+a;
  var o = zOpts(x, [b-a, a-b, b]);
  return ["حُلَّ المعادلة: "+ax(v+" − "+a+" = "+fmt(b)),
    o[0], o[1],
    "بخاصيّة الجمع في المساواة نضيف "+mn(a)+" إلى الطرفين ⇐ "+mn(fmt(b)+" + "+a+" = "+fmt(x))+"."];
}
/* ص21: خاصيّة القسمة في المساواة */
function gOneStepMul(){
  var v = gp(VARS9), a = ri(2,15), x = gp([-1,1])*ri(2,20), b = a*x;
  var o = zOpts(x, [b, b-a, -x]);
  return ["حُلَّ المعادلة: "+ax(a+v+" = "+fmt(b)),
    o[0], o[1],
    "بخاصيّة القسمة في المساواة نقسم الطرفين على "+mn(a)+" ⇐ "+mn(fmt(b)+" ÷ "+a+" = "+fmt(x))+"."];
}
/* ص21: خاصيّة الضرب في المساواة */
function gOneStepDiv(){
  var v = gp(VARS9), a = ri(2,12), b = gp([-1,1])*ri(2,20), x = a*b;
  var o = zOpts(x, [b, b+a, -x]);
  return ["حُلَّ المعادلة: "+ax(v+" ÷ "+a+" = "+fmt(b)),
    o[0], o[1],
    "بخاصيّة الضرب في المساواة نضرب الطرفين في "+mn(a)+" ⇐ "+mn(fmt(b)+" × "+a+" = "+fmt(x))+"."];
}
/* ص24: من جملةٍ كلامية إلى معادلة ثمّ حلّها */
function gOneStepWord(){
  var k = gp([3,4,5,6,7,8]), x = ri(6,40), total = k*x;
  var o = numOpts(x, [total, total-k, k+x]);
  var NAMEK = ["ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية"][k-3];
  return [NAMEK+" أمثال عددٍ تساوي "+mn(total)+". ما ذلك العدد؟",
    o[0], o[1],
    "المعادلة "+ax(k+"س = "+total)+"، ونقسم الطرفين على "+mn(k)+" ⇐ "+mn(total+" ÷ "+k+" = "+x)+"."];
}
/* ص21: تسمية الخاصيّة المستعملة */
function gPropEquality(){
  var a = ri(3,20), b = ri(5,60);
  var C = [
    ["أيّ خاصيّةٍ تستعملها لحلّ "+ax("س + "+a+" = "+b)+" ؟", "خاصيّة الطرح في المساواة", ["خاصيّة الجمع في المساواة","خاصيّة الضرب في المساواة","خاصيّة القسمة في المساواة"]],
    ["أيّ خاصيّةٍ تستعملها لحلّ "+ax("س − "+a+" = "+b)+" ؟", "خاصيّة الجمع في المساواة", ["خاصيّة الطرح في المساواة","خاصيّة الضرب في المساواة","خاصيّة القسمة في المساواة"]],
    ["أيّ خاصيّةٍ تستعملها لحلّ "+ax(a+"س = "+b)+" ؟", "خاصيّة القسمة في المساواة", ["خاصيّة الضرب في المساواة","خاصيّة الجمع في المساواة","خاصيّة الطرح في المساواة"]],
    ["أيّ خاصيّةٍ تستعملها لحلّ "+ax("س ÷ "+a+" = "+b)+" ؟", "خاصيّة الضرب في المساواة", ["خاصيّة القسمة في المساواة","خاصيّة الجمع في المساواة","خاصيّة الطرح في المساواة"]]
  ];
  var c = gp(C), o = [c[1]].concat(c[2]); shuffle(o);
  return [c[0], o, o.indexOf(c[1]),
    "نستعمل العملية العكسية على الطرفين معًا: عكس الجمع طرحٌ، وعكس الطرح جمعٌ، وعكس الضرب قسمةٌ، وعكس القسمة ضربٌ."];
}
/* ص22 مثال 3: مسألة من واقع الحياة */
function gOneStepReal(){
  var per = gp([6,8,9,12,15]), k = ri(4,14), total = per*k;
  var o = numOpts(k, [total, total-per, per+k]);
  return ["قُسِمت "+mn(total)+" "+tmz(total,"قطعةً","قطع")+" من الحلوى بالتساوي على عددٍ من الأطفال، فأخذ كلُّ طفلٍ "+mn(per)+" "+tmz(per,"قطعةً","قطع")+". كم عدد الأطفال؟",
    o[0], o[1],
    "المعادلة "+ax(per+"س = "+total)+" ⇐ "+mn(total+" ÷ "+per+" = "+k)+" أطفال."];
}


/* ===== الدرس 1-3: حلّ المعادلات المتعدّدة الخطوات (ص 28–32) ===== */

/* ص28 مثال 1: aس + b = c */
function gMultiStep(){
  var v = gp(VARS9), a = ri(2,12), x = ri(-15,20), b = gp([-1,1])*ri(2,30), c = a*x + b;
  var o = zOpts(x, [c-b, Math.round(c/a), c+b]);
  return ["حُلَّ المعادلة: "+ax(a+v+" "+(b<0?"− "+Math.abs(b):"+ "+b)+" = "+fmt(c)),
    o[0], o[1],
    "نتخلّص من الجمع أو الطرح أوّلًا: "+mn(fmt(c)+" "+(b<0?"+ "+Math.abs(b):"− "+b)+" = "+fmt(a*x))+"، ثمّ نقسم على "+mn(a)+" ⇐ "+ax(v+" = "+fmt(x))+"."];
}

/* ص30 تمرين: c = aس − b مع مُعامِلٍ سالب */
function gMultiStepNeg(){
  var v = gp(VARS9), a = -ri(2,10), x = ri(-12,15), b = ri(2,25), c = a*x - b;
  var o = zOpts(x, [c+b, -x, Math.round(c/a)+1]);
  return ["حُلَّ المعادلة: "+ax(fmt(c)+" = "+fmt(a)+v+" − "+b),
    o[0], o[1],
    "نضيف "+mn(b)+" للطرفين: "+mn(fmt(c)+" + "+b+" = "+fmt(a*x))+"، ثمّ نقسم على "+mn(fmt(a))+" ⇐ "+ax(v+" = "+fmt(x))+"."];
}

/* ص28 مثال: (س − b) ÷ a = c */
function gMultiStepFrac(){
  var v = gp(VARS9), a = ri(2,12), c = ri(-10,15), b = ri(2,25), x = a*c + b;
  var o = zOpts(x, [a*c, c+b, a*c-b]);
  return ["حُلَّ المعادلة: "+ax("("+v+" − "+b+") ÷ "+a+" = "+fmt(c)),
    o[0], o[1],
    "نضرب الطرفين في "+mn(a)+": "+mn(fmt(c)+" × "+a+" = "+fmt(a*c))+"، ثمّ نضيف "+mn(b)+" ⇐ "+ax(v+" = "+fmt(x))+"."];
}

/* ص29 مثال 3: ثلاثة أعداد فردية متتالية */
function gConsecOdd(){
  var n = 2*ri(-15,15) + 1, S = 3*n + 6;
  var o = zOpts(n, [S/3, n+2, n+4]);
  return ["أوجد أصغر ثلاثة أعدادٍ صحيحةٍ فرديةٍ متتاليةٍ مجموعها "+mn(fmt(S))+" :",
    o[0], o[1],
    "لتكن "+ax("ن")+" أصغرها، فالأعداد "+ax("ن")+" و"+ax("ن + 2")+" و"+ax("ن + 4")+" ⇐ "+ax("3ن + 6 = "+fmt(S))+" ⇐ "+ax("ن = "+fmt(n))+"."];
}

/* ص29: ثلاثة أعداد صحيحة متتالية */
function gConsecInt(){
  var mid = ri(-20,25), S = 3*mid;
  var o = zOpts(mid-1, [mid, mid+1, S]);
  return ["أوجد أصغر ثلاثة أعدادٍ صحيحةٍ متتاليةٍ مجموعها "+mn(fmt(S))+" :",
    o[0], o[1],
    "لتكن "+ax("ن")+" أصغرها ⇐ "+ax("3ن + 3 = "+fmt(S))+" ⇐ "+ax("ن = "+fmt(mid-1))+" (والأعداد "+mn(fmt(mid-1))+" و"+mn(fmt(mid))+" و"+mn(fmt(mid+1))+")."];
}

/* ص29 مثال 2: مسألة نقود متعدّدة الخطوات */
function gMoneyMulti(){
  var k = gp([3,4,5]), less = gp([10,15,20,25,30]), saad = ri(20,90), naif = k*saad - less;
  var o = numOpts(saad, [naif, naif+less, Math.round(naif/k)]);
  return ["مع نايفٍ مبلغٌ يساوي "+mn(k)+" أمثال ما مع سعدٍ ناقصًا "+mn(less)+" "+ryl(less)+". فإذا كان مع نايفٍ "+mn(naif)+" "+ryl(naif)+"، فكم مع سعد؟",
    o[0], o[1],
    "المعادلة "+ax(k+"س − "+less+" = "+naif)+" ⇐ "+mn(naif+" + "+less+" = "+(naif+less))+"، ثمّ "+mn((naif+less)+" ÷ "+k+" = "+saad)+" "+ryl(saad)+"."];
}

/* ===== الدرس 1-4: معادلاتٌ فيها متغيّرٌ في الطرفين (ص 33–37) ===== */

/* ص33 مثال 1: aس + b = cس + d */
function gVarBothSides(){
  var a = ri(3,12), c = ri(1,a-1), x = ri(-12,15);
  var b = gp([-1,1])*ri(2,20), d = (a-c)*x + b;
  var o = zOpts(x, [b-d, d-b, -x]);
  return ["حُلَّ المعادلة: "+ax(a+"س "+(b<0?"− "+Math.abs(b):"+ "+b)+" = "+c+"س "+(d<0?"− "+Math.abs(d):"+ "+d)),
    o[0], o[1],
    "نطرح "+ax(c+"س")+" من الطرفين ⇐ "+ax((a-c)+"س "+(b<0?"− "+Math.abs(b):"+ "+b)+" = "+fmt(d))+"، ثمّ نعزل ⇐ "+ax("س = "+fmt(x))+"."];
}

/* ص34 مثال 2: أقواسٌ في الطرفين ⇐ خاصيّة التوزيع */
function gVarParens(){
  var a = ri(2,8), c = ri(2,8); if(a===c) c = a+1;
  var b = ri(1,9), x = ri(-10,12);
  var d = ((a-c)*x + a*b) / c;
  if(!Number.isInteger(d) || d < 1 || d > 60) throw 0;   /* genN يعيد المحاولة */
  var o = zOpts(x, [a*b, c*d, -x]);
  return ["حُلَّ المعادلة: "+ax(a+"(س + "+b+") = "+c+"(س + "+d+")"),
    o[0], o[1],
    "بخاصيّة التوزيع: "+ax(a+"س + "+(a*b)+" = "+c+"س + "+(c*d))+"، ثمّ نجمع الحدود المتشابهة ⇐ "+ax("س = "+fmt(x))+"."];
}

/* ص34: متطابقة أم لا حلّ لها */
function gVarClassify(){
  var a = ri(2,9), b = ri(1,15), c = ri(1,15);
  var same = gp([0,1]);   /* 1 = متطابقة */
  var rightTxt = same ? "متطابقة، وحلّها مجموعة الأعداد الحقيقية" : "لا حلّ لها، ومجموعة حلّها Ø";
  var d = same ? b : b + c;
  var o = ["متطابقة، وحلّها مجموعة الأعداد الحقيقية", "لا حلّ لها، ومجموعة حلّها Ø", "لها حلٌّ واحدٌ فقط"]; shuffle(o);
  return ["صنّف المعادلة: "+ax(a+"س + "+b+" = "+a+"س + "+d),
    o, o.indexOf(rightTxt),
    "مُعامِلا "+ax("س")+" متساويان، فإذا حذفناهما من الطرفين بقي "+ax(b+" = "+d)+" — "+(same ? "وهي جملةٌ صحيحة دائمًا ⇐ متطابقة." : "وهي جملةٌ خاطئةٌ دائمًا ⇐ لا حلّ لها.")];
}

/* ص36: محيطا شكلين متساويان */
function gPerimeterEqual(){
  var x = ri(2,15), a = ri(2,6), b = ri(1,12);   /* مستطيل: الطول aس، العرض b */
  if((a*x + b) % 2 !== 0) b += 1;                /* ليقبل المحيط القسمة على 4 */
  var P = 2*(a*x + b), s = P/4;
  var o = zOpts(x, [P, a*x, s]);
  return ["مستطيلٌ طوله "+ax(a+"س")+" وعرضه "+mn(b)+"، ومربّعٌ طول ضلعه "+mn(s)+". إذا تساوى محيطاهما، فما قيمة "+ax("س")+" ؟",
    o[0], o[1],
    "محيط المستطيل "+ax("2("+a+"س + "+b+")")+" ومحيط المربّع "+mn("4 × "+s+" = "+P)+" ⇐ "+ax(a+"س + "+b+" = "+(P/2))+" ⇐ "+ax("س = "+x)+"."];
}

/* ص34: خطوات حلّ المعادلة */
function gStepsOrder9(){
  var C = [
    ["ما أوّل خطوةٍ في حلّ معادلةٍ فيها أقواس؟", "استعمال خاصيّة التوزيع للتخلّص من الأقواس", ["قسمة الطرفين على المُعامِل","جمع الحدود في طرفٍ واحد فقط","حذف المتغيّر"]],
    ["إذا وُجد المتغيّر في طرفَي المعادلة، فماذا تفعل؟", "أجمع حدود المتغيّر في طرفٍ والأعداد في الطرف الآخر", ["أحذف المتغيّر من الطرفين","أضرب الطرفين في المتغيّر","أترك المعادلة بلا حلّ"]],
    ["إذا حُذف المتغيّر وبقيت جملةٌ صحيحة مثل "+ax("5 = 5")+" فإنّ المعادلة:", "متطابقة، وحلّها مجموعة الأعداد الحقيقية", ["لا حلّ لها","لها حلٌّ واحد","خاطئة"]],
    ["إذا حُذف المتغيّر وبقيت جملةٌ خاطئة مثل "+ax("3 = 7")+" فإنّ المعادلة:", "لا حلّ لها، ومجموعة حلّها Ø", ["متطابقة","لها حلٌّ واحد","حلّها صفر"]]
  ];
  var c = gp(C), o = [c[1]].concat(c[2]); shuffle(o);
  return [c[0], o, o.indexOf(c[1]),
    "الأقواس أوّلًا بالتوزيع، ثمّ اجمع المتغيّر في طرفٍ والأعداد في الآخر، ثمّ اقسم. وإن اختفى المتغيّر: جملةٌ صحيحة ⇐ متطابقة، وخاطئة ⇐ لا حلّ."];
}

/* ص39 مثال 2: |س + a| = b ⇐ حالتان */
function gAbsEqTwo(){
  var a = gp([-1,1])*ri(1,15), b = ri(2,25);
  var x1 = b - a, x2 = -b - a;
  var right = "{ "+fmt(Math.min(x1,x2))+" ، "+fmt(Math.max(x1,x2))+" }";
  var o = sOpts(right, ["{ "+fmt(x1)+" }", "{ "+fmt(b)+" ، "+fmt(-b)+" }", "{ "+fmt(x1+1)+" ، "+fmt(x2-1)+" }"]);
  return ["أوجد مجموعة الحلّ: "+ax("| س "+(a<0?"− "+Math.abs(a):"+ "+a)+" | = "+b),
    o[0].map(ax), o[1],
    "حالتان: "+ax("س "+(a<0?"− "+Math.abs(a):"+ "+a)+" = "+b)+" ⇐ "+ax("س = "+fmt(x1))+"، و"+ax("س "+(a<0?"− "+Math.abs(a):"+ "+a)+" = "+fmt(-b))+" ⇐ "+ax("س = "+fmt(x2))+"."];
}

/* ص39: قيمةٌ مطلقةٌ تساوي عددًا سالبًا ⇐ Ø */
function gAbsEqNone(){
  var a = gp([-1,1])*ri(1,12), b = -ri(2,20);
  var right = "المجموعة الخالية Ø";
  var o = [right, "{ "+fmt(b-a)+" }", "{ "+fmt(b-a)+" ، "+fmt(-b-a)+" }"]; shuffle(o);
  return ["أوجد مجموعة الحلّ: "+ax("| س "+(a<0?"− "+Math.abs(a):"+ "+a)+" | = "+fmt(b)),
    o.map(ax), o.indexOf(right),
    "القيمة المطلقة بُعدٌ عن الصفر فلا تكون سالبةً أبدًا، ولا يوجد عددٌ قيمته المطلقة "+mn(fmt(b))+" ⇐ لا حلّ."];
}

/* ص41: حساب قيمة عبارةٍ فيها قيمٌ مطلقة */
function gAbsExpr(){
  var h = ri(2,9), dd = ri(2,9), b = -ri(2,9);
  var r = Math.abs(b) + h*Math.abs(dd);
  var o = zOpts(r, [b + h*dd, Math.abs(b)+h+dd, -r]);
  return ["إذا كانت "+ax("هـ = "+h)+" و"+ax("د = "+dd)+" و"+ax("ب = "+fmt(b))+"، فاحسب قيمة العبارة: "+ax("| ب | + هـ | د |"),
    o[0], o[1],
    mn("| "+fmt(b)+" | = "+Math.abs(b))+" و"+mn("| "+dd+" | = "+dd)+" ⇐ "+mn(Math.abs(b)+" + "+h+" × "+dd+" = "+r)+"."];
}

/* ص42: موقفٌ حياتيّ — مدًى مسموح */
function gAbsReal(){
  var target = gp([60,90,120,150,180]), tol = gp([5,10,15,20]);
  var hi = target + tol, lo = target - tol;
  var right = "من "+lo+" إلى "+hi;
  var o = sOpts(right, ["من "+target+" إلى "+hi, "من "+lo+" إلى "+target, "من "+(lo-tol)+" إلى "+(hi+tol)]);
  return ["يُعطى المتحدّث في برنامجٍ فرصةَ حديثٍ مدّتها "+mn(target)+" ثانيةً مع سماحٍ قدره "+mn("±"+tol)+" ثانية. ما المدى المسموح لمدّة حديثه بالثواني؟",
    o[0].map(mn), o[1],
    "المعادلة "+ax("| س − "+target+" | = "+tol)+" تعطي الطرفين "+mn(lo)+" و"+mn(hi)+" ⇐ المدى المسموح بينهما."];
}

   رياضيات ثالث متوسط — الفصل ٢: العلاقات والدوال الخطية
   من كتاب حسن نفسه (ص ٥٠–٩١):

function nz(a,b){ var v=ri(a,b); return v===0 ? (Math.random()<0.5?1:-1)*ri(1,b) : v; }  /* عدد غير صفريّ */
function pairS(p){ return "(" + fmt(p[0]) + " ، " + fmt(p[1]) + ")"; }
function setS(a){ return "{ " + a.join(" ، ") + " }"; }

/* ---------- ٢-١ العلاقات ---------- */

/* الربع الذي تقع فيه نقطة */
function gQuadrant(){
  var x=nz(-9,9), y=nz(-9,9);
  var q = (x>0&&y>0)?"الربع الأول":(x<0&&y>0)?"الربع الثاني":(x<0&&y<0)?"الربع الثالث":"الربع الرابع";
  var all=["الربع الأول","الربع الثاني","الربع الثالث","الربع الرابع"];
  var o=sOpts(q, shuffle(all.filter(function(z){return z!==q;})));
  return ["في أيّ ربعٍ من المستوى الإحداثيّ تقع النقطة "+ax(pairS([x,y]))+"؟",o[0],o[1],
    "الإحداثيّ السينيّ "+fmt(x)+" "+(x>0?"موجب":"سالب")+" والصاديّ "+fmt(y)+" "+(y>0?"موجب":"سالب")+" ← "+q+".",
    "qd:"+x+","+y];
}

/* المجال أو المدى لمجموعة أزواج مرتبة */
function gDomainRange(){
  var n=4, xs=[], ys=[], seen={}, t=0;
  while(xs.length<n && t<80){ t++; var v=nz(-8,8); if(seen["x"+v]) continue; seen["x"+v]=1; xs.push(v); }
  while(ys.length<n && t<200){ t++; var w=nz(-8,8); if(seen["y"+w]) continue; seen["y"+w]=1; ys.push(w); }
  if(xs.length<n||ys.length<n) return null;
  var pairs=[]; for(var i=0;i<n;i++) pairs.push([xs[i],ys[i]]);
  var wantDomain = Math.random()<0.5;
  var vals = (wantDomain?xs:ys).slice().sort(function(a,b){return a-b;});
  var other= (wantDomain?ys:xs).slice().sort(function(a,b){return a-b;});
  var correct=setS(vals.map(fmt));
  var w1=setS(other.map(fmt));
  var w2=setS(vals.slice().reverse().map(fmt));
  var o=sOpts(correct,[w1,w2]);
  return ["أوجد "+(wantDomain?"<b>مجال</b>":"<b>مدى</b>")+" العلاقة "+
          ax(setS(pairs.map(pairS)))+" :",
    o[0].map(ax),o[1],
    (wantDomain
      ? "المجال مجموعة الإحداثيّات <b>السينيّة</b> (الأولى) مرتّبةً تصاعديًّا."
      : "المدى مجموعة الإحداثيّات <b>الصاديّة</b> (الثانية) مرتّبةً تصاعديًّا."),
    "dr:"+(wantDomain?"d":"r")+":"+xs.join("_")+"|"+ys.join("_")];
}

function gIndepDep(){

/* أيّ العلاقات تمثّل دالة؟ (واحدة فقط بلا تكرار في المجال) */
function gIsFunction(){
  function rel(isFunc){
    var xs=[], seen={}, t=0;
    while(xs.length<3 && t<60){ t++; var v=nz(-6,6); if(seen[v]) continue; seen[v]=1; xs.push(v); }
    if(xs.length<3) return null;
    var pairs=xs.map(function(x){ return [x, nz(-6,6)]; });
    if(!isFunc){
      /* نكرّر أوّل إحداثيّ سينيّ بصاديٍّ مختلف ← ليست دالة */
      var y2=pairs[0][1]; var g=0;
      while(y2===pairs[0][1] && g++<40) y2=nz(-6,6);
      if(y2===pairs[0][1]) return null;
      pairs.push([pairs[0][0], y2]);
    } else {
      var x4=nz(-6,6), g2=0;
      while(seen[x4] && g2++<40) x4=nz(-6,6);
      if(seen[x4]) return null;
      pairs.push([x4, nz(-6,6)]);
    }
    return setS(shuffle(pairs).map(pairS));
  }
  var right=rel(true), w1=rel(false), w2=rel(false);
  if(!right||!w1||!w2||w1===w2||right===w1||right===w2) return null;
  var o=sOpts(right,[w1,w2]);
  return ["أيّ العلاقات الآتية تمثّل <b>دالة</b>؟",o[0].map(ax),o[1],
    "العلاقة دالةٌ إذا ارتبط كلّ عنصرٍ في المجال بعنصرٍ واحدٍ فقط من المدى — أي ألّا يتكرّر الإحداثيّ السينيّ بإحداثيَّين صاديَّين مختلفين.",
    "if:"+right];
}

/* قيمة دالة خطّية */
function gFuncValueLin(){
  var a=nz(-6,6), b=nz(-9,9), k=nz(-6,6);

  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س + "+fmt(b))+" ، فأوجد "+ax("د("+fmt(k)+")")+" .",
    o[0],o[1],
    ax("د("+fmt(k)+") = "+fmt(a)+" × "+pz(k)+" + "+fmt(b)+" = "+fmt(a*k)+" + "+fmt(b)+" = "+fmt(val))+".",
    "fl:"+a+","+b+","+k];
}

/* قيمة دالة غير خطّية (تربيعية) */
function gFuncValueQuad(){
  var a=nz(-4,4), b=nz(-6,6), k=nz(-5,5);
  var val=a*k*k+b;
  var o=zOpts(val,[a*k*k-b, (a*k)*(a*k)+b, a*k+b]);
  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س" + "²" + " + "+fmt(b))+" ، فأوجد "+ax("د("+fmt(k)+")")+" .",
    o[0],o[1],
    "نعوّض عن س بـ"+pz(k)+" : "+ax(pz(k)+"² = "+fmt(k*k))+" ، ثمّ "+
    ax(fmt(a)+" × "+fmt(k*k)+" + "+fmt(b)+" = "+fmt(val))+
    ". <b>لاحظ:</b> نُربّع أوّلًا ثمّ نضرب في المُعامِل.",
    "fq:"+a+","+b+","+k];
}

/* تركيب قيمتين: د(a) + د(b) أو د(a) − د(b) */
function gFuncCombo(){
  var a=nz(-5,5), b=nz(-8,8), p=nz(-5,5), q=nz(-5,5);
  if(p===q) q = q+1;
  var plus=Math.random()<0.5;
  var fp=a*p+b, fq=a*q+b;
  var val = plus ? fp+fq : fp-fq;
  var o=zOpts(val,[plus?fp-fq:fp+fq, a*(p+q)+b, fp*fq]);
  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س + "+fmt(b))+" ، فأوجد "+
          ax("د("+fmt(p)+") "+(plus?"+":"−")+" د("+fmt(q)+")")+" .",
    o[0],o[1],
    ax("د("+fmt(p)+") = "+fmt(fp))+" و"+ax("د("+fmt(q)+") = "+fmt(fq))+" ، فالناتج "+
    ax(fmt(fp)+" "+(plus?"+":"−")+" "+pz(fq)+" = "+fmt(val))+".",
    "fc:"+a+","+b+","+p+","+q+(plus?"+":"-")];
}

/* أيّ زوجٍ مرتّبٍ يحقّق المعادلة؟ */
function gPointOnLine(){
  var a=nz(-5,5), b=nz(-5,5), x0=nz(-6,6), y0=nz(-6,6);
  var c=a*x0+b*y0;
  var w=[], t=0;
  while(w.length<2 && t<80){
    t++;
    var x=nz(-6,6), y=nz(-6,6);

  if(w.length<2) return null;
  var o=sOpts(pairS([x0,y0]), w);
  return ["أيُّ الأزواج المرتّبة الآتية يحقّق المعادلة "+ax(fmt(a)+"س + "+fmt(b)+"ص = "+fmt(c))+" ؟",

    " ، فالزوج يحقّق المعادلة.",

}

/* معادلةٌ لها حلٌّ واحد / لا حلّ / متطابقة */
function gClassifyEq(){
  var a=nz(-6,6), b=nz(-9,9), mode=gp(["one","none","ident"]);

    var d2=b; while(d2===b) d2=nz(-9,9);
    eq = fmt(a)+"س + "+fmt(b)+" = "+fmt(a)+"س + "+fmt(d2);

  } else {
    eq = fmt(a)+"س + "+fmt(b)+" = "+fmt(a)+"س + "+fmt(b);

  }
  var o=sOpts(correct, shuffle(["لها حلٌّ واحد","لا حلّ لها","متطابقة، وحلّها جميع الأعداد الحقيقية"]
        .filter(function(z){ return z!==correct; })));

    "وإن بقيت جملةٌ <b>صحيحة</b> فهي متطابقة وحلّها كلّ الأعداد الحقيقية.",

/* ---------- ٢-٥ معدل التغير والميل ---------- */

function gcdi(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a||1; }
/* كسر مبسّط بإشارةٍ رياضية، أو عدد صحيح، أو «غير معرّف» */
function fracStr(n,d){
  if(d===0) return "غير معرّف";
  if(n===0) return "0";
  var neg = (n<0)!==(d<0);
  n=Math.abs(n); d=Math.abs(d);
  var g=gcdi(n,d); n=n/g; d=d/g;
  return (neg?"−":"") + (d===1 ? String(n) : (n+"/"+d));
}
/* يضمن ثلاثة خيارات متمايزة حتى لو تكرّرت المشتّتات */
function sOpts3(right, cands, filler){
  var o=[right];
  var pool=cands.concat(filler||[]);
  for(var i=0;i<pool.length && o.length<3;i++){ if(pool[i]!=null && o.indexOf(pool[i])<0) o.push(pool[i]); }
  if(o.length<3) return null;
  shuffle(o); return [o, o.indexOf(right)];
}

/* معدّل التغير من جدولٍ في سياق */
var RATECTX = [
  ["عدد ألعاب الحاسوب","التكلفة (ريال)","ريالًا لكلّ لعبة"],
  ["عدد البلاطات","المساحة المبلّطة (سم²)","سم² لكلّ بلاطة"],
  ["عدد ساعات العمل","الأجر (ريال)","ريالًا في الساعة"],
  ["عدد الوجبات","التكلفة (ريال)","ريالًا لكلّ وجبة"],
  ["عدد الأشهر","طول الشعر (سم)","سم في الشهر"]
];
function gRateOfChange(){
  var c=gp(RATECTX);
  var x1=ri(1,6), dx=ri(1,5), x2=x1+dx;
  var m=nz(-12,12), y1=ri(5,60), y2=y1+m*dx;

    ax(c[1]+" : "+fmt(y1)+" ثمّ "+fmt(y2))+"<br>أوجد <b>معدّل التغيّر</b>.",
    o[0],o[1],
    "معدّل التغيّر = "+ax("التغيّر في ص ÷ التغيّر في س")+" = "+
    ax("("+fmt(y2)+" − "+fmt(y1)+") ÷ ("+fmt(x2)+" − "+fmt(x1)+")")+" = "+
    ax(fmt(y2-y1)+" ÷ "+fmt(dx)+" = "+fmt(m))+
    " ، أي "+fmt(Math.abs(m))+" "+c[2]+(m<0?" نقصانًا":" زيادةً")+".",
    "rc:"+c[0]+":"+x1+","+dx+","+m+","+y1];
}

/* ميل المستقيم المارّ بنقطتين */
function gSlopeTwoPoints(){
  var x1=nz(-8,8), y1=nz(-8,8), x2=nz(-8,8), y2=nz(-8,8);
  if(x1===x2) return null;
  var dy=y2-y1, dx=x2-x1;
  var correct=fracStr(dy,dx);
  var cands=[fracStr(-dy,dx), fracStr(dx,dy), fracStr(dy,-dx), fracStr(dy+1,dx)];
  var o=sOpts3(correct, cands.filter(function(z){ return z!==correct && z!=="غير معرّف"; }),
               [fracStr(dy+2,dx), fracStr(dy-1,dx), fracStr(dy,dx+1)]);
  if(!o) return null;
  return ["أوجد <b>ميل</b> المستقيم المارّ بالنقطتين "+ax(pairS([x1,y1]))+" و"+ax(pairS([x2,y2]))+" .",
    o[0].map(ax),o[1],
    "الميل "+ax("م = (ص₂ − ص₁) ÷ (س₂ − س₁)")+" = "+
    ax("("+fmt(y2)+" − "+fmt(y1)+") ÷ ("+fmt(x2)+" − "+fmt(x1)+")")+" = "+
    ax(fmt(dy)+" ÷ "+fmt(dx)+" = "+correct)+
    " . <b>احذر</b> من تبديل قيم س بقيم ص.",
    "sl:"+x1+","+y1+","+x2+","+y2];
}

/* نوع الميل: موجب أو سالب أو صفر أو غير معرّف */
function gSlopeType(){
  var mode=gp(["pos","neg","zero","undef"]);
  var x1=nz(-7,7), y1=nz(-7,7), x2, y2;
  if(mode==="undef"){ x2=x1; y2=y1; while(y2===y1) y2=nz(-7,7); }
  else if(mode==="zero"){ y2=y1; x2=x1; while(x2===x1) x2=nz(-7,7); }
  else {
    x2=x1; while(x2===x1) x2=nz(-7,7);
    var d=ri(1,7)*(mode==="pos"?1:-1)*((x2-x1)>0?1:-1);
    y2=y1+d;
  }
  var lbl={pos:"موجب",neg:"سالب",zero:"صفر",undef:"غير معرّف"}[mode];
  var o=sOpts(lbl, shuffle(["موجب","سالب","صفر","غير معرّف"].filter(function(z){ return z!==lbl; })));
  return ["ما <b>نوع ميل</b> المستقيم المارّ بالنقطتين "+ax(pairS([x1,y1]))+" و"+ax(pairS([x2,y2]))+" ؟",
    o[0],o[1],
    mode==="undef" ? "فرق السينات صفر، فالقسمة على صفرٍ غير معرّفة ← المستقيم <b>رأسيّ</b> وميله غير معرّف."
    : mode==="zero" ? "فرق الصادات صفر، فالميل "+ax("0 ÷ فرق السينات = 0")+" ← المستقيم <b>أفقيّ</b>."
    : ("فرق الصادات "+fmt(y2-y1)+" وفرق السينات "+fmt(x2-x1)+" ، وحاصل قسمتهما "+lbl+
       " ← المستقيم يتّجه للأ"+(mode==="pos"?"على":"سفل")+" عند التحرّك من اليسار إلى اليمين."),
    "st:"+mode+":"+x1+","+y1+","+x2+","+y2];
}

/* هل الدالة خطّية؟ (ثبات معدّل التغيّر في جدول) */
function gLinearTable(){
  function tbl(linear){
    var x0=nz(-4,4), dx=ri(1,3), m=nz(-5,5), y0=nz(-9,9);
    var xs=[x0,x0+dx,x0+2*dx,x0+3*dx], ys=[y0,y0+m*dx,y0+2*m*dx,y0+3*m*dx];
    if(!linear){
      var bump=ri(1,4)*(Math.random()<0.5?1:-1);
      ys[3]=ys[3]+bump;                       /* نكسر ثبات معدّل التغيّر */
    }
    return {s: ax("س : "+xs.map(fmt).join(" ، "))+"<br>"+ax("ص : "+ys.map(fmt).join(" ، ")),
            xs:xs, ys:ys};
  }
  var t=tbl(Math.random()<0.5);
  /* نحسب من الجدول نفسه: هل معدّل التغيّر ثابت؟ */
  var r0=(t.ys[1]-t.ys[0])/(t.xs[1]-t.xs[0]);
  var isLin=true;
  for(var i=1;i<3;i++){ if((t.ys[i+1]-t.ys[i])/(t.xs[i+1]-t.xs[i])!==r0){ isLin=false; break; } }
  var correct = isLin ? "خطّية؛ لأنّ معدّل التغيّر ثابت" : "ليست خطّية؛ لأنّ معدّل التغيّر غير ثابت";
  var o=sOpts(correct,[isLin ? "ليست خطّية؛ لأنّ معدّل التغيّر غير ثابت" : "خطّية؛ لأنّ معدّل التغيّر ثابت",
                       "لا يمكن الحكم من الجدول"]);
  return ["هل الدالة الممثّلة بالجدول <b>خطّية</b>؟<br>"+t.s,o[0],o[1],
    "نحسب "+ax("التغيّر في ص ÷ التغيّر في س")+" بين كلّ حدَّين متجاورين: إن كان <b>ثابتًا</b> فالدالة خطّية، وإلّا فلا."+
    (isLin? (" وهنا المعدّل ثابتٌ ويساوي "+fmt(r0)+".") : " وهنا اختلف المعدّل بين زوجٍ وآخر."),
    "lt:"+t.xs.join("_")+"|"+t.ys.join("_")];
}

/* ---------- ٢-٦ المتتابعات الحسابية كدوال خطّية ---------- */

function seqStr(a1,d,n){
  var out=[]; for(var i=0;i<n;i++) out.push(fmt(a1+i*d));
  return out.join(" ، ")+" ، ...";
}

/* أيّ المتتابعات حسابية؟ */
function gIsArithmetic(){
  var a1=nz(-9,9), d=nz(-6,6);
  var right=seqStr(a1,d,4);
  function bad(){
    var b1=nz(-9,9), s=[b1], cur=b1;
    for(var i=1;i<4;i++){ cur += nz(-6,6)+ (i%2?1:2); s.push(cur); }   /* فروق غير ثابتة */
    /* نتأكّد أنّها ليست حسابية فعلًا */
    var d0=s[1]-s[0], okBad=false;
    for(var j=1;j<3;j++) if(s[j+1]-s[j]!==d0) okBad=true;
    if(!okBad) return null;
    return s.map(fmt).join(" ، ")+" ، ...";
  }
  var w1=bad(), w2=bad();
  if(!w1||!w2||w1===w2||w1===right||w2===right) return null;
  var o=sOpts(right,[w1,w2]);
  return ["أيُّ المتتابعات الآتية <b>حسابية</b>؟",o[0].map(ax),o[1],
    "المتتابعة حسابيةٌ إذا كان الفرق بين كلّ حدَّين متتاليين <b>ثابتًا</b>، ويُسمّى هذا الفرق <b>أساس</b> المتتابعة.",
    "ia:"+a1+","+d];
}

}

/* الحدود الثلاثة التالية */
function gNextTerms(){
  var a1=nz(-12,12), d=nz(-8,8), k=4;
  var nxt=[a1+k*d, a1+(k+1)*d, a1+(k+2)*d];
  var correct=nxt.map(fmt).join(" ، ");
  var w1=[a1+k*d, a1+(k+1)*d+d, a1+(k+2)*d+2*d].map(fmt).join(" ، ");
  var w2=[a1+k*d-d, a1+k*d, a1+(k+1)*d].map(fmt).join(" ، ");
  var o=sOpts3(correct,[w1,w2].filter(function(z){return z!==correct;}),
               [[a1+k*d, a1+k*d, a1+k*d].map(fmt).join(" ، ")]);
  if(!o) return null;
  return ["أوجد الحدود الثلاثة التالية في المتتابعة الحسابية: "+ax(seqStr(a1,d,4)),
    o[0].map(ax),o[1],

    "nt:"+a1+","+d];
}

/* معادلة الحد النوني */
function gNthTermEq(){
  var a1=nz(-12,12), d=nz(-7,7);
  if(d===0) return null;
  var c=a1-d;                                  /* أن = د ن + (أ₁ − د) */
  function eqS(dd,cc){ return "أن = "+fmt(dd)+"ن"+(cc===0?"":(cc>0?(" + "+fmt(cc)):(" − "+fmt(Math.abs(cc))))); }
  var correct=eqS(d,c);
  var cands=[eqS(d,a1), eqS(d,c+d), eqS(-d,c)].filter(function(z){ return z!==correct; });
  var o=sOpts3(correct,cands,[eqS(d,c+1), eqS(d,c-1)]);
  if(!o) return null;
  return ["اكتب معادلة <b>الحدّ النونيّ</b> للمتتابعة الحسابية: "+ax(seqStr(a1,d,4)),
    o[0].map(ax),o[1],

    ax(fmt(d)+"ن + "+fmt(c))+" بعد التبسيط بخاصيّة التوزيع.",
    "ne:"+a1+","+d];
}

  /* ═══ الاختبار الشامل يُغذّي «علاجي» ═══════════════════════════
     بلاغ الأب (٢٦ أغسطس ٢٠٢٦): «قسم علاجي ما حطّيت فيه دروس بعد
     الاختبار». وسببه أنّ تسجيل نتيجة الدرس كان مشروطًا بألّا يكون
     الاختبار شاملًا — فمن اختبر الشامل وحده لم يُسجَّل له درسٌ
     واحد، فيجد «علاجي» فارغًا وقد اختبر لتوّه.

     وهذا نقيض المقصود: الشامل هو الاختبار الوحيد الذي يمسح الدروس
     كلّها، فهو أولى ما يُبنى عليه ترتيب الضعف.

     ولكنّه اثنا عشر سؤالًا موزّعةً على الدروس، فنصيب الدرس سؤالان
     أو ثلاثة — وهذا تقديرٌ لا حكم. فنُسجّله موسومًا بعدده،
     ولا نطمس به نتيجةَ درسٍ اختُبر وحده، فالعشرة أصدق من الاثنين. */
  /* المطابقة بالاسم أوّلًا، وبهُويّة الدالّة إن كانت مجهولة الاسم —

     تسقط كلّها من الحصر فيبقى «علاجي» فارغًا رغم الاختبار. */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1 || id==="rem") return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      /* نتيجةُ درسٍ اختُبر وحده لا تُطمَس بتقديرٍ من الشامل */
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify(
        { pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null, est:!!(s&&s.from==="all"), n:(s&&s.n)||null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الدروس من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل درس.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الدروس. جرّب دروس '+REM_LABEL+' ويرجع هنا يعرض أضعف درس مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+(x.est?' <span style="font-weight:400;font-size:.78rem;color:var(--muted)">تقديريّ من الشامل ('+(x.n===1?'سؤال واحد':x.n===2?'سؤالان':x.n+' أسئلة')+')</span>':'')+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel(curId);   // يتبع curId لا اسمًا مكتوبًا
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
</script>
