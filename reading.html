<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القراءة والاستماع</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<style>
  :root{
    --accent:#0d9488; --accent-soft:#5eead4; --accent-deep:#0f766e;
    --bg:#f6f8fa; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c50;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.6rem;font-weight:800}
  .langtabs{display:flex;gap:8px;margin:16px 0 6px}
  .langtabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .langtabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabs{display:flex;gap:8px;margin:10px 0 18px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.98rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  section.panel{display:none} section.panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .block-title{display:flex;align-items:center;gap:10px;margin:20px 4px 12px;font-size:1.05rem;font-weight:800}
  .block-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .say{background:var(--accent);color:#fff;border:0;padding:11px 16px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
  .say.small{padding:8px 12px;font-size:.9rem}
  .no-mic [data-mic]{display:none!important}
  .dinp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1.15rem;margin:10px 0;font-family:inherit;background:transparent;color:var(--ink)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .fb{margin-top:8px;font-size:.98rem;min-height:20px}
  .fb.ok{color:var(--good);font-weight:700}
  .fb.no{color:var(--bad);font-weight:700}
  .fb .corr{color:var(--good);font-weight:700}
  .passage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .passage .txt{font-size:1.1rem;line-height:2.1;margin-top:12px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .stem{font-weight:700;margin:4px 0 8px}
  .score{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .hint{color:var(--muted);font-size:.85rem;margin:2px 4px 0}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>

      questions:[["Where did Ali go last weekend?",["to the city","to his grandparents' village","to school"],1],["What animals are on the farm?",["cows and chickens","lions","fish"],0],["What did they do in the evening?",["watched TV","told stories","played football"],1]] },
    ar:{ dictation:["العِلْمُ نُورٌ يُنِيرُ طَرِيقَ الإِنْسَانِ.","الصِّدْقُ صِفَةٌ يُحِبُّهَا النَّاسُ.","نَظَافَةُ البِيئَةِ مَسْؤُولِيَّةُ الجَمِيعِ.","القِرَاءَةُ غِذَاءُ العَقْلِ.","التَّعَاوُنُ يُقَوِّي المُجْتَمَعَ.","فِي التَّأَنِّي السَّلَامَةُ."],
      passage:"يُعَدُّ المَاءُ أَسَاسَ الحَيَاةِ عَلَى الأَرْضِ، فَلَا يَسْتَطِيعُ إِنْسَانٌ وَلَا حَيَوَانٌ وَلَا نَبَاتٌ العَيْشَ بِدُونِهِ. وَرَغْمَ أَهَمِّيَّتِهِ، يَهْدِرُ كَثِيرٌ مِنَ النَّاسِ المَاءَ دُونَ وَعْيٍ. لِذَلِكَ يَجِبُ عَلَيْنَا تَرْشِيدُ الاسْتِهْلَاكِ وَإِغْلَاقُ الصَّنَابِيرِ جَيِّدًا وَالمُحَافَظَةُ عَلَى هَذِهِ النِّعْمَةِ.",

  },

      passage:"Technology has changed the way we learn. In the past, students depended only on books and teachers. Today, they can find information online, watch videos, and take courses from home. However, experts warn that spending too much time on screens can affect health and focus. Therefore, balance is important.",
      questions:[["How did students learn in the past?",["only online","from books and teachers","from videos"],1],["What do experts warn about?",["reading too much","too much screen time","studying at home"],1],["What is the main advice?",["stop using technology","balance","study all day"],1]] },
    ar:{ dictation:["إنَّ مَعَ العُسْرِ يُسْرًا.","مَنْ جَدَّ وَجَدَ وَمَنْ زَرَعَ حَصَدَ.","العَقْلُ السَّلِيمُ فِي الجِسْمِ السَّلِيمِ.","الكَلِمَةُ الطَّيِّبَةُ صَدَقَةٌ.","خَيْرُ النَّاسِ أَنْفَعُهُمْ لِلنَّاسِ.","الأَمَانَةُ تَاجٌ عَلَى رُؤُوسِ الأَصْحَابِ."],
      passage:"شَهِدَ العَالَمُ فِي العُقُودِ الأَخِيرَةِ تَطَوُّرًا هَائِلًا فِي مَجَالِ التِّقْنِيَةِ، فَقَدْ غَيَّرَتْ وَسَائِلُ التَّوَاصُلِ الحَدِيثَةُ طَرِيقَةَ تَعَامُلِنَا مَعَ المَعْلُومَةِ وَالعَالَمِ مِنْ حَوْلِنَا. وَمَعَ أَنَّ لِهَذِهِ التِّقْنِيَةِ فَوَائِدَ كَثِيرَةً فِي التَّعْلِيمِ وَالعَمَلِ، إِلَّا أَنَّ الإِفْرَاطَ فِي اسْتِخْدَامِهَا قَدْ يُؤَثِّرُ سَلْبًا عَلَى العَلَاقَاتِ الاجْتِمَاعِيَّةِ وَالصِّحَّةِ. وَلِذَلِكَ فَإِنَّ الاسْتِخْدَامَ المُتَوَازِنَ هُوَ مِفْتَاحُ الاسْتِفَادَةِ الحَقِيقِيَّةِ.",
      questions:[["ما الذي غيّرته وسائل التواصل الحديثة؟",["طريقة تعاملنا مع المعلومة","الطقس","أسعار السوق"],0],["ما سلبيات الإفراط في التقنية؟",["تزيد الصحة","تؤثّر على العلاقات والصحة","تحسّن النوم"],1],["ما مفتاح الاستفادة الحقيقية؟",["الاستخدام المتوازن","تركها كليًا","استخدامها طوال اليوم"],0]] }
  }
};

// معاني الكلمات الإنجليزية بالعربي (يُقبل أكثر من إجابة)
const VOCAB = {
  saud:[["cat",["قطة","قط"]],["dog",["كلب"]],["red",["أحمر"]],["book",["كتاب"]],["sun",["شمس"]],["apple",["تفاحة","تفاح"]],["fish",["سمكة","سمك"]],["milk",["حليب","لبن"]]],
  osama:[["school",["مدرسة"]],["friend",["صديق","صاحب"]],["water",["ماء","مويه"]],["green",["أخضر"]],["happy",["سعيد","فرحان"]],["family",["عائلة","أسرة"]],["tree",["شجرة"]],["book",["كتاب"]]],
  rafeef:[["weather",["طقس","جو"]],["student",["طالب","تلميذ"]],["beautiful",["جميل","جميلة"]],["difficult",["صعب","صعبة"]],["important",["مهم","مهمة"]],["answer",["إجابة","جواب"]],["question",["سؤال"]],["country",["دولة","بلد"]]],
  hasan:[["knowledge",["معرفة","علم"]],["success",["نجاح"]],["experience",["خبرة","تجربة"]],["environment",["بيئة"]],["technology",["تقنية","تكنولوجيا"]],["future",["مستقبل"]],["health",["صحة"]],["develop",["يطور","تطوير","يطوّر"]]]
};

function qs(k){ return new URLSearchParams(location.search).get(k); }
const who = (qs("who")||"").toLowerCase();
const app = document.getElementById("app");

try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
var CHOSEN = { en:null, ar:null };
function voicesFor(isAr){
  var re = isAr ? /^ar/i : /^en/i;
  return speechSynthesis.getVoices().filter(function(x){return re.test(x.lang);});
}
var AUDIO_VER = "hd5";
var MANIFEST = null, MANI_DONE = false, CUR_AUDIO = null;
var MANI_P = fetch("audio/manifest.json?v=" + AUDIO_VER)
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(m){ MANIFEST = m; MANI_DONE = true; })
  .catch(function(){ MANI_DONE = true; });
function speak(text, rate, lang){
  // ننتظر تحميل قائمة الصوت البشري قبل أي رجوع للصوت الآلي
  if(!MANI_DONE){ MANI_P.then(function(){ speak(text, rate, lang); }); return; }
  var isAr = lang && lang.indexOf("ar")===0, lk = isAr ? "ar" : "en";
  // صوت بشري جاهز إن وُجد
  if(MANIFEST && MANIFEST[lk] && MANIFEST[lk][text]){
    try{
      if(CUR_AUDIO){ CUR_AUDIO.pause(); }
      var a = new Audio("audio/" + MANIFEST[lk][text] + "?v=" + AUDIO_VER);
      a.playbackRate = Math.max(0.5, rate || 1);
      CUR_AUDIO = a; a.play(); return;
    }catch(e){}
  }
  // بديل: نطق المتصفح
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-US"; u.rate = rate || 0.9;
    var cands = voicesFor(isAr);
    var v = null;
    if(CHOSEN[lk]) v = cands.filter(function(x){return x.name===CHOSEN[lk];})[0];
    if(!v){ var good = cands.filter(function(x){return /(siri|enhanced|premium|natural|neural|eloquence|maged|majed|tarik|laila|samantha|daniel|karen|serena)/i.test(x.name);}); v = good[0] || cands[0]; }
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ alert("المتصفح لا يدعم النطق. جرّب Chrome أو Safari."); }
}
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!SR){ try{ document.documentElement.classList.add("no-mic"); }catch(e){} }
function startRecognition(lang, onResult, onErr){
  if(!SR){ onErr && onErr("no-support"); return; }
  try{
    var r = new SR(); r.lang = lang; r.interimResults = false; r.maxAlternatives = 5;
    r.onresult = function(e){ var a=[]; for(var i=0;i<e.results[0].length;i++) a.push(e.results[0][i].transcript); onResult(a); };
    r.onerror = function(e){ onErr && onErr((e && e.error) || "error"); };
    r.start();
  }catch(e){ onErr && onErr("error"); }
}
function speechMatch(alts, target, ar){
  var t = normX(target, ar).split(" ").filter(Boolean);
  var heard = alts[0] || "", best = 0;
  alts.forEach(function(a){
    var w = normX(a, ar).split(" ").filter(Boolean), setT = {}, hit = 0;
    t.forEach(function(x){ setT[x] = (setT[x]||0)+1; });
    w.forEach(function(x){ if(setT[x]>0){ hit++; setT[x]--; } });
    var score = t.length ? hit/t.length : 0;
    if(score > best) best = score;
  });
  return { ok: best >= 0.6, heard: heard, score: best };
}
function wireMic(qEl, text, ar){
  var mic = qEl.querySelector("[data-mic]"), pfb = qEl.querySelector(".pfb");
  if(!mic || !pfb) return;
  mic.addEventListener("click", function(){
    pfb.style.color = "var(--muted)"; pfb.textContent = "🎤 تكلّم الآن...";
    startRecognition(ar?"ar-SA":"en-US", function(alts){
      var m = speechMatch(alts, text, ar);
      if(m.ok){ pfb.style.color = "var(--good)"; pfb.textContent = "✅ نطق صحيح! ("+m.heard+")"; }
      else{ pfb.style.color = "var(--bad)"; pfb.textContent = '❌ سمعتك: "'+m.heard+'" · انطقها: '+text; }
    }, function(err){
      pfb.style.color = "var(--bad)";
      pfb.textContent = (err==="no-support") ? "⚠️ متصفح الآيفون لا يدعم النطق بالمايك — يشتغل على أندرويد/كمبيوتر بمتصفح Chrome." : "⚠️ لم أسمع بوضوح، اسمح بالمايك وحاول ثانية.";
    });
  });
}
function normX(s, ar){
  s = (s||"").replace(/[ً-ْٰ]/g,"").replace(/[.,!?;:'"،؛؟]/g,"").replace(/\s+/g," ").trim();
  if(ar){ s = s.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي"); } else { s = s.toLowerCase(); }
  return s;
}
function norm(s, ar){
  s = (s||"").replace(/[ً-ْٰ]/g,"").replace(/[.,!?;:'"،؛؟]/g,"").replace(/\s+/g," ").trim();
  if(ar){ s = s.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي"); }
  else { s = s.toLowerCase(); }
  return s;
}

if(!META[who] || !DATA[who]){
  app.innerHTML = '<header class="top"><h1>القراءة والاستماع</h1></header><p style="text-align:center;color:var(--muted);padding:40px">افتح الرابط مع اسم الابن، مثل: ?who=hasan</p>';
}else{
  const S = META[who];
  document.documentElement.style.setProperty("--accent", S.accent);
  document.documentElement.style.setProperty("--accent-deep", S.deep);
  document.title = "قراءة واستماع — " + S.name;
  app.innerHTML =
    '<header class="top"><p class="eyebrow">'+S.grade+' · استماع وكتابة</p><h1>'+S.emoji+' قراءة '+S.name+'</h1></header>'+
    '<div class="bar"><a href="quiz.html?who='+who+'">📝 الاختبار</a><a href="index.html">📊 اللوحة</a></div>'+
    '<div class="langtabs" role="tablist">'+
      '<button data-lang="en" aria-selected="true">الإنجليزي 🇬🇧</button>'+
      '<button data-lang="ar" aria-selected="false">العربي 🇸🇦</button>'+
    '</div>'+
    '<div class="bar" id="humanBar" style="align-items:center;display:none"><span style="font-size:.85rem;color:var(--good);font-weight:800;white-space:nowrap">🔊 صوت بشري طبيعي</span>'+
      '<button class="say small" id="voiceTest">جرّب 🔊</button></div>'+
    '<div class="bar" id="voiceBar" style="align-items:center;display:none"><span style="font-size:.85rem;color:var(--muted);font-weight:700;white-space:nowrap">🔈 الصوت:</span>'+
      '<select id="voiceSel" style="flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:.85rem"></select>'+
      '<button class="say small" id="voiceTestFb">جرّب 🔊</button></div>'+
    '<div class="tabs" role="tablist">'+
      '<button data-tab="dict" aria-selected="true">إملاء 🔊✍️</button>'+
      '<button data-tab="read" aria-selected="false">قراءة وفهم 📖</button>'+
      '<button data-tab="vocab" aria-selected="false">كلمات 🔊✍️</button>'+
    '</div>'+
    '<section class="panel active" id="dict"></section>'+
    '<section class="panel" id="read"></section>'+
    '<section class="panel" id="vocab"></section>'+
    '<footer>استمع، اكتب، وافهم · صفحة تعليمية</footer>';

  var curLang = "en";

  function renderDict(){
    var D = DATA[who][curLang], ar = curLang==="ar", dir = ar?"rtl":"ltr", ta = ar?"right":"left";
    var sec = document.getElementById("dict");
    var html = '<div class="block-title"><span class="dot"></span> اسمع واكتب</div>'+
      '<p class="hint">اضغط 🔊 استمع، ثم اكتب ما سمعته، ثم «تحقّق».</p>';
    D.dictation.forEach(function(item,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">رقم '+(i+1)+'</div>'+
        '<div class="row"><button class="say" data-say>🔊 استمع</button>'+
        '<button class="say small" data-slow>🐢 أبطأ</button></div>'+
        '<input class="dinp" placeholder="اكتب هنا..." style="direction:'+dir+';text-align:'+ta+'">'+
        '<div class="row"><button class="chk">تحقّق</button>'+
        '<button class="say small" data-show>👁️ أظهر</button>'+
        '<button class="say small" data-mic style="background:#dc2626;color:#fff;border-color:#dc2626">🎤 انطق</button></div>'+
        '<div class="fb"></div><div class="pfb" style="margin-top:6px;font-weight:700;min-height:18px"></div></div>';
    });
    html += '<div class="score" data-score>الدرجة: 0 / '+D.dictation.length+'</div>';
    sec.innerHTML = html;
    var done={}, correct=0, scoreEl=sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, text=D.dictation[i];
      var inp=qEl.querySelector(".dinp"), fb=qEl.querySelector(".fb");
      qEl.querySelector("[data-say]").addEventListener("click",function(){ speak(text,1,ar?"ar-SA":"en-US"); });
      qEl.querySelector("[data-slow]").addEventListener("click",function(){ speak(text,0.7,ar?"ar-SA":"en-US"); });
      qEl.querySelector("[data-show]").addEventListener("click",function(){ fb.className="fb"; fb.innerHTML='الإجابة: <span class="corr">'+text+'</span>'; });
      wireMic(qEl, text, ar);
      qEl.querySelector(".chk").addEventListener("click",function(){
        var ok = norm(inp.value,ar)===norm(text,ar);
        if(ok){ fb.className="fb ok"; fb.textContent="✅ صحيح!"; if(!done[i]){done[i]=1;correct++;} }
        else{ fb.className="fb no"; fb.innerHTML='❌ حاول مرة ثانية · الصحيح: <span class="corr">'+text+'</span>'; }
        scoreEl.textContent="الدرجة: "+correct+" / "+D.dictation.length;
      });
    });
  }

  function renderRead(){
    var D = DATA[who][curLang], ar = curLang==="ar", dir = ar?"rtl":"ltr", ta = ar?"right":"left";
    var sec = document.getElementById("read");
    var html = '<div class="block-title"><span class="dot"></span> اقرأ واستمع</div>'+
      '<div class="passage" data-mic-wrap><div class="row"><button class="say" data-read>🔊 استمع للنص</button>'+
      '<button class="say small" data-mic style="background:#dc2626;color:#fff;border-color:#dc2626">🎤 اقرأ بصوتك</button></div>'+
      '<div class="txt" style="direction:'+dir+';text-align:'+ta+'">'+D.passage+'</div>'+
      '<div class="pfb" style="margin-top:8px;font-weight:700;min-height:18px"></div></div>'+
      '<div class="block-title"><span class="dot"></span> أسئلة الفهم</div>';
    D.questions.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="stem" style="direction:'+dir+';text-align:'+ta+'">'+(i+1)+'. '+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'" style="direction:'+dir+';text-align:'+ta+'">'+o+'</button>'; });
      html += '</div></div>';
    });
    html += '<div class="score" data-score>الفهم: 0 / '+D.questions.length+'</div>';
    sec.innerHTML = html;
    sec.querySelector("[data-read]").addEventListener("click",function(){ speak(D.passage,1,ar?"ar-SA":"en-US"); });
    wireMic(sec.querySelector("[data-mic-wrap]"), D.passage, ar);
    var ans={}, correct=0, scoreEl=sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, right=D.questions[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(ans[i]!=null) return; ans[i]=+btn.dataset.j;
          qEl.querySelectorAll(".opts button").forEach(function(b){b.disabled=true;});
          if(+btn.dataset.j===right){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[right].classList.add("correct"); }
          scoreEl.textContent="الفهم: "+correct+" / "+D.questions.length;
        });
      });
    });
  }

  function renderVocab(){
    var sec = document.getElementById("vocab");
    if(curLang!=="en"){ sec.innerHTML=""; return; }
    var V = VOCAB[who] || [];
    var lab = 'style="font-weight:700;font-size:.9rem;color:var(--muted);display:block;margin:8px 2px 2px"';
    var html = '<div class="block-title"><span class="dot"></span> اسمع الكلمة، اكتبها بالإنجليزي، ومعناها بالعربي</div>'+
      '<p class="hint">اضغط 🔊 استمع، ثم اكتب الكلمة بالإنجليزي ومعناها بالعربي، ثم «تحقّق».</p>';
    V.forEach(function(item,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">كلمة '+(i+1)+'</div>'+
        '<div class="row"><button class="say" data-say>🔊 استمع</button>'+
        '<button class="say small" data-slow>🐢 أبطأ</button></div>'+
        '<span '+lab+'>اكتبها بالإنجليزي:</span>'+
        '<input class="einp" placeholder="English..." style="direction:ltr;text-align:left">'+
        '<span '+lab+'>معناها بالعربي:</span>'+
        '<input class="ainp" placeholder="المعنى بالعربي..." style="direction:rtl;text-align:right">'+
        '<div class="row"><button class="chk">تحقّق</button><button class="say small" data-show>👁️ أظهر</button>'+
        '<button class="say small" data-mic style="background:#dc2626;color:#fff;border-color:#dc2626">🎤 انطق</button></div>'+
        '<div class="fb"></div><div class="pfb" style="margin-top:6px;font-weight:700;min-height:18px"></div></div>';
    });
    html += '<div class="score" data-score>الدرجة: 0 / '+V.length+'</div>';
    sec.innerHTML = html;
    var done={}, correct=0, scoreEl=sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, word=V[i][0], answers=V[i][1];
      var ein=qEl.querySelector(".einp"), ain=qEl.querySelector(".ainp"), fb=qEl.querySelector(".fb");
      var mic=qEl.querySelector("[data-mic]"), pfb=qEl.querySelector(".pfb");
      if(mic){ mic.addEventListener("click",function(){
        pfb.style.color="var(--muted)"; pfb.textContent="🎤 تكلّم الآن... قل: "+word;
        startRecognition("en-US", function(alts){
          var target=norm(word,false);
          var hit=alts.some(function(a){ var n=norm(a,false); return n===target || n.split(" ").indexOf(target)>=0; });
          if(hit){ pfb.style.color="var(--good)"; pfb.textContent="✅ نطق صحيح! ("+alts[0]+")"; }
          else{ pfb.style.color="var(--bad)"; pfb.textContent='❌ سمعتك: "'+(alts[0]||"")+'" · انطقها: '+word; }
        }, function(err){
          pfb.style.color="var(--bad)";
          pfb.textContent = (err==="no-support") ? "⚠️ متصفح هذا الجهاز لا يدعم النطق بالمايك — جرّب Chrome على أندرويد أو كمبيوتر." : "⚠️ لم أسمع بوضوح، اسمح بالمايك وحاول ثانية.";
        });
      }); }
      qEl.querySelector("[data-say]").addEventListener("click",function(){ speak(word,1,"en-US"); });
      qEl.querySelector("[data-slow]").addEventListener("click",function(){ speak(word,0.7,"en-US"); });
      qEl.querySelector("[data-show]").addEventListener("click",function(){ fb.className="fb"; fb.innerHTML='الكلمة: <span class="corr">'+word+'</span> · المعنى: <span class="corr">'+answers[0]+'</span>'; });
      qEl.querySelector(".chk").addEventListener("click",function(){
        var enOk = norm(ein.value,false)===norm(word,false);
        var arOk = answers.some(function(a){return norm(a,true)===norm(ain.value,true);});
        if(enOk && arOk){ fb.className="fb ok"; fb.textContent="✅ ممتاز! الإنجليزي والعربي صحيحين"; if(!done[i]){done[i]=1;correct++;} }
        else{
          fb.className="fb no";
          fb.innerHTML = 'الإنجليزي: '+(enOk?'✅':'❌ <span class="corr">'+word+'</span>')+' · العربي: '+(arOk?'✅':'❌ <span class="corr">'+answers[0]+'</span>');
        }
        scoreEl.textContent="الدرجة: "+correct+" / "+V.length;
      });
    });
  }

  function syncVocabTab(){
    var vt = document.querySelector('.tabs [data-tab="vocab"]');
    if(!vt) return;
    vt.style.display = (curLang==="ar") ? "none" : "";
    if(curLang==="ar" && vt.getAttribute("aria-selected")==="true"){
      document.querySelector('.tabs [data-tab="dict"]').click();
    }
  }

  function populateVoices(){
    var sel = document.getElementById("voiceSel"); if(!sel) return;
    var isAr = curLang==="ar", lk = isAr?"ar":"en";
    var vs = voicesFor(isAr);
    if(!vs.length){ sel.innerHTML='<option value="">(لا توجد أصوات — حمّلها من إعدادات الجوال)</option>'; return; }
    sel.innerHTML = vs.map(function(v){ return '<option value="'+v.name+'">'+v.name+' — '+v.lang+'</option>'; }).join("");
    if(CHOSEN[lk]) sel.value = CHOSEN[lk];
    sel.onchange = function(){ CHOSEN[lk] = sel.value; };
  }
  function tryVoice(){
    var d = (DATA[who] && DATA[who][curLang==="ar"?"ar":"en"]) || {};
    var sample = (d.dictation && d.dictation[0]) || (curLang==="ar"?"مدرسة":"school");
    speak(sample, 1, curLang==="ar"?"ar-SA":"en-US");
  }
  ["voiceTest","voiceTestFb"].forEach(function(id){
    var b = document.getElementById(id); if(b) b.addEventListener("click", tryVoice);
  });
  try{ speechSynthesis.onvoiceschanged = function(){ populateVoices(); }; }catch(e){}

  // نعرض شريط «صوت بشري» عند توفره، ونخفي منتقي صوت الجهاز الآلي
  function updateVoiceBars(){
    var human = !!(MANIFEST && ((MANIFEST.en && Object.keys(MANIFEST.en).length) || (MANIFEST.ar && Object.keys(MANIFEST.ar).length)));
    var hb = document.getElementById("humanBar"), vb = document.getElementById("voiceBar");
    if(hb) hb.style.display = (MANI_DONE && human) ? "flex" : "none";
    if(vb) vb.style.display = (MANI_DONE && !human) ? "flex" : "none";
  }
  MANI_P.then(updateVoiceBars);

  function renderAll(){ renderDict(); renderRead(); renderVocab(); syncVocabTab(); populateVoices(); updateVoiceBars(); }
  renderAll();

  document.querySelectorAll(".langtabs button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".langtabs button").forEach(function(x){x.setAttribute("aria-selected","false");});
      b.setAttribute("aria-selected","true");
      curLang = b.dataset.lang; renderAll();
    });
  });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected","false");});
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
      document.getElementById(b.dataset.tab).classList.add("active");
    });
  });
}
</script>
</body>
</html>
