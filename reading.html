<style>

  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.6rem;font-weight:800}
  .langtabs{display:flex;gap:8px;margin:16px 0 6px}
  .langtabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;border-radius:14px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .langtabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabs{display:flex;gap:8px;margin:10px 0 18px}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.98rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  section.panel{display:none} section.panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .block-title{display:flex;align-items:center;gap:10px;margin:20px 4px 12px;font-size:1.05rem;font-weight:800}
  .block-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .say{background:var(--accent);color:#fff;border:0;padding:11px 16px;border-radius:12px;font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit}
  .say.small{padding:8px 12px;font-size:.9rem}
  .no-mic [data-mic]{display:none!important}
  .dinp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1.15rem;margin:10px 0;font-family:inherit;background:transparent;color:var(--ink)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chk{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:11px 16px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .fb{margin-top:8px;font-size:.98rem;min-height:20px}
  .fb.ok{color:var(--good);font-weight:700}
  .fb.no{color:var(--bad);font-weight:700}
  .fb .corr{color:var(--good);font-weight:700}
  .passage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
  .passage .txt{font-size:1.1rem;line-height:2.1;margin-top:12px}
  .opts{display:grid;gap:8px;margin-top:10px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .stem{font-weight:700;margin:4px 0 8px}
  .score{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .hint{color:var(--muted);font-size:.85rem;margin:2px 4px 0}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>

function _awayOut(){ if(AWAY.hiddenAt==null) AWAY.hiddenAt=Date.now(); }
function _awayIn(){ if(AWAY.hiddenAt!=null){ AWAY.total += (Date.now()-AWAY.hiddenAt); AWAY.exits++; AWAY.hiddenAt=null; if(AWAY.onReturn){ try{ AWAY.onReturn(); }catch(e){} } } }
document.addEventListener("visibilitychange", function(){ if(document.hidden) _awayOut(); else _awayIn(); });
window.addEventListener("blur", _awayOut); window.addEventListener("focus", _awayIn);
function awaySnap(){ return { total:AWAY.total, exits:AWAY.exits }; }
function awaySince(s){ var extra = AWAY.hiddenAt!=null ? (Date.now()-AWAY.hiddenAt) : 0; return { away: Math.round((AWAY.total - s.total + extra)/1000), exits: AWAY.exits - s.exits + (AWAY.hiddenAt!=null?1:0) }; }
var EXIT_WARN_HTML = '<div data-exitwarn style="display:none;background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:800;text-align:center">⚠️ خرجت من الصفحة! هذه الجلسة صارت <u>غير محتسبة</u> — لا تفتح الواتساب أو أي تطبيق أثناء الاختبار.</div>';
function wireExitWarn(sec){ AWAY.onReturn = function(){ var wb=sec.querySelector("[data-exitwarn]"); if(wb) wb.style.display="block"; }; }
// لو خرج من الصفحة أثناء أي قسم، نحفظ اللي سوّاه لين الآن (عشان لا يضيع تعبه)
document.addEventListener("visibilitychange", function(){ if(document.hidden){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); } });
// اختيار عناصر جديدة كل مرة بدون تكرار — نلفّ على كل القائمة ثم نعيد
function pickFresh(pool, key, n){
  n = Math.min(n||8, pool.length);
  var k = "seen_"+key+"_"+who;
  var seen; try{ seen=JSON.parse(localStorage.getItem(k)||"{}")||{}; }catch(e){ seen={}; }
  var remaining = pool.filter(function(x){ return !seen[x]; });
  if(remaining.length < n){ seen={}; remaining = pool.slice(); }
  var pick = shuffle(remaining).slice(0, n);
  pick.forEach(function(x){ seen[x]=1; });
  try{ localStorage.setItem(k, JSON.stringify(seen)); }catch(e){}
  return pick;
}
// اختيار قطعة قراءة مختلفة كل مرة — نلفّ على كل القطع ثم نعيد
function pickIndex(len, key){
  if(len<=1) return 0;
  var k = "seenIdx_"+key+"_"+who;
  var seen; try{ seen=JSON.parse(localStorage.getItem(k)||"[]")||[]; }catch(e){ seen=[]; }
  if(seen.length>=len) seen=[];
  var avail=[]; for(var i=0;i<len;i++){ if(seen.indexOf(i)<0) avail.push(i); }
  var pick = avail[Math.floor(Math.random()*avail.length)];
  seen.push(pick); try{ localStorage.setItem(k, JSON.stringify(seen)); }catch(e){}
  return pick;
}

// ===== تقييم النطق عبر Azure Speech (يعمل فقط إذا وُضع المفتاح في azure-config.js) =====
function azureCreds(){ var A = window.AZURE_SPEECH||{}; var c = A[who]; if(c && c.key && c.region) return c; var d = A["default"]; return (d && d.key && d.region) ? d : null; }
function azureConfigured(){ return !!azureCreds(); }
function azureAssess(refText, isAr, statusEl, btn){
  var cr = azureCreds();
  if(!cr){ statusEl.textContent="⚠️ لم يُضبط مفتاح Azure لهذا الطفل بعد."; return; }
  if(!window.SpeechSDK){ statusEl.textContent="⏳ جارٍ تحميل أداة النطق... جرّب بعد ثانية."; return; }
  var SDK = window.SpeechSDK;
  var cfg, audio, rec, pa;
  try{
    cfg = SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    cfg.speechRecognitionLanguage = isAr ? "ar-SA" : "en-US";
    audio = SDK.AudioConfig.fromDefaultMicrophoneInput();
    rec = new SDK.SpeechRecognizer(cfg, audio);
    pa = new SDK.PronunciationAssessmentConfig(refText, SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, true);
    pa.applyTo(rec);
  }catch(e){ statusEl.textContent="خطأ في الإعداد: "+(e.message||e); return; }
  if(btn){ btn.disabled=true; }
  statusEl.style.color="var(--muted)"; statusEl.innerHTML="🎙️ اقرأ الآن بصوت واضح...";
  rec.recognizeOnceAsync(function(result){
    try{
      if(result && result.reason===SDK.ResultReason.RecognizedSpeech){
        var r = SDK.PronunciationAssessmentResult.fromResult(result);
        var pron=Math.round(r.pronunciationScore), acc=Math.round(r.accuracyScore), flu=Math.round(r.fluencyScore);
        var col = pron>=80?"var(--good)":pron>=60?"var(--warn)":"var(--bad)";
        var bad=[];
        try{ var ws=(r.detailResult&&r.detailResult.Words)||[]; ws.forEach(function(w){ var a=w.PronunciationAssessment; if(a&&a.AccuracyScore<60) bad.push(w.Word); }); }catch(e){}
        var face = pron>=80?"🌟":pron>=60?"👍":"💪";
        statusEl.innerHTML = face+' <b style="color:'+col+'">النطق: '+pron+'/100</b> · دقّة '+acc+' · طلاقة '+flu + (bad.length?('<br>🔁 راجع نطق: <b>'+bad.join("، ")+'</b>'):' ✅ ممتاز!');
      } else {
        statusEl.style.color="var(--bad)"; statusEl.textContent="❌ ما وضح الصوت — تأكد من السماح للمايكروفون وحاول ثانية.";
      }
    }catch(e){ statusEl.style.color="var(--bad)"; statusEl.textContent="خطأ: "+(e.message||e); }
    if(btn){ btn.disabled=false; } try{ rec.close(); }catch(e){}
  }, function(err){ statusEl.style.color="var(--bad)"; statusEl.textContent="❌ خطأ Azure: "+err; if(btn){ btn.disabled=false; } try{ rec.close(); }catch(e){} });
}
function azBtnHtml(){ return azureConfigured() ? '<button class="say small azbtn" style="background:#0a7cff;color:#fff;border-color:#0a7cff">🎙️ قيّم نطقي</button>' : ''; }

try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
var CHOSEN = { en:null, ar:null };
function voicesFor(isAr){
  var re = isAr ? /^ar/i : /^en/i;
  return speechSynthesis.getVoices().filter(function(x){return re.test(x.lang);});
}
var AUDIO_VER = "s2";
var MANIFEST = null, MANI_DONE = false, CUR_AUDIO = null;
var MANI_P = fetch("audio/manifest.json?v=" + AUDIO_VER)
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(m){ MANIFEST = m; MANI_DONE = true; })
  .catch(function(){ MANI_DONE = true; });
function speak(text, rate, lang, onEnd){
  // ننتظر تحميل قائمة الصوت البشري قبل أي رجوع للصوت الآلي
  if(!MANI_DONE){ MANI_P.then(function(){ speak(text, rate, lang, onEnd); }); return; }
  var isAr = lang && lang.indexOf("ar")===0, lk = isAr ? "ar" : "en";
  var key = audioKey(text); // الصوت من نص بدون حركات (يُقرأ أصح)
  // صوت بشري جاهز إن وُجد
  if(MANIFEST && MANIFEST[lk] && MANIFEST[lk][key]){
    try{
      if(CUR_AUDIO){ CUR_AUDIO.pause(); }
      var a = new Audio("audio/" + MANIFEST[lk][key] + "?v=" + AUDIO_VER);
      a.playbackRate = Math.max(0.5, rate || 1);
      if(onEnd){ a.addEventListener("ended", onEnd); a.addEventListener("error", onEnd); }
      CUR_AUDIO = a; var pr=a.play(); if(pr&&pr.catch){ pr.catch(function(){ if(onEnd) onEnd(); }); } return;
    }catch(e){}
  }
  // بديل: نطق المتصفح
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(key);
    u.lang = lang || "en-US"; u.rate = rate || 0.9;
    var cands = voicesFor(isAr);
    var v = null;
    if(CHOSEN[lk]) v = cands.filter(function(x){return x.name===CHOSEN[lk];})[0];
    if(!v){ var good = cands.filter(function(x){return /(siri|enhanced|premium|natural|neural|eloquence|maged|majed|tarik|laila|samantha|daniel|karen|serena)/i.test(x.name);}); v = good[0] || cands[0]; }
    if(v) u.voice = v;
    if(onEnd){ u.onend = onEnd; }
    speechSynthesis.speak(u);
  }catch(e){ if(onEnd){ onEnd(); } alert("المتصفح لا يدعم النطق. جرّب Chrome أو Safari."); }
}
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// التعرّف على الكلام غير موثوق على آيفون/آيباد (قيد من آبل) — نخفي زر النطق هناك
var IS_IOS = /iP(hone|od|ad)/.test(navigator.platform)
  || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
  || /iPad|iPhone|iPod/.test(navigator.userAgent);
if(!SR || IS_IOS){ try{ document.documentElement.classList.add("no-mic"); }catch(e){} }
function startRecognition(lang, onResult, onErr){
  if(!SR){ onErr && onErr("no-support"); return; }
  try{
    var r = new SR(); r.lang = lang; r.interimResults = false; r.maxAlternatives = 5;
    r.onresult = function(e){ var a=[]; for(var i=0;i<e.results[0].length;i++) a.push(e.results[0][i].transcript); onResult(a); };
    r.onerror = function(e){ onErr && onErr((e && e.error) || "error"); };
    r.start();
  }catch(e){ onErr && onErr("error"); }
}
function speechMatch(alts, target, ar){
  var t = normX(target, ar).split(" ").filter(Boolean);
  var heard = alts[0] || "", best = 0;
  alts.forEach(function(a){
    var w = normX(a, ar).split(" ").filter(Boolean), setT = {}, hit = 0;
    t.forEach(function(x){ setT[x] = (setT[x]||0)+1; });
    w.forEach(function(x){ if(setT[x]>0){ hit++; setT[x]--; } });
    var score = t.length ? hit/t.length : 0;
    if(score > best) best = score;
  });
  return { ok: best >= 0.6, heard: heard, score: best };
}
function wireMic(qEl, text, ar){
  var mic = qEl.querySelector("[data-mic]"), pfb = qEl.querySelector(".pfb");
  if(!mic || !pfb) return;
  mic.addEventListener("click", function(){
    pfb.style.color = "var(--muted)"; pfb.textContent = "🎤 تكلّم الآن...";
    startRecognition(ar?"ar-SA":"en-US", function(alts){
      var m = speechMatch(alts, text, ar);
      if(m.ok){ pfb.style.color = "var(--good)"; pfb.textContent = "✅ نطق صحيح! ("+m.heard+")"; }
      else{ pfb.style.color = "var(--bad)"; pfb.textContent = '❌ سمعتك: "'+m.heard+'" · انطقها: '+text; }
    }, function(err){
      pfb.style.color = "var(--bad)";
      pfb.textContent = (err==="no-support") ? "⚠️ متصفح الآيفون لا يدعم النطق بالمايك — يشتغل على أندرويد/كمبيوتر بمتصفح Chrome." : "⚠️ لم أسمع بوضوح، اسمح بالمايك وحاول ثانية.";
    });
  });
}
function normX(s, ar){
  s = (s||"").replace(/[ً-ْٰ]/g,"").replace(/[.,!?;:'"،؛؟]/g,"").replace(/\s+/g," ").trim();
  if(ar){ s = s.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي"); } else { s = s.toLowerCase(); }
  return s;
}
// نص الصوت: بدون حركات (يُقرأ أصح)، مع تصحيح أسماء يخطئ الصوت في نطقها
var AUDIO_FIX = {"منى":"مُنى"};
function stripTash(s){ return (s||"").replace(/[ً-ْٰ]/g,""); }
function audioKey(s){ s = stripTash(s); for(var k in AUDIO_FIX){ s = s.split(k).join(AUDIO_FIX[k]); } return s; }
// مقارنة نطق متسامحة: تتجاهل الرموز الخفية والحركات وتوحّد صيغ الحروف
function normSpeak(s, ar){
  s = (s||"").replace(/[​-‏‪-‮⁦-⁩﻿ـ]/g,"")
             .replace(/[ً-ْٰ]/g,"");
  if(ar){
    s = s.replace(/[أإآٱا]/g,"ا")
         .replace(/[ىیيئ]/g,"ي")
         .replace(/ؤ/g,"و")
         .replace(/ة/g,"ه");
    return s.replace(/[^ء-ي]/g,"");
  }
  return s.toLowerCase().replace(/[^a-z]/g,"");
}
function norm(s, ar){
  s = (s||"").replace(/[ً-ْٰ]/g,"").replace(/[.,!?;:'"،؛؟]/g,"").replace(/\s+/g," ").trim();
  if(ar){ s = s.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي"); }
  else { s = s.toLowerCase(); }
  return s;
}

      if(Object.keys(tried).length!==total) return;
      var aw=awaySince(aw0); var trusted=(aw.exits===0);
      if(!saved){ saved=true; var learnedNow = isNew ? Math.min(VOC_TOTAL, startIdx+total) : getLearned(); var dur=Math.round((Date.now()-t0)/1000); saveScore("كلمات إنجليزي 🔤", correct, total, { mode:(isNew?"new":"review"), learned:learnedNow, vocTotal:VOC_TOTAL, dur:dur, away:aw.away, exits:aw.exits, trusted:trusted }); }
      if(!trusted){
        doneMsg.className="fb no"; doneMsg.innerHTML="🚫 هذه الجلسة <b>غير محتسبة</b> — خرجت من الصفحة "+aw.exits+" مرة أثناء الحل. حاول من جديد بدون ما تفتح أي تطبيق ثاني.";
      } else if(isNew && !advanced && startIdx<VOC_TOTAL){
        advanced=true; setLearned(startIdx+total);
        doneMsg.className="fb ok"; doneMsg.innerHTML="✅ خلّصت اليوم! حفظت الآن "+getLearned()+" / "+VOC_TOTAL+". بكرة اضغط «تعلّم ١٠ جديدة» للي بعدها، ولا تنسى «راجع المحفوظ».";
      } else {
        doneMsg.className="fb ok"; doneMsg.innerHTML="✅ أحسنت! النتيجة "+correct+" / "+total+".";
      }
    }
    // حفظ جزئي للمراجعة: حتى لو ما كمّل كل المجموعة، نحفظ الكلمات اللي جاوبها
    function saveIfPartial(){
      if(saved || isNew) return;
      var tn=Object.keys(tried).length; if(tn<1) return;
      saved=true; var aw=awaySince(aw0); var dur=Math.round((Date.now()-t0)/1000);
      saveScore("كلمات إنجليزي 🔤", correct, tn, { mode:"review", learned:getLearned(), vocTotal:VOC_TOTAL, dur:dur, away:aw.away, exits:aw.exits, trusted:(aw.exits===0) });
    }
    renderVocab._save = saveIfPartial; sec._leave = saveIfPartial;
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, word=V[i][0];
      var ein=qEl.querySelector(".einp"), fb=qEl.querySelector(".fb");
      qEl.querySelector("[data-show]").addEventListener("click",function(){ fb.className="fb"; fb.innerHTML='المعنى بالإنجليزي: <span class="corr">'+word+'</span>'; });
      qEl.querySelector(".chk").addEventListener("click",function(){
        var enOk = norm(ein.value,false)===norm(word,false);
        if(enOk){ fb.className="fb ok"; fb.textContent="✅ ممتاز! صحيح"; if(!done[i]){done[i]=1;correct++;} }
        else{ fb.className="fb no"; fb.innerHTML='❌ حاول ثانية · الصحيح: <span class="corr">'+word+'</span>'; }
        if(!tried[i]){ tried[i]=1; markWeak(word, !enOk); }
        scoreEl.textContent="الدرجة: "+correct+" / "+total;
        onComplete();
      });
      var pin=qEl.querySelector(".pinp"), pfb2=qEl.querySelector(".pfb2");
      qEl.querySelector(".pchk").addEventListener("click",function(){
        var said = normSpeak(pin.value,false), tgt = normSpeak(word,false);
        var ok = said && (said===tgt || tgt.indexOf(said)>=0 || said.indexOf(tgt)>=0);
        pfb2.style.color = ok?"var(--good)":"var(--bad)";
        pfb2.textContent = ok? " ✅ نطق صحيح!" : " ❌ غير واضح، جرّب ثانية";
      });
      var azb=qEl.querySelector(".azbtn"); if(azb) azb.addEventListener("click",function(){ azureAssess(word, false, pfb2, azb); });
    });
    sec.querySelectorAll("[data-mode]").forEach(function(b){ b.addEventListener("click",function(){ saveIfPartial(); vocMode=b.dataset.mode; renderVocab(); }); });
    var rg=sec.querySelector("[data-regen]"); if(rg) rg.addEventListener("click", function(){ saveIfPartial(); renderVocab(); });
  }

  function syncVocabTab(){
    var vt = document.querySelector('.tabs [data-tab="vocab"]');
    if(!vt) return;
    vt.style.display = (curLang==="ar") ? "none" : "";
    if(curLang==="ar" && vt.getAttribute("aria-selected")==="true"){
      document.querySelector('.tabs [data-tab="dict"]').click();
    }
  }

  function populateVoices(){
    var sel = document.getElementById("voiceSel"); if(!sel) return;
    var isAr = curLang==="ar", lk = isAr?"ar":"en";
    var vs = voicesFor(isAr);
    if(!vs.length){ sel.innerHTML='<option value="">(لا توجد أصوات — حمّلها من إعدادات الجوال)</option>'; return; }
    sel.innerHTML = vs.map(function(v){ return '<option value="'+v.name+'">'+v.name+' — '+v.lang+'</option>'; }).join("");
    if(CHOSEN[lk]) sel.value = CHOSEN[lk];
    sel.onchange = function(){ CHOSEN[lk] = sel.value; };
  }
  function tryVoice(){
    var d = (DATA[who] && DATA[who][curLang==="ar"?"ar":"en"]) || {};
    var sample = (d.dictation && d.dictation[0]) || (curLang==="ar"?"مدرسة":"school");
    speak(sample, 1, curLang==="ar"?"ar-SA":"en-US");
  }
  ["voiceTest","voiceTestFb"].forEach(function(id){
    var b = document.getElementById(id); if(b) b.addEventListener("click", tryVoice);
  });
  try{ speechSynthesis.onvoiceschanged = function(){ populateVoices(); }; }catch(e){}

  // نعرض شريط «صوت بشري» عند توفره، ونخفي منتقي صوت الجهاز الآلي
  function updateVoiceBars(){
    var human = !!(MANIFEST && ((MANIFEST.en && Object.keys(MANIFEST.en).length) || (MANIFEST.ar && Object.keys(MANIFEST.ar).length)));
    var hb = document.getElementById("humanBar"), vb = document.getElementById("voiceBar");
    if(hb) hb.style.display = (MANI_DONE && human) ? "flex" : "none";
    if(vb) vb.style.display = (MANI_DONE && !human) ? "flex" : "none";
  }
  MANI_P.then(updateVoiceBars);

  function renderAll(){ renderDict(); renderRead(); renderVocab(); syncVocabTab(); populateVoices(); updateVoiceBars(); }
  renderAll();

  document.querySelectorAll(".langtabs button").forEach(function(b){
    b.addEventListener("click",function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".langtabs button").forEach(function(x){x.setAttribute("aria-selected","false");});
      b.setAttribute("aria-selected","true");
      curLang = b.dataset.lang; renderAll();
    });
  });
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".tabs button").forEach(function(x){x.setAttribute("aria-selected","false");});
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
      document.getElementById(b.dataset.tab).classList.add("active");
    });
  });
}
</script>
</body>
</html>
