<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الرياضيات — ثاني متوسط</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:8px;margin:14px 0 8px}
  .chapsel button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 8px;border-radius:13px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:104px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.1rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .ax{direction:rtl;unicode-bidi:isolate;display:inline-block;font-weight:inherit}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.1rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"saud").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ var s = Number(Math.abs(n)).toLocaleString('en-US'); return (n<0 ? "\u2212" : "")+s; } // فاصلة آلاف + إشارة سالب رياضية
function mn(s){ return '<span class="en">'+s+'</span>'; }
// خيارات رقمية مميّزة: الصحيح + مشتّتات
function numOpts(correct, cands){
  /* لا بدّ من ثلاثة خيارات متمايزة. المشتّتات المقترحة قد تتصادم مع الجواب
     أو ببعضها (مثلًا حين يتساوى الطرفان في معادلة)، فنُتبعها باحتياطيٍّ
     موسَّع. وإن لم تكتمل الثلاثة رجّعنا null فيتخطّى genN المولّد ويعيد
     المحاولة — أهون من عرض خيارين على الطفل. */
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([correct+1, correct-1, correct+2, correct-2, correct+3,
                           correct+5, correct+10, correct*2, correct*2+1, correct+100]);
  for(var i=0;i<pool.length && others.length<2;i++){
    var v=pool[i];
    if(v!==correct && v>=0 && isFinite(v) && !seen[v]){ seen[v]=1; others.push(v); }
  }
  if(others.length<2) return null;
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}

/* ============================================================
   رياضيات ثاني متوسط — الفصل ١: الجبر والدوال
   الدروس ١-١ و١-٢ و١-٣، مبنيّة من كتاب رفيف نفسه (ص ١٢–٢٤).
   كل مولّد فوقه رقم الدرس والصفحة التي أُخذ منها نوع السؤال.
   ============================================================ */
var SUP = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
function sup(n){ return String(n).split("").map(function(d){ return SUP[+d]; }).join(""); }
function pw(b,e){ return mn(b+sup(e)); }

/* ===== الدرس ١-١: الخطوات الأربع لحل المسألة (ص ١٢–١٦) ===== */

/* ص١٢: ترتيب الخطوات الأربع — أساس الدرس كلّه */
var STEPS = ["افهم","خطّط","حُلّ","تحقّق"];
function gStepOrder(){
  var C = [
    ["«ما المعطيات؟ وما المطلوب إيجاده؟» — هذا السؤال في خطوة:", "افهم"],
    ["«اختر خطة لحلّ المسألة وقدّر الإجابة» — هذه خطوة:", "خطّط"],
    ["«استعمل خطّتك، وإن لم تنجح فاختر خطّة أخرى» — هذه خطوة:", "حُلّ"],
    ["«هل تتوافق إجابتك مع المعطيات؟ وهل هي معقولة؟» — هذا السؤال في خطوة:", "تحقّق"],
    ["أوّل خطوة تعملها قبل أن تحسب أيّ شيء هي:", "افهم"],
    ["بعد أن تصل إلى الجواب، الخطوة الأخيرة هي:", "تحقّق"]
  ];
  var c = gp(C), o = STEPS.slice(); shuffle(o);
  return [c[0], o, o.indexOf(c[1]), "الخطوات الأربع بالترتيب: <b>افهم ← خطّط ← حُلّ ← تحقّق</b>."];
}

/* ص١٤ مثال ٢: أقطار المضلّع — ن(ن−٣)÷٢ */
function gDiagonals(){
  var n = ri(6,12), r = n*(n-3)/2;
  var o = numOpts(r, [n*(n-1)/2, n*(n-3), r+n]);
  return ["القُطر قطعة مستقيمة تصل بين رأسين غير متجاورين في مضلَّع. للمثلث "+mn(0)+" أقطار، وللمربّع "+mn(2)+"، وللخماسي "+mn(5)+". فكم عدد أقطار مضلَّع له "+mn(n)+" أضلاع؟",
    o[0], o[1],
    "القاعدة: "+mn("ن × (ن − 3) ÷ 2")+" ⇐ "+mn(n+" × "+(n-3)+" ÷ 2 = "+r)+" قطرًا."];
}

/* ص١٤ تحقّق: الأعداد المثلّثية ١، ٣، ٦، ١٠، ١٥ … */
function gTriangular(){
  var k = ri(5,9), t=[], s=0;
  for(var i=1;i<=k+1;i++){ s+=i; t.push(s); }
  var r = t[k], seq = t.slice(0,k);
  var o = numOpts(r, [r+k, r-1, r+1]);
  return ["الأعداد المثلَّثية هي التي يمكن ترتيبها بنقطٍ على شكل مثلث: "+mn(seq.join(" ، ")+" ، ؟")+"<br>ما العدد التالي؟",
    o[0], o[1],
    "نزيد في كلّ مرة بمقدارٍ أكبر بواحد: آخر زيادة كانت "+mn(k)+" فالتالية "+mn(k+1)+" ⇐ "+mn(seq[k-1]+" + "+(k+1)+" = "+r)+"."];
}

/* ص١٤ تمرين ٢: نمط ضربيّ متزايد ١، ٢، ٦، ٢٤ … */
function gFactPattern(){
  var st = gp([1,2,3]), seq=[st], v=st;
  for(var i=2;i<=4;i++){ v*=i; seq.push(v); }
  var nx = v*5;
  var o = numOpts(nx, [v+5, v*2, nx+v]);
  return ["ما العدد التالي في النمط؟ "+mn(seq.join(" ، ")+" ، ؟"),
    o[0], o[1],
    "نضرب في "+mn(2)+" ثم في "+mn(3)+" ثم في "+mn(4)+" ثم في "+mn(5)+" ⇐ "+mn(v+" × 5 = "+nx)+"."];
}

/* ص١٤ تمرين ١: قراءة جدول — كم مرّة تكبر */
var ISLANDS = [["فرسان الكبرى",369],["زفاف",30],["السقيد",156],["دمسك",12],["سلوبه",2],["قماح",14]];
function gTableTimes(){
  var pairs = [];
  ISLANDS.forEach(function(x){ ISLANDS.forEach(function(y){ if(x[0]!==y[0] && x[1] >= y[1]*2) pairs.push([x,y]); }); });
  var pr = gp(pairs), a = pr[0], b = pr[1];
  var r = Math.round(a[1]/b[1]);
  var o = numOpts(r, [Math.round(a[1]/b[1])+2, a[1]-b[1], Math.round(b[1]/a[1])||1]);
  var rows = ISLANDS.map(function(x){ return '<tr><td style="border:1px solid #999;padding:3px 8px">'+x[0]+'</td><td style="border:1px solid #999;padding:3px 8px">'+x[1]+'</td></tr>'; }).join("");
  return ['الجدول يبيّن مساحات جُزُر فرسان بالكيلومتر المربّع. كم مرّة تقريبًا تكبر مساحة جزيرة <b>'+a[0]+'</b> جزيرةَ <b>'+b[0]+'</b>؟'+
    '<div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;margin:0 auto;font-size:.92rem"><tr><th style="border:1px solid #999;padding:3px 8px">الجزيرة</th><th style="border:1px solid #999;padding:3px 8px">المساحة</th></tr>'+rows+'</table></div>',
    o[0], o[1],
    "نقسم: "+mn(a[1]+" ÷ "+b[1]+" ≈ "+r)+" مرّة."];
}

/* ص١٣: خطوة «تحقّق» — هل الإجابة معقولة؟ */
function gReasonable(){
  var n = ri(4,9), per = ri(12,28), r = n*per;
  var ok = Math.random() < 0.5;
  var est = ok ? (Math.round(r/10)*10) : gp([r*10, Math.round(r/10), r+1000]);
  var o = ["معقولة","غير معقولة"]; shuffle(o);
  return ["في المدرسة "+mn(n)+" فصول، في كلّ فصلٍ "+mn(per)+" طالبًا. قدّرت طالبةٌ أن عدد الطلاب "+mn(fmt(est))+" طالبًا. هل إجابتها معقولة؟",
    o, o.indexOf(ok ? "معقولة" : "غير معقولة"),
    "خطوة <b>تحقّق</b>: نقدّر أوّلًا "+mn(n+" × "+per+" ≈ "+fmt(r))+"، والتقدير المذكور "+mn(fmt(est))+" ⇐ "+(ok ? "قريبٌ منه فهو معقول." : "بعيدٌ عنه فهو غير معقول.")];
}

/* ===== الدرس ١-٢: القوى والأسس (ص ١٧–٢٠) ===== */

/* ص١٧: القوة ← ضرب العامل في نفسه */
function gPowerExpand(){
  var b = ri(2,9), e = ri(2,5);
  var right = Array(e).fill(b).join(" × ");
  var d1 = Array(e).fill(b+1).join(" × ");
  var d2 = Array(e+1).fill(b).join(" × ");
  var o = [right,d1,d2].map(mn); shuffle(o);
  return ["اكتب القوة "+pw(b,e)+" على صورة ضرب العامل في نفسه:",
    o, o.indexOf(mn(right)),
    "الأساس "+mn(b)+" والأُسّ "+mn(e)+"، أي نستعمل "+mn(b)+" عاملًا "+mn(e)+" مرّات."];
}

/* ص١٨ مثالان ٣ و٤: احسب قيمة القوة */
function gPowerValue(){
  var b = ri(2,10), e = ri(2,4);
  if(b>=7 && e>3) e=2;
  var r = Math.pow(b,e);
  var o = numOpts(r, [b*e, Math.pow(b,e-1), Math.pow(b,e+1)]);
  return ["احسب قيمة القوة: "+pw(b,e), o[0], o[1],
    mn(Array(e).fill(b).join(" × ")+" = "+fmt(r))+" — لا تضرب الأساس في الأُسّ."];
}

/* ص١٨ مثال ٥: اكتب بالصيغة الأُسّية */
function gPowerWrite(){
  var b = ri(2,12), e = ri(3,6);
  var right = b+sup(e);
  var cands = [e+sup(b), b+sup(e+1), b+sup(e-1), (b+1)+sup(e)];
  var o = [right];
  for(var i=0;i<cands.length && o.length<3;i++){ if(o.indexOf(cands[i])<0) o.push(cands[i]); }
  o = o.map(mn); shuffle(o);
  return ["اكتب "+mn(Array(e).fill(b).join(" × "))+" بالصيغة الأُسّية:",
    o, o.indexOf(mn(right)),
    "العدد "+mn(b)+" هو الأساس، واستُعمل عاملًا "+mn(e)+" مرّات، فالأُسّ "+mn(e)+"."];
}

/* ص١٧: قراءة القوة بالكلمات */
function gPowerRead(){
  var b = ri(2,9), e = gp([2,3]);
  var right = (e===2) ? (b+" تربيع") : (b+" تكعيب");
  var wrong1 = (e===2) ? (b+" تكعيب") : (b+" تربيع");
  var o = [right, wrong1, "الأساس "+e+" والأُسّ "+b]; shuffle(o);
  return ["كيف تُقرأ القوة التالية؟ "+pw(b,e), o, o.indexOf(right),
    "الأُسّ "+mn(2)+" يُقرأ «تربيع» والأُسّ "+mn(3)+" يُقرأ «تكعيب»."];
}

/* ص١٨ تمرين ٧: الصيغة القياسية */
function gStandardForm(){
  var b = ri(2,7), e = ri(3,5), r = Math.pow(b,e);
  var o = numOpts(r, [b*e, Math.pow(b,e-1), r+b]);
  return ["يبلغ عدد طلاب مدرسةٍ "+pw(b,e)+" طالبًا. اكتب هذا العدد بالصيغة القياسية:",
    o[0], o[1],
    "الصيغة القياسية تعني كتابته عددًا عاديًّا: "+mn(Array(e).fill(b).join(" × ")+" = "+fmt(r))+"."];
}

/* ===== الدرس ١-٣: ترتيب العمليات (ص ٢١–٢٤) ===== */

/* ص٢١: ترتيب العمليات بالقاعدة */
function gOrderRule(){
  var C = [
    ["ما أوّل ما تحسبه في العبارة العددية؟", "ما بين الأقواس", ["الضرب","الجمع","الطرح"]],
    ["بعد الأقواس، ما الذي يُحسب قبل غيره؟", "القوى والأسس", ["الجمع","الطرح","القسمة"]],
    ["الضرب والقسمة يُحسبان:", "من اليمين إلى اليسار حسب أيّهما أسبق", ["الضرب دائمًا قبل القسمة","القسمة دائمًا قبل الضرب","بعد الجمع"]],
    ["الجمع والطرح يُحسبان:", "في النهاية، من اليمين إلى اليسار", ["قبل الأقواس","قبل الضرب","قبل الأسس"]]
  ];
  var c = gp(C), o = [c[1]].concat(c[2]); shuffle(o);
  return [c[0], o, o.indexOf(c[1]),
    "ترتيب العمليات: <b>الأقواس ← الأسس ← الضرب والقسمة ← الجمع والطرح</b>."];
}

/* ص٢٢ مثال ٣: أقواس ثم ضرب ثم جمع */
function gOrderParen(){
  var a=ri(10,20), b=ri(2,6), c=ri(3,9), d=ri(1,c-1);
  var r = a + b*(c-d);
  var wrongLeft = (a+b)*(c-d);           /* من جمع قبل الضرب */
  var wrongNoParen = a + b*c - d;        /* من تجاهل القوسين */
  var o = numOpts(r, [wrongLeft, wrongNoParen, r+b]);
  return ["احسب قيمة: "+mn(a+" + "+b+" ("+c+" − "+d+")"),
    o[0], o[1],
    "الأقواس أوّلًا: "+mn(c+" − "+d+" = "+(c-d))+"، ثم الضرب "+mn(b+" × "+(c-d)+" = "+(b*(c-d)))+"، ثم الجمع ⇐ "+mn(r)+"."];
}

/* ص٢٢ مثال ٤: أسس ثم ضرب ثم طرح */
function gOrderPower(){
  var a=ri(2,6), b=ri(2,3), e=ri(2,3), c=ri(2,9);
  var p = Math.pow(b,e), r = a*p - c;
  if(r<1){ c = ri(1, a*p-1); r = a*p - c; }
  var wrongMul = Math.pow(a*b, e) - c;   /* من ضرب قبل الأسّ */
  var o = numOpts(r, [wrongMul, a*b*e - c, r+c]);
  return ["احسب قيمة: "+mn(a+" × "+b+sup(e)+" − "+c),
    o[0], o[1],
    "الأُسّ أوّلًا: "+mn(b+sup(e)+" = "+p)+"، ثم الضرب "+mn(a+" × "+p+" = "+(a*p))+"، ثم الطرح ⇐ "+mn(r)+"."];
}

/* ص٢٢ مثال ٥: مسألة نقود — عبارة عددية من جدول */
var SHOPITEMS = [["ورق زينة",2],["ألعاب",7],["بالونات",5],["أقلام",3],["دفاتر",6]];

/* ص٢٢ تحقّق (د): جمع وقسمة وضرب مع قوسين */

/* ص25 مثال: نوعان بسعرين مختلفين ومجموع معلوم */

/* ص26: عددان مجموعهما وفرقهما معلومان */

/* ===== الدرس 1-5: الجبر — المتغيّرات والعبارات الجبرية (ص 27–29) ===== */

var VARS = ["س","ص","ن","م","ك","د"];

/* ============================================================
   الفصل الثاني: الأعداد الصحيحة — الدروس 2-1 … 2-8 (ص 49–91)
   ============================================================ */
function pz(n){ return n<0 ? "("+fmt(n)+")" : fmt(n); }   /* عدد سالب بين قوسين */
/* خيارات لأعداد صحيحة (تسمح بالسالب، بخلاف numOpts) */
function zOpts(correct, cands){
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([-correct, correct+1, correct-1, correct+2, correct+10]);
  for(var i=0;i<pool.length && others.length<2;i++){ var v=pool[i]; if(v!==correct && !seen[v]){ seen[v]=1; others.push(v); } }
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}

  var a = ri(-30,30), b = ri(-30,30); if(a===b) b = a+ri(1,9);
  var r = Math.max(a,b);

    o, o.indexOf(fmt(r)),

/* ص55: ترتيب تصاعدي */
function gOrderAsc(){
  var set = {}; while(Object.keys(set).length < 4){ set[ri(-25,25)] = 1; }
  var v = Object.keys(set).map(Number);
  var asc = v.slice().sort(function(x,y){ return x-y; });
  var right = asc.map(fmt).join(" < ");
  var wrong1 = asc.slice().reverse().map(fmt).join(" < ");
  var wrong2 = v.slice().sort(function(x,y){ return Math.abs(x)-Math.abs(y); }).map(fmt).join(" < ");
  var o = [right, wrong1, wrong2].filter(function(x,i,arr){ return arr.indexOf(x)===i; });
  if(o.length < 3) o.push(asc.slice(1).concat(asc[0]).map(fmt).join(" < "));
  o = o.slice(0,3); shuffle(o);
  return ["رتّب الأعداد التالية تصاعديًّا (من الأصغر إلى الأكبر): "+mn(shuffle(v.slice()).map(fmt).join(" ، ")),
    o.map(mn), o.indexOf(right),
    "الترتيب الصحيح على خط الأعداد من اليسار إلى اليمين: "+mn(right)+"."];
}

/* ص54: أبرد مدينة (جدول درجات حرارة) */
var CITIES = ["الرياض","جدة","أبها","تبوك","حائل","عرعر","الدمام","القريات"];
function gColdest(){
  var cs = shuffle(CITIES.slice()).slice(0,4);
  var set = {}; while(Object.keys(set).length < 4){ set[ri(-12,20)] = 1; }
  var t = shuffle(Object.keys(set).map(Number));
  var ask = gp([0,1]);   /* 0 = الأبرد، 1 = الأدفأ */
  var target = ask ? Math.max.apply(null,t) : Math.min.apply(null,t);
  var right = cs[t.indexOf(target)];
  var o = cs.slice(0,3).indexOf(right)>=0 ? cs.slice(0,3) : [right].concat(cs.filter(function(x){return x!==right;}).slice(0,2));
  o = o.slice(); shuffle(o);
  var rows = cs.map(function(c,i){ return '<tr><td style="border:1px solid #999;padding:3px 10px">'+c+'</td><td style="border:1px solid #999;padding:3px 10px">'+fmt(t[i])+'</td></tr>'; }).join("");
  return ['يبيّن الجدول درجات الحرارة المسجَّلة في أربع مدن. أيُّ المدن كانت <b>'+(ask?"الأدفأ":"الأبرد")+'</b>؟'+
    '<div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;margin:0 auto;font-size:.92rem"><tr><th style="border:1px solid #999;padding:3px 10px">المدينة</th><th style="border:1px solid #999;padding:3px 10px">الحرارة</th></tr>'+rows+'</table></div>',
    o, o.indexOf(right),
    (ask?"الأدفأ هي صاحبة أكبر عدد: ":"الأبرد هي صاحبة أصغر عدد: ")+mn(fmt(target))+" ⇐ "+right+"."];
}

/* ===== الدرس 2-3: المستوى الإحداثي (ص 58–62) ===== */

var QUAD = ["الربع الأول","الربع الثاني","الربع الثالث","الربع الرابع"];
function quadOf(x,y){
  if(x>0 && y>0) return 0;
  if(x<0 && y>0) return 1;
  if(x<0 && y<0) return 2;
  return 3;
}
/* ص59 مثال 1: تحديد الربع */
function gQuadrant(){
  var x = gp([-1,1])*ri(1,6), y = gp([-1,1])*ri(1,6);
  var right = QUAD[quadOf(x,y)];
  var o = QUAD.slice(); shuffle(o);
  return ["في أيِّ ربعٍ تقع النقطة "+mn("("+fmt(x)+", "+fmt(y)+")")+" ؟",
    o, o.indexOf(right),
    "الإحداثي السيني "+mn(fmt(x))+" والصادي "+mn(fmt(y))+" ⇐ "+right+". (الأول: + +، الثاني: − +، الثالث: − −، الرابع: + −)"];
}

/* ص59: نقطة على أحد المحورين */
function gOnAxis(){
  var k = ri(1,6), which = gp([0,1,2]);
  var x = which===0 ? k*gp([-1,1]) : 0, y = which===1 ? k*gp([-1,1]) : 0;
  if(which===2){ x = 0; y = 0; }
  var right = which===2 ? "نقطة الأصل" : (which===0 ? "المحور السيني" : "المحور الصادي");
  var o = ["المحور السيني","المحور الصادي","نقطة الأصل","الربع الأول"]; shuffle(o);
  return ["أين تقع النقطة "+mn("("+fmt(x)+", "+fmt(y)+")")+" ؟",
    o, o.indexOf(right),
    "إذا كان الإحداثي الصادي صفرًا فالنقطة على المحور السيني، وإذا كان السيني صفرًا فهي على المحور الصادي، وإذا كانا صفرين فهي نقطة الأصل."];
}

/* ص58: من الحركة إلى الزوج المرتّب */
function gMoveToPair(){

  o = o.filter(function(v,i,arr){ return arr.indexOf(v)===i; });
  if(o.length<3) o.push("("+fmt(x)+", "+fmt(-y)+")");
  o = o.slice(0,3); shuffle(o);
  return ["ابدأ من نقطة الأصل، وتحرّك "+mn(a)+" "+tmz(a,"وحدةً","وحدات")+" إلى "+hx[0]+"، ثمّ "+mn(b)+" "+tmz(b,"وحدةً","وحدات")+" إلى "+hy[0]+". ما الزوج المرتّب للنقطة؟",
    o.map(mn), o.indexOf(right),
    "اليمين وأعلى موجب، واليسار وأسفل سالب، والإحداثي السيني يُكتب أوّلًا ⇐ "+mn(right)+"."];

function gAddSame(){
  var s = gp([-1,1]), a = s*ri(3,40), b = s*ri(3,40), r = a+b;

/* ص67 مثال 2: عددان مختلفا الإشارة */
function gAddDiff(){

}

/* ص68 تمرين 5: ثلاثة أعداد */
function gAddThree(){
  var a = gp([-1,1])*ri(3,25), b = gp([-1,1])*ri(3,25), c = gp([-1,1])*ri(3,25), r = a+b+c;
  var o = zOpts(r, [-r, a+b-c, Math.abs(a)+Math.abs(b)+Math.abs(c)]);

}

/* ص65: النظير الجمعي */

/* ===== الدرس 2-5: طرح الأعداد الصحيحة (ص 71–75) ===== */

/* ص72 مثالان: الطرح */
function gSubInt(){
  var a = gp([-1,1])*ri(2,40), b = gp([-1,1])*ri(2,40), r = a-b;
  var o = zOpts(r, [a+b, -r, b-a]);

    o[0], o[1],
    "لطرح عددٍ نجمع نظيره: "+mn(fmt(a)+" + "+pz(-b)+" = "+fmt(r))+"."];
}

/* ص72: تحويل الطرح إلى جمع */
function gSubAsAdd(){
  var a = gp([-1,1])*ri(2,30), b = gp([-1,1])*ri(2,30);
  var right = fmt(a)+" + "+pz(-b);
  var o = [right, fmt(a)+" + "+pz(b), fmt(-a)+" + "+pz(b)];
  o = o.filter(function(v,i,arr){ return arr.indexOf(v)===i; });
  if(o.length<3) o.push(fmt(-a)+" + "+pz(-b));
  o = o.slice(0,3); shuffle(o);
  return ["أيُّ جملة جمعٍ تكافئ: "+mn(fmt(a)+" − "+pz(b)),
    o.map(mn), o.indexOf(right),
    "طرح عددٍ = جمع نظيره الجمعي ⇐ "+mn(right+" = "+fmt(a-b))+"."];
}

/* ص73: فرق درجات الحرارة */
function gSubTemp(){

    o[0], o[1],
    "الفرق = العظمى − الصغرى ⇐ "+mn(fmt(hi)+" − "+pz(lo)+" = "+fmt(hi)+" + "+fmt(-lo)+" = "+fmt(r))+"."];
}

/* ص71: مصطلحات الطرح */
function gSubRule(){

/* ===== الدرس 2-6: ضرب الأعداد الصحيحة (ص 76–79) ===== */

/* ص77: إشارتان مختلفتان ⇐ سالب */
function gMulDiff(){
  var a = ri(2,12), b = -ri(2,12);
  if(gp([0,1])){ var t=a; a=b; b=Math.abs(t); }
  var r = a*b;
  var o = zOpts(r, [-r, a+b, Math.abs(a*b)+Math.abs(a)]);
  return ["أوجد الناتج: "+mn(fmt(a)+" × "+pz(b)),
    o[0], o[1],
    "الإشارتان مختلفتان فالناتج سالب: "+mn(Math.abs(a)+" × "+Math.abs(b)+" = "+Math.abs(r))+" ⇐ "+mn(fmt(r))+"."];
}

/* ص78: إشارتان متشابهتان ⇐ موجب */
function gMulSame(){
  var s = gp([-1,1]), a = s*ri(2,12), b = s*ri(2,12), r = a*b;
  var o = zOpts(r, [-r, a+b, r+Math.abs(a)]);
  return ["أوجد الناتج: "+mn(fmt(a)+" × "+pz(b)),
    o[0], o[1],
    "الإشارتان متشابهتان فالناتج موجب ⇐ "+mn(fmt(r))+"."];
}

/* ص78 مثال 4: مربّع عددٍ سالب */
function gMulSquare(){

    o[0], o[1],
    mn("("+fmt(a)+") × ("+fmt(a)+")")+" — العددان لهما الإشارة نفسها فالناتج موجب ⇐ "+mn(fmt(r))+"."];
}

/* ص78 مثال 5: ثلاثة أعداد */
function gMulThree(){
  var a = gp([-1,1])*ri(2,8), b = gp([-1,1])*ri(2,8), c = gp([-1,1])*ri(2,6), r = a*b*c;
  var o = zOpts(r, [-r, a*b+c, a+b+c]);

    o[0], o[1],
    "نضرب اثنين أوّلًا: "+mn(fmt(a)+" × "+pz(b)+" = "+fmt(a*b))+"، ثمّ "+mn(fmt(a*b)+" × "+pz(c)+" = "+fmt(r))+"."];

/* ص79: غوّاصة تنزل بمعدّل ثابت */
function gMulWord(){
  var per = ri(2,9), mins = ri(3,12), r = -per*mins;
  var o = zOpts(r, [-r, -(per+mins), r-per]);
  return ["تبدأ غوّاصةٌ الغطس من سطح الماء بسرعة "+mn(per)+" "+tmz(per,"مترًا","أمتار")+" في الدقيقة. ما العمق الذي تصل إليه بعد "+mn(mins)+" "+tmz(mins,"دقيقةً","دقائق")+"؟",
    o[0], o[1],
    "النزول يمثَّل بعددٍ سالب: "+mn(fmt(-per)+" × "+mins+" = "+fmt(r))+" مترًا."];

/* ص77–78: قاعدة الضرب */
function gMulRule(){
  var C = [
    ["ناتج ضرب عددين صحيحين لهما الإشارة نفسها يكون:", "موجبًا", ["سالبًا","صفرًا","له إشارة الأكبر"]],
    ["ناتج ضرب عددين صحيحين مختلفَي الإشارة يكون:", "سالبًا", ["موجبًا","صفرًا","له إشارة الأول"]],
    ["ناتج ضرب أيّ عددٍ صحيحٍ في صفر يساوي:", "صفرًا", ["العدد نفسه","واحدًا","نظير العدد"]],
    ["ناتج ضرب ثلاثة أعدادٍ سالبة يكون:", "سالبًا", ["موجبًا","صفرًا","لا يمكن تحديده"]]

/* ===== الدرس 2-7: استراتيجية البحث عن نمط (ص 82–83) ===== */

/* ص82: جدول نسبة ثابتة */
function gPatternRatio(){
  var per = gp([4,5,6,8]), out = ri(3, per-1), k = ri(4,9);   /* الأهداف أقلّ من الركلات دائمًا */
  var kicks = per*k, goals = out*k;
  var head = ["الأهداف","الركلات"], name = gp(["طلال","سعود","ماجد","خالد","فيصل"]);
  var o = zOpts(goals, [kicks-goals, goals+out, Math.round(kicks/2)]);
  var r1 = [1,2,3].map(function(i){ return '<td style="border:1px solid #999;padding:3px 10px">'+(out*i)+'</td>'; }).join("");
  var r2 = [1,2,3].map(function(i){ return '<td style="border:1px solid #999;padding:3px 10px">'+(per*i)+'</td>'; }).join("");
  return ['يسجّل '+name+' <b>'+out+'</b> أهدافٍ من كلّ <b>'+per+'</b> ركلاتٍ، كما في الجدول. كم هدفًا يسجّل من '+mn(kicks)+' ركلة؟'+
    '<div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;margin:0 auto;font-size:.92rem">'+
    '<tr><td style="border:1px solid #999;padding:3px 10px">'+head[0]+'</td>'+r1+'</tr>'+
    '<tr><td style="border:1px solid #999;padding:3px 10px">'+head[1]+'</td>'+r2+'</tr></table></div>',
    o[0], o[1],
    "النمط: كلّ "+mn(per)+" ركلاتٍ تعطي "+mn(out)+" أهداف. و"+mn(kicks)+" ركلة = "+mn(k)+" مجموعات ⇐ "+mn(k+" × "+out+" = "+goals)+" هدفًا."];
}

/* ص83: متتابعة بفرق ثابت */
function gPatternStep(){
  var a0 = ri(2,15), d = gp([-1,1])*ri(2,9), k = ri(6,10);
  var seq = [0,1,2,3].map(function(i){ return a0 + i*d; });
  var r = a0 + (k-1)*d;
  var o = zOpts(r, [a0 + k*d, r-d, a0*k]);
  return ["ابحث عن النمط: "+mn(seq.map(fmt).join(" ، ")+" ، …")+"<br>ما الحدّ رقم "+mn(k)+" ؟",
    o[0], o[1],
    "النمط يزيد بمقدار "+mn(fmt(d))+" في كلّ خطوة ⇐ "+mn(fmt(a0)+" + "+(k-1)+" × "+pz(d)+" = "+fmt(r))+"."];
}

    ["بعد أن تكتشف النمط، ماذا تفعل؟", "أوسّعه حتى أصل إلى المطلوب ثمّ أتحقّق", ["أتوقّف وأكتب أوّل عدد","أعيد كتابة المعطيات","أبدّل النمط بنمطٍ آخر"]]
  ];
  var c = gp(C), o = [c[1]].concat(c[2]); shuffle(o);
  return [c[0], o, o.indexOf(c[1]),

}

/* ===== الدرس 2-8: قسمة الأعداد الصحيحة (ص 84–87) ===== */

/* ص85 مثال 1: إشارتان مختلفتان */
function gDivDiff(){
  var q = ri(2,12), b = ri(2,12), a = q*b;
  if(gp([0,1])){ b = -b; } else { a = -a; }
  var r = a/b;
  var o = zOpts(r, [-r, a-b, r+1]);
  return ["أوجد ناتج القسمة: "+mn(fmt(a)+" ÷ "+pz(b)),
    o[0], o[1],
    "الإشارتان مختلفتان فالناتج سالب: "+mn(Math.abs(a)+" ÷ "+Math.abs(b)+" = "+Math.abs(r))+" ⇐ "+mn(fmt(r))+"."];

/* ص86 مثال 3: إشارتان متشابهتان */
function gDivSame(){
  var q = ri(2,12), b = ri(2,12), a = q*b;
  if(gp([0,1])){ a = -a; b = -b; }
  var r = a/b;
  var o = zOpts(r, [-r, a+b, r+2]);
  return ["أوجد ناتج القسمة: "+mn(fmt(a)+" ÷ "+pz(b)),

function gDivFrac(){
  var q = ri(2,11), b = ri(2,11), a = q*b;
  if(gp([0,1])) a = -a; else b = -b;
  var r = a/b;
  var o = zOpts(r, [-r, a+b, r-1]);
  return ["أوجد ناتج القسمة: "+mn(fmt(a)+" / "+fmt(b)),
    o[0], o[1],
    "الخطّ الكسري يعني القسمة، والإشارتان مختلفتان فالناتج سالب ⇐ "+mn(fmt(r))+"."];

function gDivAlg(){
  var q = gp([-1,1])*ri(2,10), b = gp([-1,1])*ri(2,10), a = q*b;

/* ص86: معدّل التغيّر */
function gDivWord(){
  var per = ri(2,9), n = ri(3,9), total = -per*n;
  var o = zOpts(-per, [per, total/2, total]);

    o[0], o[1],
    mn(fmt(total)+" ÷ "+n+" = "+fmt(-per))+" — أي أنّها تنخفض "+mn(per)+" "+tmz(per,"درجةً","درجات")+" كلّ ساعة."];
}

/* ص86: قاعدة القسمة */
function gDivRule(){
  var C = [
    ["ناتج قسمة عددين صحيحين لهما الإشارة نفسها يكون:", "موجبًا", ["سالبًا","صفرًا","له إشارة المقسوم"]],
    ["ناتج قسمة عددين صحيحين مختلفَي الإشارة يكون:", "سالبًا", ["موجبًا","صفرًا","له إشارة المقسوم عليه"]],

/* ===== الدرس 3-1: كتابة العبارات الجبرية والمعادلات (ص 94–100) ===== */

/* ص94 مثال 1 + جدول الكلمات الدالّة */
var VERBEXP = [
  ["عددٌ ازداد بمقدار ", "س + ", 0],
  ["عددٌ نقص بمقدار ",  "س − ", 1],
  [" أكبر من عددٍ",      "س + ", 2],
  [" أقلّ من عددٍ",      "س − ", 3],
  ["مجموع عددٍ و",       "س + ", 0],
  ["الفرق بين عددٍ و",   "س − ", 1],
  [" أضعاف عددٍ",        "س",    4],
  ["ناتج ضرب عددٍ في ",  "س",    5],
  ["عددٌ مقسومٌ على ",    "س ÷ ", 6]
];
function gExprFromWords(){
  var v = gp(VERBEXP), n = ri(3,10);   /* ٣–١٠ ليصحّ جمع التمييز في «أضعاف» */
  var phrase, right;
  if(v[2]===2 || v[2]===3 || v[2]===4){ phrase = mn(n)+v[0]; } else { phrase = v[0]+mn(n); }
  if(v[1]==="س"){ right = n+"س"; } else { right = v[1]+n; }
  var pool = ["س + "+n, "س − "+n, n+"س", "س ÷ "+n, n+" − س"];
  var o = [right]; shuffle(pool);
  for(var i=0;i<pool.length && o.length<3;i++){ if(o.indexOf(pool[i])<0) o.push(pool[i]); }
  shuffle(o);
  return ["اكتب العبارة التالية على صورة عبارةٍ جبرية، حيث "+ax("س")+" هو العدد: «"+phrase+"»",
    o.map(ax), o.indexOf(right),
    "«ازداد» و«مجموع» و«أكبر من» ⇐ جمع، و«نقص» و«الفرق» و«أقلّ من» ⇐ طرح، و«أضعاف» و«ناتج ضرب» ⇐ ضرب، و«مقسوم» ⇐ قسمة. فالعبارة هي "+ax(right)+"."];
}

/* ص94 مثال: مع خالد زيادةٌ على ما مع حمد */
function gExprMoney(){
  var n = ri(3,15), a = gp(["خالد","سعد","نايف","ريما","لمى"]), b = gp(["حمد","فهد","سلمان","دانة","نورة"]);
  var more = gp([0,1]);
  var right = more ? ("س + "+n) : ("س − "+n);
  var o = ["س + "+n, "س − "+n, n+"س"]; shuffle(o);
  return ["مع "+a+" "+mn(n)+" "+ryl(n)+" "+(more?"زيادةً على":"أقلّ ممّا مع")+" "+b+". إذا كانت "+ax("س")+" تمثّل ما مع "+b+"، فما العبارة الجبرية التي تمثّل ما مع "+a+"؟",
    o.map(ax), o.indexOf(right),
    (more?"«زيادة على» تعني الجمع":"«أقلّ ممّا» تعني الطرح")+" ⇐ "+ax(right)+"."];
}

/* ص95: من جملة لفظية إلى معادلة */
function gEqFromWords(){
  var n = ri(3,10), r = ri(5,40);
  var kind = gp([0,1,2]);
  var right = kind===0 ? ("س + "+n+" = "+r) : kind===1 ? ("س − "+n+" = "+r) : (n+"س = "+r);
  var txt   = kind===0 ? ("عددٌ مضافًا إليه "+mn(n)+" يساوي "+mn(r))
            : kind===1 ? ("عددٌ مطروحًا منه "+mn(n)+" يساوي "+mn(r))
            :            (mn(n)+" أضعاف عددٍ تساوي "+mn(r));
  var o = ["س + "+n+" = "+r, "س − "+n+" = "+r, n+"س = "+r]; shuffle(o);
  return ["اكتب معادلةً تمثّل الجملة: «"+txt+"»",
    o.map(ax), o.indexOf(right),
    "نرمز للعدد المجهول بـ"+ax("س")+"، ثمّ نترجم الكلمات إلى عمليات ⇐ "+ax(right)+"."];
}

/* ص94: الكلمات الدالّة على العمليات */

/* ===== الدرس 3-4: استراتيجية الحلّ عكسيًّا (ص 114–115) ===== */

/* ===== الدرس 3-6: القياس — المحيط والمساحة (ص 122–127) ===== */

/* ص122 مثال 1: محيط المستطيل */
function gPerimeter(){
  var L = ri(4,25), W = ri(2,20); if(L===W) W = L+3;
  var r = 2*(L+W);
  var o = numOpts(r, [L*W, L+W, 2*L+W]);
  return ["مستطيلٌ طوله "+mn(L)+" سم وعرضه "+mn(W)+" سم. ما محيطه بالسنتمتر؟",
    o[0], o[1],
    "محيط المستطيل "+ax("مح = 2 (ل + ض)")+" ⇐ "+mn("2 × ("+L+" + "+W+") = "+r)+" سم."];
}

/* ص123: مساحة المستطيل */
function gArea(){
  var L = ri(4,25), W = ri(2,20); if(L===W) W = L+3;
  var r = L*W;
  var o = numOpts(r, [2*(L+W), L+W, L*W+L]);
  return ["مستطيلٌ طوله "+mn(L)+" سم وعرضه "+mn(W)+" سم. ما مساحته بالسنتمتر المربّع؟",
    o[0], o[1],
    "مساحة المستطيل "+ax("م = ل × ض")+" ⇐ "+mn(L+" × "+W+" = "+r)+" سم²."];
}

function gLengthFromPerim(){
  var L = ri(4,25), W = ri(2,20); if(L===W) W = L+3;
  var P = 2*(L+W);
  var o = numOpts(L, [P-W, P/2, P-2*W]);
  return ["مستطيلٌ محيطه "+mn(P)+" سم وعرضه "+mn(W)+" سم. ما طوله بالسنتمتر؟",
    o[0], o[1],
    "من "+ax("مح = 2 (ل + ض)")+": "+mn(P+" ÷ 2 = "+(P/2))+"، ثمّ "+mn((P/2)+" − "+W+" = "+L)+" سم."];
}

/* ص124: العرض من المساحة والطول */
function gWidthFromArea(){
  var L = ri(3,20), W = ri(2,15), A = L*W;
  var o = numOpts(W, [A-L, A, L+W]);
  return ["مستطيلٌ مساحته "+mn(A)+" سم² وطوله "+mn(L)+" سم. ما عرضه بالسنتمتر؟",
    o[0], o[1],
    "من "+ax("م = ل × ض")+": "+mn(A+" ÷ "+L+" = "+W)+" سم."];
}

/* ===== الدرس 3-7: التمثيل البياني للدوال (ص 129–134) ===== */

/* ص129: زوجٌ مرتّب من قاعدة الدالّة */
function gPairFromRule(){
  var a = ri(2,9), b = ri(-5,9), x = ri(1,8), y = a*x+b;
  var right = "("+fmt(x)+", "+fmt(y)+")";
  /* المشتّتان قد يتصادمان مع الجواب أو ببعضهما (مثلًا حين س = ص أو ب = 0)،
     والحشو الواحد لا يكفي إن سقط اثنان. فنملأ من قائمةٍ حتى تكتمل ثلاثة. */
  var o = [right];
  var fill = ["("+fmt(y)+", "+fmt(x)+")", "("+fmt(x)+", "+fmt(a*x)+")",
              "("+fmt(x)+", "+fmt(y+a)+")", "("+fmt(x)+", "+fmt(y-a)+")",
              "("+fmt(x+1)+", "+fmt(y)+")", "("+fmt(x)+", "+fmt(y+1)+")"];
  for(var fi=0; fi<fill.length && o.length<3; fi++){ if(o.indexOf(fill[fi])<0) o.push(fill[fi]); }
  if(o.length<3) return null;
  shuffle(o);
  return ["قاعدة الدالّة "+ax("ص = "+a+"س "+(b<0?"− "+Math.abs(b):"+ "+b))+". أيُّ زوجٍ مرتّبٍ يقع على تمثيلها البياني عندما "+ax("س = "+x)+" ؟",
    o.map(mn), o.indexOf(right),
    "نعوّض: "+mn(a+" × "+x+" "+(b<0?"− "+Math.abs(b):"+ "+b)+" = "+fmt(y))+" ⇐ الزوج المرتّب "+mn(right)+"."];
}

/* ص129 مثال 1: من الجدول إلى الأزواج المرتّبة */
function gTableToPair(){
  var a = ri(2,12);
  var xs = [1,2,3,4], ys = xs.map(function(x){ return a*x; });
  var k = ri(1,4), right = "("+k+", "+ys[k-1]+")";
  var o = [right, "("+ys[k-1]+", "+k+")", "("+k+", "+(ys[k-1]+a)+")"];
  o = o.filter(function(v,i,arr){ return arr.indexOf(v)===i; });
  o = o.slice(0,3); shuffle(o);
  var tr = '<tr><td style="border:1px solid #999;padding:3px 10px">المُدخَل (س)</td>'+xs.map(function(x){ return '<td style="border:1px solid #999;padding:3px 10px">'+x+'</td>'; }).join("")+'</tr>'+
           '<tr><td style="border:1px solid #999;padding:3px 10px">المُخرَج (ص)</td>'+ys.map(function(y){ return '<td style="border:1px solid #999;padding:3px 10px">'+y+'</td>'; }).join("")+'</tr>';
  return ['يبيّن الجدول دالّةً. أيُّ زوجٍ مرتّبٍ يمثّل المُدخَل '+mn(k)+' ؟'+
    '<div style="overflow-x:auto;margin-top:8px"><table style="border-collapse:collapse;margin:0 auto;font-size:.92rem">'+tr+'</table></div>',
    o.map(mn), o.indexOf(right),
    "الزوج المرتّب يُكتب (مُدخَل، مُخرَج) ⇐ "+mn(right)+"."];
}

/* ص129 استعدّ: رحلة الطلاب */
function gLinearWord(){

    o.map(mn), o.indexOf(right),

/* ============================================================
   الفصل الرابع: النِّسبة والتَّناسب (ص 139–182)
   ============================================================ */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=b; b=a%b; a=t; } return a||1; }
function frq(a,b){ var g=gcd(a,b); return (b/g===1) ? String(a/g) : (a/g)+"/"+(b/g); }   /* كسر في أبسط صورة */
function rto(a,b){ var g=gcd(a,b); return (a/g)+" : "+(b/g); }        /* نسبة في أبسط صورة */
/* خيارات نصّية متمايزة */
function sOpts(right, cands){
  /* كسابقتها: ثلاثة متمايزة أو null. المشتّتات هنا نصوص فلا يمكن توليد
     احتياطيٍّ لها، والبديل الوحيد أن يتخطّى genN هذه التوليدة. */
  var o=[right];
  for(var i=0;i<cands.length && o.length<3;i++){ if(cands[i]!=null && o.indexOf(cands[i])<0) o.push(cands[i]); }
  if(o.length<3) return null;
  shuffle(o); return [o, o.indexOf(right)];
}

/* ص140 مثال 1: نسبة في أبسط صورة */
var RECIPE = [["حليب مجفف","كركم"],["دقيق","سكر"],["أرز","عدس"],["تمر","لوز"],["ماء","عصير"]];
function gRatioSimplify(){
  var it = gp(RECIPE), g = gp([2,3,4,5]), a = g*ri(2,5), b = g*ri(2,5);
  if(a===b) b = a + g;
  var right = rto(a,b);
  var o = sOpts(right, [rto(b,a), a+" : "+b, (a+1)+" : "+(b+1)]);
  return ["في وصفةٍ "+mn(a)+" "+tmz(a,"ملعقةً","ملاعق")+" من "+it[0]+" و"+mn(b)+" "+tmz(b,"ملعقةً","ملاعق")+" من "+it[1]+". اكتب نسبة "+it[0]+" إلى "+it[1]+" في أبسط صورة:",
    o[0].map(mn), o[1],
    "نقسم الطرفين على القاسم المشترك الأكبر "+mn(gcd(a,b))+" ⇐ "+mn(right)+"."];
}

  var g = gp([2,3,4,5,6]), a = g*ri(2,8), b = g*ri(2,8); if(a===b) b = a+g;
  var right = frq(a,b);
  var o = sOpts(right, [a+"/"+b, frq(a+g,b+g), frq(b,a)]);
  return ["اكتب النسبة "+mn(a+" : "+b)+" على صورة كسرٍ في أبسط صورة:",
    o[0].map(mn), o[1],
    "النسبة "+mn(a+" : "+b)+" تعني الكسر "+mn(a+"/"+b)+"، ونقسم على "+mn(gcd(a,b))+" ⇐ "+mn(right)+"."];

}
/* ص171: نموذجٌ مكبَّر */
function gScaleModel(){

  var o = numOpts(real, [drawn, drawn+k, k]);

    o[0], o[1],

}

/* ===== الدرس 4-8: الكسور والنِّسب المئوية (ص 176–181) ===== */

/* ص176 مثال 1: من نسبةٍ مئوية إلى كسر */
function gPctToFrac(){
  var p = gp([4,5,8,10,12,15,20,24,25,30,35,40,45,50,60,64,70,75,80,85,90]);
  var right = frq(p,100);
  var o = sOpts(right, [p+"/100", frq(p+5,100), frq(p,10)]);
  return ["اكتب النسبة المئوية "+mn(p+"٪")+" على صورة كسرٍ اعتيادي في أبسط صورة:",
    o[0].map(mn), o[1],
    mn(p+"٪ = "+p+"/100")+"، ونقسم على "+mn(gcd(p,100))+" ⇐ "+mn(right)+"."];
}
/* ص177: من كسر إلى نسبةٍ مئوية */
function gFracToPct(){
  var d = gp([2,4,5,10,20,25,50]), n = ri(1,d-1);
  var p = n*100/d;
  var o = numOpts(p, [n*d, n+d, p+10]);
  return ["اكتب الكسر "+mn(n+"/"+d)+" على صورة نسبةٍ مئوية (بدون علامة ٪):",
    o[0], o[1],
    "نجعل المقام "+mn(100)+": "+mn(n+"/"+d+" = "+p+"/100")+" ⇐ "+mn(p+"٪")+"."];
}
/* ص176 مثال 2: نسبةٌ مئوية أكبر من 100 */
function gPctOver100(){
  var p = gp([110,120,125,130,140,150,160,175,180,190,200,250]);
  var right = frq(p,100);
  var o = sOpts(right, [p+"/100", frq(p+5,100), frq(p,10)]);
  return ["اكتب النسبة المئوية "+mn(p+"٪")+" على صورة كسرٍ في أبسط صورة:",
    o[0].map(mn), o[1],
    mn(p+"٪ = "+p+"/100")+"، ونقسم على "+mn(gcd(p,100))+" ⇐ "+mn(right)+". (أكبر من "+mn(1)+" لأنّ النسبة أكبر من "+mn("100٪")+".)"];
}

  var C = [
    ["ما النسبة المئوية؟", "نسبةٌ مقامها 100", ["نسبةٌ بسطها 100","أيّ كسرٍ في أبسط صورة","معدَّل وحدة"]],
    ["نسبةٌ مئوية أكبر من ٪100 تعني أنّ الكسر:", "أكبر من واحد", ["أصغر من واحد","يساوي واحدًا","سالب"]],
    ["كيف تحوّل كسرًا إلى نسبةٍ مئوية؟", "أجعل مقامه 100 ثمّ آخذ البسط", ["أضرب البسط في المقام","أجمع البسط والمقام","أقسم 100 على البسط"]],

}

  function panelOf(id){
    var pan = document.getElementById("p_"+id);
    if(!pan){ pan = document.createElement("section"); pan.className="panel"; pan.id="p_"+id; document.getElementById("panels").appendChild(pan); }
    return pan;
  }
  function leaveCur(){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); }

  function render(id){
    var c = CFG[id], sec = panelOf(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score>0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false;
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && !saved){ saved=true; saveScore(c.label, correct, total);
            if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/total*100)})); }catch(e){} } }
        });
      });
    });
    function savePartial(){ var n=Object.keys(answered).length; if(saved||n<3) return; saved=true; saveScore(c.label, correct, n); if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/n*100)})); }catch(e){} } }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

    {id:"d8", name:"1-8 الدوال", tip:"الدالّة تعطي لكل مُدخَل مُخرَجًا واحدًا فقط. المُدخلات = المجال، والمُخرجات = المدى. لتجد القاعدة من جدول: اسأل ماذا فُعِل بـ س ليعطي ص في كلّ صف؟", yt:"شرح المعادلات والدوال المجال والمدى ثاني متوسط"},
    {id:"e1", name:"2-1 القيمة المطلقة", tip:"ما فوق المستوى أو الزيادة موجب، وما تحته أو النقص سالب. والقيمة المطلقة هي بُعد العدد عن الصفر — فهي لا تكون سالبة أبدًا، ولذلك |س| = 5 لها حلّان: 5 و −5.", yt:"شرح الأعداد الصحيحة والقيمة المطلقة ثاني متوسط"},

    {id:"e3", name:"2-3 المستوى الإحداثي", tip:"الزوج المرتّب (س، ص) يبدأ بالسيني دائمًا. اليمين وأعلى موجب، واليسار وأسفل سالب. الأرباع: الأول (+،+)، الثاني (−،+)، الثالث (−،−)، الرابع (+،−).", yt:"شرح المستوى الإحداثي والأزواج المرتبة ثاني متوسط"},
    {id:"e4", name:"2-4 جمع الصحيحة", tip:"إشارتان متشابهتان: اجمع القيمتين المطلقتين وأبقِ الإشارة. إشارتان مختلفتان: اطرح القيمتين المطلقتين وخذ إشارة العدد الأكبر قيمةً مطلقة.", yt:"شرح جمع الأعداد الصحيحة ثاني متوسط"},
    {id:"e5", name:"2-5 طرح الصحيحة", tip:"لا تطرح — حوّل الطرح إلى جمع بالنظير: أ − ب = أ + (−ب). فمثلًا 5 − (−3) تصير 5 + 3 = 8.", yt:"شرح طرح الأعداد الصحيحة ثاني متوسط"},
    {id:"e6", name:"2-6 ضرب الصحيحة", tip:"إشارتان متشابهتان ⇐ موجب، ومختلفتان ⇐ سالب. وفي أكثر من عددين: عُدّ الإشارات السالبة — زوجي ⇐ موجب، فردي ⇐ سالب. وانتبه: (−4)² = 16 موجبة.", yt:"شرح ضرب الأعداد الصحيحة ثاني متوسط"},
    {id:"e7", name:"2-7 البحث عن نمط", tip:"رتّب المعطيات في جدول أوّلًا، وابحث: كم يزيد أو ينقص في كل خطوة؟ أو في كم يُضرب؟ ثم وسّع النمط حتى تصل إلى المطلوب، ثم تحقّق أن الجواب معقول.", yt:"شرح استراتيجية البحث عن نمط ثاني متوسط"},
    {id:"e8", name:"2-8 قسمة الصحيحة", tip:"قواعد إشارة القسمة هي نفسها قواعد الضرب: متشابهتان ⇐ موجب، ومختلفتان ⇐ سالب. والخطّ الكسري يعني قسمة.", yt:"شرح قسمة الأعداد الصحيحة ثاني متوسط"},
    {id:"f1", name:"3-1 كتابة العبارات", tip:"ابحث عن الكلمة الدالّة قبل أن تكتب: المجموع · زاد بمقدار · أكبر من ⇐ جمع. الفرق · قلَّ بمقدار · أقلّ من ⇐ طرح. أضعاف · ناتج ضرب ⇐ ضرب. جزء · ناتج قسمة ⇐ قسمة. وانتبه: العبارة بلا «=» والمعادلة فيها «=».", yt:"شرح كتابة العبارات الجبرية والمعادلات ثاني متوسط"},
    {id:"f2", name:"3-2 معادلات الجمع والطرح", tip:"اعزل المتغيّر بالعملية العكسية: إن كان مضافًا إليه عدد فاطرحه من الطرفين، وإن كان مطروحًا منه عدد فأضفه للطرفين. ثم تحقّق بالتعويض في المعادلة الأصلية.", yt:"شرح حل معادلات الجمع والطرح ثاني متوسط"},
    {id:"f3", name:"3-3 معادلات الضرب", tip:"إذا كان المتغيّر مضروبًا في عدد فاقسم الطرفين على ذلك العدد. والصيغة الرياضية مثل ف = ع ن تربط كميّات: عوّض بالمعلوم ثم حُلّ للمجهول.", yt:"شرح حل معادلات الضرب والصيغة الرياضية ثاني متوسط"},

    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel("all1");
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
