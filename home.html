<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>صفحة البداية</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<style>
  :root{
    --accent:#059669; --accent-deep:#047857;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:24px;box-shadow:var(--shadow);text-align:center}
  header.top .eyebrow{font-size:.85rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.7rem;font-weight:800}
  header.top p.sub{margin:8px 0 0;font-size:.9rem;opacity:.9}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  a.tile{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:18px;padding:22px 14px;box-shadow:var(--shadow);text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;
    transition:transform .12s ease}
  a.tile:active{transform:scale(.97)}
  a.tile .ico{font-size:2.1rem;line-height:1}
  a.tile .name{font-weight:800;font-size:1.05rem}
  a.tile .desc{font-size:.78rem;color:var(--muted);font-weight:600}
  a.tile.wide{grid-column:1 / -1;flex-direction:row;gap:14px;min-height:auto;padding:18px}
  a.tile.wide .ico{font-size:1.8rem}
  a.tile.hero{grid-column:1 / -1;background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border:0}
  a.tile.hero .desc{color:rgba(255,255,255,.85)}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"saud").toLowerCase();
var NAMES  = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || who;
var grade = GRADES[who] || "";

// روابط المواد لكل طالب. سعود عنده صفحات المنهج المطابقة لكتبه.
var SUBJECTS = {
  saud: [
    {href:"quiz.html",   ico:"📝", nm:"اختبر نفسك", ds:"إنجليزي + رياضيات", hero:true},
    {href:"lughati.html",  ico:"📗", nm:"لغتي", ds:"مطابق للكتاب"},
    {href:"english.html",  ico:"🔤", nm:"الإنجليزي", ds:"الوحدات 1–8"},
    {href:"math4.html",  ico:"🔢", nm:"الرياضيات", ds:"الفصول 1–6"},
    {href:"science4.html", ico:"🔬", nm:"العلوم", ds:"الوحدات 1–3"},
    {href:"reading.html",  ico:"🔊", nm:"القراءة والاستماع", ds:"إملاء ومفردات"},
    {href:"practice.html", ico:"📖", nm:"قدرات لفظي", ds:"تدرّب على القدرات", wide:true}
  ]
};
// باقي الأبناء (مؤقتاً): الأقسام العامة
var GENERIC = [
  {href:"quiz.html",   ico:"📝", nm:"اختبر نفسك", ds:"إنجليزي + رياضيات", hero:true},
  {href:"practice.html", ico:"💪", nm:"القدرات", ds:"لفظي وكمي وتحصيلي"},
  {href:"reading.html",  ico:"🔊", nm:"القراءة والاستماع", ds:"إملاء ومفردات"}
];

var list = (SUBJECTS[who] || GENERIC).slice();
// زر تقرير الطفل الشخصي (نسبته + تطوّره + توصياته) — خاص فيه فقط
list.push({href:"child.html", ico:"📊", nm:"نتيجتي وتقريري", ds:"نسبتك وتطوّرك وتوصياتك", wide:true});

var html = ''+
  '<header class="top">'+
    '<p class="eyebrow">'+ (grade?grade+' · ':'') +'كل موادك في مكان واحد</p>'+
    '<h1>👋 أهلاً '+name+'</h1>'+
    '<p class="sub">اختر المادة الي تبي تتدرّب عليها</p>'+
  '</header>'+
  '<div class="grid">';

list.forEach(function(s){
  var cls = 'tile'+(s.hero?' hero':'')+(s.wide?' wide':'');
  html += '<a class="'+cls+'" href="'+s.href+'?who='+who+'">'+
            '<span class="ico">'+s.ico+'</span>'+
            '<span class="name">'+s.nm+'</span>'+
            (s.ds?'<span class="desc">'+s.ds+'</span>':'')+
          '</a>';
});

html += '</div>'+
  '<footer>مسار «'+name+'» — تقدر تحفظ هذا الرابط في الشاشة الرئيسية للجوال 📱</footer>';

document.getElementById("app").innerHTML = html;
document.title = "مسار "+name;
</script>
</body>
</html>
