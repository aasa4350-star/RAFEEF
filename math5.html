<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --accent:#059669; --accent-deep:#047857;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:110px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.1rem}
  .stem .en,.explain .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.1rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"saud").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ return Number(n).toLocaleString('en-US'); } // فاصلة آلاف
function mn(s){ return '<span class="en">'+s+'</span>'; }
// خيارات رقمية مميّزة: الصحيح + مشتّتات
function numOpts(correct, cands){
  var seen={}; seen[correct]=1; var others=[];
  for(var i=0;i<cands.length && others.length<2;i++){ var v=cands[i]; if(v!==correct && v>=0 && !seen[v]){ seen[v]=1; others.push(v); } }
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}
// يولّد n سؤالًا بلا تكرار (يتجاهل المولّد الذي يرمي استثناء ويعيد المحاولة)
function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*30){ var q; try{ q=gp(gens)(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; out.push(q); } return out; }


/* ===== منهج الصف الخامس — الكسور العشرية (من فهرس الكتاب) =====
   ف١ القيمة المنزلية · ف٢ الجمع والطرح · ف٣ الضرب.
   كل مولّد يرجع [نصّ السؤال, [خيارات], فهرس الصحيح, التفسير] بأرقام جديدة كل مرة. */

/* منازل الكسر العشري */
var DPLACES = [[0.1,"الأجزاء من عشرة"],[0.01,"الأجزاء من مئة"],[0.001,"الأجزاء من ألف"]];
function dec2(){ return Math.round(ri(101,9999))/100; }          // عدد بمنزلتين
function dec1(){ return Math.round(ri(11,999))/10; }             // عدد بمنزلة واحدة
function r2(x){ return Math.round(x*100)/100; }
function r3(x){ return Math.round(x*1000)/1000; }
function dstr(x){ return String(x); }

/* ---------- الفصل ١: القيمة المنزلية والكسور العشرية ---------- */

// القيمة المنزلية داخل كسر عشري
function gDecPlace(){
  var whole=ri(1,99), a=ri(1,9), b=ri(1,9);
  var num = whole + a/10 + b/100;
  num = r2(num);
  var pick = gp([["a",a,"الأجزاء من عشرة",0.1],["b",b,"الأجزاء من مئة",0.01]]);
  var d=pick[1], place=pick[2], val=r3(d*pick[3]);
  var o=numOpts(val,[r3(d*0.1),r3(d*0.01),r3(d*1),r3(val*10)]);
  return ["في العدد "+mn(dstr(num))+"، ما قيمة الرقم "+mn(String(d))+" الواقع في منزلة "+place+"؟",
          o[0],o[1],"الرقم "+d+" في منزلة "+place+"، فقيمته "+d+" × "+pick[3]+" = "+val+"."];
}

// اسم المنزلة
function gDecPlaceName(){
  var whole=ri(1,99), a=ri(1,9), b=ri(1,9), num=r2(whole+a/10+b/100);
  var which=gp([[a,"الأجزاء من عشرة"],[b,"الأجزاء من مئة"]]);
  var wrong=["الآحاد","العشرات","الأجزاء من ألف"].filter(function(x){return x!==which[1];});
  var arr=[which[1]].concat(shuffle(wrong).slice(0,2)); shuffle(arr);
  return ["في العدد "+mn(dstr(num))+"، في أيّ منزلة يقع الرقم "+mn(String(which[0]))+"؟",
          arr,arr.indexOf(which[1]),"المنزلة الأولى بعد الفاصلة هي الأجزاء من عشرة، والثانية الأجزاء من مئة."];
}

// المقارنة بين كسرين عشريين
function gDecCompare(){
  var a=dec2(), b=r2(a + gp([-1,1])*(ri(1,60)/100));
  if(a===b) b=r2(b+0.05);
  var correct = a>b ? ">" : "<";
  var arr=[">","<","="];
  return ["قارن: "+mn(dstr(a))+" ___ "+mn(dstr(b)),arr,arr.indexOf(correct),
          "نقارن المنازل من اليسار: "+(a>b?(a+" أكبر من "+b):(a+" أصغر من "+b))+"."];
}

// ترتيب ثلاثة كسور عشرية تصاعديًا
function gDecOrder(){
  var s={}, v=[];
  while(v.length<3){ var x=r2(ri(101,999)/100); if(!s[x]){ s[x]=1; v.push(x); } }
  var asc=v.slice().sort(function(p,q){return p-q;});
  var correct=asc.join(" ، ");
  var w1=asc.slice().reverse().join(" ، ");
  var w2=[asc[1],asc[0],asc[2]].join(" ، ");
  var arr=[correct,w1,w2]; shuffle(arr);
  return ["رتّب تصاعديًا (من الأصغر إلى الأكبر): "+mn(v.join(" ، ")),
          arr,arr.indexOf(correct),"الترتيب التصاعدي: "+correct+"."];
}

// كسر اعتيادي ← كسر عشري (أعشار/أجزاء من مئة)
function gFracToDec(){
  var den=gp([10,100]), n=ri(1,den===10?9:99);
  var val = den===10 ? r2(n/10) : r2(n/100);
  var o=numOpts(val,[r2(n/(den===10?100:10)), r2(val*10), r2(val/10)]);
  return ["اكتب الكسر "+mn(n+"/"+den)+" على صورة كسر عشري:",o[0],o[1],
          n+" ÷ "+den+" = "+val+"."];
}

// تمثيل الكسر العشري بالكلمات
function gDecWords(){
  var whole=ri(0,9), t=ri(1,9);
  var num=r2(whole + t/10);
  var correct = (whole? whole+" و" : "")+t+" من عشرة";
  var w1=(whole? whole+" و" : "")+t+" من مئة";
  var w2=(whole? whole+" و" : "")+(t)+" من ألف";
  var arr=[correct,w1,w2]; shuffle(arr);
  return ["كيف نقرأ العدد "+mn(dstr(num))+"؟",arr,arr.indexOf(correct),
          "المنزلة الأولى بعد الفاصلة هي الأعشار، فنقرأها «من عشرة»."];
}

/* ---------- الفصل ٢: الجمع والطرح ---------- */

// جمع كسرين عشريين
function gDecAdd(){
  var a=r2(ri(101,4999)/100), b=r2(ri(101,4999)/100), s=r2(a+b);
  var o=numOpts(s,[r2(s+0.1),r2(s-0.1),r2(a+b+1),r2(Math.abs(a-b))]);
  return ["احسب: "+mn(dstr(a)+" + "+dstr(b)),o[0],o[1],
          "نرتّب الفاصلة تحت الفاصلة ثم نجمع: "+a+" + "+b+" = "+s+"."];
}

// طرح كسرين عشريين
function gDecSub(){
  var a=r2(ri(500,9999)/100), b=r2(ri(101,Math.floor(a*100)-1)/100), d=r2(a-b);
  var o=numOpts(d,[r2(d+0.1),r2(d-0.1),r2(a+b)]);
  return ["احسب: "+mn(dstr(a)+" − "+dstr(b)),o[0],o[1],
          "نرتّب الفاصلة تحت الفاصلة ثم نطرح: "+a+" − "+b+" = "+d+"."];
}

// تقريب كسر عشري لأقرب عدد صحيح
function gDecRoundWhole(){
  var x=r2(ri(101,9999)/100), c=Math.round(x);
  var o=numOpts(c,[Math.floor(x),Math.ceil(x),c+1,c-1]);
  return ["قرّب "+mn(dstr(x))+" إلى أقرب عدد صحيح:",o[0],o[1],
          "ننظر لمنزلة الأعشار: "+(Math.round((x-Math.floor(x))*10)>=5?"٥ أو أكثر فنقرّب لأعلى":"أقل من ٥ فنبقي العدد")+" ← "+c+"."];
}

// تقريب لأقرب جزء من عشرة
function gDecRoundTenth(){
  var x=r2(ri(101,9999)/100), c=r2(Math.round(x*10)/10);
  var o=numOpts(c,[r2(c+0.1),r2(c-0.1),Math.round(x)]);
  return ["قرّب "+mn(dstr(x))+" إلى أقرب جزء من عشرة:",o[0],o[1],
          "ننظر لمنزلة الأجزاء من مئة ثم نقرّب ← "+c+"."];
}

// تقدير ناتج الجمع بالتقريب
function gDecEstimate(){
  var a=r2(ri(101,4999)/100), b=r2(ri(101,4999)/100);
  var est=Math.round(a)+Math.round(b);
  var o=numOpts(est,[est+1,est-1,Math.round(a+b)+2]);
  return ["قدّر ناتج: "+mn(dstr(a)+" + "+dstr(b))+" بتقريب كلّ عدد لأقرب عدد صحيح:",
          o[0],o[1],"نقرّب: "+Math.round(a)+" + "+Math.round(b)+" = "+est+"."];
}

/* ---------- الفصل ٣: الضرب ---------- */

// خاصية التوزيع
function gDistProp(){
  var a=ri(3,9), b=ri(11,29);
  var tens=Math.floor(b/10)*10, ones=b%10, res=a*b;
  var correct="("+a+"×"+tens+") + ("+a+"×"+ones+")";
  var w1="("+a+"×"+tens+") − ("+a+"×"+ones+")";
  var w2="("+a+"+"+tens+") × ("+a+"+"+ones+")";
  var arr=[correct,w1,w2]; shuffle(arr);
  return ["باستعمال خاصية التوزيع، أيّ العبارات تساوي "+mn(a+" × "+b)+"؟",
          arr,arr.indexOf(correct),"نفكّك "+b+" إلى "+tens+" + "+ones+" ثم نضرب كلًّا في "+a+" ونجمع: "+res+"."];
}

// أنماط الضرب في مضاعفات العشرة
function gMulPattern(){
  var a=ri(2,9), z=gp([10,100,1000]), res=a*z;
  var o=numOpts(res,[a*z*10, a*z/10, res+z]);
  return ["احسب ذهنيًّا: "+mn(a+" × "+z),o[0],o[1],
          "نضرب "+a+" × "+(z===10?1:z===100?1:1)+" ثم نضيف أصفار "+z+" ← "+fmt(res)+"."];
}

// تقدير ناتج الضرب
function gMulEstimate(){
  var a=ri(21,89), b=ri(3,9);
  var ra=Math.round(a/10)*10, est=ra*b;
  var o=numOpts(est,[est+10*b, est-10*b, a*b]);
  return ["قدّر ناتج "+mn(a+" × "+b)+" بتقريب "+mn(String(a))+" لأقرب عشرة:",
          o[0],o[1],"نقرّب "+a+" ← "+ra+"، ثم "+ra+" × "+b+" = "+fmt(est)+"."];
}

// الضرب في عدد من رقم واحد
function gMul1(){
  var a=ri(112,987), b=ri(3,9), res=a*b;
  var o=numOpts(res,[res+b, res-b, a*(b+1), a*(b-1)]);
  return ["احسب: "+mn(a+" × "+b),o[0],o[1],a+" × "+b+" = "+fmt(res)+"."];
}

// الضرب في عدد من رقمين
function gMul2(){
  var a=ri(23,79), b=ri(12,39), res=a*b;
  var o=numOpts(res,[res+a, res-a, res+b, a*(b+10)]);
  return ["احسب: "+mn(a+" × "+b),o[0],o[1],
          "نضرب في الآحاد ثم في العشرات ونجمع: "+a+" × "+b+" = "+fmt(res)+"."];
}

// مسألة كلامية: رسم صورة / اختيار العملية
function gMulWord(){
  var box=ri(6,15), per=ri(8,24), res=box*per;
  var items=gp(["قلمًا","كتابًا","تمرة","حبّة","بطاقة"]);
  var o=numOpts(res,[box+per, res-per, res+per]);
  return ["في كلّ صندوق "+mn(String(per))+" "+items+"، وعندنا "+mn(String(box))+" صناديق. كم العدد الكلّي؟",
          o[0],o[1],"«في كلّ» تدلّ على الضرب: "+box+" × "+per+" = "+fmt(res)+"."];
}

/* ---------- الفصل ٤: القسمة ---------- */

// أنماط القسمة على مضاعفات العشرة (ذهنيًّا)
function gDivPattern(){
  var a=ri(2,9), z=gp([10,100,1000]), dividend=a*z;
  var o=numOpts(a,[a*10, a*100, a+1]);
  return ["احسب ذهنيًّا: "+mn(fmt(dividend)+" ÷ "+z),o[0],o[1],
          "نحذف أصفار "+z+" من "+fmt(dividend)+" ← "+fmt(dividend)+" ÷ "+z+" = "+a+"."];
}

// تقدير ناتج القسمة (أعداد متوافقة)
function gDivEstimate(){
  var b=ri(3,9), q=ri(20,90);
  var r=ri(1, Math.floor((b-1)/2));      // الباقي أقل من نصف المقسوم عليه ← b×q هو الأقرب دائمًا
  var a=b*q+r, est=q;
  var o=numOpts(est,[est+10,est-10,est+2]);
  return ["قدّر ناتج: "+mn(fmt(a)+" ÷ "+b)+" باستعمال أقرب عددين متوافقين:",
          o[0],o[1],"أقرب عدد لـ"+fmt(a)+" يقبل القسمة على "+b+" هو "+fmt(b*q)+"، و"+fmt(b*q)+" ÷ "+b+" = "+est+"."];
}

// القسمة على عدد من رقم واحد (بلا باقٍ)
function gDiv1(){
  var b=ri(3,9), q=ri(21,199), a=b*q;
  var o=numOpts(q,[q+1,q-1,q+10]);
  return ["احسب: "+mn(fmt(a)+" ÷ "+b),o[0],o[1],fmt(a)+" ÷ "+b+" = "+fmt(q)+"."];
}

// باقي القسمة
function gDivRemainder(){
  var b=ri(3,9), q=ri(11,99), r=ri(1,b-1), a=b*q+r;
  var o=numOpts(r,[r+1,r-1,b]);
  return ["ما باقي القسمة في: "+mn(fmt(a)+" ÷ "+b)+"؟",o[0],o[1],
          fmt(a)+" = ("+b+" × "+fmt(q)+") + "+r+"، فالباقي "+r+"."];
}

// القسمة على عدد من رقمين
function gDiv2(){
  var b=ri(12,39), q=ri(6,40), a=b*q;
  var o=numOpts(q,[q+1,q-1,q+10]);
  return ["احسب: "+mn(fmt(a)+" ÷ "+b),o[0],o[1],fmt(a)+" ÷ "+b+" = "+fmt(q)+"."];
}

// مسألة قسمة كلامية (التوزيع بالتساوي)
function gDivWord(){
  var b=ri(4,12), q=ri(5,25), a=b*q;
  var item=gp(["حبّة","قطعة","كتابًا","قلمًا","بطاقة"]);
  var o=numOpts(q,[a-b, q+1, b]);
  return ["وُزِّعت "+mn(fmt(a))+" "+item+" بالتساوي على "+mn(String(b))+" طلاب. كم نصيب كلّ طالب؟",
          o[0],o[1],"«بالتساوي على» تدلّ على القسمة: "+fmt(a)+" ÷ "+b+" = "+fmt(q)+"."];
}

/* ---------- الفصل ٥: العبارات الجبرية والمعادلات ---------- */

// كتابة عبارة جبرية (جمع/طرح)
function gExprAddSub(){
  var n=ri(2,15), op=gp(["زاد","نقص"]);
  var correct = op==="زاد" ? ("س + "+n) : ("س − "+n);
  var w1 = op==="زاد" ? ("س − "+n) : ("س + "+n);
  var w2 = op==="زاد" ? (n+" − س") : (n+" + س");
  var arr=[correct,w1,w2]; shuffle(arr);
  var txt = op==="زاد" ? ("عدد زاد بمقدار "+n) : ("عدد نقص بمقدار "+n);
  return ["اكتب عبارة جبرية تُعبّر عن: "+txt,arr,arr.indexOf(correct),
          "نرمز للعدد المجهول بـ«س»، و«"+op+"» تعني "+(op==="زاد"?"الجمع":"الطرح")+"."];
}

// كتابة عبارة جبرية (ضرب/قسمة)
function gExprMulDiv(){
  var n=ri(2,9), op=gp(["أضعاف","قُسِّم"]);
  var correct = op==="أضعاف" ? (n+" × س") : ("س ÷ "+n);
  var w1 = op==="أضعاف" ? ("س ÷ "+n) : (n+" × س");
  var w2 = op==="أضعاف" ? ("س + "+n) : ("س − "+n);
  var arr=[correct,w1,w2]; shuffle(arr);
  var txt = op==="أضعاف" ? (n+" أضعاف عدد") : ("عدد قُسِّم على "+n);
  return ["اكتب عبارة جبرية تُعبّر عن: "+txt,arr,arr.indexOf(correct),
          op==="أضعاف" ? ("«أضعاف» تعني الضرب: "+n+" × س.") : ("«قُسِّم على» تعني القسمة: س ÷ "+n+".")];
}

// حلّ معادلة جمع/طرح
function gEqAddSub(){
  var n=ri(2,25), plus=Math.random()<0.5;
  var x = plus ? ri(3,40) : ri(n+1, n+40);      // في الطرح نضمن ناتجًا موجبًا
  var rhs = plus ? x+n : x-n;
  var eq = plus ? ("س + "+n+" = "+rhs) : ("س − "+n+" = "+rhs);
  var o=numOpts(x,[rhs+n,Math.abs(rhs-n),x+1]);
  return ["حُلّ المعادلة: "+mn(eq),o[0],o[1],
          plus ? ("نطرح "+n+" من الطرفين: س = "+rhs+" − "+n+" = "+x+".")
               : ("نجمع "+n+" للطرفين: س = "+rhs+" + "+n+" = "+x+".")];
}

// حلّ معادلة ضرب/قسمة
function gEqMulDiv(){
  var n=ri(2,9), mul=Math.random()<0.5, x, rhs, eq, expl;
  if(mul){
    x=ri(2,20); rhs=x*n; eq=n+" × س = "+rhs;
    expl="نقسم الطرفين على "+n+": س = "+rhs+" ÷ "+n+" = "+x+".";
  } else {
    rhs=ri(2,20); x=rhs*n; eq="س ÷ "+n+" = "+rhs;
    expl="نضرب الطرفين في "+n+": س = "+rhs+" × "+n+" = "+x+".";
  }
  var o=numOpts(x,[rhs,x+n,x*n]);
  return ["حُلّ المعادلة: "+mn(eq),o[0],o[1],expl];
}

// ترتيب العمليات
function gOrderOps(){
  var a=ri(2,9), b=ri(2,9), c=ri(2,9);
  var mode=gp(["mulAdd","addMul","paren"]);
  var expr, val, trap;
  if(mode==="mulAdd"){ expr=a+" × "+b+" + "+c; val=a*b+c; trap=a*(b+c); }
  else if(mode==="addMul"){ expr=a+" + "+b+" × "+c; val=a+b*c; trap=(a+b)*c; }
  else { expr="("+a+" + "+b+") × "+c; val=(a+b)*c; trap=a+b*c; }
  var o=numOpts(val,[trap, val+c, val+a]);
  return ["احسب مع مراعاة ترتيب العمليات: "+mn(expr),o[0],o[1],
          "نبدأ بالأقواس، ثم الضرب والقسمة، ثم الجمع والطرح ← "+mn(expr)+" = "+val+"."];
}

// جدول دالة: إيجاد القاعدة
function gFuncTable(){
  var m=ri(2,6), b=ri(0,9);
  var xs=[1,2,3];
  var ys=xs.map(function(x){ return m*x+b; });
  var correct = b===0 ? ("س × "+m) : ("(س × "+m+") + "+b);
  var w1 = b===0 ? ("س + "+m) : ("(س × "+m+") − "+b);
  var w2 = b===0 ? ("س − "+m) : ("س + "+(m+b));
  var arr=[correct,w1,w2]; shuffle(arr);
  return ["في جدول الدالة: عندما "+mn("س = "+xs.join(" ، "))+" تكون "+mn("ص = "+ys.join(" ، "))+". ما القاعدة؟",
          arr,arr.indexOf(correct),
          "كلّما زادت س واحدًا زادت ص "+m+"، وعند س = 1 تكون ص = "+ys[0]+" ← "+correct+"."];
}

/* ---------- الفصل ٦: الكسور الاعتيادية ---------- */

function gcd(a,b){ while(b){ var t=b; b=a%b; a=t; } return a; }

// القسمة والكسور: تبسيط الكسر
function gFracSimplify(){
  var k=ri(2,6), n=ri(1,8), d=n+ri(1,7);
  var N=n*k, D=d*k;
  var g=gcd(N,D), sn=N/g, sd=D/g;
  var correct=sn+"/"+sd;
  var arr=[correct, N+"/"+D, (sn+1)+"/"+sd];
  shuffle(arr);
  return ["بسّط الكسر "+mn(N+"/"+D)+" إلى أبسط صورة:",arr,arr.indexOf(correct),
          "القاسم المشترك الأكبر لـ"+N+" و"+D+" هو "+g+"، فنقسم الطرفين عليه ← "+correct+"."];
}

// تحويل كسر غير عادي إلى عدد كسري
function gImproperToMixed(){
  var d=ri(2,9), w=ri(1,6), r=ri(1,d-1), N=w*d+r;
  var correct=w+" و "+r+"/"+d;
  var w1=(w+1)+" و "+r+"/"+d;
  var w2=w+" و "+(r+1)+"/"+d;
  var arr=[correct,w1,w2]; shuffle(arr);
  return ["حوّل الكسر غير العادي "+mn(N+"/"+d)+" إلى عدد كسري:",arr,arr.indexOf(correct),
          N+" ÷ "+d+" = "+w+" والباقي "+r+"، فالناتج "+correct+"."];
}

// تحويل عدد كسري إلى كسر غير عادي
function gMixedToImproper(){
  var d=ri(2,9), w=ri(1,6), r=ri(1,d-1), N=w*d+r;
  var correct=N+"/"+d;
  var arr=[correct,(N+1)+"/"+d,(w+r)+"/"+d]; shuffle(arr);
  return ["حوّل العدد الكسري "+mn(w+" و "+r+"/"+d)+" إلى كسر غير عادي:",arr,arr.indexOf(correct),
          "("+w+" × "+d+") + "+r+" = "+N+"، والمقام لا يتغيّر ← "+correct+"."];
}

// مقارنة كسرين
function gFracCompare(){
  var d=gp([4,6,8,10,12]);
  if(Math.random()<0.25){                        // حالة التساوي: كسران متكافئان
    var k=gp([2,3]), a0=ri(1,d-1);
    return ["قارن: "+mn(a0+"/"+d)+" ___ "+mn((a0*k)+"/"+(d*k)),
            ["<",">","="],2,
            "بضرب طرفَي "+a0+"/"+d+" في "+k+" نحصل على "+(a0*k)+"/"+(d*k)+"، فهما متكافئان."];
  }
  var a=ri(1,d-1), b=ri(1,d-1);
  if(a===b) b=(b%(d-1))+1;
  var correct = a>b ? ">" : "<";
  var arr=[">","<","="];
  return ["قارن: "+mn(a+"/"+d)+" ___ "+mn(b+"/"+d),arr,arr.indexOf(correct),
          "المقامان متساويان، فنقارن البسطين: "+a+(a>b?" > ":" < ")+b+"."];
}

// تقريب الكسر إلى ٠ أو ½ أو ١
function gFracRound(){
  var d,n,v,t=0;
  do{ d=gp([4,6,8,10,12]); n=ri(1,d-1); v=n/d; t++; }
  while((v===0.25||v===0.75) && t<40);            // نتجنّب الحالتين المتساويتَي البُعد
  if(v===0.25||v===0.75) throw 0;
  var correct = v<0.25 ? "0" : (v<0.75 ? "1/2" : "1");
  var arr=["0","1/2","1"];
  return ["قرّب الكسر "+mn(n+"/"+d)+" إلى أقرب: "+mn("0")+" أو "+mn("1/2")+" أو "+mn("1"),
          arr,arr.indexOf(correct),
          n+"/"+d+" ≈ "+(Math.round(v*100)/100)+"، فأقرب قيمة هي "+correct+"."];
}
