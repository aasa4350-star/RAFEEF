<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<style>
  :root{
    --accent:#7c3aed; --soft:#c4b5fd; --deep:#5b21b6;
    --bg:#f6f8fa; --card:#fff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --warn:#b45309; --step-bg:#f3f0ff;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c;
          --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;
          --accent:#a78bfa;--soft:#4c1d95;--deep:#c4b5fd;--step-bg:#1c1830;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;line-height:1.75}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
  .top{text-align:center;margin-bottom:14px}
  .eyebrow{color:var(--muted);font-size:.9rem;margin:0 0 4px}
  h1{margin:0;font-size:1.5rem}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  .bar a,.bar button{background:transparent;border:1.5px solid var(--line);color:var(--accent);
    border-radius:12px;padding:9px 14px;font-weight:700;cursor:pointer;font-family:inherit;
    font-size:.9rem;text-decoration:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .intro{background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;
         border-radius:16px;padding:14px 16px;margin-bottom:14px;font-weight:700;line-height:1.8}
  .intro small{display:block;font-weight:400;opacity:.92;margin-top:6px;font-size:.88rem}
  .skills{list-style:none;margin:10px 0 0;padding:0}
  .skills li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .skills li:last-child{border-bottom:0}
  .pill{min-width:54px;text-align:center;border-radius:9px;padding:3px 8px;font-weight:800;font-size:.86rem}
  .lo{background:var(--bad-bg);color:var(--bad)} .mid{background:#fff4e5;color:var(--warn)}
  .hi{background:var(--good-bg);color:var(--good)}
  .nm{flex:1;font-weight:700;font-size:.96rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;
     padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .num{color:var(--muted);font-size:.82rem;font-weight:700;margin-bottom:4px}
  .tag{display:inline-block;background:var(--soft);color:var(--deep);border-radius:8px;
       padding:2px 9px;font-size:.78rem;font-weight:800;margin-right:6px}
  @media (prefers-color-scheme:dark){ .tag{color:#fff} }
  .stem{font-weight:800;font-size:1.06rem;margin:6px 0 10px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts button{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);
    border-radius:12px;padding:11px 13px;font-weight:700;cursor:pointer;
    font-family:inherit;font-size:1rem;text-align:right}
  .opts button:hover:not(:disabled){border-color:var(--accent)}
  .opts button.ok{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .opts button.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .opts button:disabled{cursor:default}
  .sol{display:none;margin-top:11px;background:var(--step-bg);border-radius:12px;padding:11px 13px}
  .sol.show{display:block}
  .sol .rule{font-weight:800;color:var(--deep);margin-bottom:7px;font-size:.95rem}
  @media (prefers-color-scheme:dark){ .sol .rule{color:var(--soft)} }
  .sol ol{margin:0;padding-inline-start:20px}
  .sol li{margin:4px 0;font-size:.97rem}
  .sol .tip{margin-top:8px;font-size:.9rem;color:var(--muted);font-weight:700}
  /* توصية ٢ (دليل قويّ): أسئلةُ مراقبة التفكير قبل الحلّ، وخطوةُ تحقّقٍ بعده */
  .ask{background:var(--bg);border:1px dashed var(--line);border-radius:12px;
       padding:9px 12px;margin:10px 0;font-size:.88rem;color:var(--muted)}
  .ask b{color:var(--ink)}
  .ask ul{margin:5px 0 0;padding-inline-start:19px}
  .ask li{margin:2px 0}
  .sol .chk{margin-top:9px;background:var(--good-bg);color:var(--good);
            border-radius:10px;padding:8px 11px;font-weight:700;font-size:.92rem}
  /* توصية ٤ (متوسّط): طريقةٌ ثانية تُقارن بالأولى */
  .sol .alt{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
  .sol .alt ol{margin:5px 0 0}
  .sol .cmp{margin-top:5px;font-size:.88rem;color:var(--muted);font-weight:700}
  /* توصية ٣ (دليل قويّ): التمثيل البصري */
  .viz{width:100%;max-width:290px;height:auto;display:block;margin:10px auto 4px}
  .vz-fill{fill:var(--soft);stroke:var(--deep);stroke-width:2}
  .vz-track{fill:var(--bg);stroke:var(--line);stroke-width:2}
  .vz-dash{stroke:var(--deep);stroke-width:2;stroke-dasharray:5 4;fill:none}
  .vz-axis{stroke:var(--muted);stroke-width:2}
  .vz-arc{stroke:var(--accent);stroke-width:2;fill:none}
  .vz-dot{fill:var(--accent)}
  .vz-right{fill:none;stroke:var(--deep);stroke-width:2}
  .vz-t{fill:var(--ink);font-size:13px;font-weight:700;text-anchor:middle;font-family:inherit}
  .vz-in{fill:var(--deep);font-size:13px;font-weight:800;text-anchor:middle;font-family:inherit}
  .vz-hyp{fill:var(--accent);font-size:13px;font-weight:800;text-anchor:middle;font-family:inherit}
  .vz-unit{fill:var(--ink);font-size:13px;font-weight:800;text-anchor:middle;font-family:inherit}
  @media (prefers-color-scheme:dark){ .vz-in{fill:#fff} .vz-fill{fill:#4c1d95;stroke:#a78bfa} }
  /* مسائل الاستدلال (TIMSS) تُميَّز بصريًّا عن تمارين المهارة */
  .q-reason{border-inline-start:4px solid var(--accent)}
  .score{text-align:center;font-weight:800;margin:14px 0;font-size:1.05rem}
  .go{width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;
      padding:13px;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;margin-top:6px}
  .note{color:var(--muted);font-size:.88rem;margin:6px 0 0}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:18px}
</style>
</head>
<body>

<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"hasan").toLowerCase();
var NAMES = {hasan:"حسن",rafeef:"رفيف",osama:"أسامة",saud:"سعود"};
var GRADES = {hasan:"ثالث متوسط",rafeef:"ثاني متوسط",osama:"خامس ابتدائي",saud:"رابع ابتدائي"};
var name = NAMES[who] || "الطالب";
var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
/* تمييز العدد والمعدود: خانة واحدة · خانتان · 3–10 خانات · 11 فأكثر خانة */
function khana(n){
  if(n===1) return "خانة واحدة";
  if(n===2) return "خانتان";
  if(n>=3 && n<=10) return n+" خانات";
  return n+" خانة";
}
/* ثلاثة خيارات: الصحيح ومشتّتان، مخلوطة. نُرجع [الخيارات، فهرس الصحيح] */
function opt3(correct, ds){
  var o=[correct];
  (ds||[]).forEach(function(d){ if(o.indexOf(d)<0 && o.length<3) o.push(d); });
  var p=1; while(o.length<3){ var c=(typeof correct==="number")?correct+p:String(correct)+"*"; if(o.indexOf(c)<0)o.push(c); p++; if(p>40)break; }
  shuffle(o);
  return [o.map(function(v){ return String(v).replace(/-/g,"−"); }), o.indexOf(correct)];
}

/* ═══════════════════════════════════════════════════════════════
   رسومٌ توضيحيّة — توصية ٣ في دليل IES/WWC، ودرجتها «دليلٌ قويّ».
   الدليل يوصي تحديدًا بالجدول، وشريط الكسر، وشريط النسبة، والمخطّط
   التخطيطيّ (Example 10) — وهي المستعملة أدناه. تُرسم بـSVG داخل
   الصفحة (لا صور) لتتبع ألوان الوضع الليلي وتكبر مع الشاشة.
   ═══════════════════════════════════════════════════════════════ */
function svg(inner, w, h){
  return '<svg class="viz" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+inner+'</svg>';
}
var VZ = {
  /* مربّع بضلعٍ مُسمّى */
  square: function(s, label){
    return svg('<rect x="60" y="10" width="120" height="120" class="vz-fill"/>'+
      '<text x="120" y="148" class="vz-t">'+s+'</text>'+
      '<text x="40" y="75" class="vz-t">'+s+'</text>'+
      (label?'<text x="120" y="78" class="vz-in">'+label+'</text>':''), 240, 160);
  },
  /* مستطيل بطولٍ وعرض */
  rect: function(L, W){
    return svg('<rect x="30" y="20" width="180" height="100" class="vz-fill"/>'+
      '<text x="120" y="140" class="vz-t">الطول '+L+'</text>'+
      '<text x="16" y="75" class="vz-t">'+W+'</text>', 240, 155);
  },
  /* مثلث بقاعدةٍ وارتفاعٍ متقطّع */
  tri: function(b, h){
    return svg('<polygon points="30,120 210,120 90,20" class="vz-fill"/>'+
      '<line x1="90" y1="20" x2="90" y2="120" class="vz-dash"/>'+
      '<text x="120" y="140" class="vz-t">القاعدة '+b+'</text>'+
      '<text x="98" y="75" class="vz-t">الارتفاع '+h+'</text>', 240, 155);
  },
  /* مثلث قائم: ضلعان قائمان ووتر */
  rtri: function(a, b, c){
    return svg('<polygon points="40,130 40,30 190,130" class="vz-fill"/>'+
      '<rect x="40" y="115" width="15" height="15" class="vz-right"/>'+
      '<text x="22" y="85" class="vz-t">'+a+'</text>'+
      '<text x="115" y="150" class="vz-t">'+b+'</text>'+
      '<text x="125" y="72" class="vz-hyp">الوتر ؟</text>', 240, 165);
  },
  /* شريط نسبة مئوية: الكلّ 100٪ والمظلّل هو المطلوب */
  pctBar: function(p, whole, part){
    var w = Math.max(2, Math.round(200*p/100));
    return svg('<rect x="20" y="30" width="200" height="34" class="vz-track"/>'+
      '<rect x="20" y="30" width="'+w+'" height="34" class="vz-fill"/>'+
      '<text x="120" y="20" class="vz-t">الكلّ = '+whole+' (100%)</text>'+
      '<text x="'+(20+w/2)+'" y="53" class="vz-in">'+p+'%</text>'+
      '<text x="120" y="82" class="vz-t">المظلّل = '+part+'</text>', 240, 95);
  },
  /* شريط كسر: مقسومٌ إلى مقامٍ خانة، ومظلّلٌ منه البسط */
  fracBar: function(num, den, whole, val){
    var cw = 200/den, cells = '';
    for(var i=0;i<den;i++){
      cells += '<rect x="'+(20+i*cw)+'" y="30" width="'+cw+'" height="34" class="'+(i<num?'vz-fill':'vz-track')+'"/>';
    }
    return svg(cells +
      '<text x="120" y="20" class="vz-t">الكلّ = '+whole+'</text>'+
      '<text x="120" y="82" class="vz-t">كل خانة = '+(whole/den)+' · المظلّل '+khana(num)+' = '+val+'</text>', 240, 95);
  },
  /* خطّ أعدادٍ بقفزاتٍ ثابتة — للأنماط والمتتاليات */
  jumps: function(vals, step){
    var n = vals.length, x0 = 25, gap = 190/Math.max(1,n-1), pts = '', arcs = '';
    vals.forEach(function(v,i){
      var x = x0 + i*gap;
      pts += '<circle cx="'+x+'" cy="90" r="5" class="vz-dot"/>'+
             '<text x="'+x+'" y="115" class="vz-t">'+v+'</text>';
      if(i<n-1){
        var xn = x0+(i+1)*gap, mid=(x+xn)/2;
        arcs += '<path d="M'+x+',82 Q'+mid+',52 '+xn+',82" class="vz-arc"/>'+
                '<text x="'+mid+'" y="48" class="vz-t">+'+step+'</text>';
      }
    });
    return svg('<line x1="15" y1="90" x2="225" y2="90" class="vz-axis"/>'+arcs+pts, 240, 125);
  },
  /* سهم تحويلٍ بين وحدتين */
  convert: function(from, factor, to){
    return svg('<text x="45" y="45" class="vz-unit">'+from+'</text>'+
      '<line x1="80" y1="60" x2="160" y2="60" class="vz-axis"/>'+
      '<polygon points="160,60 150,55 150,65" class="vz-dot"/>'+
      '<text x="120" y="45" class="vz-t">×'+factor+'</text>'+
      '<text x="195" y="45" class="vz-unit">'+to+'</text>', 240, 80);
  },
  /* أعمدةٌ للقيم مع إبراز الوسيط أو المتوسط */
  dots: function(sorted, hi, capt){
    var gap = 200/Math.max(1,sorted.length), out = '';
    sorted.forEach(function(v,i){
      var x = 25+i*gap;
      out += '<circle cx="'+x+'" cy="55" r="12" class="'+(v===hi?'vz-fill':'vz-track')+'"/>'+
             '<text x="'+x+'" y="60" class="vz-in">'+v+'</text>';
    });
    return svg(out+'<text x="120" y="95" class="vz-t">'+capt+'</text>', 240, 110);
  }
};

/* ═══════════════════════════════════════════════════════════════
   مولّدات علاجية — لماذا صفحةٌ مستقلّة عن practice.html؟

   سؤال الأب (٢ سبتمبر ٢٠٢٦): «وش رايك في مستوى حسن في مهارات
   التفكير؟». حلّلنا ٣٧١ جلسة له فظهر ملفٌّ مشقوق: استدلال لغوي ٩٢٪
   وفهم صور ٩٠٪، مقابل استدلال رياضي ٥٢٪ وقدرات كمي ٦٦٪. وبطؤه في
   الرياضي هو الأعلى (١٧ ثانية للسؤال) وصفر جلسة خرج منها — أي أنّه
   يجلس ويحاول ويعجز. وخمسة أسابيع تكرارٍ عشوائيّ لم ترفع المستوى.

   ثمّ طلب الأب الرجوع إلى «أفضل الحلول والمعايير العالمية»، فبُني
   ما هنا على دليل IES/WWC العملي (Improving Mathematical Problem
   Solving in Grades 4–8) وإطار TIMSS 2023:

     · توصية ٢ (دليل قويّ) — مراقبة التفكير والتأمّل: أسئلةُ تنبيهٍ قبل
       الحل، وخطوةُ «تحقّق» بعده (حقل check).
     · توصية ٣ (دليل قويّ) — التمثيل البصري: رسمٌ لكل مسألة (حقل viz).
     · توصية ٤ (متوسّط) — طريقتان تُقارنان (حقل alt).
     · توصية ٥ (متوسّط) — شرحٌ بخطوات وتسميةُ القاعدة (rule/steps).
     · TIMSS: الاستدلال ٢٥٪ من اختبار الصف الثامن، وتعريفه مواقفُ غير
       مألوفة ومسائلُ متعدّدة الخطوات — وهو REASON أدناه.

   أسماء المهارات تطابق QUANT_AR في practice.html حرفًا بحرف، وإلّا
   لم يلتقِ الضعفُ المقروء من القاعدة بعلاجه هنا.
   ═══════════════════════════════════════════════════════════════ */
var REMEDY = {

"أعداد متتالية": function(){
  var st=ri(4,20), s=st+(st+1)+(st+2);
  var o=opt3(s,[s+3,s-3,st*3]);
  return { q:"مجموع ثلاثة أعداد متتالية أوّلها "+st+" =؟", opts:o[0], ans:o[1],
    viz: VZ.jumps([st,st+1,st+2], 1),
    rule:"المتتالية تزيد واحدًا واحدًا.",
    steps:["الأعداد هي: "+st+"، "+(st+1)+"، "+(st+2)+".",
           "نجمعها: "+st+" + "+(st+1)+" + "+(st+2)+" = "+s+"."],
    alt:{ name:"طريقة الأوسط", steps:["الأوسط هو "+(st+1)+".", "مجموع ثلاثة متتالية = الأوسط × 3 = "+(st+1)+" × 3 = "+s+"."],
          cmp:"أسرع: خطوةٌ واحدة بدل جمع ثلاثة أعداد." },
    check:"اقسم جوابك على 3: "+s+" ÷ 3 = "+(st+1)+" — لازم يطلع العدد الأوسط. ✔",
    tip:"لو كانت خمسة متتالية فالقاعدة نفسها: الأوسط × 5." };
},

"أنماط عددية": function(){
  var start=ri(2,9), step=gp([3,4,5,6,7]), seq=[start,start+step,start+2*step,start+3*step], nx=start+4*step;
  var o=opt3(nx,[nx+step,nx-1,nx+2]);
  return { q:"أكمل النمط: "+seq.join("، ")+"، ...؟", opts:o[0], ans:o[1],
    viz: VZ.jumps(seq, step),
    rule:"لمعرفة النمط اطرح كل عددٍ ممّا قبله.",
    steps:[seq[1]+" − "+seq[0]+" = "+step+"، و"+seq[2]+" − "+seq[1]+" = "+step+" ← الفرق ثابت "+step+".",
           "نضيف "+step+" للأخير: "+seq[3]+" + "+step+" = "+nx+"."],
    alt:{ name:"بالقاعدة العامة", steps:["الحدّ الأول "+start+" والفرق "+step+".",
           "الحدّ الخامس = "+start+" + (4 × "+step+") = "+nx+"."],
          cmp:"تنفع لو طُلب حدٌّ بعيد (العشرون مثلًا) بلا عدٍّ يدوي." },
    check:"ارجع بالعكس: "+nx+" − "+step+" = "+seq[3]+" — لازم يطابق آخر حدٍّ معطى. ✔",
    tip:"دائمًا افحص الفرق بين رقمين متجاورين أوّلًا — أغلب الأنماط جمعٌ ثابت." };
},

"النسبة المئوية": function(){
  var cf=gp([[10,10],[20,5],[25,4],[50,2],[40,5]]), p=cf[0], N=cf[1]*ri(3,20), v=N*p/100;
  var o=opt3(v,[v+5,v-5,N-v]);
  return { q:"كم يساوي "+p+"% من "+N+"؟", opts:o[0], ans:o[1],
    viz: VZ.pctBar(p, N, v),
    rule:"«من» تعني ضربًا، و«%» تعني ÷100.",
    steps:[p+"% = "+p+" ÷ 100 = "+(p/100)+".", "نضربها في العدد: "+(p/100)+" × "+N+" = "+v+"."],
    alt:{ name:"طريقة الواحد بالمئة", steps:["1% من "+N+" = "+N+" ÷ 100 = "+(N/100)+".",
           "نضرب في "+p+": "+(N/100)+" × "+p+" = "+v+"."],
          cmp:"أسهل ذهنيًّا بلا كسورٍ عشرية." },
    check:"هل الجواب معقول؟ "+p+"% أقلّ من النصف؟ إذن لازم يكون "+v+" أصغر من نصف "+N+" ("+(N/2)+"). ✔",
    tip:"50% = النصف، و25% = الربع، و10% = تحريك الفاصلة خانة." };
},

"نسبة الزيادة": function(){
  var cf=gp([[10,10],[20,5],[25,4],[50,2]]), inc=cf[0], base=cf[1]*ri(Math.ceil(20/cf[1]), Math.floor(60/cf[1])),
      add=base*inc/100, nv=base+add;   /* القاعدة تُختار مضاعفًا يجعل الزيادة عددًا صحيحًا */
  var o=opt3(nv,[base+inc,nv+5,base]);
  return { q:"زاد سعرٌ من "+base+" ريالًا بنسبة "+inc+"%، فما السعر الجديد؟", opts:o[0], ans:o[1],
    viz: VZ.pctBar(inc, base, add),
    rule:"الزيادة تُحسب من السعر القديم ثمّ تُضاف إليه.",
    steps:["مقدار الزيادة = "+inc+"% × "+base+" = "+add+" ريالًا.",
           "السعر الجديد = "+base+" + "+add+" = "+nv+" ريالًا."],
    alt:{ name:"بمعامل واحد", steps:["الجديد = "+(100+inc)+"% من القديم.",
           (100+inc)+"% × "+base+" = "+nv+" ريالًا."], cmp:"خطوةٌ واحدة بدل خطوتين." },
    check:"الجديد لازم يكون أكبر من "+base+" وأصغر من ضعفه ("+(base*2)+") ما دامت الزيادة أقلّ من 100%. ✔",
    tip:"خطأٌ شائع: إضافة "+inc+" نفسها (تصير "+(base+inc)+") — لا! "+inc+" نسبةٌ لا ريالات." };
},

"نسبة النقص": function(){
  var cf=gp([[10,10],[20,5],[25,4],[50,2]]), dec=cf[0], base=cf[1]*ri(Math.ceil(40/cf[1]), Math.floor(90/cf[1])),
      cut=base*dec/100, nv=base-cut;   /* المثل: قاعدةٌ تجعل النقص عددًا صحيحًا */
  var o=opt3(nv,[base-dec,nv+5,cut]);
  return { q:"نقص سعرٌ من "+base+" ريالًا بنسبة "+dec+"%، فما السعر الجديد؟", opts:o[0], ans:o[1],
    viz: VZ.pctBar(dec, base, cut),
    rule:"النقص يُحسب من السعر القديم ثمّ يُطرح منه.",
    steps:["مقدار النقص = "+dec+"% × "+base+" = "+cut+" ريالًا.",
           "السعر الجديد = "+base+" − "+cut+" = "+nv+" ريالًا."],
    alt:{ name:"بالباقي مباشرة", steps:["الباقي = "+(100-dec)+"% من "+base+".",

    check:"الجواب لازم يكون أصغر من "+base+" وأكبر من صفر. ✔",
    tip:"لا تخلط بين مقدار النقص ("+cut+") والسعر بعده ("+nv+")." };
},

"الخصم": function(){
  var cf=gp([[10,10],[20,5],[25,4],[50,2]]), p=cf[0], price=cf[1]*ri(4,18), disc=price*p/100, fin=price-disc;
  var o=opt3(fin,[disc,price,fin+5]);
  return { q:"خصمٌ "+p+"% على سعر "+price+" ريالًا، فكم السعر بعد الخصم؟", opts:o[0], ans:o[1],
    viz: VZ.pctBar(p, price, disc),
    rule:"المطلوب السعر بعد الخصم، لا الخصم نفسه.",
    steps:["الخصم = "+p+"% × "+price+" = "+disc+" ريالًا.",
           "السعر بعد الخصم = "+price+" − "+disc+" = "+fin+" ريالًا."],
    alt:{ name:"بالنسبة الباقية", steps:["تدفع "+(100-p)+"% من السعر.",

    tip:"أشهر غلطة: اختيار "+disc+" (وهو الخصم) بدل "+fin+" (وهو المطلوب). اقرأ السؤال مرّتين." };
},

"نظرية فيثاغورس": function(){
  var t=gp([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]]);
  var o=opt3(t[2],[t[0]+t[1],t[2]+1,t[2]-2]);
  return { q:"مثلث قائم الزاوية ضلعاه القائمان "+t[0]+" و "+t[1]+"، فما طول الوتر؟", opts:o[0], ans:o[1],
    viz: VZ.rtri(t[0], t[1], t[2]),
    rule:"في المثلث القائم: (الوتر)² = (الضلع الأول)² + (الضلع الثاني)².",
    steps:[t[0]+"² = "+(t[0]*t[0])+"، و "+t[1]+"² = "+(t[1]*t[1])+".",
           "مجموعهما = "+(t[0]*t[0])+" + "+(t[1]*t[1])+" = "+(t[2]*t[2])+".",
           "الوتر = الجذر التربيعي لـ "+(t[2]*t[2])+" = "+t[2]+"."],
    alt:{ name:"بالثلاثيات المشهورة", steps:["(3، 4، 5) وأضعافها، و(5، 12، 13)، و(8، 15، 17)، و(7، 24، 25).",
           "«"+t[0]+"، "+t[1]+"» منها ← الوتر "+t[2]+" مباشرة."],

    check:"الوتر لازم يكون أطول من كل ضلعٍ قائم وأقصر من مجموعهما: "+t[1]+" < "+t[2]+" < "+(t[0]+t[1])+". ✔",
    tip:"لا تجمع الضلعين مباشرة ("+(t[0]+t[1])+") — الجمع للمربّعات لا للأطوال." };
},

"مساحة المربّع": function(){
  var s=ri(3,14), o=opt3(s*s,[4*s,2*s,s*s+s]);
  return { q:"مربّعٌ طول ضلعه "+s+" سم، ما مساحته؟", opts:o[0], ans:o[1],
    viz: VZ.square(s+" سم", "المساحة ؟"),
    rule:"مساحة المربّع = الضلع × الضلع.",
    steps:["نضرب الضلع في نفسه: "+s+" × "+s+" = "+(s*s)+".", "المساحة = "+(s*s)+" سم²."],
    alt:{ name:"بعدّ المربّعات", steps:["تخيّله شبكةً من "+s+" صفوف، في كل صفٍّ "+s+" مربّعًا صغيرًا.",
           "العدد الكليّ = "+s+" × "+s+" = "+(s*s)+" مربّعًا."],
          cmp:"تُفهم المساحة بها، لا تُحفظ فقط." },
    check:"الوحدة: المساحة تُقاس بـسم² — لو كان جوابك بالسنتيمتر فهو محيطٌ لا مساحة. ✔",
    tip:"فرّق: المساحة ضربٌ ("+(s*s)+")، والمحيط جمعُ الأضلاع الأربعة ("+(4*s)+")." };
},

"محيط المربّع": function(){
  var s=ri(3,16), o=opt3(4*s,[s*s,2*s,4*s+2]);
  return { q:"مربّعٌ طول ضلعه "+s+" سم، ما محيطه؟", opts:o[0], ans:o[1],
    viz: VZ.square(s+" سم", "المحيط ؟"),
    rule:"المحيط = مجموع الأضلاع، وأضلاع المربّع أربعةٌ متساوية.",
    steps:[s+" + "+s+" + "+s+" + "+s+" = "+(4*s)+"، أو باختصار 4 × "+s+" = "+(4*s)+".",
           "المحيط = "+(4*s)+" سم."],
    alt:{ name:"بالمشي حول الشكل", steps:["امشِ على حوافّه الأربع، كلّ حافّةٍ "+s+".",
           "المسافة الكلّية = 4 × "+s+" = "+(4*s)+" سم."], cmp:"تربط المحيط بمعناه: مسافةُ الدوران حول الشكل." },
    check:"المحيط طولٌ (سم)، والمساحة مربّعة (سم²) — الوحدة تكشف الغلط. ✔",
    tip:"لو ضاعف الضلع تضاعف المحيط، لكن المساحة تصير أربعة أضعاف." };
},

"مساحة المثلّث": function(){
  var b=gp([4,6,8,10,12]), h=ri(3,11), a=b*h/2;
  var o=opt3(a,[b*h,b+h,a+b]);
  return { q:"مثلثٌ قاعدته "+b+" وارتفاعه "+h+"، ما مساحته؟", opts:o[0], ans:o[1],
    viz: VZ.tri(b, h),
    rule:"مساحة المثلث = (القاعدة × الارتفاع) ÷ 2.",
    steps:["القاعدة × الارتفاع = "+b+" × "+h+" = "+(b*h)+".", "نقسم على 2: "+(b*h)+" ÷ 2 = "+a+"."],
    alt:{ name:"نصف المستطيل", steps:["ارسم مستطيلًا "+b+"×"+h+" ← مساحته "+(b*h)+".",
           "المثلث نصفه بالضبط ← "+a+"."], cmp:"تشرح لماذا نقسم على 2، فلا تُنسى القسمة." },
    check:"مساحة المثلث لازم تكون أصغر من مساحة المستطيل الذي يحيط به ("+(b*h)+"). ✔",
    tip:"لا تنسَ القسمة على 2 — بدونها تصير مساحة مستطيل ("+(b*h)+")، وهي أشهر غلطة هنا." };
},

"مساحة المستطيل": function(){
  var L=ri(5,15), W=ri(3,L-1), o=opt3(L*W,[2*(L+W),L+W,L*W-W]);
  return { q:"مستطيلٌ طوله "+L+" وعرضه "+W+"، ما مساحته؟", opts:o[0], ans:o[1],
    viz: VZ.rect(L, W),
    rule:"مساحة المستطيل = الطول × العرض.",
    steps:[L+" × "+W+" = "+(L*W)+".", "المساحة = "+(L*W)+" وحدة مربّعة."],
    alt:{ name:"بعدّ الصفوف", steps:[W+" صفوف، في كل صفٍّ "+L+" مربّعًا.",
           W+" × "+L+" = "+(L*W)+"."], cmp:"الترتيب لا يهمّ في الضرب — نتيجةٌ واحدة." },
    check:"المساحة بوحدةٍ مربّعة، والمحيط ("+(2*(L+W))+") بوحدةٍ طوليّة. ✔",
    tip:"إن تساوى الطول والعرض صار مربّعًا — والقاعدة نفسها." };
},

"محيط المستطيل": function(){
  var L=ri(5,15), W=ri(3,L-1), o=opt3(2*(L+W),[L*W,L+W,2*L+W]);
  return { q:"مستطيلٌ طوله "+L+" وعرضه "+W+"، ما محيطه؟", opts:o[0], ans:o[1],
    viz: VZ.rect(L, W),
    rule:"المحيط = (الطول + العرض) × 2.",

          cmp:"أطول، لكنّها أوضح لو التبس عليك سببُ الضرب في 2." },
    check:"المحيط لازم يكون أكبر من ضعف الطول ("+(2*L)+") ما دام العرض أكبر من صفر. ✔",
    tip:"غلطةٌ شائعة: جمع الطول والعرض فقط ("+(L+W)+") ونسيان الضرب في 2." };
},

"تحويل الكتلة": function(){
  var kg=ri(2,9), o=opt3(kg*1000,[kg*100,kg*10,kg*500]);
  return { q:"كم غرامًا في "+kg+" كيلوغرامات؟", opts:o[0], ans:o[1],
    viz: VZ.convert("كيلوغرام", 1000, "غرام"),
    rule:"الكيلوغرام = 1000 غرام. ومن الأكبر إلى الأصغر نضرب.",
    steps:["ننتقل من كيلو إلى غرام (أصغر) ← ضرب.", kg+" × 1000 = "+(kg*1000)+" غرامًا."],
    alt:{ name:"بالتناسب", steps:["1 كجم ← 1000 غ.", kg+" كجم ← "+kg+" × 1000 = "+(kg*1000)+" غ."],
          cmp:"تنفع في أي تحويلٍ حتى لو نسيت اتجاه الضرب أو القسمة." },
    check:"الجواب لازم يكون أكبر عددًا من "+kg+" — الوحدة الأصغر تعطي رقمًا أكبر. ✔",
    tip:"القاعدة العامة: كبير ← صغير = ضرب، وصغير ← كبير = قسمة." };
},

"تحويل الأطوال": function(){
  var m=ri(2,9), o=opt3(m*100,[m*10,m*1000,m*60]);
  return { q:"كم سنتيمترًا في "+m+" أمتار؟", opts:o[0], ans:o[1],
    viz: VZ.convert("متر", 100, "سنتيمتر"),
    rule:"المتر = 100 سم. ومن الأكبر إلى الأصغر نضرب.",
    steps:["ننتقل من متر إلى سنتيمتر (أصغر) ← ضرب.", m+" × 100 = "+(m*100)+" سم."],
    alt:{ name:"بالتناسب", steps:["1 م ← 100 سم.", m+" م ← "+m+" × 100 = "+(m*100)+" سم."],
          cmp:"نفس الطريقة تصلح للكيلومتر (×1000) بلا حفظٍ جديد." },
    check:"الجواب لازم يكون أكبر عددًا من "+m+". ✔",
    tip:"احذر 1000 — تلك للكيلومتر/المتر أو الكيلوغرام/الغرام، لا للمتر/السنتيمتر." };
},

"تحويل الزمن": function(){
  var h=ri(2,9), o=opt3(h*60,[h*100,h*24,h*30]);
  return { q:"كم دقيقة في "+h+" ساعات؟", opts:o[0], ans:o[1],
    viz: VZ.convert("ساعة", 60, "دقيقة"),
    rule:"الساعة = 60 دقيقة (لا 100).",
    steps:["ننتقل من ساعة إلى دقيقة (أصغر) ← ضرب.", h+" × 60 = "+(h*60)+" دقيقة."],
    alt:{ name:"بالجمع المتكرّر", steps:["كل ساعةٍ 60 دقيقة.", "نجمع 60 "+h+" مرّات = "+(h*60)+"."],
          cmp:"بطيئة، لكنّها تُثبّت أنّ الأساس 60 لا 100." },
    check:"اقسم جوابك على 60: "+(h*60)+" ÷ 60 = "+h+" — لازم ترجع الساعات. ✔",
    tip:"الزمن ليس عشريًّا: 60 للدقائق والثواني، و24 للساعات في اليوم." };
},

"المتوسط الحسابي": function(){
  var n=gp([3,4,5]), m=ri(6,20), arr=[];
  for(var i=0;i<n;i++) arr.push(m+(i-Math.floor(n/2))*2);
  var s=arr.reduce(function(a,b){return a+b;},0), av=s/n;
  var o=opt3(av,[av+2,av-2,s]);
  return { q:"ما متوسط الأعداد: "+arr.join("، ")+"؟", opts:o[0], ans:o[1],
    viz: VZ.dots(arr.slice().sort(function(x,y){return x-y;}), av, "المتوسط = "+av),
    rule:"المتوسط = المجموع ÷ عددها.",
    steps:["المجموع = "+arr.join(" + ")+" = "+s+".", "عددها = "+n+".",
           "المتوسط = "+s+" ÷ "+n+" = "+av+"."],
    alt:{ name:"بالموازنة", steps:["الأعداد موزّعةٌ حول قيمةٍ وسطى بفروقٍ متساوية.",
           "فالمتوسط هو مركزها: "+av+"."], cmp:"تكشف الجواب بلا حسابٍ إن كانت الفروق منتظمة." },
    check:"المتوسط يقع دائمًا بين أصغر عددٍ ("+Math.min.apply(null,arr)+") وأكبره ("+Math.max.apply(null,arr)+"). ✔",
    tip:"لو خرج المتوسط عن هذا المدى فالحساب غلط قطعًا." };
},

"الوسيط": function(){
  var arr=[ri(2,9),ri(11,19),ri(21,29),ri(31,39),ri(41,49)].slice(0,gp([3,5]));
  shuffle(arr);
  var sorted=arr.slice().sort(function(x,y){return x-y;});
  var med=sorted[Math.floor(sorted.length/2)];
  var o=opt3(med,[sorted[0],sorted[sorted.length-1],Math.round(sorted.reduce(function(a,b){return a+b;},0)/sorted.length)]);
  return { q:"ما الوسيط للأعداد: "+arr.join("، ")+"؟", opts:o[0], ans:o[1],
    viz: VZ.dots(sorted, med, "بعد الترتيب — الوسطى هي "+med),
    rule:"الوسيط = القيمة الوسطى بعد الترتيب (لا المتوسط).",
    steps:["نرتّبها تصاعديًّا: "+sorted.join("، ")+".",
           "عددها "+sorted.length+"، فالوسطى هي رقم "+(Math.floor(sorted.length/2)+1)+" = "+med+"."],
    alt:{ name:"بالشطب من الطرفين", steps:["اشطب الأصغر والأكبر معًا، ثم كرّر.",
           "يبقى في المنتصف: "+med+"."], cmp:"سريعة ولا تحتاج عدّ المواقع." },
    check:"عدد ما قبل الوسيط لازم يساوي عدد ما بعده. ✔",
    tip:"الترتيب أوّلًا دائمًا — أغلب الأخطاء من أخذ الرقم الأوسط قبل الترتيب." };
},

"كسر من عدد": function(){
  var den=gp([3,4,5,6,8]), mult=ri(2,9), N=den*mult, num=ri(1,den-1), v=N*num/den;
  var o=opt3(v,[N-v,v+num,N/den]);
  return { q:"كم يساوي "+num+"/"+den+" من "+N+"؟", opts:o[0], ans:o[1],
    viz: VZ.fracBar(num, den, N, v),
    rule:"«كسرٌ من عدد» = العدد ÷ المقام × البسط.",
    steps:["نقسم على المقام: "+N+" ÷ "+den+" = "+(N/den)+" (وهذا 1/"+den+").",
           "نضرب في البسط: "+(N/den)+" × "+num+" = "+v+"."],
    alt:{ name:"بالضرب أوّلًا", steps:["("+num+" × "+N+") = "+(num*N)+".",
           "ثم ÷ "+den+" = "+v+"."], cmp:"نفس النتيجة — اختر ما يعطيك أعدادًا أسهل." },
    check:"البسط ("+num+") أصغر من المقام ("+den+")، فالجواب لازم يكون أصغر من "+N+". ✔",
    tip:"انظر الشريط: قسمناه "+khana(den)+" وأخذنا "+num+" منها." };
}
};

   الصف الثامن، وتعريفه: مواقفُ غير مألوفة، وتبريرُ الطريقة، ودمجٌ
   عبر مسائلَ متعدّدة الخطوات. ومولّدات المهارات أعلاه كلّها خطوةٌ

   ═══════════════════════════════════════════════════════════════ */
var REASON = {

"تبليط وخصم": function(){
  var s=gp([6,8,10,12]), t=2, price=gp([15,20,25]), d=gp([10,20,25,50]);
  var tiles=(s/t)*(s/t), cost=tiles*price, disc=cost*d/100, fin=cost-disc;
  if(!Number.isInteger(disc)) { price=20; d=25; cost=tiles*price; disc=cost*d/100; fin=cost-disc; }
  var o=opt3(fin,[cost,disc,fin+price]);
  return { q:"غرفةٌ مربّعة ضلعها "+s+" أمتار، تُبلَّط ببلاطٍ مربّعٍ ضلعه "+t+" متر. سعر البلاطة "+price+
             " ريالًا وعليها خصم "+d+"%. كم تدفع؟", opts:o[0], ans:o[1],
    viz: VZ.square(s+" م", "بلاطة "+t+"×"+t),
    rule:"مسألةٌ متعدّدة الخطوات: مساحة ← عدد ← تكلفة ← خصم.",
    steps:["مساحة الغرفة = "+s+" × "+s+" = "+(s*s)+" م².",
           "مساحة البلاطة = "+t+" × "+t+" = "+(t*t)+" م².",
           "عدد البلاط = "+(s*s)+" ÷ "+(t*t)+" = "+tiles+" بلاطة.",
           "التكلفة قبل الخصم = "+tiles+" × "+price+" = "+cost+" ريالًا.",
           "الخصم = "+d+"% × "+cost+" = "+disc+" ريالًا.",
           "المدفوع = "+cost+" − "+disc+" = "+fin+" ريالًا."],
    check:"تحقّق سريع: المدفوع لازم يكون أقلّ من "+cost+" وأكثر من صفر. ✔",
    tip:"في المسائل الطويلة اكتب كل خطوةٍ بسطر — الغلط غالبًا في القفز لا في الحساب." };
},

"رحلة ووقود": function(){
  var v=gp([60,80,90,120]), t=gp([2,3,4]), km=v*t, cons=gp([10,12,15]);
  if(km % cons !== 0) cons = 10;
  if(km % cons !== 0) cons = (km % 12 === 0) ? 12 : 15;
  var lit=km/cons, pr=gp([2,3]), cost=lit*pr;
  var o=opt3(cost,[km,lit,cost+pr]);
  return { q:"سيّارةٌ سرعتها "+v+" كم/ساعة سارت "+t+" ساعات، وتقطع "+cons+" كم بكل لتر، ولتر البنزين بـ"+pr+
             " ريال. كم تكلفة وقود الرحلة؟", opts:o[0], ans:o[1],
    viz: VZ.convert(v+" كم/س", t+" ساعات", km+" كم"),
    rule:"ثلاث خطوات: مسافة ← لترات ← تكلفة.",
    steps:["المسافة = السرعة × الزمن = "+v+" × "+t+" = "+km+" كم.",
           "اللترات = المسافة ÷ استهلاك اللتر = "+km+" ÷ "+cons+" = "+lit+" لترًا.",
           "التكلفة = "+lit+" × "+pr+" = "+cost+" ريالًا."],
    check:"وحدةُ الجواب ريال — لو طلع جوابك بالكيلومترات أو اللترات فقد توقّفت قبل النهاية. ✔",
    tip:"اسأل نفسك: ما الذي يطلبه السؤال بالضبط؟ كثيرٌ يحسب المسافة ويتوقّف." };
},

"سياج وبوابة": function(){
  var L=gp([12,15,18,20]), W=gp([8,10,12]), g=gp([2,3]), m=gp([20,25,30]);
  var per=2*(L+W), fence=per-g, cost=fence*m;
  var o=opt3(cost,[per*m,fence,per]);
  return { q:"حديقةٌ مستطيلة طولها "+L+" م وعرضها "+W+" م، يُحاط بسياجٍ ما عدا بوّابةً عرضها "+g+
             " م. سعر المتر "+m+" ريالًا. كم تكلفة السياج؟", opts:o[0], ans:o[1],
    viz: VZ.rect(L, W),
    rule:"محيط ← طرح البوّابة ← تكلفة. الشرطُ الخفيّ هنا هو البوّابة.",
    steps:["المحيط = (الطول + العرض) × 2 = ("+L+" + "+W+") × 2 = "+per+" م.",
           "طول السياج = المحيط − البوّابة = "+per+" − "+g+" = "+fence+" م.",
           "التكلفة = "+fence+" × "+m+" = "+cost+" ريالًا."],
    check:"التكلفة لازم تكون أقلّ من تكلفة المحيط كاملًا ("+(per*m)+" ريالًا). ✔",
    tip:"اقرأ السؤال مرّتين وابحث عن الاستثناءات: «ما عدا»، «إلّا»، «باستثناء»." };
},

"مقارنة عرضين": function(){
  var p=gp([20,25,30,40]), d=gp([10,20,30]);
  var a=4*p*(100-d)/100, b=3*p, diff=Math.abs(a-b);
  var o=opt3(diff,[a,b,diff+p]);
  return { q:"تريد 4 قطعٍ سعر الواحدة "+p+" ريالًا. عرض (أ): خصم "+d+"% على الكل. عرض (ب): اشترِ 3 والرابعة مجانًا. "+
             "كم الفرق بين العرضين بالريال؟", opts:o[0], ans:o[1],
    viz: VZ.pctBar(d, 4*p, Math.round(4*p*d/100)),
    rule:"لا تُقارن النسب مباشرةً — احسب ما تدفعه فعلًا في كلٍّ منهما.",
    steps:["عرض (أ): السعر الكامل = 4 × "+p+" = "+(4*p)+" ريالًا، وبخصم "+d+"% تدفع "+a+" ريالًا.",
           "عرض (ب): تدفع ثمن 3 فقط = 3 × "+p+" = "+b+" ريالًا.",
           "الفرق = |"+a+" − "+b+"| = "+diff+" ريالًا، والأوفر هو عرض ("+(a<b?"أ":"ب")+")."],
    check:"عرض (ب) يعادل خصم 25% دائمًا — قارنه بـ"+d+"% لتعرف الأوفر قبل الحساب. ✔",
    tip:"«اشترِ 3 والرابعة مجانًا» = خصم 25% لا 33% — لأنّ القسمة على 4 لا على 3." };
},

"أعمار بعد سنوات": function(){
  /* «الضِعف» تُخرج أبًا عمره ٢٤ وابنه ١٠ — حسابٌ صحيح وسياقٌ سخيف،
     فالطفل يضحك ويفقد ثقته بالمسألة. «ثلاثة أضعاف» تعطي أعمارًا واقعية
     (٢٨–٥٤) بنفس مستوى الصعوبة. */
  var son=ri(8,14), n=gp([2,4,6]), father=3*(son+n)-n;
  var o=opt3(son,[son+n,father-son,Math.round(father/3)]);
  return { q:"عمر الأب الآن "+father+" سنة، وبعد "+n+" سنوات يصير عمره ثلاثة أضعاف عمر ابنه. كم عمر الابن الآن؟",
    opts:o[0], ans:o[1],
    viz: VZ.jumps([son, son+n], n),
    rule:"الشرط في المستقبل لا في الحاضر — أضف السنوات للاثنين قبل المقارنة.",
    steps:["بعد "+n+" سنوات: عمر الأب = "+father+" + "+n+" = "+(father+n)+".",
           "وقتها يكون عمر الابن ثُلث ذلك = "+(father+n)+" ÷ 3 = "+(son+n)+".",
           "فعمره الآن = "+(son+n)+" − "+n+" = "+son+" سنة."],
    check:"تحقّق: بعد "+n+" سنوات يصير الابن "+(son+n)+" والأب "+(father+n)+" = ثلاثة أضعافه بالضبط. ✔",
    tip:"الغلط الشائع: قسمة عمر الأب الحالي على 3 — الشرط بعد "+n+" سنوات لا الآن." };
},

"رفع المعدّل": function(){
  var k=4, a=gp([70,75,80,60]), want=gp([80,85,90]);
  if(want<=a) want=a+10;
  var need=(k+1)*want - k*a;
  if(need>100 || need<0){ a=70; want=80; need=(k+1)*want-k*a; }
  var o=opt3(need,[want,a,need-10]);
  return { q:"طالبٌ متوسّط درجاته في 4 مواد "+a+"، ويريد أن يصير متوسّطه في 5 موادّ "+want+
             ". كم يحتاج في المادة الخامسة؟", opts:o[0], ans:o[1],
    viz: VZ.dots([a,a,a,a,need], need, "الأربع الأولى "+a+" والخامسة "+need),
    rule:"ارجع للمجموع: المتوسط = المجموع ÷ العدد، فالمجموع = المتوسط × العدد.",
    steps:["مجموع الأربع = "+a+" × 4 = "+(k*a)+".",
           "المجموع المطلوب للخمس = "+want+" × 5 = "+((k+1)*want)+".",
           "المادة الخامسة = "+((k+1)*want)+" − "+(k*a)+" = "+need+"."],
    check:"تحقّق: ("+(k*a)+" + "+need+") ÷ 5 = "+want+" ✔",
    tip:"القاعدة: لرفع المتوسط لازم تكون الدرجة الجديدة أعلى من المتوسط المطلوب." };
}
};

/* ═══ قراءة ضعف الابن من جلساته الفعلية ═══════════════════════
   نقرأ meta.skills من كل جلساته (اختبر نفسك/قدرات...)، ونجمع لكل
   مهارةٍ صحيحَها من مجموعها. الأضعف أوّلًا — بشرط ٣ أسئلةٍ فأكثر،
   فنسبةٌ من سؤالٍ واحد لا يُبنى عليها حكم. */
var MIN_ASK = 3, SESSION = 8, TOP_WEAK = 4;
function fetchSkills(){
  var url = SUPA_URL+"/rest/v1/attempts?select=meta&student=eq."+encodeURIComponent(name)+
            "&order=created_at.desc&limit=1000";
  return fetch(url, { headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY } })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows){
      var agg = {};
      (rows||[]).forEach(function(r){
        var sk = (r.meta && r.meta.skills) || null;
        if(!sk) return;
        Object.keys(sk).forEach(function(k){
          var v = sk[k];
          if(!v || !v.t) return;
          if(!agg[k]) agg[k] = {c:0,t:0};
          agg[k].c += (v.c||0); agg[k].t += v.t;
        });
      });
      return agg;
    })
    .catch(function(){ return {}; });
}
function weakest(agg){
  var list = Object.keys(agg)
    .filter(function(k){ return REMEDY[k] && agg[k].t >= MIN_ASK; })
    .map(function(k){ return { k:k, c:agg[k].c, t:agg[k].t, p:Math.round(100*agg[k].c/agg[k].t) }; })
    .sort(function(a,b){ return a.p - b.p; });
  return list.slice(0, TOP_WEAK);
}
/* لا بيانات بعد (ابنٌ جديد أو لم يحلّ قدرات): نبدأ بأساسيّاتٍ يُبنى عليها */
var DEFAULT_WEAK = ["النسبة المئوية","مساحة المثلّث","نظرية فيثاغورس","أعداد متتالية"]
  .map(function(k){ return { k:k, c:0, t:0, p:null }; });

/* الجلسة: ٦ أسئلةٍ على أضعف مهاراته (الأضعف يأخذ نصيبًا أكبر: ٤ حصص ثمّ
   ٣، ٢، ١)، ثمّ مسألتا استدلالٍ متعدّدتا الخطوات — لأنّ مهاراتٍ منفردةً
   لا تُنتج استدلالًا؛ ومجال «الاستدلال» في TIMSS مسائلُ تدمج أكثر من
   خطوةٍ في سياقٍ غير مألوف، وهو أضعف ما عند حسن. */
var SKILL_Q = 6, REASON_Q = 2;
function buildSession(weak){
  var pool=[];
  weak.forEach(function(w,i){ var reps = Math.max(1, 4-i); for(var j=0;j<reps;j++) pool.push(w.k); });
  shuffle(pool);
  var out=[], seen={}, guard=0;
  while(out.length < SKILL_Q && guard < SKILL_Q*30){
    guard++;
    var k = pool[out.length % pool.length];
    var item;
    try{ item = REMEDY[k](); }catch(e){ continue; }
    if(!item || seen[item.q]) continue;
    seen[item.q]=1; item.skill=k; out.push(item);
  }
  var rk = shuffle(Object.keys(REASON)); guard=0;
  while(out.length < SKILL_Q+REASON_Q && guard < REASON_Q*30){
    guard++;
    var key = rk[(out.length - SKILL_Q) % rk.length], it2;
    try{ it2 = REASON[key](); }catch(e){ continue; }
    if(!it2 || seen[it2.q]) continue;
    seen[it2.q]=1; it2.skill = key; it2.reason = true; out.push(it2);
  }
  return out;
}

/* ═══ الحفظ — بنفس اصطلاح بقيّة الصفحات، وبتفصيل مهاراتٍ يقرأه التقرير ═══ */
function saveScore(correct, total, skills){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[],
      meta:{ kind:"practice", test:"تقوية التفكير 🧠", correct:correct, total:total,
             skills:(skills||{}), targeted:true } };
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body) });
  }catch(e){}
}

var app = document.getElementById("app");
function cls(p){ return p==null ? "" : (p<60 ? "lo" : (p<80 ? "mid" : "hi")); }

function renderLoading(){
  app.innerHTML =
    '<header class="top"><p class="eyebrow">'+(GRADES[who]||"")+'</p><h1>🧠 تقوية التفكير — '+esc(name)+'</h1></header>'+
    '<div class="card"><p class="note">أقرأ نتائجك السابقة لأحدّد أضعف مهاراتك…</p></div>';
}

function render(weak, hasData){
  var items = buildSession(weak);
  var answered = {}, correct = 0, saved = false;
  var skillTally = {};

  var head =
    '<header class="top"><p class="eyebrow">'+(GRADES[who]||"")+' · تدريبٌ مُوجَّه</p>'+
    '<h1>🧠 تقوية التفكير — '+esc(name)+'</h1></header>'+
    '<div class="bar"><a href="home.html?who='+who+'">⬅ الرئيسية</a>'+
    '<a href="practice.html?who='+who+'">📊 قدرات وتحصيلي</a></div>';

  var intro = '<div class="intro">'+
    (hasData ? 'هذي أسئلةٌ مختارةٌ لك أنت — من أضعف مهاراتك في نتائجك السابقة.'
             : 'أوّل جلسة لك — نبدأ بمهاراتٍ أساسيّة، وبعدها تصير الأسئلة مُفصّلةً على ضعفك أنت.')+
    '<small>كل سؤالٍ بعد إجابتك يفتح لك <b>الحلّ خطوة بخطوة</b> — اقرأه حتى لو أجبت صح.</small></div>';

  var skillsCard = '<div class="card"><b>مهاراتك المستهدَفة اليوم:</b><ul class="skills">'+
    weak.map(function(w){
      return '<li><span class="pill '+cls(w.p)+'">'+(w.p==null?"جديد":w.p+"%")+'</span>'+
             '<span class="nm">'+esc(w.k)+'</span>'+
             (w.t ? '<span class="note">'+w.c+'/'+w.t+' سابقًا</span>' : '')+'</li>';
    }).join("")+'</ul></div>';

  /* أسئلةُ مراقبة التفكير — توصية ٢ (دليل قويّ) في IES/WWC، منقولةٌ من
     قائمة الأسئلة في الدليل نفسه (Example 6). تُعرض قبل الخيارات لا بعدها،
     فالغرض أن يسأل نفسه أثناء الحلّ لا أن يراجع بعد أن يعرف الجواب. */
  var PROMPTS_SKILL = ["وش يطلبه السؤال بالضبط؟","أيّ معلومةٍ فيه مهمّة؟","شفت مسألةً تشبهها قبل؟"];
  var PROMPTS_REASON = ["وش المطلوب في النهاية — لا في الخطوة الأولى؟","وش الخطوات اللي أحتاجها بالترتيب؟",
                        "فيه شرطٌ خفيّ («ما عدا»، «بعد كذا سنة»)؟"];

  var qs_ = items.map(function(it,i){
    var pr = it.reason ? PROMPTS_REASON : PROMPTS_SKILL;
    return '<div class="q'+(it.reason?' q-reason':'')+'" data-i="'+i+'">'+
      '<div class="num">سؤال '+(i+1)+' <span class="tag">'+(it.reason?'🧩 استدلال · ':'')+esc(it.skill)+'</span></div>'+
      '<div class="stem">'+esc(it.q)+'</div>'+
      (it.viz || '')+
      '<div class="ask"><b>قبل ما تحلّ، اسأل نفسك:</b><ul>'+
        pr.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div>'+
      '<div class="opts">'+ it.opts.map(function(o,j){
        return '<button data-j="'+j+'">'+esc(o)+'</button>'; }).join("") +'</div>'+
      '<div class="sol" data-sol>'+
        '<div class="rule">📌 القاعدة: '+esc(it.rule)+'</div>'+
        '<ol>'+ it.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("") +'</ol>'+
        (it.alt ? '<div class="alt"><b>🔀 طريقة ثانية — '+esc(it.alt.name)+':</b><ol>'+
            it.alt.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("")+'</ol>'+
            (it.alt.cmp ? '<div class="cmp">أيّهما أفضل؟ '+esc(it.alt.cmp)+'</div>' : '')+'</div>' : '')+
        (it.check ? '<div class="chk">✅ تحقّق من جوابك: '+esc(it.check)+'</div>' : '')+
        (it.tip ? '<div class="tip">💡 '+esc(it.tip)+'</div>' : '')+
      '</div></div>';
  }).join("");

  app.innerHTML = head + intro + skillsCard + qs_ +
    '<div class="score" data-score>الدرجة: 0 / '+items.length+'</div>'+
    '<button class="go" data-again>جلسة جديدة 🔄</button>'+
    '<footer>الأسئلة تتغيّر أرقامها كل مرّة · والمهارات تتحدّث تلقائيًّا مع تقدّمك</footer>';

  function finishIfDone(){
    var n = Object.keys(answered).length;
    if(saved) return;
    if(n === items.length){ saved = true; saveScore(correct, items.length, skillTally); }
  }
  /* حفظٌ جزئيّ إن غادر قبل أن يُكمل — كبقيّة صفحات الموقع، فلا يضيع جهده */
  function savePartial(){
    if(saved) return;
    var n = Object.keys(answered).length;
    if(n < MIN_ASK) return;
    saved = true; saveScore(correct, n, skillTally);
  }
  document.addEventListener("visibilitychange", function(){ if(document.hidden) savePartial(); });
  window.addEventListener("pagehide", function(){ savePartial(); });

  app.querySelectorAll(".q").forEach(function(qEl){
    var i = +qEl.getAttribute("data-i"), it = items[i];
    var sol = qEl.querySelector("[data-sol]");
    qEl.querySelectorAll(".opts button").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(answered[i]) return;
        var j = +btn.getAttribute("data-j");
        answered[i] = true;
        var ok = (j === it.ans);
        if(ok){ correct++; btn.classList.add("ok"); }
        else {
          btn.classList.add("no");
          qEl.querySelectorAll(".opts button").forEach(function(b){
            if(+b.getAttribute("data-j") === it.ans) b.classList.add("ok"); });
        }
        var t = skillTally[it.skill] || (skillTally[it.skill] = {c:0,t:0});
        t.t++; if(ok) t.c++;
        qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled = true; });
        sol.classList.add("show");
        var sc = app.querySelector("[data-score]");
        if(sc) sc.textContent = "الدرجة: "+correct+" / "+items.length;
        finishIfDone();
      });
    });
  });

  var again = app.querySelector("[data-again]");
  if(again) again.addEventListener("click", function(){ savePartial(); start(); });
}

function start(){
  renderLoading();
  fetchSkills().then(function(agg){
    var w = weakest(agg);
    if(w.length) render(w, true);
    else render(DEFAULT_WEAK, false);
  });
}
start();
</script>
