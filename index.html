<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>لوحة متابعة الأبناء</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<style>
  :root{
    --accent:#3b5bdb; --accent-soft:#bac8ff; --accent-deep:#2b3fa0;
    --bg:#f5f7fb; --card:#ffffff; --ink:#131a2b; --muted:#5c6577;
    --line:#e5e9f2; --good:#15803d; --good-bg:#e7f6ec; --warn:#b45309; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(19,26,43,.05),0 8px 24px rgba(19,26,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0a0f1a;--card:#121a2b;--ink:#e8edf7;--muted:#94a0b8;--line:#22304850;
      --good:#4ade80;--good-bg:#12321f;--warn:#fbbf24;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.7}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff;border-radius:22px;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;letter-spacing:.06em;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.6rem;font-weight:800}
  header.top p{margin:8px 0 0;opacity:.93;font-size:.93rem}
  .bar{display:flex;gap:10px;align-items:center;margin:16px 0}
  .bar button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .bar .muted{color:var(--muted);font-size:.85rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .chead .who{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .chead .who small{color:var(--muted);font-weight:600;font-size:.8rem}
  .pill{padding:5px 12px;border-radius:99px;font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .stat .lbl{color:var(--muted);font-size:.85rem;margin-bottom:4px}
  .stat .val{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .trend{font-size:.8rem;color:var(--muted);margin-top:2px}
  .diag{border-radius:14px;padding:14px 16px;font-size:.95rem;line-height:1.8}
  .diag.good{background:var(--good-bg);border:1px solid var(--good)}
  .diag.warn{background:#fff7ed;border:1px solid var(--warn)}
  @media (prefers-color-scheme:dark){ .diag.warn{background:#2a1c07} }
  .diag b{font-weight:800}
  .behav{display:flex;align-items:center;gap:10px;margin-top:10px;padding:11px 14px;border-radius:13px;font-size:.92rem}
  .behav .be{font-size:1.3rem;line-height:1}
  .behav.ok{background:var(--good-bg);border:1px solid var(--good)}
  .behav.no{background:#fff7ed;border:1px solid var(--warn)}
  @media (prefers-color-scheme:dark){ .behav.no{background:#2a1c07} }
  .weak{margin-top:12px}
  .weak .wt{font-weight:800;font-size:.9rem;margin-bottom:6px;color:var(--muted)}
  .weak ul{margin:0;padding-inline-start:20px}
  .weak li{margin-bottom:6px;font-size:.92rem}
  .weak .cnt{color:var(--bad);font-weight:700}
  .hist{margin-top:12px;font-size:.85rem;color:var(--muted)}
  .hist span{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:3px 9px;margin:3px 3px 0 0;font-variant-numeric:tabular-nums}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .links a{text-decoration:none;font-size:.82rem;background:var(--bg);border:1px solid var(--line);
    color:var(--ink);padding:7px 12px;border-radius:10px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">متابعة تعليمية · إنجليزي ورياضيات</p>
    <h1>لوحة متابعة الأبناء</h1>
    <p>كل نتيجة يحلّها أحدهم تظهر هنا تلقائيًا — مستوى، تطوّر، ونقاط ضعف.</p>
  </header>
  <div class="bar">
    <button id="refresh">🔄 تحديث</button>
    <span class="muted" id="status"><span class="spin"></span> جارٍ التحميل...</span>
  </div>
  <div id="content"></div>
  <div class="links">
    <a href="quiz.html?who=hasan">📘 اختبار حسن</a>
    <a href="quiz.html?who=rafeef">📗 اختبار رفيف</a>
    <a href="quiz.html?who=osama">📙 اختبار أسامة</a>
    <a href="quiz.html?who=saud">📕 اختبار سعود</a>
  </div>
  <footer>يتم التحديث تلقائيًا من قاعدة البيانات · اضغط تحديث لأحدث النتائج</footer>
</div>

<script>
const SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
const SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
const ORDER = ["حسن","رفيف","أسامة","سعود"];
const EMOJI = {"حسن":"📘","رفيف":"📗","أسامة":"📙","سعود":"📕"};
const SLUG = {"حسن":"hasan","رفيف":"rafeef","أسامة":"osama","سعود":"saud"};

function pillColor(p){
  if(p>=80) return "background:var(--good-bg);color:var(--good)";
  if(p>=50) return "background:#fff7ed;color:var(--warn)";
  return "background:var(--bad-bg);color:var(--bad)";
}
function pctOf(c,t){ return t? Math.round(c/t*100) : 0; }
function saTime(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,16).replace("T"," "); d=new Date(d.getTime()+3*3600*1000); var p=function(n){return String(n).padStart(2,"0");}; return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes()); }
function saToday(){ var d=new Date(new Date().getTime()+3*3600*1000); var p=function(n){return String(n).padStart(2,"0");}; return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate()); }
var SKILLNAMES=[
  {name:"الجذور",rx:/√/},{name:"حل المعادلات",rx:/حل\s*:|معادلة|\dx|\dس|x\s*=|س\s*=|x²|س²/},
  {name:"الأسس",rx:/[²³⁴⁵⁶⁷]|الأس/},{name:"الهندسة",rx:/مساحة|محيط|حجم|مثلث|زاوية|الوتر|قطر/},
  {name:"النسبة المئوية",rx:/%|نسبة/},{name:"الكسور",rx:/[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚]|\d\/\d|كسر/},
  {name:"ترتيب العمليات",rx:/[+\-−].*×|×.*[+\-−]/},{name:"الأعداد السالبة",rx:/−\d|احسب:\s*−/},
  {name:"الجموع الشاذة",rx:/plural/i},{name:"الأضداد",rx:/opposite/i},
  {name:"المقارنة والتفضيل",rx:/than|comparative/i},{name:"الأزمنة",rx:/\bhad\b|\bhas\b|\bhave\b|\bwas\b|\bwere\b|\bwill\b|since|yet|already/i}
];
function autoRec(rows){
  if(!rows.length) return "";
  var latest=rows[0], lp=pctOf(latest.en_correct+latest.ma_correct,latest.en_total+latest.ma_total), trend="";
  if(rows.length>=2){ var prev=pctOf(rows[1].en_correct+rows[1].ma_correct,rows[1].en_total+rows[1].ma_total); trend= lp>prev+5?"📈 في تحسّن":lp<prev-5?"📉 نزل شوي":"➡️ ثابت"; }
  var wrongs=[]; rows.slice(0,3).forEach(function(r){(r.wrong||[]).forEach(function(w){wrongs.push(w);});});
  var counts={}; wrongs.forEach(function(w){ var t=(w.q||"")+" "+(w.subject||""); for(var i=0;i<SKILLNAMES.length;i++){ if(SKILLNAMES[i].rx.test(t)){ counts[SKILLNAMES[i].name]=(counts[SKILLNAMES[i].name]||0)+1; break; } } });
  var top=SKILLNAMES.filter(function(s){return counts[s.name];}).sort(function(a,b){return counts[b.name]-counts[a.name];}).slice(0,3);
  var h="المستوى الحالي: <b>"+lp+"%</b> "+trend+" · إنجليزي "+latest.en_correct+"/"+latest.en_total+" · رياضيات "+latest.ma_correct+"/"+latest.ma_total+".";
  if(top.length) h+="<br><b>ركّز على:</b> "+top.map(function(s){return s.name+" ("+counts[s.name]+")";}).join(" · ")+".";
  else h+="<br>🎉 ما فيه أخطاء متكررة!";
  return `<div class="weak"><div class="wt">📊 تقرير تلقائي محدّث (${saToday()}):</div><div style="font-size:.9rem;line-height:1.9">${h}</div></div>`;
}

function diagnose(name, rows){
  // rows: attempts for this student, newest first
  const latest = rows[0];
  const enAvg = Math.round(rows.reduce((s,r)=>s+pctOf(r.en_correct,r.en_total),0)/rows.length);
  const maAvg = Math.round(rows.reduce((s,r)=>s+pctOf(r.ma_correct,r.ma_total),0)/rows.length);
  const weakSubj = enAvg===maAvg? null : (enAvg<maAvg? "الإنجليزي":"الرياضيات");
  const strong = enAvg===maAvg? null : (enAvg>maAvg? "الإنجليزي":"الرياضيات");
  let txt="";
  const overall = Math.round((enAvg+maAvg)/2);
  if(overall>=80) txt += `<b>${name} مستواه ممتاز</b> (${overall}%). `;
  else if(overall>=50) txt += `<b>${name} مستواه جيد</b> (${overall}%) وقابل للتحسّن. `;
  else txt += `<b>${name} يحتاج مراجعة أكثر</b> (${overall}%) — بالتدريب يتحسّن بإذن الله. `;
  if(weakSubj) txt += `الأضعف عنده: <b>${weakSubj}</b> (${weakSubj==="الإنجليزي"?enAvg:maAvg}%)، والأقوى: ${strong} (${strong==="الإنجليزي"?enAvg:maAvg}%). ركّزوا على ${weakSubj}.`;
  else txt += `أداؤه متقارب في المادتين.`;
  return {enAvg, maAvg, overall, html:txt, good:overall>=70};
}

function behavior(row){
  const m = row.meta;
  if(!m || !m.per || !m.per.length) return null;
  const dts = m.per.map(p=>p.dt).filter(x=>x!=null);
  const avg = dts.length ? dts.reduce((a,b)=>a+b,0)/dts.length : null;
  const acc = (row.en_correct+row.ma_correct)/((row.en_total+row.ma_total)||1);
  const cs = m.per.map(p=>p.c);
  const counts = {}; cs.forEach(c=>counts[c]=(counts[c]||0)+1);
  const sameRatio = cs.length ? Math.max.apply(null,Object.values(counts))/cs.length : 0;
  let label, emoji, good;
  if(avg!=null && avg < 4 && acc < 0.6){ label="حلّ عشوائي (تخمين سريع)"; emoji="🎲"; good=false; }
  else if(sameRatio >= 0.7 && acc < 0.6){ label="يختار نفس الترتيب غالبًا (تخمين)"; emoji="🎲"; good=false; }
  else if(avg!=null && avg < 4){ label="حلّ بسرعة ودقة"; emoji="🏃"; good=true; }
  else if(avg!=null && avg > 20 && acc < 0.6){ label="يتعثّر ويحتاج مساعدة"; emoji="🐢"; good=false; }
  else if(acc >= 0.8){ label="متأنٍّ ومركّز"; emoji="🎯"; good=true; }
  else { label="أداء عادي — يحتاج تدريب"; emoji="📚"; good=false; }
  return {label, emoji, good, avg: avg!=null? Math.round(avg*10)/10 : null};
}

function weakAreas(rows){
  const map = {};
  rows.forEach(r=>{
    (r.wrong||[]).forEach(w=>{
      const key = "["+(w.subject||"")+"] "+w.q;
      map[key] = (map[key]||0)+1;
    });
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
}

async function load(){
  const status = document.getElementById("status");
  const content = document.getElementById("content");
  status.innerHTML = '<span class="spin"></span> جارٍ التحميل...';
  try{
    const r = await fetch(SUPA_URL+"/rest/v1/attempts?select=*&order=created_at.desc", {
      headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY }
    });
    if(!r.ok){ throw new Error("HTTP "+r.status); }
    let data = await r.json();
    data = Array.isArray(data)?data:[];
    // نفصل صفوف النشاط والاختبارات التجريبية عن اختبارات المدرسة
    const activity = data.filter(row=> row.meta && row.meta.kind==="activity");
    const actBy = {};
    activity.forEach(a=>{ (actBy[a.student] = actBy[a.student]||[]).push(a); });
    const practiceBy = {};
    data.filter(row=> row.meta && row.meta.kind==="practice").forEach(p=>{ (practiceBy[p.student]=practiceBy[p.student]||[]).push(p); });
    data = data.filter(row=> !(row.meta && (row.meta.kind==="activity"||row.meta.kind==="practice")));
    status.textContent = `آخر تحديث: ${new Date().toLocaleString("en-GB",{timeZone:"Asia/Riyadh"})} (السعودية) · ${data.length} محاولة`;
    if(!data.length){
      content.innerHTML = `<div class="card empty">ما فيه نتائج بعد.<br>افتح رابط أي ابن من تحت وخلّه يحل الاختبار، وبتظهر نتيجته هنا تلقائيًا.</div>`;
      return;
    }
    const byStudent = {};
    data.forEach(row=>{ (byStudent[row.student] = byStudent[row.student]||[]).push(row); });
    const names = ORDER.filter(n=>byStudent[n]).concat(Object.keys(byStudent).filter(n=>!ORDER.includes(n)));
    content.innerHTML = names.map(name=>{
      const rows = byStudent[name];
      const d = diagnose(name, rows);
      const weak = weakAreas(rows);
      const beh = behavior(rows[0]);
      const grade = rows[0].grade || "";
      const hist = rows.slice(0,8).map(x=>{
        const p = pctOf((x.en_correct+x.ma_correct),(x.en_total+x.ma_total));
        return `<span>${p}%</span>`;
      }).join("");
      return `<div class="card">
        <div class="chead">
          <div class="who">${EMOJI[name]||"👦"} ${name} <small>${grade}</small></div>
          <div class="pill" style="${pillColor(d.overall)}">${d.overall}%</div>
        </div>
        <div class="grid2">
          <div class="stat"><div class="lbl">الإنجليزي (متوسط)</div><div class="val">${d.enAvg}%</div>
            <div class="trend">${rows.length} محاولة</div></div>
          <div class="stat"><div class="lbl">الرياضيات (متوسط)</div><div class="val">${d.maAvg}%</div>
            <div class="trend">${rows.length} محاولة</div></div>
        </div>
        <div class="diag ${d.good?'good':'warn'}">${d.html}</div>
        ${autoRec(rows)}
        ${beh? `<div class="behav ${beh.good?'ok':'no'}">
          <span class="be">${beh.emoji}</span>
          <span><b>أسلوب الحل (آخر محاولة):</b> ${beh.label}${beh.avg!=null? ` · متوسط ${beh.avg}ث/سؤال`:""}</span>
        </div>`: ""}
        ${weak.length? `<div class="weak"><div class="wt">أكثر الأسئلة اللي يغلط فيها:</div><ul>
          ${weak.map(w=>`<li>${w[0]} <span class="cnt">(×${w[1]})</span></li>`).join("")}
        </ul></div>` : `<div class="weak"><div class="wt">ما فيه أخطاء متكررة 🎉</div></div>`}
        ${(function(){ var pr=practiceBy[name]||[]; if(!pr.length) return ""; var byTest={}; pr.forEach(function(p){ if(!byTest[p.meta.test]) byTest[p.meta.test]=p; }); return `<div class="weak"><div class="wt">📊 الاختبارات التجريبية (قدرات/تحصيلي/STEP):</div><ul>${Object.keys(byTest).map(function(t){ var p=byTest[t]; return `<li>${t}: <b>${p.meta.correct}/${p.meta.total}</b> <span class="cnt">${saTime(p.created_at)}</span></li>`; }).join("")}</ul></div>`; })()}
        ${(function(){ var acts=actBy[name]||[]; return acts.length
          ? `<div class="weak"><div class="wt">📖 النشاط (فتح الدروس والفيديوهات):</div><ul>${acts.slice(0,6).map(a=>`<li>${a.meta.event==="video"?"🎬 فيديو":"📖 درس"}: ${a.meta.label||""} <span class="cnt">${saTime(a.created_at)}</span></li>`).join("")}</ul></div>`
          : `<div class="weak"><div class="wt">📖 النشاط: ما فتح دروس أو فيديوهات بعد</div></div>`; })()}
        <div class="hist">آخر المحاولات (النسبة الكلية): ${hist}</div>
        ${SLUG[name]?`<div style="margin-top:12px"><a href="child.html?who=${SLUG[name]}&v=3" style="display:inline-block;text-decoration:none;background:var(--accent);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:.9rem">افتح صفحة ${name} ←</a></div>`:""}
      </div>`;
    }).join("");
  }catch(e){
    status.textContent = "";
    content.innerHTML = `<div class="card empty">⚠️ تعذّر تحميل النتائج (${e.message}).<br>
      تأكد من الاتصال بالإنترنت، وأنك شغّلت سطر SQL الخاص بالقراءة.</div>`;
  }
}
document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
