<head>

<style>
  :root{
    --accent:#2563eb; --accent-deep:#1d4ed8;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:110px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .stem .en{direction:ltr;unicode-bidi:isolate}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:left}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .explain .en{direction:ltr;unicode-bidi:isolate}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
  .say{background:var(--accent);color:#fff;border:0;padding:9px 13px;border-radius:11px;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit}
  .say.small{padding:8px 12px;font-size:.88rem}
  .prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
  .prow .say{background:#0a7cff;border-color:#0a7cff}
  .prow .listen{background:var(--accent)}
  .prow .en{direction:ltr;unicode-bidi:isolate;font-weight:700}
  .prow .pfb{font-weight:700;font-size:.9rem}
</style>

<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"saud").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify({ student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } })
    });
  }catch(e){}
}

function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function opt(correct, others){ var o=[correct].concat(others); shuffle(o); return [o, o.indexOf(correct)]; }
function en(s){ return '<span class="en">'+s+'</span>'; }
// مشتّتات مميّزة من نفس القائمة (تستبعد القيمة الصحيحة وتحذف المكرّر)
function dist(pool, item, idx, n){ var correct=item[idx], seen={}, o=[]; pool.forEach(function(x){ var v=x[idx]; if(v!==correct && !seen[v]){ seen[v]=1; o.push(v); } }); shuffle(o); return o.slice(0, n||2); }

/* ===== النطق: استماع (متصفح) + تقييم عبر Azure ===== */
function azureCreds(){ var A=window.AZURE_SPEECH||{}; var c=A[who]; if(c&&c.key&&c.region) return c; var d=A["default"]; return (d&&d.key&&d.region)?d:null; }
function azureConfigured(){ return !!azureCreds(); }
function azBtnHtml(){ return azureConfigured() ? '<button class="say small azbtn">🎙️ قيّم نطقي</button>' : ''; }
function speakEN(text){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.9;
    var cands=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);});
    var good=cands.filter(function(x){return /(natural|neural|enhanced|premium|samantha|daniel|karen|serena|aria|guy|jenny)/i.test(x.name);});
    var v=good[0]||cands[0]; if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ alert("المتصفح لا يدعم النطق. جرّب Chrome أو Safari."); }
}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
function azureAssess(refText, statusEl, btn){
  var cr=azureCreds();
  if(!cr){ statusEl.textContent="⚠️ لم يُضبط مفتاح Azure بعد."; return; }
  if(!window.SpeechSDK){ statusEl.textContent="⏳ جارٍ تحميل أداة النطق... جرّب بعد ثانية."; return; }
  var SDK=window.SpeechSDK, cfg, audio, rec, pa;
  try{
    cfg=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    cfg.speechRecognitionLanguage="en-US";
    audio=SDK.AudioConfig.fromDefaultMicrophoneInput();
    rec=new SDK.SpeechRecognizer(cfg, audio);
    pa=new SDK.PronunciationAssessmentConfig(refText, SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, true);
    pa.applyTo(rec);
  }catch(e){ statusEl.textContent="خطأ في الإعداد: "+(e.message||e); return; }
  if(btn) btn.disabled=true;
  statusEl.style.color="var(--muted)"; statusEl.innerHTML="🎙️ اقرأ الآن بصوت واضح...";
  rec.recognizeOnceAsync(function(result){
    try{
      if(result && result.reason===SDK.ResultReason.RecognizedSpeech){
        var r=SDK.PronunciationAssessmentResult.fromResult(result);
        var pron=Math.round(r.pronunciationScore), acc=Math.round(r.accuracyScore), flu=Math.round(r.fluencyScore);
        var col=pron>=80?"var(--good)":pron>=60?"var(--warn)":"var(--bad)";
        var bad=[];
        try{ var ws=(r.detailResult&&r.detailResult.Words)||[]; ws.forEach(function(w){ var a=w.PronunciationAssessment; if(a&&a.AccuracyScore<60) bad.push(w.Word); }); }catch(e){}
        var face=pron>=80?"🌟":pron>=60?"👍":"💪";
        statusEl.innerHTML=face+' <b style="color:'+col+'">النطق: '+pron+'/100</b> · دقّة '+acc+' · طلاقة '+flu+(bad.length?('<br>🔁 راجع نطق: <b>'+bad.join("، ")+'</b>'):' ✅ ممتاز!');
      } else { statusEl.style.color="var(--bad)"; statusEl.textContent="❌ ما وضح الصوت — تأكد من السماح للمايكروفون وحاول ثانية."; }
    }catch(e){ statusEl.style.color="var(--bad)"; statusEl.textContent="خطأ: "+(e.message||e); }
    if(btn) btn.disabled=false; try{ rec.close(); }catch(e){}
  }, function(err){ statusEl.style.color="var(--bad)"; statusEl.textContent="❌ خطأ Azure: "+err; if(btn) btn.disabled=false; try{ rec.close(); }catch(e){} });
}
// استخراج الجملة/الكلمة الإنجليزية من السؤال، مع تعبئة الفراغ بالإجابة الصحيحة
function enTarget(stemEl, ansText){
  var parts=[]; try{ stemEl.querySelectorAll(".en").forEach(function(e){ parts.push(e.textContent); }); }catch(e){}
  var t=parts.join(" ").trim();
  var ansEn=/[A-Za-z]/.test(ansText||"");
  if(!t){ return ansEn ? clean(ansText) : ""; }
  if(/_{2,}|_/.test(t) && ansEn){ t=t.replace(/_{2,}|_/g, ansText); }
  t=clean(t);
  return /[A-Za-z]/.test(t) ? t : (ansEn ? clean(ansText) : "");
  function clean(s){ return String(s).replace(/[«»"?؟]/g,"").replace(/\s+/g," ").trim(); }
}

/* ============ Unit 1 — Family Events ============ */
var FAM = [["aunt","العمّة أو الخالة"],["uncle","العمّ أو الخال"],["cousin","ابن العمّ/الخال"],["son","الابن"],["daughter","الابنة"],["grandson","الحفيد"],["granddaughter","الحفيدة"],["parent","أحد الوالدين"],["grandparent","الجدّ أو الجدّة"],["husband","الزوج"],["wife","الزوجة"]];
var ADJ1 = [["kind","لطيف"],["helpful","متعاون"],["chatty","كثير الكلام"],["lazy","كسول"],["strong","قويّ"],["weak","ضعيف"],["tired","متعب"]];
var FREQ = [["always","دائمًا (100%)"],["usually","عادةً"],["often","غالبًا"],["sometimes","أحيانًا"],["never","أبدًا (0%)"]];
var POSS = [["I","mine"],["you","yours"],["he","his"],["she","hers"],["we","ours"],["they","theirs"]];
function gFam(){ var p=gp(FAM); var o=opt(p[1], dist(FAM,p,1)); return ["معنى "+en("«"+p[0]+"»")+" بالعربي؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gAdj1(){ var p=gp(ADJ1); var o=opt(p[1], dist(ADJ1,p,1)); return ["معنى "+en("«"+p[0]+"»")+" بالعربي؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gOpp(){ var o=opt("weak",["kind","tired"]); return ["ضدّ كلمة "+en("«strong»")+":", o[0], o[1], en("strong ↔ weak")+" (قويّ ↔ ضعيف)."]; }
function gFreqM(){ var p=gp(FREQ); var o=opt(p[1], dist(FREQ,p,1)); return ["معنى "+en("«"+p[0]+"»")+"؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gFreqFill(){ var items=[["I ___ brush my teeth every day. (كل يوم)","always"],["I ___ tell lies. (أبدًا)","never"],["We ___ visit grandma on Fridays. (أحيانًا)","sometimes"]]; var p=gp(items); var o=opt(p[1], ["never","always","sometimes"].filter(function(x){return x!==p[1];}).slice(0,2)); return ["أكمل: "+en(p[0]), o[0], o[1], "الظرف المناسب: "+en(p[1])+"."]; }
function gPoss(){ var p=gp(POSS); var o=opt(p[1], dist(POSS,p,1)); return ["الضمير الملكي لـ "+en("«"+p[0]+"»")+" (mine/yours/…):", o[0], o[1], en(p[0]+" → "+p[1])+"."]; }
function gWhose(){ var items=[["It's her bag. = It's ___.","hers"],["It's my pen. = It's ___.","mine"],["It's your book. = It's ___.","yours"],["It's their car. = It's ___.","theirs"]]; var p=gp(items); var o=opt(p[1], dist(POSS,["x",p[1]],1)); return ["أكمل: "+en(p[0]), o[0], o[1], en(p[1])+" هو الضمير الملكي الصحيح."]; }

/* ============ Unit 2 — Chores ============ */
var CHORE = [["wash","the dishes"],["make","the bed"],["sweep","the floor"],["take out","the trash"],["set","the table"],["cut","the grass"],["feed","the animals"],["clear","the table"]];
var TOOLS = [["broom","المكنسة"],["bucket","الدلو"],["dustpan","جاروف القمامة"]];
function gChoreV(){ var p=gp(CHORE); var o=opt(p[0], dist(CHORE,p,0)); return ["أكمل: "+en("___ "+p[1]), o[0], o[1], en(p[0]+" "+p[1])+"."]; }
function gChoreO(){ var p=gp(CHORE); var o=opt(p[1], dist(CHORE,p,1)); return ["أكمل: "+en(p[0]+" ___"), o[0], o[1], en(p[0]+" "+p[1])+"."]; }
function gTool(){ var p=gp(TOOLS); var o=opt(p[1], dist(TOOLS,p,1)); return ["معنى "+en("«"+p[0]+"»")+"؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gProg(){ var items=[["I ___ reading now.","am"],["She ___ cooking dinner.","is"],["They ___ playing football.","are"],["What ___ you doing?","are"],["He ___ sleeping.","is"]]; var p=gp(items); var o=opt(p[1], ["am","is","are"].filter(function(x){return x!==p[1];})); return ["أكمل (المضارع المستمر): "+en(p[0]), o[0], o[1], "الصحيح: "+en(p[1])+" (be + verb-ing)."]; }
function gCan(){ var items=["___ you help me, please?","___ I take out the trash for you?","___ you open the window, please?"]; var p=gp(items); var o=opt("Can", ["Am","Did"]); return ["أكمل (طلب/عرض): "+en(p), o[0], o[1], en("Can")+" تُستخدم للطلب والعرض بأدب."]; }

/* ============ Unit 3 — Stories ============ */
var VERB3 = [["call","يتّصل/ينادي"],["carry","يحمل"],["climb","يتسلّق"],["cry","يبكي"],["laugh","يضحك"],["shout","يصرخ"],["invite","يدعو"],["plant","يزرع"],["water","يسقي"],["wait","ينتظر"],["prefer","يفضّل"],["score","يسجّل هدفًا"]];
var REG = [["play","played"],["walk","walked"],["jump","jumped"],["wait","waited"],["plant","planted"],["call","called"],["climb","climbed"],["laugh","laughed"],["shout","shouted"],["water","watered"],["open","opened"],["clean","cleaned"]];
function gVerb3(){ var p=gp(VERB3); var o=opt(p[1], dist(VERB3,p,1)); return ["معنى "+en("«"+p[0]+"»")+" بالعربي؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gPastReg(){ var p=gp(REG); var o=opt(p[1], [p[0], p[0]+"ing"]); return ["الماضي (Simple Past) من "+en("«"+p[0]+"»")+"؟", o[0], o[1], en(p[0]+" → "+p[1])+" (نضيف ed)."]; }
function gPastNeg(){ var items=[["She ___ (not/play) yesterday.","didn't play","doesn't play"],["He ___ (not/laugh).","didn't laugh","don't laugh"],["They ___ (not/win).","didn't win","aren't win"]]; var p=gp(items); var o=opt(p[1], [p[2],"not play"]); return ["أكمل بالنفي (Simple Past): "+en(p[0]), o[0], o[1], "النفي في الماضي: "+en("didn't + verb")+"."]; }
function gPastQ(){ var items=[["Did you win the game? — Yes, I ___.","did","didn't"],["Did she laugh? — No, she ___.","didn't","did"],["Did they play? — Yes, they ___.","did","didn't"]]; var p=gp(items); var o=opt(p[1], [p[2],"do"]); return ["أكمل الإجابة القصيرة: "+en(p[0]), o[0], o[1], "الإجابة القصيرة: "+en(p[1])+"."]; }

/* ============ Unit 4 — After-School Fun ============ */
var VERB4 = [["go shopping","يتسوّق"],["take photos","يلتقط صورًا"],["play board games","يلعب ألعاب الطاولة"],["hide","يختبئ"],["dress up","يتأنّق/يتنكّر"],["make a model","يصنع مجسّمًا"]];
var IRR = [["go","went","goed"],["see","saw","seed"],["have","had","haved"],["run","ran","runned"],["write","wrote","writed"],["eat","ate","eated"],["take","took","taked"]];
var ADV = [["quick","quickly"],["happy","happily"],["slow","slowly"],["loud","loudly"],["careful","carefully"],["bad","badly"],["lucky","luckily"]];
var CONJ = [["I was tired, ___ I went to bed.","so","but","and","«so» = لذلك (نتيجة)."],["I like apples ___ bananas.","and","so","because","«and» = و (إضافة)."],["I stayed home ___ it rained.","because","and","but","«because» = لأنّ (سبب)."],["He is small ___ strong.","but","so","because","«but» = لكن (تضادّ)."],["Call me ___ you arrive.","when","but","so","«when» = عندما (زمن)."]];
function gVerb4(){ var p=gp(VERB4); var o=opt(p[1], dist(VERB4,p,1)); return ["معنى "+en("«"+p[0]+"»")+" بالعربي؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gIrr(){ var p=gp(IRR); var o=opt(p[1], [p[2], p[0]]); return ["الماضي الشاذّ من "+en("«"+p[0]+"»")+"؟", o[0], o[1], en(p[0]+" → "+p[1])+" (فعل شاذّ)."]; }
function gAdv(){ var p=gp(ADV); var o=opt(p[1], [p[0], p[0]+"er"]); return ["حوّل "+en("«"+p[0]+"»")+" إلى ظرف (adverb):", o[0], o[1], en(p[0]+" → "+p[1])+" (نضيف ly)."]; }
function gConj(){ var p=gp(CONJ); var o=opt(p[1], [p[2],p[3]]); return ["أكمل بأداة الربط: "+en(p[0]), o[0], o[1], p[4]]; }

/* ============ Unit 5 — Outdoor Fun (أماكن الطبيعة) ============ */
var NATURE = [["Earth","الأرض / الكوكب"],["mountain","جبل"],["land","يابسة"],["island","جزيرة"],["waterfall","شلال"],["lake","بحيرة"],["field","حقل"],["forest","غابة"],["countryside","الرِّيف"],["desert","صحراء"],["hill","تلّة"],["cave","كهف"]];
function gNature(){ var p=gp(NATURE); var o=opt(p[1], dist(NATURE,p,1)); return ["معنى "+en("«"+p[0]+"»")+" بالعربي؟", o[0], o[1], en(p[0])+" = "+p[1]+"."]; }
function gNatureAr(){ var p=gp(NATURE); var o=opt(p[0], dist(NATURE,p,0)); return ["أيّ كلمة تعني «"+p[1]+"»؟", o[0], o[1], p[1]+" = "+en(p[0])+"."]; }

// Unit 5 grammar
var VBING = [
  ["I enjoy ___ in the lake.","swimming","to swim","swim","بعد enjoy: الفعل + ing."],
  ["We went ___ around the lake.","walking","to walk","walk","مع الأنشطة: go + verb-ing."],
  ["I decided ___ to the countryside.","to go","going","go","بعد decide: to + الفعل."],
  ["I want ___ football.","to play","playing","play","بعد want: to + الفعل."],
  ["I finished ___ my homework.","doing","to do","do","بعد finish: الفعل + ing."]
];
function gVing(){ var p=gp(VBING); var o=opt(p[1],[p[2],p[3]]); return ["أكمل: "+en(p[0]), o[0], o[1], p[4]]; }
var COULD = [
  ["___ you swim when you were five? — Yes, I could.","Could","Can","Do","«Could» للقدرة في الماضي."],
  ["I ___ ride a horse when I was young.","couldn't","can't","didn't","«couldn't» = لم أستطع (ماضٍ)."],
  ["She ___ read at the age of four.","could","can","will","«could» للقدرة في الماضي."]
];
