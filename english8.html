<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الإنجليزي — ثاني متوسط</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:8px;margin:14px 0 8px}
  .chapsel button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 8px;border-radius:13px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:104px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.1rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 15px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:left;line-height:1.6}
  .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block;text-align:left}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:260px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"rafeef").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function en(s){ return '<span class="ltr">'+s+'</span>'; }
/* ثلاثة خيارات متمايزة أو null — والمولّد يُعاد بدل عرض خيارين على الطفل */
function eOpts(right, cands){
  var o=[right], i;
  for(i=0;i<cands.length && o.length<3;i++){ if(cands[i]!=null && o.indexOf(cands[i])<0) o.push(cands[i]); }
  if(o.length<3) return null;
  shuffle(o); return [o, o.indexOf(right)];
}
/* جملةٌ فيها فراغ: نعرضها كما في الكتاب بخطٍّ سفليّ */
function blank(s){ return en(s.replace(/_/g, "_____")); }

/* ============================================================
   الإنجليزي — ثاني متوسط (منهج رفيف · Part 1: الوحدات ١–٨)

   مبنيّ من كتابها نفسه: صفحة المحتويات وجدول Scope and Sequence —
   فكلّ وحدةٍ هنا تُدرَّب على «الوظائف» و«القواعد» المذكورتين لها في
   الجدول بالحرف، وبأرقام صفحاتها.

   وما ليس في الصورتين لا نخترعه: نصوص القراءة (Let the Games Begin ·
   Foods: Truth and Lies) ومفردات الوحدات وتمارين الكتاب ليست عندنا،
   فلا أسئلة عليها حتى تصل صورُها. والمراجعتان هنا مراجعةُ قواعدَ
   ولغة (Language Review) كما سمّاهما الجدول، لا أسئلةَ فهمٍ على
   قطعةٍ لم نقرأها.
   ============================================================ */

/* ===================== الوحدة ١ — Are You Here on Vacation? (ص ٢–٩) ===================== */

/* القاعدة: المضارع البسيط من الفعل be */
var BE = [
  { s:"I", be:"am" }, { s:"He", be:"is" }, { s:"She", be:"is" }, { s:"It", be:"is" },
  { s:"We", be:"are" }, { s:"You", be:"are" }, { s:"They", be:"are" },
  { s:"My brother", be:"is" }, { s:"My parents", be:"are" }, { s:"Sara", be:"is" },
  { s:"Sara and Noura", be:"are" }, { s:"The students", be:"are" }, { s:"The book", be:"is" }
];
function u1Be(){
  var x = gp(BE);
  var o = eOpts(x.be, ["am","is","are"].filter(function(b){ return b!==x.be; }));
  if(!o) return null;
  return ["اختاري الصحيح: "+blank(x.s+" _ from Saudi Arabia."), o[0].map(en), o[1],
    "الفعل <span class=ltr>be</span> يتبع الفاعل: <span class=ltr>I → am</span> · <span class=ltr>he/she/it</span> والمفرد <span class=ltr>→ is</span> · <span class=ltr>we/you/they</span> والجمع <span class=ltr>→ are</span>. وهنا الفاعل <span class=ltr>"+x.s+"</span> فالصواب <span class=ltr>"+x.be+"</span>.",
    "u1be:"+x.s];
}

/* النفي والاختصار */
function u1BeNeg(){
  var x = gp(BE.filter(function(b){ return b.s!=="I"; }));
  var right = x.be==="is" ? "isn't" : "aren't";
  var o = eOpts(right, ["isn't","aren't","amn't"].filter(function(b){ return b!==right; }));
  if(!o) return null;
  return ["اختاري الصحيح: "+blank(x.s+" _ at school today."), o[0].map(en), o[1],
    "نفي <span class=ltr>is</span> هو <span class=ltr>isn't</span>، ونفي <span class=ltr>are</span> هو <span class=ltr>aren't</span>. ولا يوجد في الإنجليزية اختصارٌ اسمه <span class=ltr>amn't</span> — يُقال <span class=ltr>I'm not</span>.",
    "u1neg:"+x.s];
}

/* أدوات السؤال: how, what, when, where, who, why */
var WHQ = [
  { w:"Where", a:"In Riyadh.",            hint:"المكان" },
  { w:"When",  a:"At seven o'clock.",     hint:"الوقت" },
  { w:"Who",   a:"My cousin Noura.",      hint:"الشخص" },
  { w:"Why",   a:"Because I like it.",    hint:"السبب" },
  { w:"What",  a:"A notebook and a pen.", hint:"الشيء" },
  { w:"How",   a:"By bus.",               hint:"الطريقة" },
  { w:"Where", a:"At the airport.",       hint:"المكان" },
  { w:"When",  a:"On Friday.",            hint:"الوقت" },
  { w:"Why",   a:"Because it was late.",  hint:"السبب" },
  { w:"How",   a:"Very well, thank you.", hint:"الحال" }
];
function u1Wh(){
  var x = gp(WHQ);
  var pool = ["Where","When","Who","Why","What","How"].filter(function(w){ return w!==x.w; });
  shuffle(pool);
  var o = eOpts(x.w, pool);
  if(!o) return null;
  return ["أيُّ أداةِ سؤالٍ تناسب هذا الجواب؟ "+en("— "+x.a), o[0].map(en), o[1],
    "الجواب يدلّ على <b>"+x.hint+"</b>، وأداتُه <span class=ltr>"+x.w+"</span>.",
    "u1wh:"+x.a];
}

/* حروف الجرّ المكانية */
var PREP1 = [
  { p:"in",       s:"The pen is _ the bag." },
  { p:"on",       s:"The book is _ the table." },
  { p:"under",    s:"The ball is _ the chair." },
  { p:"next to",  s:"The bank is _ the hotel." },
  { p:"between",  s:"The school is _ the park and the mall." },
  { p:"behind",   s:"The garden is _ the house." },
  { p:"in front of", s:"The car is _ the door." },
  { p:"across from", s:"The mosque is _ the library." }
];
function u1Prep(){
  var x = gp(PREP1);
  var pool = PREP1.map(function(y){ return y.p; }).filter(function(p){ return p!==x.p; });
  shuffle(pool);
  var o = eOpts(x.p, pool);
  if(!o) return null;
  return ["اختاري حرف الجرّ المناسب: "+blank(x.s), o[0].map(en), o[1],
    "<span class=ltr>in</span> داخل · <span class=ltr>on</span> فوق مُلامِسًا · <span class=ltr>under</span> تحت · <span class=ltr>next to</span> بجانب · <span class=ltr>between</span> بين اثنين · <span class=ltr>behind</span> خلف · <span class=ltr>in front of</span> أمام · <span class=ltr>across from</span> مقابل.",
    "u1prep:"+x.p];
}

/* الوظائف: التحية والاعتذار والشكر والتعارف */
var FUNC1 = [
  { sit:"تقابلين شخصًا لأوّل مرّة",              r:"Nice to meet you.",       w:["See you later.","You're welcome."] },
  { sit:"تودّعين صديقتك",                        r:"See you tomorrow!",       w:["Nice to meet you.","How do you do it?"] },
  { sit:"أحدهم شكرك",                            r:"You're welcome.",         w:["I'm sorry.","Nice to meet you."] },
  { sit:"تأخّرتِ عن الموعد وتعتذرين",            r:"I'm sorry I'm late.",     w:["Thank you very much.","See you later."] },
  { sit:"تطلبين اسم شخصٍ بأدب",                  r:"What's your name?",       w:["Where are you from?","How old are you?"] },
  { sit:"تسألين عن بلد شخصٍ",                    r:"Where are you from?",     w:["What's your name?","What time is it?"] },
  { sit:"تعرّفين صديقتك على أختك",               r:"This is my sister, Sara.", w:["I'm fine, thanks.","See you soon."] },
  { sit:"أحدهم قال لك شكرًا على هديّة",          r:"You're welcome.",         w:["Excuse me.","Good luck."] },
  { sit:"تسألين عن الطريق إلى البنك",            r:"Excuse me, where is the bank?", w:["How are you today?","What's your name?"] },
  { sit:"تشكرين شخصًا ساعدك",                    r:"Thank you for your help.", w:["I'm sorry.","See you later."] }
];
function u1Func(){
  var x = gp(FUNC1);
  var o = eOpts(x.r, x.w.slice());
  if(!o) return null;
  return ["ماذا تقولين حين "+x.sit+"؟", o[0].map(en), o[1],
    "العبارة المناسبة هنا: <span class=ltr>"+x.r+"</span>.",
    "u1f:"+x.sit];
}

/* إرشاد الطريق */
var DIR1 = [
  { r:"Go straight ahead.",     ar:"امشِ إلى الأمام مباشرةً" },
  { r:"Turn left at the corner.", ar:"انعطف يسارًا عند الزاوية" },
  { r:"Turn right after the bank.", ar:"انعطف يمينًا بعد البنك" },
  { r:"It's on your left.",     ar:"هو على يسارك" },
  { r:"It's on your right.",    ar:"هو على يمينك" }
];
function u1Dir(){
  var x = gp(DIR1);
  var pool = DIR1.filter(function(y){ return y.r!==x.r; }).map(function(y){ return y.r; });
  shuffle(pool);
  var o = eOpts(x.r, pool);
  if(!o) return null;
  return ["أيُّ جملةٍ معناها: <b>"+x.ar+"</b>؟", o[0].map(en), o[1],
    "<span class=ltr>"+x.r+"</span> = "+x.ar+".",
    "u1dir:"+x.r];
}

/* ===================== الوحدة ٢ — What Are They Making? (ص ١٠–١٧) ===================== */

var PROG = [
  { s:"I", be:"am" }, { s:"He", be:"is" }, { s:"She", be:"is" },
  { s:"We", be:"are" }, { s:"They", be:"are" }, { s:"You", be:"are" },
  { s:"My mother", be:"is" }, { s:"The children", be:"are" }
];
var VING = ["making a cake","cooking dinner","reading a book","playing football",
            "watching TV","writing a letter","studying English","cleaning the room"];
function u2Prog(){
  var x = gp(PROG), v = gp(VING);
  var o = eOpts(x.be, ["am","is","are"].filter(function(b){ return b!==x.be; }));
  if(!o) return null;
  return ["المضارع المستمر — اختاري الصحيح: "+blank(x.s+" _ "+v+" now."), o[0].map(en), o[1],
    "المضارع المستمر = <span class=ltr>be + verb-ing</span>، و<span class=ltr>be</span> يتبع الفاعل. والفاعل <span class=ltr>"+x.s+"</span> يأخذ <span class=ltr>"+x.be+"</span>.",
    "u2prog:"+x.s];
}

/* إملاء صيغة ing */
var ING = [
  { v:"make",  ing:"making",   why:"فعلٌ ينتهي بـe صامتة ⇐ تُحذف ثمّ نضيف ing" },
  { v:"write", ing:"writing",  why:"فعلٌ ينتهي بـe صامتة ⇐ تُحذف ثمّ نضيف ing" },
  { v:"run",   ing:"running",  why:"فعلٌ قصيرٌ ينتهي بحرفٍ ساكنٍ واحدٍ بعد حرف علّة ⇐ يُضاعف الساكن" },
  { v:"sit",   ing:"sitting",  why:"فعلٌ قصيرٌ ينتهي بحرفٍ ساكنٍ واحدٍ بعد حرف علّة ⇐ يُضاعف الساكن" },
  { v:"swim",  ing:"swimming", why:"فعلٌ قصيرٌ ينتهي بحرفٍ ساكنٍ واحدٍ بعد حرف علّة ⇐ يُضاعف الساكن" },
  { v:"study", ing:"studying", why:"الياء تبقى كما هي مع ing — لا تتحوّل" },
  { v:"play",  ing:"playing",  why:"نضيف ing بلا تغيير" },
  { v:"cook",  ing:"cooking",  why:"نضيف ing بلا تغيير" },
  { v:"take",  ing:"taking",   why:"فعلٌ ينتهي بـe صامتة ⇐ تُحذف ثمّ نضيف ing" },
  { v:"stop",  ing:"stopping", why:"فعلٌ قصيرٌ ينتهي بحرفٍ ساكنٍ واحدٍ بعد حرف علّة ⇐ يُضاعف الساكن" }
];
function u2Ing(){
  var x = gp(ING);
  var wrong1 = x.v + "ing";                       /* بلا حذفٍ ولا مضاعفة */
  var wrong2 = x.v.replace(/y$/,"i") + "ing";     /* تحويل الياء خطأً */
  var cands = [wrong1, wrong2, x.v+"eing", x.v+"ning"].filter(function(w){ return w!==x.ing; });
  var o = eOpts(x.ing, cands);
  if(!o) return null;
  return ["ما صيغة <span class=ltr>ing</span> للفعل "+en(x.v)+"؟", o[0].map(en), o[1],
    x.why+" ⇐ <span class=ltr>"+x.ing+"</span>.",
    "u2ing:"+x.v];
}

/* الأمر والنهي */
var IMP = [
  { r:"Open the door, please.",  neg:"Don't open the door." },
  { r:"Close the window.",       neg:"Don't close the window." },
  { r:"Listen carefully.",       neg:"Don't listen to that." },
  { r:"Sit down, please.",       neg:"Don't sit here." },
  { r:"Mix the flour and water.",neg:"Don't mix them." }
];
function u2Imper(){
  var x = gp(IMP), useNeg = ri(0,1)===1;
  var right = useNeg ? x.neg : x.r;
  var base = right.replace(/^Don't /,"").replace(/[.,].*$/,"");
  var bad1 = useNeg ? ("Not "+base+".") : ("You "+base.toLowerCase()+".");
  var bad2 = useNeg ? ("No "+base+".")  : ("To "+base.toLowerCase()+".");
  var o = eOpts(right, [bad1, bad2]);
  if(!o) return null;
  return [(useNeg ? "أيُّ صيغة <b>نهي</b> صحيحة؟" : "أيُّ صيغة <b>أمر</b> صحيحة؟"), o[0].map(en), o[1],
    "الأمر يبدأ بالفعل مجرّدًا بلا فاعل: <span class=ltr>Open the door.</span> والنهي بـ<span class=ltr>Don't</span> + الفعل: <span class=ltr>Don't open the door.</span>",
    "u2imp:"+right];
}

/* الاستحسان والاستهجان */
var APPR = [
  { r:"That's a great idea!",  ok:true },
  { r:"I like it very much.",  ok:true },
  { r:"That looks wonderful!", ok:true },
  { r:"I don't like it.",      ok:false },
  { r:"That's not a good idea.",ok:false },
  { r:"I don't think so.",     ok:false }
];
function u2Appr(){
  var wantOk = ri(0,1)===1;
  var pool = APPR.filter(function(a){ return a.ok===wantOk; });
  var right = gp(pool).r;
  var others = APPR.filter(function(a){ return a.ok!==wantOk; }).map(function(a){ return a.r; });
  shuffle(others);
  var o = eOpts(right, others);
  if(!o) return null;
  return ["أيُّ عبارةٍ تُعبِّر عن <b>"+(wantOk?"الاستحسان":"عدم الاستحسان")+"</b>؟", o[0].map(en), o[1],
    "عباراتُ الاستحسان: <span class=ltr>That's a great idea! · I like it. · That looks wonderful!</span><br>وعبارات عدمه: <span class=ltr>I don't like it. · That's not a good idea. · I don't think so.</span>",
    "u2appr:"+right];
}

/* ===================== الوحدة ٣ — Who's Who (ص ١٨–٢٥) ===================== */

var JOBS = [
  { j:"a teacher",   d:"works in a school and helps students learn" },

  function leaveCur(){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); }

  var REMTOPICS = [
    {id:"u1", name:"Unit 1 — Vacation",   yt:"شرح verb to be and wh questions ثاني متوسط"},
    {id:"u2", name:"Unit 2 — Making",     yt:"شرح present continuous and imperative ثاني متوسط"},
    {id:"u3", name:"Unit 3 — Who's Who",  yt:"شرح simple present and relative pronouns ثاني متوسط"},
    {id:"u4", name:"Unit 4 — Pastimes",   yt:"شرح adverbs of frequency and gerund infinitive ثاني متوسط"},
    {id:"exp1",name:"مراجعة 1–4",         yt:"مراجعة انجليزي ثاني متوسط الوحدات الاولى"},
    {id:"u5", name:"Unit 5 — Ice Cream",  yt:"شرح countable uncountable some any too enough ثاني متوسط"},
    {id:"u6", name:"Unit 6 — What Was It",yt:"شرح simple past regular irregular verbs ثاني متوسط"},
    {id:"u7", name:"Unit 7 — Happened",   yt:"شرح there was there were ago because so ثاني متوسط"},
    {id:"u8", name:"Unit 8 — What's Wrong",yt:"شرح should pronouns possessive adjectives ثاني متوسط"},
    {id:"exp2",name:"مراجعة 5–8",         yt:"مراجعة انجليزي ثاني متوسط الوحدات الخامسة للثامنة"}
  ];
  function ytLinkHtml(id){
    var rt=null;
    for(var i=0;i<REMTOPICS.length;i++){ if(REMTOPICS[i].id===id){ rt=REMTOPICS[i]; break; } }
    if(!rt) return '';
    return '<div style="margin-top:10px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(rt.yt||rt.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800;font-size:.88rem">🎬 شاهد شرح الدرس</a></div>';
  }

  function render(id){
    var c = CFG[id], sec = panelOf(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+ytLinkHtml(id)+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score dir="ltr">0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false;
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && !saved){ saved=true; saveScore(c.label, correct, total); }
        });
      });
    });
    function savePartial(){ var n=Object.keys(answered).length; if(saved||n<3) return; saved=true; saveScore(c.label, correct, n); }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

  function drawChap(){
    var e=document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("[data-ch]").forEach(function(b){
      b.addEventListener("click", function(){
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
    document.getElementById("unit").innerHTML = CHAPS[curCh].unit;
  }
  function drawTabs(){
    var t=document.getElementById("tabs");
    t.innerHTML = CHAPS[curCh].ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("");
    t.querySelectorAll("[data-tab]").forEach(function(b){
      b.addEventListener("click", function(){ leaveCur(); showPanel(b.dataset.tab); });
    });
  }
  function showPanel(id){
    curId = id;
    document.querySelectorAll("#tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x.dataset.tab===id ? "true":"false"); });
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id); pan.classList.add("active");
    if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }

  drawChap(); drawTabs(); showPanel(curId);
  /* الاختفاء والمغادرة كلاهما يحفظ ما حُلّ — انظر ما وقع لرفيف في ١٠ سبتمبر:
     نصفُ قسمٍ محلولٌ ضاع لأنّ الحفظ كان معلّقًا على تبديل التبويب وحده. */
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });
  window.addEventListener("pagehide", function(){ leaveCur(); });
}

</script>
</body>
</html>
