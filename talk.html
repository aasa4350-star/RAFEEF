<!-- أداة النطق: الإصدار مثبَّتٌ عمدًا لا @latest.
     كان @latest يجلب أحدث إصدارٍ مهما كان، فأيّ تحديثٍ من مايكروسوفت
     يصل أجهزة الأولاد الأربعة من تلقائه ويكسر التسجيل بلا أن نلمس
     شيئًا ولا نعرف السبب. والترقية الآن قرارٌ نتّخذه ونختبره.
     1.51.0 هو ما كان @latest يخدمه يوم التثبيت (٥ سبتمبر ٢٠٢٦)
     بايتًا ببايت، فالتثبيت لم يغيّر سلوكًا قائمًا. -->
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --npc:#eef1f6; --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;--npc:#1b2431;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:20px 22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.42rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a,.bar button{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
  .en{direction:ltr;unicode-bidi:isolate}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
  .scn{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:right;font-family:inherit;color:var(--ink)}
  .scn:hover{border-color:var(--accent)}
  .scn .e{font-size:1.7rem;flex:none}
  .scn .t{font-weight:800;font-size:1.02rem;line-height:1.3}
  .scn.free{grid-column:1 / -1;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:0}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:6px 0 14px;box-shadow:var(--shadow);font-size:.94rem}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
  .b{display:flex;gap:9px;align-items:flex-start;max-width:100%}
  .b.me{flex-direction:row-reverse}
  .b .av{flex:none;font-size:1.5rem;margin-top:2px}
  .b .bub{border-radius:16px;padding:10px 14px;max-width:82%;box-shadow:var(--shadow)}
  .b.ai .bub{background:var(--npc);border:1px solid var(--line);border-bottom-right-radius:5px}
  .b.me .bub{background:var(--good-bg);border:1px solid var(--good);border-bottom-left-radius:5px}
  .b .bub .en{font-size:1.12rem;font-weight:700}
  .b .bub .sc{font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:600}
  .b .bub .cor{font-size:.78rem;margin-top:5px;font-weight:600}
  .b .bub .cor.ok{color:var(--good)}
  .b .bub .cor.no{color:var(--warn,#b45309)}
  .b .bub .rep{background:transparent;border:0;color:var(--accent);font-weight:800;cursor:pointer;font-size:.85rem;padding:4px 0 0;font-family:inherit}
  .thinking{color:var(--muted);font-style:normal}

  /* Mic dock */
  .dock{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .status{text-align:center;font-weight:700;font-size:.92rem;min-height:22px;margin-bottom:10px}
  .micbtn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:16px;font-size:1.12rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .micbtn:disabled{opacity:.55}
  .micbtn.rec{background:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.98)}}
  .row2{display:flex;gap:9px;margin-top:9px}
  .row2 button{flex:1;background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:11px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}

<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who=(qs("who")||"saud").toLowerCase();
var NAMES={saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES={saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name=NAMES[who]||"الطالب";

/* ===== تسجيل جلسة المحادثة (بلاغ الأب ١ سبتمبر ٢٠٢٦: «كيف أتابع
   مستواهم بالمحادثة؟» — لم تكن الصفحة تحفظ أيّ شيء). نسجّل عند نهاية
   كل جلسة: الموضوع، عدد الجمل التي قالها، ومتوسط درجة نطقه (Azure)
   إن وُجدت. نفس جدول attempts المستعمل في بقية الصفحات. */
var SUPA_URL="https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY2="sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
/* بلاغ الأب (٢ سبتمبر ٢٠٢٦، صورة): «حسن مادخل نهائي بس طالع لي جلستين»
   و«باقي الأولاد متكلمين كثير بس التقرير يقول جملة وحدة». سببان:

   ١) تكرار: كنّا نحفظ عند visibilitychange (اختفاء التبويب) وأيضًا عند
      pagehide — كلاهما عبر AQ.post الذي يكتب الطلب محليًّا أوّلًا (تفاؤلًا)
      ثم يرسله، ولا يمسحه من الطابور المحلّي إلا بعد وصول ردّ الشبكة.
      لكنّ هذين الحدثين يُطلَقان أثناء إغلاق الصفحة فعليًّا، فغالبًا
      تُغلَق الصفحة (ويموت سياق الجافاسكربت) قبل أن يصل ردّ fetch — رغم
      أنّ keepalive يضمن وصول الطلب فعليًّا للخادم. فيبقى الطلب في
      الطابور المحلّي «كأنّه فشل»، ويُعاد إرساله تلقائيًّا لاحقًا (أوّل
      فتحةٍ لأيّ صفحة) فيتكرّر صفٌّ نجح فعلًا من قبل — وهذا بالضبط ما
      حصل لحسن: نفس الجلسة (نفس meta.at) بصفّين، فرقهما نحو ١٨ ساعة.

   ٢) نقص: state.saved كان قفلًا دائمًا — أوّل اختفاءٍ للتبويب (إشعارٌ
      عابر، قفل الشاشة، تبديل تطبيق) يحفظ الجلسة بعدد جملها إلى تلك
      اللحظة (غالبًا 1) ويقفلها نهائيًّا؛ فإن رجع الطفل لنفس المحادثة
      واستمرّ يتكلّم كثيرًا، كل ذلك الكلام الإضافي لا يُحفَظ أبدًا —
      لأنّ القفل لا يُفتح إلا ببدء موضوعٍ جديد. فيظهر للأب «جملة واحدة»
      فقط رغم أنّ ابنه تكلّم طويلًا.

   الحل: علامة رقمية (savedTurns) بدل القفل المنطقي — كل استدعاءٍ يحفظ
   الفرق (delta) منذ آخر حفظ فقط لا العدد كاملًا، فلا تكرار في المجموع
   حتى لو حُفظت الجلسة أكثر من مرّة. وحفظ اختفاء التبويب/إغلاقه تحديدًا
   يستخدم navigator.sendBeacon (لا AQ) لأنّ المتصفّح يضمن تسليمه فعليًّا
   أثناء إغلاق الصفحة دون حاجة لردّ جافاسكربت — فلا طابور محلّي يُعاد
   إرساله لاحقًا، ولا تكرار. Supabase يقبل apikey من الاستعلام مباشرةً
   (بلا ترويسة) — تأكّدنا منه فعليًّا بطلبٍ تجريبي قبل الاعتماد عليه. */
/* بلاغ الأب (٣ سبتمبر ٢٠٢٦): «حسن داخل محادثة اليوم بس ماطلع عندي» —
   وقاعدة البيانات تؤكّده: لا صفّ محادثةٍ لحسن اليوم إطلاقًا.
   والسبب في التوقيت لا في الإرسال: لم نكن نحفظ إلّا عند مغادرة الصفحة
   (pagehide/visibilitychange) أو الرجوع للمواضيع. فما دام الطفل في
   المحادثة فلا شيء محفوظ، وإن أُغلق التبويب إغلاقًا لا يوقظ هذين الحدثين،
   أو ماتت الشبكة في تلك اللحظة (sendBeacon يُرمى بلا إعادة محاولة)،
   ضاعت الجلسة كلّها بلا أثر — ولا يظهر للأب شيء.
   الحلّ: نحفظ بعد كلّ جملةٍ يقولها الطفل عبر AQ (طابورٌ محلّيٌّ يُعيد
   الإرسال عند فتح الصفحة القادم، ومختوم بـ cid فلا يتكرّر)، ويبقى
   sendBeacon عند الخروج للدفعة الأخيرة وحدها. */
function saveTalkSession(useBeacon){
  var turns = state.msgs.filter(function(m){ return m.role==="user"; }).length;
  var delta = turns - (state.savedTurns||0);
  /* ═══ جلسةٌ لم يُفهم فيها شيء كانت لا تترك أثرًا البتّة ═══
     بلاغ الأب (٨ سبتمبر ٢٠٢٦): حسن دخل «يومي» و«تعارف» وتحدّث، ولم
     يظهر في التقرير إلّا جمل «تعارف». والسبب أنّ الحفظ كان معلّقًا على
     delta<1: فإن تكلّم ولم تفهمه أزور فلا جملة جديدة، فلا صفّ، فالجلسة
     كأنّها لم تكن. فيقول الأب: أين ذهب وقته؟ ولا جواب عندنا.
     فصرنا نحفظ متى وُجد جديدٌ من أيّ نوع: جملةٌ فُهمت، أو محاولةٌ ضُغطت
     ولم تُفهم — فيُرى الفرق بين «ما تكلّم» و«تكلّم ولم يُفهم». */
  var attD = (state.att||0) - (state.savedAtt||0);
  var unhD = (state.unh||0) - (state.savedUnh||0);
  if(!state.topic) return;
  if(delta<1 && attD<1 && unhD<1) return;
  var scores = (state.pronScores||[]).filter(function(v){ return typeof v==="number"; });
  var avgPron = scores.length ? Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length) : null;
  /* نسبة صحّة الجملة (نحو ومعنى) — انظر applyCorrectness أعلاه؛ نفس أسلوب
     avgPron (متوسّطٌ تراكميٌّ للجلسة كلّها حتى لحظة الحفظ، لا الدفعة فقط)
     حتى يبقى الحقلان متّسقين في طريقة حسابهما. */
  var cf = state.correctFlags||[];
  var avgCorrect = cf.length ? Math.round(100*cf.filter(Boolean).length/cf.length) : null;
  var secs = state.sessionStart ? Math.round((Date.now()-state.sessionStart)/1000) : null;
  var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[],
    /* pronN و corrN: عدد الجمل التي بُني عليها كلّ متوسّط. بدونهما كانت
       التقارير تُساوي بين جلسةٍ فيها جملةٌ واحدة وجلسةٍ فيها أربع، فتظهر
       النسبة أقلّ (أو أعلى) ممّا هي. وهما تراكميّان للجلسة كلّها مثل
       المتوسّطين نفسيهما، لا للدفعة وحدها. */
    meta:{ kind:"talk", sid:state.sid, topic:TOPICS[state.topic].t, turns:delta, avgPron:avgPron, avgCorrect:avgCorrect,
      pronN:scores.length, corrN:cf.length,
      /* att: ضغطاتُ «تكلّم» في هذه الدفعة · unh: ما لم يُفهم منها */
      att:attD, unh:unhD,
      secs:secs, audioSec:(state.audioSec||0),
      avgConf:(state.confs.length? Math.round(100*state.confs.reduce(function(a,b){return a+b;},0)/state.confs.length)/100 : null),
      minConf:(state.confs.length? Math.min.apply(null,state.confs) : null) } };
  state.savedTurns = turns; state.savedAtt = (state.att||0); state.savedUnh = (state.unh||0);   // نُثبّت العلامات فورًا حتى لا يُعاد إرسال نفس الدفعة لو استُدعيت الدالة مرّتين بسرعة
  try{
    if(useBeacon && navigator.sendBeacon){
      body.meta.at = new Date().toISOString();
      var blob = new Blob([JSON.stringify(body)], { type:"application/json" });
      navigator.sendBeacon(SUPA_URL+"/rest/v1/attempts?apikey="+SUPA_KEY2, blob);
      return;
    }
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY2, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY2,"Authorization":"Bearer "+SUPA_KEY2,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body) });
  }catch(e){}
}

// ذكاء اصطناعي كامل عبر Edge Function (إن نُشرت). لو تعذّرت، نرجع للردود الموجّهة بالموضوع تلقائيًا.
var SUPA="https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_ANON="sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
var AI_ENDPOINT=SUPA+"/functions/v1/talk-ai";

function azureCreds(){ var A=window.AZURE_SPEECH||{}; var c=A[who]; if(c&&c.key&&c.region) return c; var d=A["default"]; return (d&&d.key&&d.region)?d:null; }
function azureConfigured(){ return !!azureCreds(); }

/* ===== المعلّم يتكلم (نطق عصبي) ===== */
function speakEN(text){ try{ speechSynthesis.cancel(); try{ speechSynthesis.resume(); }catch(e){} var u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.92; var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);})[0]; if(v)u.voice=v; speechSynthesis.speak(u);}catch(e){} }
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
var _tts=null;
function tutorSpeak(text){
  var cr=azureCreds();
  if(!cr||!window.SpeechSDK){ speakEN(text); return; }
  try{
    var SDK=window.SpeechSDK;
    try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ if(!window.__ac) window.__ac=new AC(); if(window.__ac.state==="suspended") window.__ac.resume(); } }catch(e){}
    if(_tts){ try{_tts.close();}catch(e){} _tts=null; }
    var sc=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    var synth=new SDK.SpeechSynthesizer(sc); _tts=synth;
    var esc=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
    var ssml='<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-GB"><voice name="en-GB-RyanNeural"><prosody rate="-8%">'+esc+'</prosody></voice></speak>';
    synth.speakSsmlAsync(ssml, function(){ try{synth.close();}catch(e){} if(_tts===synth)_tts=null; }, function(){ try{synth.close();}catch(e){} if(_tts===synth)_tts=null; speakEN(text); });
  }catch(e){ speakEN(text); }
}

/* ===== يسمع الطفل بحرية: تفريغ + تقييم نطق غير مقيّد ===== */
/* حدّ الثقة في تفريغ أزور (NBest[0].Confidence): دونه نعرض كلام الطفل ونحفظه
   ونكمل الحوار، لكن بلا درجة نطقٍ ولا حكمٍ على صحّة الجملة — فكلاهما محسوبٌ
   على التفريغ لا على الطفل. ولا يوجد حدٌّ نرمي عنده الدور: ذلك جرّبناه في ٣
   سبتمبر فأسكت الأولاد (انظر الشرح عند موضع الاستعمال). */
var CONF_SURE = 0.40;
/* الحدّ منخفضٌ عمدًا: حجب الدرجة عن طفلٍ نطق صحيحًا خسارةٌ أيضًا (الدرجة هي
   ما يشدّه للقسم)، والتفريغ المُشوَّش يمسكه garbled من talk-ai مستقلًّا عن
   الثقة. ونحن نخزّن avgConf/minConf مع كلّ جلسة، فبعد أيّامٍ نضبط هذا الرقم
   على توزيعٍ حقيقيٍّ من كلام أولادنا بدل التخمين. */
var EN_NAME={saud:"Saud",osama:"Osama",rafeef:"Rafeef",hasan:"Hassan"};
var PHRASES=["My name is","I am","I'm","I live in","I like","I don't like","I want to be",
 "I go to school","My favourite","My favorite","I have","I don't have","I play",
 "Yes I do","No I don't","Thank you","Nice to meet you",
 "Mohammed","Aldohayem","Saudi Arabia","Riyadh","Jeddah","Makkah","Madinah",
 "fourth grade","fifth grade","second intermediate","third intermediate",
 "football","mathematics","science","English","Arabic","engineer","doctor","teacher","pilot"];
var MIC_TAIL ='<div style="font-weight:400;font-size:.85rem;margin-top:6px">وتقدر تكمّل بقيّة الأسئلة عادي — تقييم النطق إضافةٌ لا شرط.</div>';
/* بلاغ الأب: «هذا حسن يتكلّم، أحيانًا يلقط وأحيانًا لا».
   عيبان اثنان كانا وراء ذلك:

   ١) حين ترجع أزور بلا كلامٍ مفهوم (NoMatch) كان الكود يمسح سطر الحالة
      ثمّ ينادي onDone بنصٍّ فارغ، والمُنادي يخرج صامتًا. فالطفل يتكلّم
      ويضغط، ثمّ لا يحدث شيءٌ إطلاقًا: لا ردّ ولا رسالة ولا سبب. وهذا هو
      «أحيانًا لا» — ليس المايك، بل غياب أيّ خبر. وقد كانت reading.html
      تعالج الحالة نفسها بإعادة محاولةٍ تلقائية ورسالةٍ واضحة، فنقلنا
      الأسلوب نفسه إلى هنا.

   ٢) مهلة الأمان عندنا ١٤ ثانية، وميزانية أزور نفسها ١٢ ثانية صمتًا
      أوّليًّا + ٢٫٢ للفصل = ١٤٫٢ — أي إنّ مؤقّتنا يسبقها فيقطع الجلسة
      ويقول «ما سمعتك» بينما الصوت التُقط فعلًا وهو في طريقه. صار صمت
      البدء ٨ ثوانٍ (خبرٌ أسرع للطفل)، والفصل ٣ ثوانٍ (الأطفال يتوقّفون
      وسط الجملة الإنجليزية)، ومهلتنا ٢٢ ثانية فلا تسابق أحدًا. */
function listen(statusEl, btn, onDone, tries){

     متى سمعت بدء كلام (sd)، كم نتيجةً جزئيّةً أرسلت (rz) وأوّلها (rz1)،
     ومتى ألغت (cx). فإن أخفق الدور عرفنا من الأرقام أين وقف: لا جلسة =
     الصوت لم يخرج من الجهاز · جلسةٌ بلا كلام = المسار صامت · كلامٌ ثمّ
     انقطاع = شبكة. وهذه ثلاثة أعطالٍ كانت تُسجَّل سطرًا واحدًا. */
  var _st={t0:0,ss:null,sp:null,sd:null,se:null,rz:0,rz1:null,part:null,cx:null,cxr:null,cxd:null,cn:null,dc:null,cnErr:null,full:"",usedPartial:null};
  var _conTries = 0;   /* مصافحاتُ القناة المُعادة صامتًا في هذا الدور */
  function _stage(){
    if(_st.ss==null) return "no-session";
    if(_st.rz===0 && _st.sd==null) return "session-no-audio";
    if(_st.cx!=null) return "canceled-after-speech";
    return "speech-no-result";
  }
  function _stageAr(){
    var s=_stage();
    return s==="no-session" ? "لم تُفتح جلسةٌ مع أزور أصلًا"
         : s==="session-no-audio" ? "فُتحت الجلسة ولم يصلها صوت"
         : s==="canceled-after-speech" ? "سمعت كلامًا ثمّ أُلغيت"
         : "سمعت كلامًا ولم تُرجع نتيجة";

  /* لم أسمع كلامًا مفهومًا: نعيد المحاولة مرّةً تلقائيًّا ثمّ نُفصح عن السبب.

     ولم يكن في الموقع سطرٌ يقرأ سبب إلغاء أزور، فكلّ إخفاقٍ يظهر للطفل
     «ما وضح كلامك» ولو كانت العلّة شبكةً أو مفتاحًا أو حصّةً نفدت — ولا
     يبقى منه أثر. فصرنا نحفظ السبب ونقوله صادقًا. */
  function saveMicFail(info){
    try{
      var e = (window.MIC && MIC.env) ? MIC.env() : {};
      var meta = { kind:"micfail", sect:"talk",
        why:(info&&info.reason)||null, code:(info&&info.code)||null,
        detail:(info&&info.detail)||null,
      res:(info&&info.res)||null, txt:(info&&info.txt), pa:(info&&info.pa),
        br:e.br, ios:e.ios, osv:e.osv, inApp:e.inApp, online:e.online, build:((window.MIC&&MIC.build)||null),
        stage:_stage(), ss:_st.ss, sd:_st.sd, rz:_st.rz, rz1:_st.rz1, part:_st.part,
        cx:_st.cx, cxr:_st.cxr, cxd:_st.cxd,
        cn:_st.cn, dc:_st.dc, cnErr:_st.cnErr, conTries:_conTries, usedPartial:_st.usedPartial };
      var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:meta };
      if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY2, body); return; }
      fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
        headers:{ "apikey":SUPA_KEY2,"Authorization":"Bearer "+SUPA_KEY2,"Content-Type":"application/json","Prefer":"return=minimal" },
        body: JSON.stringify(body) }).catch(function(){});
    }catch(err){}
  }
  function micFailMsg(info){
    var c = (info && info.code) || "";

      if(/Authentication|Forbidden/i.test(c)) return "❌ خدمة تقييم النطق رفضت الطلب (مفتاح الاشتراك). أخبر والدك — ما هي مشكلةٌ منك.";
      if(/TooManyRequests/i.test(c))          return "❌ خدمة تقييم النطق مشغولة الآن. انتظر دقيقة ثمّ أعد المحاولة.";
      if(/Connection|Timeout/i.test(c))       return "❌ انقطع الاتّصال بخدمة النطق. تأكّد من الإنترنت وأعد المحاولة — كلامك سليم.";
      return "❌ خدمة تقييم النطق توقّفت" + (c ? " ("+c+")" : "") + ". أعد المحاولة، وإن تكرّر فأخبر والدك.";
    }

       صوتُه الخدمةَ أصلًا فالعطل في الجهاز أو الشبكة لا في نطقه —
       ونقولها له صريحةً بدل أن يظنّ نفسه أخفق فيُعيد ويُعيد. */
    /* ولا نقولها من أوّل مرّة: انقطاعةٌ عابرةٌ في الشبكة تُصلحها إعادةٌ
       واحدةٌ صامتة. فإن أخفقت الثانية أيضًا فهو عطلٌ حقيقيّ يستحقّ الإفصاح.
       أمّا إن كانت القناة قد أُعيدت ثلاثًا (conDone) فقد كُفينا الإعادة. */
    if(tries >= 1 || (info && info.conDone)){
      if(info && (info.reason === "nosession" || c === "no-session"))
        return "❌ ما وصل صوتك للخدمة — والعلّة في الاتّصال أو المايك، مب في كلامك. "+
               "أغلق التبويب وافتح الصفحة من جديد، وإن تكرّر فأخبر والدك.";
      if(info && c === "session-no-audio")

  function notHeard(info){

      statusEl.style.color="var(--muted)";

        "ثمّ اضغط <b>🎤 اضغط وتكلّم</b> مرّةً ثانية.";
      state.unh = (state.unh||0) + 1;   /* تكلّم ولم يُفهم — يُعرض للأب */
      saveTalkSession();                /* فلا تبقى الجلسة بلا أثرٍ إن لم تُفهم ولا جملة */
      resetBtn();
    }
  }
  if(!cr){ statusEl.innerHTML="⚠️ لم يُضبط مفتاح Azure." + MIC_TAIL; resetBtn(); return; }
  /* كانت رسالة الانتظار تعود أبدًا إن لم تصل الأداة — انظر mic-help.js */
  if(!SDK){
    MIC.waitSDK(statusEl, btn, function(){ listen(statusEl, btn, onDone, tries); },
      function(){ statusEl.style.color="var(--bad)";
        statusEl.innerHTML="❌ ما قدرت أحمّل أداة تقييم النطق — غالبًا الإنترنت." + MIC_TAIL;

       الأسماء العربية وبدايات الجُمل. في صورة الأب سمعت أزور «not your name
       is mohammed hassan» بدل «my name is...». هذه القائمة ترجّح ما يُنتظر
       فعلًا من طفلٍ يجيب عن هذه الأسئلة — ولا تمنع غيره. */

       تُفتح جلسةٌ مع أزور خلال خمس عشرة ثانية، وذلك في الدور الأوّل

      var _pl=SDK.PhraseListGrammar.fromRecognizer(rec);

       صفوف ٦ سبتمبر كلّها «مهلة ٢٢ث بلا ردٍّ من أزور» — وهذا أسوأ سببٍ
       يمكن أن يُسجَّل: يقول إنّ شيئًا لم يعد، ولا يقول أين وقف. وبينها
       فروقٌ حاسمة: هل فُتحت الجلسة مع أزور أصلًا؟ هل وصلها صوت؟ هل

           إنّ أزور كانت تسمعه وتُرسل خمس عشرة نتيجةً جزئيّة — ونحن

  }catch(e){ statusEl.textContent="خطأ: "+(e.message||e); if(btn){btn.disabled=false;btn.classList.remove("rec");} return; }
  if(btn){ btn.classList.add("rec"); btn.textContent="🔴 أستمع لك... تكلّم"; }

  function _live(t){
    statusEl.style.color="var(--muted)";
    statusEl.innerHTML='<span style="opacity:.75">🎙️ أسمعك:</span> '+
      '<span class="en" style="font-weight:800">'+String(t).replace(/[<>&]/g,"")+'</span>'+
      '<button data-stoptalk class="say small" style="display:block;margin:8px auto 0;background:#dc2626;'+
      'border-color:#dc2626;color:#fff;font-family:inherit;border-radius:12px;padding:8px 14px;'+
      'font-weight:800;cursor:pointer;border:1px solid">✅ خلّصت</button>';
    var sb=statusEl.querySelector("[data-stoptalk]");
    if(sb) sb.addEventListener("click", function(){ _usePartial("ضغط «خلّصت»"); });
  }
  /* ما سمعته أزور خيرٌ من لا شيء: صفوفُ سعود فيها سبع عشرة نتيجةً

       ss=700 · sd=5700  · rz=2  →  قُتل عند ٢٢ث

         ومحاولةٌ ثانيةٌ بقناةٍ جديدة تنجح غالبًا. وكنّا نُري الطفل
         شاشةً حمراء تقول «أغلق التبويب» من أوّل تعثّر — وهي نصيحةٌ

      if(_st.ss==null && _conTries<2){

      }
      MIC.releaseSoon(45000);
      /* conDone: استُنفدت محاولات القناة الثلاث. فلا تُعاد المحاولة
         الصامتة الأخرى فوقها — وإلّا صارت ستّ محاولاتٍ وستّون ثانية
         قبل أن يُقال للطفل شيء، وهو ما أظهره الاختبار. */
      notHeard({ reason:(_st.ss==null?"nosession":"timeout"), code:_stage(),
                 conDone:(_st.ss==null),
                 detail:why+" — "+_stageAr()+" · محاولات القناة: "+(_conTries+1) }); }, ms);
  }
  /* عشر ثوانٍ للمصافحة، لأنّ ما بعدها إعادةٌ صامتةٌ لا إخفاق. وحين
     تنجح تُفتح الجلسة في أقلّ من ثانية (ss=646 في صفوف سعود). */
  _arm(10000, "لم تُفتح جلسةُ أزور خلال ١٠ث");
  /* وكلُّ إشارةٍ من أزور تُجدّد المهلة: فتحُ الجلسة، بدءُ الكلام،
     وكلُّ نتيجةٍ جزئيّة. فالعدّاد يقيس صمتَ الخدمة لا صمتَ الطفل. */
  _st.onLife=function(kind){
    if(fin) return;
    /* ٣٠ث بعد فتح الجلسة لا أكثر: أزور نفسها تُرجع «ما سمعت» بعد ٢٠ث
       من الصمت الأوّل، فإن مضت ثلاثون بلا حرفٍ منها فهي ميّتة قطعًا.
       وهذه المهلة لا تقطع تعرّفًا حيًّا أبدًا — أوّل ما يتكلّم الطفل
       يصل speechStartDetected فتُجدَّد المهلة من جديد. */
    if(kind==="ss")      _arm(30000, "فُتحت الجلسة ثمّ صمتت الخدمة ٣٠ث");
    else if(kind==="sd") _arm(15000, "سمعت بدء الكلام ثمّ صمتت الخدمة ١٥ث");
    /* ثماني ثوانٍ بعد آخر نتيجةٍ جزئيّة تكفي للحكم: الفاصلُ المضبوط
       ثانيةٌ ونصف، فصمتُ ثمانٍ يعني أنّ أزور تعلّقت. ومعنا نصُّه
       فنمضي به فورًا — لا ننتظر خمسًا وعشرين ثانيةً بلا فائدة. */
    else                 _arm(8000,  "وصلت نتائجُ جزئيّة ثمّ صمتت الخدمة ٨ث");
  };
  rec.recognizeOnceAsync(function(result){
    if(fin)return; fin=true; if(to){clearTimeout(to);to=null;}
    var out={text:"",wordsHtml:"",pron:null,conf:null,shaky:false,audioSec:0};
    try{
      if(result && result.reason===SDK.ResultReason.RecognizedSpeech && (result.text||"").trim()){
        out.text=result.text.trim();
        /* ثواني الصوت كما تعدّها أزور — لقياس استهلاك الحصّة المجانية (٥ ساعات
           شهريًّا) عبر الأولاد الأربعة والصفحات كلّها، لا بالتخمين. */
        if(typeof result.duration==="number") out.audioSec = Math.round(result.duration/1e7);
        /* بلاغ الأب (٣ سبتمبر ٢٠٢٦) بصورة شاشة أسامة: فُرِّغ كلامه
           «are you games will play football» ويقول «أنا ما نطقت will»،
           ومعها «نطقك ٩٨/١٠٠» و«✅ جملة صحيحة».
           والسبب أنّ التقييم هنا بلا نصٍّ مرجعيّ (PronunciationAssessmentConfig("")),
           فأزور تقيس نطقه على «ما ظنّت أنّه قاله» — قياسٌ دائريّ: أيّ تفريغٍ
           تخرج به تُعطيه درجةً عالية، فتظهر ٩٨/١٠٠ على كلامٍ مُشوَّش.
           فصرنا نقرأ ثقة أزور في التفريغ نفسه (NBest[0].Confidence):
           دونها لا معنى لأيّ درجة، ولا يصحّ أن نُثبّت على الطفل كلامًا لم يقله. */
        try{
          var _j = JSON.parse(result.json || (result.properties && result.properties.getProperty(SDK.PropertyId.SpeechServiceResponse_JsonResult)) || "{}");
          var _nb = (_j.NBest && _j.NBest[0]) || null;
          if(_nb && typeof _nb.Confidence==="number") out.conf=_nb.Confidence;
        }catch(e){}
        try{
          var r=SDK.PronunciationAssessmentResult.fromResult(result);
          if(typeof r.pronunciationScore==="number" && !isNaN(r.pronunciationScore)) out.pron=Math.round(r.pronunciationScore);
          var ws=(r.detailResult&&r.detailResult.Words)||[];
          if(ws.length){ out.wordsHtml=ws.map(function(w){ var a=w.PronunciationAssessment||{}; var sc=(typeof a.AccuracyScore==="number")?a.AccuracyScore:100; var wc=(sc>=80?"var(--good)":sc>=60?"var(--warn)":"var(--bad)"); return '<span style="color:'+wc+'">'+w.Word+'</span>'; }).join(' '); }
        }catch(e){}
      }
    }catch(e){}
    try{rec.close();}catch(e){} MIC.releaseSoon(45000);
    /* لا نصّ = لم تفهم أزور شيئًا. لا نخرج صامتين: إمّا إعادةٌ تلقائية أو سببٌ واضح. */
    if(!out.text){ var _w=null; try{ _w=MIC.why(SDK, result, null); }catch(e){} notHeard(_w); return; }
    /* بلاغ الأب (٤ سبتمبر ٢٠٢٦): «حتى المحادثة يتكلّم ولا ينحفظ ثمّ يقول سجّل
       مرّة أخرى» — وقاعدة البيانات خالية: صفر جلسة محادثة اليوم.
       والسبب أنا: أضفتُ أمس بوّابةً ترمي التفريغ كلّه إن نزلت ثقة أزور عن
       ٠٫٤٥ فتطلب الإعادة. وثقة أزور تنخفض طبيعيًّا في كلام الأطفال العرب
       بالإنجليزية، فصار الطفل يتكلّم فلا يظهر شيء ولا يُحفظ شيء ويُطلب منه
       أن يعيد بلا نهاية — وهي عين الشكوى التي بدأ منها هذا كلّه، ضاعفتُها
       من حيث أردتُ علاجها.
       والصواب أنّ الكفّتين غير متساويتين: أن نعرض تفريغًا فيه خطأ أهون
       بكثيرٍ من أن نبتلع كلام الطفل ونطالبه بالإعادة. فلا نرمي دورًا أبدًا:
       يُعرض ويُحفظ ويستمرّ الحوار. والثقة المتدنّية تمنع الدرجة والحكم
       النحويّ فقط — لا الكلام نفسه. والتفريغ المُشوَّش يمسكه garbled من
       talk-ai (مُختبَرٌ حيًّا) لا حجب الدور. */
    if(out.conf!=null && out.conf < CONF_SURE){ out.shaky=true; out.pron=null; out.wordsHtml=""; }
    resetBtn();
    statusEl.textContent="";
    onDone(out);
  }, function(err){ if(fin)return; fin=true; if(to){clearTimeout(to);to=null;} var _w=null; try{ _w=MIC.why(SDK, null, err); }catch(e){} saveMicFail(_w); MIC.fail(statusEl, btn, { tail:MIC_TAIL, reset:resetBtn }); try{rec.close();}catch(e){} MIC.releaseSoon(45000); });
  }
}

  [/draw|paint/,"You're creative!"],

];
var GENERIC=["Nice!","That's interesting!","Great job!","Well said!","Cool!","I see!","Awesome!","Good!"];
function reactTo(text){ var t=(" "+text+" ").toLowerCase(); for(var i=0;i<REACT.length;i++){ if(REACT[i][0].test(t)) return REACT[i][1]; } return GENERIC[Math.floor(Math.random()*GENERIC.length)]; }

var app=document.getElementById("app");
/* att: كم مرّةً ضغط «تكلّم» فعلًا · unh: كم مرّةً تكلّم ولم يُفهم كلامه.
   بلاغ الأب (٨ سبتمبر ٢٠٢٦): «حسن يقول جلست ٨ دقايق وتحدّثت كثيرًا، لكن
   ما طلع لي إلّا ٥ جمل». وكان التقرير عاجزًا عن تفسير ذلك: لا يعرض إلّا
   الجمل التي فُهمت، فالمحاولة التي لم تُفهم لا أثر لها البتّة. فصرنا
   نعدّها ونعرضها، ليُرى الفرق بين «ما تكلّم» و«تكلّم ولم يُفهم». */
var state={topic:null,qi:0,chatHtml:"",msgs:[],pronScores:[],correctFlags:[],turnSeq:0,sessionStart:null,savedTurns:0,sid:null,shakyTurns:{},turnPron:{},audioSec:0,confs:[],att:0,unh:0,savedAtt:0,savedUnh:0};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderHome(){
  saveTalkSession();
  state.topic=null;
  var cards=LIST.map(function(id){ var s=TOPICS[id]; return '<button class="scn'+(id==="free"?" free":"")+'" data-t="'+id+'"><span class="e">'+s.ico+'</span><span class="t">'+s.t+'</span></button>'; }).join("");
  app.innerHTML=
    '<header class="top"><p class="eyebrow">محادثة إنجليزية · تكلّم بحرية 🎙️</p><h1>تحدّث معي — '+name+'</h1></header>'+
    '<div class="bar"><a href="home.html?who='+who+'">⬅ الرئيسية</a></div>'+
    '<div class="intro">اختر موضوعًا، وأنا أبدأ أسألك بالصوت 🔊 — <b>وأنت تردّ بكلامك أنت</b> (مب تقرأ). أسمعك وأردّ عليك وأكمّل الحوار، وأقيّم نطقك بالألوان.'+(MIC.inAppBrowser()?' <b>أنت داخل متصفّح تطبيق — اضغط «···» ثمّ «فتح في Safari» ليعمل المايك.</b>':'')+'</div>'+
    '<div class="grid">'+cards+'</div>'+
    '<footer>كلامك يُفرَّغ ويُقيَّم عبر Azure · الردود موجّهة بالموضوع</footer>';
  app.querySelectorAll("[data-t]").forEach(function(b){ b.addEventListener("click",function(){ startTopic(b.getAttribute("data-t")); }); });
}

function startTopic(id){
  saveTalkSession(); // لو كان في جلسةٍ سابقة جارية، سجّلها قبل بدء جلسة جديدة
  state.topic=id; state.qi=0; state.chatHtml=""; state.msgs=[]; state.pronScores=[]; state.correctFlags=[]; state.turnSeq=0; state.sessionStart=Date.now(); state.savedTurns=0; state.shakyTurns={}; state.turnPron={}; state.audioSec=0; state.confs=[]; state.att=0; state.unh=0; state.savedAtt=0; state.savedUnh=0;
  /* معرّف الجلسة: صرنا نحفظ بعد كلّ جملة (لا عند الخروج وحده)، فتصير الجلسة
     الواحدة عدّة صفوف. التقارير تجمعها بهذا المعرّف فيبقى عدد الجلسات صحيحًا. */
  state.sid = String(Date.now())+"_"+Math.random().toString(36).slice(2,8);
  var s=TOPICS[id];
  render();
  addAI(s.open, true);
  state.msgs.push({role:"model", content:s.open});
}

function render(){
  var s=TOPICS[state.topic];
  app.innerHTML=
    '<header class="top"><p class="eyebrow">'+s.ico+' '+s.t+'</p><h1>تحدّث معي — '+name+'</h1></header>'+
    '<div class="bar"><button data-back>⬅ المواضيع</button></div>'+
    '<div class="chat" id="chat">'+state.chatHtml+'</div>'+
    '<div class="dock"><div class="status" id="st"></div>'+
      '<button class="micbtn" id="mic">🎤 اضغط وتكلّم</button>'+
      '<div class="row2"><button data-repeat>🔁 أعد سؤالي</button><button data-skip>تخطَّ ➡️</button></div>'+
    '</div>'+
    '<footer>تكلّم بجملة كاملة · اضغط 🔁 لتسمع سؤالي ثانية</footer>';
  app.querySelector("[data-back]").addEventListener("click", renderHome);
  app.querySelector("#mic").addEventListener("click", onMic);
  app.querySelector("[data-repeat]").addEventListener("click", function(){ if(state.lastAI) tutorSpeak(state.lastAI); });
  app.querySelector("[data-skip]").addEventListener("click", nextTutor);
}
function scrollDown(){ var c=document.getElementById("chat"); if(c) window.scrollTo(0, document.body.scrollHeight); }

function addAI(text, speak){
  state.lastAI=text;
  state.chatHtml+='<div class="b ai"><span class="av">🧑‍🏫</span><div class="bub"><div class="en">'+esc(text)+'</div><button class="rep" data-rep="'+encodeURIComponent(text)+'">🔊 استمع</button></div></div>';
  var c=document.getElementById("chat"); if(c){ c.innerHTML=state.chatHtml; c.querySelectorAll("[data-rep]").forEach(function(b){ b.addEventListener("click",function(){ tutorSpeak(decodeURIComponent(b.getAttribute("data-rep"))); }); }); }
  if(speak) tutorSpeak(text);
  scrollDown();
}
function addMe(out){
  var tid = ++state.turnSeq;
  /* نحفظ موضع درجة هذا الدور في المصفوفة: إن تبيّن بعد ردّ الذكاء أنّ التفريغ
     مُشوَّش سحبناها، فلا تُحتسب درجةٌ على كلامٍ ليس كلام الطفل. */
  if(out.pron!=null){ state.turnPron[tid]=state.pronScores.length; state.pronScores.push(out.pron); }
  state.audioSec = (state.audioSec||0) + (out.audioSec||0);
  /* نجمع ثقة أزور الفعليّة لنضبط الحدّ لاحقًا على أرقامٍ حقيقية من كلام
     أولادنا أنفسهم، لا على تخمينٍ مثل الذي أوقعنا في بلاغ ٤ سبتمبر. */
  if(typeof out.conf==="number") state.confs.push(out.conf);
  if(out.shaky) state.shakyTurns[tid]=1;   // لا حكمَ على صحّة جملةٍ لم نتأكّد أنّنا سمعناها
  var body = out.wordsHtml ? ('<div class="en">'+out.wordsHtml+'</div>') : ('<div class="en">'+esc(out.text)+'</div>');
  /* التفريغ المشكوك فيه يُقال للطفل صراحةً إنّه «ما سمعه الجهاز» لا حكمٌ عليه.
     أسامة رأى كلامًا لم يقله ومعه ٩٨/١٠٠ فظنّ الموقع يكذب عليه — وكان محقًّا. */
  if(out.shaky) body += '<div class="sc" style="color:var(--warn)">🎧 هذا اللي سمعه الجهاز، وما هو متأكّد منه — إن ما كان كلامك اضغط 🎤 وأعده أوضح.</div>';
  var sc = (out.pron!=null) ? ('<div class="sc" id="sc-'+tid+'">🗣️ نطقك: '+out.pron+'/100 · 🟢🟡🔴</div>') : '';
  /* حاوية فارغة لتقييم «صحة الجملة» — تُملأ لاحقًا في applyCorrectness()
     حين يصل ردّ talk-ai (يصل مع الردّ نفسه لا بطلبٍ منفصل)؛ فارغة يعني
     ما وصل تقييمٌ بعد (لا زال يفكّر، أو رجع للردّ الاحتياطي بلا تقييم). */
  var cor = '<div class="cor" id="cor-'+tid+'"></div>';
  state.chatHtml+='<div class="b me"><span class="av">🧒</span><div class="bub">'+body+sc+cor+'</div></div>';
  var c=document.getElementById("chat"); if(c) c.innerHTML=state.chatHtml;
  scrollDown();
  return tid;
}
/* بلاغ الأب (٢ سبتمبر ٢٠٢٦): «هل يطلع لي نسبة صحة الجملة؟» — لا، ما كان
   موجودًا؛ التقييم السابق صوتيٌّ بحت (نطق). أضفنا تقييم صحة الجملة
   (نحو ومعنى) عبر نفس نموذج talk-ai — يُرجعه مع الردّ نفسه (انظر
   supabase/functions/talk-ai). هذي الدالة تملأ حاوية الجملة الموافقة
   بالنتيجة، وتُسجّلها في state.correctFlags ليُحسب متوسّطها عند الحفظ. */
/* يوسم الدور بأنّ تفريغه غير موثوق، ويكتب للطفل السبب بصراحة.
   يُنادى من مكانين: ثقةٌ متدنّية من أزور، أو garbled من talk-ai. */
function markShaky(tid){
  if(state.shakyTurns[tid]) return;
  state.shakyTurns[tid]=1;
  /* ٩٨/١٠٠ على كلامٍ مقلوب هو نفس ما اشتكى منه الأب: التقييم بلا نصٍّ مرجعيّ
     يقيس النطق على ما ظنّته أزور، فإن كان الظنّ خطأً فالدرجة بلا معنى. */
  var pi=state.turnPron[tid];
  if(pi!=null) state.pronScores[pi]=null;
  var sel=document.getElementById("sc-"+tid); if(sel) sel.parentNode.removeChild(sel);
  var el=document.getElementById("cor-"+tid);
  if(el){
    el.className="cor";
    el.style.color="var(--warn)";
    el.innerHTML="🎧 التفريغ مو واضح — يمكن الجهاز ما سمعك صح. أعد جملتك أوضح ولا نحاسبك عليها.";
    var c=document.getElementById("chat"); if(c) state.chatHtml=c.innerHTML;
  }
}
function applyCorrectness(tid, correct, fixed){
  if(correct==null) return;   // لا تقييم (الردّ الاحتياطي، أو النموذج لم يلتزم بصيغة الإخراج)
  /* تفريغٌ لم نتأكّد منه لا يُحكم على نحوه: الحكم سيكون على كلام الجهاز لا كلام
     الطفل — وهو الذي أظهر «✅ جملة صحيحة» على «are you games will play football». */
  if(state.shakyTurns && state.shakyTurns[tid]) return;
  state.correctFlags.push(!!correct);
  var el = document.getElementById("cor-"+tid);
  if(!el) return;
  el.className = "cor " + (correct ? "ok" : "no");
  el.innerHTML = correct ? "✅ جملة صحيحة" : ("💡 الأصح: "+esc(fixed||""));
  var c=document.getElementById("chat"); if(c) state.chatHtml = c.innerHTML;
}

function onMic(){
  var st=document.getElementById("st"), mic=document.getElementById("mic");
  mic.disabled=true;
  listen(st, mic, function(out){
    if(!out.text){ return; } // احتياط: listen لم تعد تنادينا بنصٍّ فارغ، بل تتولّى الرسالة والإعادة
    var tid = addMe(out);
    aiTurn(out.text, tid);
  });
}
// ذكاء كامل: نرسل تاريخ الحوار للسيرفر ونأخذ ردًّا طبيعيًا (مع تقييم صحّة جملة الطفل). لو فشل → ردّ موجّه بالموضوع (احتياطي، بلا تقييم)
function aiTurn(childText, tid){
  state.msgs.push({role:"user", content:childText});
  var st=document.getElementById("st"); if(st){ st.style.color="var(--muted)"; st.textContent="🤔 يفكّر بالرد..."; }
  /* talk-ai صار يجرّب حتى مزوّدين (Gemini بمحاولتين، ثمّ OpenAI ملاذًا
     أخيرًا إن وُجد مفتاحه) قبل أن يستسلم — وكل محاولة Gemini فاشلة
     استغرقت نحو ١٠ ثوانٍ في القياس الفعليّ. رفعنا مهلة الانتظار هنا
     لتتّسع للسيناريو الأسوأ (محاولتا Gemini + OpenAI)، وإلّا استسلم
     العميل للردّ الآلي قبل أن تصل محاولات السيرفر لفرصتها الأخيرة. */
  var done=false, tmo=setTimeout(function(){ if(done)return; done=true; if(st)st.textContent=""; replyThenAsk(childText); }, 28000);
  fetch(AI_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPA_ANON,"apikey":SUPA_ANON},
    body: JSON.stringify({ messages: state.msgs.slice(-14), child: name, topic: TOPICS[state.topic].t }) })
   .then(function(r){ if(!r.ok) throw 0; return r.json(); })
   .then(function(d){ if(done)return; done=true; clearTimeout(tmo); var reply=(d&&d.reply||"").trim(); if(!reply) throw 0; if(st)st.textContent=""; state.msgs.push({role:"model", content:reply}); addAI(reply, true);
     /* garbled من talk-ai: النموذج نفسه يقول «هذا خطأ تفريغٍ لا خطأ الطفل».
        نعامله كالثقة المتدنّية: لا حكمَ نحويًّا ولا حساب في نسبة صحّة الجملة. */
     if(d && d.garbled === true){ markShaky(tid); }
     applyCorrectness(tid, (d && typeof d.correct==="boolean") ? d.correct : null, d && d.fixed); saveTalkSession(); })
   .catch(function(){ if(done)return; done=true; clearTimeout(tmo); if(st)st.textContent=""; replyThenAsk(childText); saveTalkSession(); });
}
function replyThenAsk(childText){
  var s=TOPICS[state.topic];
  var react=reactTo(childText);
  if(state.qi < s.qs.length){
    addAI(react+" "+s.qs[state.qi], true);
    state.qi++;
  } else {
    addAI(react+" You did great, "+name+"! Let's talk again soon. 🎉", true);
  }
}
function nextTutor(){ // تخطّي: ينتقل للسؤال التالي بلا رد
  var s=TOPICS[state.topic];
  if(state.qi < s.qs.length){ addAI(s.qs[state.qi], true); state.qi++; }
  else { addAI("You did great, "+name+"! Let's talk again soon. 🎉", true); }
}

renderHome();
document.addEventListener("visibilitychange", function(){ if(document.hidden) saveTalkSession(true); });
window.addEventListener("pagehide", function(){ saveTalkSession(true); });
</script>
