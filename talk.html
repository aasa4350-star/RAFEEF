<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>محادثة إنجليزية</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<script src="azure-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --npc:#eef1f6; --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;--npc:#1b2431;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:20px 22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.42rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a,.bar button{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
  .en{direction:ltr;unicode-bidi:isolate}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:6px}
  .scn{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:var(--shadow);cursor:pointer;text-align:right;font-family:inherit;color:var(--ink)}
  .scn:hover{border-color:var(--accent)}
  .scn .e{font-size:1.7rem;flex:none}
  .scn .t{font-weight:800;font-size:1.02rem;line-height:1.3}
  .scn.free{grid-column:1 / -1;background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:0}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:6px 0 14px;box-shadow:var(--shadow);font-size:.94rem}

  /* Chat */
  .chat{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
  .b{display:flex;gap:9px;align-items:flex-start;max-width:100%}
  .b.me{flex-direction:row-reverse}
  .b .av{flex:none;font-size:1.5rem;margin-top:2px}
  .b .bub{border-radius:16px;padding:10px 14px;max-width:82%;box-shadow:var(--shadow)}
  .b.ai .bub{background:var(--npc);border:1px solid var(--line);border-bottom-right-radius:5px}
  .b.me .bub{background:var(--good-bg);border:1px solid var(--good);border-bottom-left-radius:5px}
  .b .bub .en{font-size:1.12rem;font-weight:700}
  .b .bub .sc{font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:600}
  .b .bub .rep{background:transparent;border:0;color:var(--accent);font-weight:800;cursor:pointer;font-size:.85rem;padding:4px 0 0;font-family:inherit}
  .thinking{color:var(--muted);font-style:normal}

  /* Mic dock */
  .dock{position:sticky;bottom:0;padding:14px 0 6px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
  .status{text-align:center;font-weight:700;font-size:.92rem;min-height:22px;margin-bottom:10px}
  .micbtn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:16px;padding:16px;font-size:1.12rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .micbtn:disabled{opacity:.55}
  .micbtn.rec{background:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(.98)}}
  .row2{display:flex;gap:9px;margin-top:9px}
  .row2 button{flex:1;background:transparent;border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:11px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who=(qs("who")||"saud").toLowerCase();
var NAMES={saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var name=NAMES[who]||"الطالب";

// ذكاء اصطناعي كامل عبر Edge Function (إن نُشرت). لو تعذّرت، نرجع للردود الموجّهة بالموضوع تلقائيًا.
var SUPA="https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_ANON="sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
var AI_ENDPOINT=SUPA+"/functions/v1/talk-ai";

function azureCreds(){ var A=window.AZURE_SPEECH||{}; var c=A[who]; if(c&&c.key&&c.region) return c; var d=A["default"]; return (d&&d.key&&d.region)?d:null; }
function azureConfigured(){ return !!azureCreds(); }

/* ===== المعلّم يتكلم (نطق عصبي) ===== */
function speakEN(text){ try{ speechSynthesis.cancel(); try{ speechSynthesis.resume(); }catch(e){} var u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.92; var v=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);})[0]; if(v)u.voice=v; speechSynthesis.speak(u);}catch(e){} }
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
var _tts=null;
function tutorSpeak(text){
  var cr=azureCreds();
  if(!cr||!window.SpeechSDK){ speakEN(text); return; }
  try{
    var SDK=window.SpeechSDK;
    try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ if(!window.__ac) window.__ac=new AC(); if(window.__ac.state==="suspended") window.__ac.resume(); } }catch(e){}
    if(_tts){ try{_tts.close();}catch(e){} _tts=null; }
    var sc=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    var synth=new SDK.SpeechSynthesizer(sc); _tts=synth;
    var esc=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
    var ssml='<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-US"><voice name="en-US-AvaMultilingualNeural"><prosody rate="-8%">'+esc+'</prosody></voice></speak>';
    synth.speakSsmlAsync(ssml, function(){ try{synth.close();}catch(e){} if(_tts===synth)_tts=null; }, function(){ try{synth.close();}catch(e){} if(_tts===synth)_tts=null; speakEN(text); });
  }catch(e){ speakEN(text); }
}

/* ===== يسمع الطفل بحرية: تفريغ + تقييم نطق غير مقيّد ===== */
function listen(statusEl, btn, onDone){
  var SDK=window.SpeechSDK, cr=azureCreds(), cfg, audio, rec;
  if(!cr){ statusEl.textContent="⚠️ لم يُضبط مفتاح Azure."; return; }
  if(!SDK){ statusEl.textContent="⏳ جارٍ تحميل أداة النطق..."; return; }
  try{ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ if(!window.__ac) window.__ac=new AC(); if(window.__ac.state==="suspended") window.__ac.resume(); } }catch(e){}
  try{
    cfg=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    cfg.speechRecognitionLanguage="en-US";
    try{ cfg.setProperty(SDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs,"12000"); cfg.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs,"2200"); }catch(e){}
    audio=SDK.AudioConfig.fromDefaultMicrophoneInput();
    rec=new SDK.SpeechRecognizer(cfg, audio);
    try{ var pa=new SDK.PronunciationAssessmentConfig("", SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, false); pa.applyTo(rec); }catch(e){}
  }catch(e){ statusEl.textContent="خطأ: "+(e.message||e); if(btn){btn.disabled=false;btn.classList.remove("rec");} return; }
  if(btn){ btn.classList.add("rec"); btn.textContent="🔴 أستمع لك... تكلّم"; }
  statusEl.style.color="var(--muted)"; statusEl.textContent="🎙️ تكلّم الآن بالإنجليزي...";
  var fin=false;
  var to=setTimeout(function(){ if(fin)return; fin=true; statusEl.style.color="var(--bad)"; statusEl.innerHTML="⚠️ ما سمعتك — على الآيفون افتح من <b>Safari</b>، واضغط وتكلّم أعلى."; if(btn){btn.disabled=false;btn.classList.remove("rec");btn.textContent="🎤 اضغط وتكلّم";} try{rec.close();}catch(e){} }, 14000);
  rec.recognizeOnceAsync(function(result){
    if(fin)return; fin=true; clearTimeout(to);
    var out={text:"",wordsHtml:"",pron:null};
    try{
      if(result && result.reason===SDK.ResultReason.RecognizedSpeech && (result.text||"").trim()){
        out.text=result.text.trim();
        try{
          var r=SDK.PronunciationAssessmentResult.fromResult(result);
          if(typeof r.pronunciationScore==="number" && !isNaN(r.pronunciationScore)) out.pron=Math.round(r.pronunciationScore);
          var ws=(r.detailResult&&r.detailResult.Words)||[];
          if(ws.length){ out.wordsHtml=ws.map(function(w){ var a=w.PronunciationAssessment||{}; var sc=(typeof a.AccuracyScore==="number")?a.AccuracyScore:100; var wc=(sc>=80?"var(--good)":sc>=60?"var(--warn)":"var(--bad)"); return '<span style="color:'+wc+'">'+w.Word+'</span>'; }).join(' '); }
        }catch(e){}
      }
    }catch(e){}
    if(btn){ btn.disabled=false; btn.classList.remove("rec"); btn.textContent="🎤 اضغط وتكلّم"; }
    statusEl.textContent="";
    try{rec.close();}catch(e){}
    onDone(out);
  }, function(err){ if(fin)return; fin=true; clearTimeout(to); statusEl.style.color="var(--bad)"; statusEl.innerHTML="❌ تعذّر المايكروفون — افتح من <b>Safari</b> مباشرة."; if(btn){btn.disabled=false;btn.classList.remove("rec");btn.textContent="🎤 اضغط وتكلّم";} try{rec.close();}catch(e){} });
}

/* ===== مواضيع الحوار ===== */
var TOPICS={
  free:{ico:"💬",t:"دردشة حرة",open:"Hi! I'm your English friend. How are you today?",qs:["What is your name?","What did you do today?","What do you like to do for fun?","Tell me about your family.","What do you want to be when you grow up?"]},
  meet:{ico:"👋",t:"تعارف",open:"Hello! Nice to meet you. What's your name?",qs:["How old are you?","Where do you live?","What grade are you in?","What is your favorite subject?"]},
  family:{ico:"👨‍👩‍👧",t:"العائلة",open:"Let's talk about your family. How many people are in your family?",qs:["Do you have brothers or sisters?","What does your father do?","What do you like to do together?","Who do you love the most?"]},
  hobby:{ico:"⚽",t:"الهوايات",open:"What do you like to do in your free time?",qs:["Do you play any sports?","What is your favorite game?","Do you like reading or watching TV?","What do you do on the weekend?"]},
  school:{ico:"🏫",t:"المدرسة",open:"Let's talk about school. Do you like school?",qs:["What is your favorite subject?","Who is your favorite teacher?","What do you do at break time?","Is English easy for you?"]},
  food:{ico:"🍕",t:"الأكل",open:"Let's talk about food. What is your favorite food?",qs:["Do you like fruit?","What do you eat for breakfast?","Can you cook anything?","Do you like sweets?"]},
  day:{ico:"🌤️",t:"يومي",open:"Tell me about your day. What time do you wake up?",qs:["What do you do in the morning?","How do you go to school?","What do you do after school?","What time do you sleep?"]},
  dream:{ico:"🌟",t:"أحلامي",open:"Let's dream big! What do you want to be in the future?",qs:["Why do you want that?","Where do you want to travel?","What is your biggest wish?","What makes you happy?"]}
};
var LIST=["free","meet","family","hobby","school","food","day","dream"];

// ردود المعلّم حسب كلمات الطفل
var REACT=[
  [/foot ?ball|soccer|messi|ronaldo/,"Football is exciting!"],
  [/read|book/,"Reading is a wonderful habit!"],
  [/doctor/,"A doctor helps people — a great goal!"],
  [/teacher/,"Teaching is a noble job!"],
  [/engineer/,"Engineering is very cool!"],
  [/pilot|plane/,"A pilot — the sky is yours!"],
  [/game|playstation|video|xbox/,"Games are fun in moderation!"],
  [/mother|mom|father|dad|family|brother|sister/,"Family is precious!"],
  [/science|math|english|art|history/,"That's a great subject!"],
  [/pizza|burger|rice|chicken|fruit|apple|banana/,"Yummy! Good choice!"],
  [/swim/,"Swimming is great exercise!"],
  [/draw|paint/,"You're creative!"],
  [/happy|good|fine|great|awesome|nice/,"I'm glad to hear that!"],
  [/football|game|play/,"Sounds fun!"]
];
var GENERIC=["Nice!","That's interesting!","Great job!","Well said!","Cool!","I see!","Awesome!","Good!"];
function reactTo(text){ var t=(" "+text+" ").toLowerCase(); for(var i=0;i<REACT.length;i++){ if(REACT[i][0].test(t)) return REACT[i][1]; } return GENERIC[Math.floor(Math.random()*GENERIC.length)]; }

var app=document.getElementById("app");
var state={topic:null,qi:0,chatHtml:"",msgs:[]};
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function renderHome(){
  state.topic=null;
  var cards=LIST.map(function(id){ var s=TOPICS[id]; return '<button class="scn'+(id==="free"?" free":"")+'" data-t="'+id+'"><span class="e">'+s.ico+'</span><span class="t">'+s.t+'</span></button>'; }).join("");
  app.innerHTML=
    '<header class="top"><p class="eyebrow">محادثة إنجليزية · تكلّم بحرية 🎙️</p><h1>تحدّث معي — '+name+'</h1></header>'+
    '<div class="bar"><a href="home.html?who='+who+'">⬅ الرئيسية</a></div>'+
    '<div class="intro">اختر موضوعًا، وأنا أبدأ أسألك بالصوت 🔊 — <b>وأنت تردّ بكلامك أنت</b> (مب تقرأ). أسمعك وأردّ عليك وأكمّل الحوار، وأقيّم نطقك بالألوان. <b>على الآيفون افتح من Safari.</b></div>'+
    '<div class="grid">'+cards+'</div>'+
    '<footer>كلامك يُفرَّغ ويُقيَّم عبر Azure · الردود موجّهة بالموضوع</footer>';
  app.querySelectorAll("[data-t]").forEach(function(b){ b.addEventListener("click",function(){ startTopic(b.getAttribute("data-t")); }); });
}

function startTopic(id){
  state.topic=id; state.qi=0; state.chatHtml=""; state.msgs=[];
  var s=TOPICS[id];
  render();
  addAI(s.open, true);
  state.msgs.push({role:"model", content:s.open});
}

function render(){
  var s=TOPICS[state.topic];
  app.innerHTML=
    '<header class="top"><p class="eyebrow">'+s.ico+' '+s.t+'</p><h1>تحدّث معي — '+name+'</h1></header>'+
    '<div class="bar"><button data-back>⬅ المواضيع</button></div>'+
    '<div class="chat" id="chat">'+state.chatHtml+'</div>'+
    '<div class="dock"><div class="status" id="st"></div>'+
      '<button class="micbtn" id="mic">🎤 اضغط وتكلّم</button>'+
      '<div class="row2"><button data-repeat>🔁 أعد سؤالي</button><button data-skip>تخطَّ ➡️</button></div>'+
    '</div>'+
    '<footer>تكلّم بجملة كاملة · اضغط 🔁 لتسمع سؤالي ثانية</footer>';
  app.querySelector("[data-back]").addEventListener("click", renderHome);
  app.querySelector("#mic").addEventListener("click", onMic);
  app.querySelector("[data-repeat]").addEventListener("click", function(){ if(state.lastAI) tutorSpeak(state.lastAI); });
  app.querySelector("[data-skip]").addEventListener("click", nextTutor);
}
function scrollDown(){ var c=document.getElementById("chat"); if(c) window.scrollTo(0, document.body.scrollHeight); }

function addAI(text, speak){
  state.lastAI=text;
  state.chatHtml+='<div class="b ai"><span class="av">🧑‍🏫</span><div class="bub"><div class="en">'+esc(text)+'</div><button class="rep" data-rep="'+encodeURIComponent(text)+'">🔊 استمع</button></div></div>';
  var c=document.getElementById("chat"); if(c){ c.innerHTML=state.chatHtml; c.querySelectorAll("[data-rep]").forEach(function(b){ b.addEventListener("click",function(){ tutorSpeak(decodeURIComponent(b.getAttribute("data-rep"))); }); }); }
  if(speak) tutorSpeak(text);
  scrollDown();
}
function addMe(out){
  var body = out.wordsHtml ? ('<div class="en">'+out.wordsHtml+'</div>') : ('<div class="en">'+esc(out.text)+'</div>');
  var sc = (out.pron!=null) ? ('<div class="sc">🗣️ نطقك: '+out.pron+'/100 · 🟢🟡🔴</div>') : '';
  state.chatHtml+='<div class="b me"><span class="av">🧒</span><div class="bub">'+body+sc+'</div></div>';
  var c=document.getElementById("chat"); if(c) c.innerHTML=state.chatHtml;
  scrollDown();
}

function onMic(){
  var st=document.getElementById("st"), mic=document.getElementById("mic");
  mic.disabled=true;
  listen(st, mic, function(out){
    if(!out.text){ return; } // الرسالة تظهر في الحالة
    addMe(out);
    aiTurn(out.text);
  });
}
// ذكاء كامل: نرسل تاريخ الحوار للسيرفر ونأخذ ردًّا طبيعيًا. لو فشل → ردّ موجّه بالموضوع (احتياطي)
function aiTurn(childText){
  state.msgs.push({role:"user", content:childText});
  var st=document.getElementById("st"); if(st){ st.style.color="var(--muted)"; st.textContent="🤔 يفكّر بالرد..."; }
  var done=false, tmo=setTimeout(function(){ if(done)return; done=true; if(st)st.textContent=""; replyThenAsk(childText); }, 12000);
  fetch(AI_ENDPOINT, { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+SUPA_ANON,"apikey":SUPA_ANON},
    body: JSON.stringify({ messages: state.msgs.slice(-14), child: name, topic: TOPICS[state.topic].t }) })
   .then(function(r){ if(!r.ok) throw 0; return r.json(); })
   .then(function(d){ if(done)return; done=true; clearTimeout(tmo); var reply=(d&&d.reply||"").trim(); if(!reply) throw 0; if(st)st.textContent=""; state.msgs.push({role:"model", content:reply}); addAI(reply, true); })
   .catch(function(){ if(done)return; done=true; clearTimeout(tmo); if(st)st.textContent=""; replyThenAsk(childText); });
}
function replyThenAsk(childText){
  var s=TOPICS[state.topic];
  var react=reactTo(childText);
  if(state.qi < s.qs.length){
    addAI(react+" "+s.qs[state.qi], true);
    state.qi++;
  } else {
    addAI(react+" You did great, "+name+"! Let's talk again soon. 🎉", true);
  }
}
function nextTutor(){ // تخطّي: ينتقل للسؤال التالي بلا رد
  var s=TOPICS[state.topic];
  if(state.qi < s.qs.length){ addAI(s.qs[state.qi], true); state.qi++; }
  else { addAI("You did great, "+name+"! Let's talk again soon. 🎉", true); }
}

renderHome();
</script>
</body>
</html>
