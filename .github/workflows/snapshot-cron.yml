name: results-snapshot-cron

# Auto-refreshes the results snapshot from Supabase every ~15 minutes and
# commits it to main, so the latest attempts can be read instantly without
# an on-demand trigger. Scheduled workflows only run from the default branch,
# which is why this lives on main.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-cron
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch attempts from Supabase
        run: |
          mkdir -p results
          curl -sS "https://kmopkxlhisrwxllagjbu.supabase.co/rest/v1/attempts?select=*&order=created_at.desc" \
            -H "apikey: sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_" \
            -H "Authorization: Bearer sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_" \
            -o raw.json
          python3 -m json.tool raw.json > results/attempts.json || cp raw.json results/attempts.json
          rm -f raw.json
          echo "snapshot taken at $(date -u +%FT%TZ)" > results/last-updated.txt

      - name: Commit snapshot
        run: |
          git config user.name "results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/attempts.json results/last-updated.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "cron snapshot [skip ci]"
            git push
          fi
