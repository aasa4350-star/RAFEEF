name: generate-tts

# Generates natural human-like audio (Google TTS) for every phrase in
# audio/phrases.json and commits the MP3s + a manifest, so the pages can
# play real audio on any device (including iPhone) instead of robotic TTS.

on:
  push:
    branches: [claude/children-tests-reviews-bq40n9]
    paths:
      - "audio/phrases.json"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/children-tests-reviews-bq40n9

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate natural neural audio + manifest
        run: |
          python3 - <<'PY'
          import json, os, asyncio, edge_tts
          phrases = json.load(open("audio/phrases.json", encoding="utf-8"))
          # أحدث أصوات مايكروسوفت الطبيعية (HD متعدد اللغات) مع بدائل احتياطية
          VOICES = {
              "en": ["en-US-AvaMultilingualNeural", "en-US-EmmaMultilingualNeural", "en-US-JennyNeural"],
              "ar": ["ar-SA-ZariyahNeural", "ar-EG-SalmaNeural"],
          }
          manifest = {"en": {}, "ar": {}}
          async def one(text, lang, path):
              last = None
              for voice in VOICES[lang]:
                  try:
                      await edge_tts.Communicate(text, voice, rate="-6%").save(path)
                      if os.path.getsize(path) > 0:
                          return voice
                  except Exception as e:
                      last = e
              raise last or RuntimeError("no voice worked")
          async def main():
              for lang in ["en", "ar"]:
                  os.makedirs(f"audio/{lang}", exist_ok=True)
                  used = None
                  for i, text in enumerate(phrases.get(lang, [])):
                      fn = f"{lang}/{lang}_{i}.mp3"
                      try:
                          used = await one(text, lang, f"audio/{fn}")
                          manifest[lang][text] = fn
                      except Exception as e:
                          print("skip", lang, i, repr(text), e)
                  print(lang, "voice used:", used)
          asyncio.run(main())
          json.dump(manifest, open("audio/manifest.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          print("en:", len(manifest["en"]), "ar:", len(manifest["ar"]))
          PY

      - name: Commit audio
        run: |
          git config user.name "tts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/
          if git diff --staged --quiet; then echo "no change"; exit 0; fi
          git commit -m "generate TTS audio [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch origin claude/children-tests-reviews-bq40n9
            git rebase origin/claude/children-tests-reviews-bq40n9 || git rebase --abort
            if git push origin HEAD:claude/children-tests-reviews-bq40n9; then echo "pushed"; exit 0; fi
            sleep 6
          done
          echo "push failed after retries"; exit 1
