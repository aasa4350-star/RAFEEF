name: azure-health

# ينادي خدمة النطق (أزور) نداءً حقيقيًّا ويُخفق إن كانت متوقّفة،
# فيصل الأبَ إشعارُ إخفاقٍ من غيثب في يومه.
#
# لماذا وُجد: في ٩ سبتمبر ٢٠٢٦ انتهى الرصيد المجانيّ فعُطّل الاشتراك،
# فتوقّف المايكروفون في الموقع كلّه ساعتين ولا أحد يدري — لا الأب ولا
# أنا. الأولاد ظنّوا العطل منهم، وأنا شخّصتُ العلّة في الكود وكتبتُ
# فيه إصلاحًا ونشرتُه، والعلّة لم تكن في الكود أصلًا. ولم يُعرف السبب
# إلّا حين وصلت رسالةُ مايكروسوفت إلى بريد الأب بعد فوات الوقت.
#
# ولا شيء في الكود كان يمكن أن يكشفه: الصفحة تُحمّل، والمفتاح في مكانه،
# والوسوم سليمة. الفرق الوحيد أنّ أزور صارت تردّ ٤٠١ — ولا يُكشف هذا
# إلّا بنداءٍ حقيقيّ. فهذا الملفّ ينوب عن الأولاد في تجربته كلّ يوم.
#
# ⚠️ الجدولة (schedule) لا تعمل إلّا من الفرع الافتراضيّ (main) —
# كما هو مكتوبٌ في snapshot-cron.yml. فنسخةُ هذا الملفّ التي تعمل
# بالجدول هي التي على main، وهذه النسخة تعمل عند كلّ نشرٍ وباليد.

on:
  schedule:
    # ٩ صباحًا و٣ عصرًا و٨ مساءً بتوقيت الرياض (UTC+3) — قبل وقت
    # مذاكرتهم وفي أثنائه وبعده، فلا يمرّ يومٌ بعطلٍ غير معروف.
    - cron: "0 6,12,17 * * *"
  workflow_dispatch:
  push:
    branches: [claude/children-tests-reviews-bq40n9]
    paths:
      - "azure-config.js"
      - "checks/azure.js"
      - ".github/workflows/azure-health.yml"

concurrency:
  group: azure-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # المفتاح وملفّ الفحص يعيشان على فرع النشر لا على main
          ref: claude/children-tests-reviews-bq40n9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: نداءُ أزور كما يناديها الطفل
        run: node checks/azure.js
