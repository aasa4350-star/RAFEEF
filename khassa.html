<html lang="ar" dir="rtl">
<head>

<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:105px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;text-align:right;line-height:1.7}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:420px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>

function saveScore(test, correct, total){
  try{

      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }

    ["بناء برنامجٍ تربويّ متكامل من ملاحظة الأسرة مع المختصّين","تقليل تكلفة التشخيص","إعفاء المختصّين من المسؤولية"],
    "أن تشترك أسرة الطفل التوحدي في إجراءات تشخيص وتقييم طفلها وأن يتمّ دعمها لملاحظة الطفل وتقييمه جنبًا إلى جنبٍ مع المختصّين، ليتمّ بناء برنامجٍ تربويّ متكامل."],
  ["على المقيّمين معرفة خصائص كلّ أداةٍ ومجالاتها ومدى دعم الدراسات العلمية لها لتحقيق هدفٍ أهمّ، وهو:",
    ["توفير الخدمات الفردية الخاصّة لكلّ طفلٍ بما يتلاءم مع قدراته واحتياجاته","توحيد البرامج لكلّ الأطفال","تقليل عدد المقاييس المستخدمة"],
    "على المقيّمين معرفة خصائص ومجالات كلّ أداة ومدى دعم الدراسات العلمية لها عند اختيارها، والنظر إليها على أنّها وسائل لتحقيق هدفٍ أهمّ: توفير الخدمات الفردية الخاصّة لكلّ طفلٍ بما يتلاءم مع قدراته واحتياجاته."],
  ["«التقييم الوظيفيّ للسلوك» يهدف إلى:",

  ["الملاحظة المباشرة في البيئة الطبيعية تفوق الاختبار المقنّن في:",
    ["تقدير السلوك الوظيفيّ اليوميّ للطفل","قياس الذكاء العامّ","حساب العمر الزمنيّ"],
    "الطفل في بيئته المعتادة يُظهر ما لا يُظهره في غرفةٍ غريبةٍ عنه."],
  ["مشاركة معلّم الطفل في التقييم مهمّةٌ لأنّه:",
    ["يرى الطفل في مواقفَ متعدّدةٍ يوميًّا","هو الذي يكتب التقرير","هو الذي يقرّر الدواء"],
    "تعدّدُ المصادر أصلٌ في تقييم التوحد، والمعلّم أغنى مصادر الملاحظة اليومية بعد الأسرة."],
  ["تقرير التقييم الجيّد ينتهي بـ:",
    ["أهدافٍ وتوصياتٍ قابلةٍ للتطبيق في البيت والمدرسة","تشخيصٍ مجرّدٍ بلا توصية","نسبة ذكاءٍ فحسب"],

    ["دوريةً لمتابعة التقدّم وتعديل الخطّة","مرّةً واحدةً في العمر","عند تغيير المدرسة فقط"],
    "الطفل ينمو وتتغيّر حاجاته، والخطّةُ الثابتة تتخلّف عنه."],

    ["الحكم على الطفل من جلسةٍ واحدةٍ في بيئةٍ غريبةٍ عنه","تعدّد مصادر المعلومات","إشراك الأسرة في التقييم"],
    "جلسةٌ واحدةٌ قد تُظهر الطفل أقلّ من قدرته الحقيقية، فيُبنى على ذلك حكمٌ ظالم."]
];

/* البنك مكتوبٌ [سؤال، خيارات، شرح] — ونقبل [سؤال، خيارات، 0، شرح] احتياطًا */
function bankExpl(p){ return (typeof p[2] === "number") ? p[3] : p[2]; }
function bankGen(bank){ return function(){ var p=gp(bank); var o=[p[1][0],p[1][1],p[1][2]]; shuffle(o); return [p[0], o, o.indexOf(p[1][0]), bankExpl(p)]; }; }
var DEFG=[bankGen(DEF)], PREVG=[bankGen(PREV)], THEOG=[bankGen(THEO)], NEUROG=[bankGen(NEURO)],
    CHARG=[bankGen(CHAR)], DIAGG=[bankGen(DIAG)], RELG=[bankGen(REL)], ASSESSG=[bankGen(ASSESS)];
/* نُعيد استعمال مولّدات الدروس نفسها لا نصنع نسخًا جديدة، فتُعرف
   هُويّة المولّد فيُعرف درسه — وبه يُغذّي الشاملُ «علاجي». */
var ALLG=[DEFG[0], PREVG[0], THEOG[0], NEUROG[0], CHARG[0], DIAGG[0], RELG[0], ASSESSG[0]];

function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*30){ var f=gp(gens), q; try{ q=f(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; try{ q.__g=f.name||""; q.__gf=f; }catch(e){} out.push(q); } return out; }

var app = document.getElementById("app");
if(!NAMES[who]){
  app.innerHTML = '<div class="locked">افتح الرابط هكذا: <b>?who=khassa</b></div>';
} else {
  app.innerHTML =
    '<header class="top"><p class="eyebrow">'+GRADES[who]+'</p><h1>🧩 اضطراب التوحد</h1></header>'+
    '<div class="bar"><a href="child.html?who=khassa">📊 تقريري</a><a href="index.html">🏠 اللوحة</a></div>'+
    '<div class="unit">📘 المصدر: ملخّص «#كفايات_هدى» + الفصل العاشر «اضطراب التوحد» (ص <span class="en">389–431</span>)</div>'+
    '<div class="tabs" role="tablist">'+
      '<button data-tab="def" aria-selected="true">التعريف 🧩</button>'+
      '<button data-tab="prev" aria-selected="false">الانتشار 📊</button>'+
      '<button data-tab="theo" aria-selected="false">النظريات 🧠</button>'+
      '<button data-tab="neuro" aria-selected="false">النواقل العصبية ⚡</button>'+
      '<button data-tab="char" aria-selected="false">الخصائص 👦</button>'+
      '<button data-tab="diag" aria-selected="false">التشخيص 🔍</button>'+
      '<button data-tab="rel" aria-selected="false">الفروق والمتلازمات 🔀</button>'+
      '<button data-tab="assess" aria-selected="false">مبادئ القياس 📐</button>'+
      '<button data-tab="all" aria-selected="false">اختبار شامل 📝</button>'+
      '<button data-tab="rem" aria-selected="false">علاجي 💪</button>'+
    '</div>'+
    '<section class="panel active" id="def"></section>'+
    '<section class="panel" id="prev"></section>'+
    '<section class="panel" id="theo"></section>'+
    '<section class="panel" id="neuro"></section>'+
    '<section class="panel" id="char"></section>'+
    '<section class="panel" id="diag"></section>'+
    '<section class="panel" id="rel"></section>'+
    '<section class="panel" id="assess"></section>'+
    '<section class="panel" id="all"></section>'+
    '<section class="panel" id="rem"></section>'+
    '<footer>التربية الخاصة · اضطراب التوحد · أسئلةٌ جديدة كلّ مرّة — من إعداد المعلّم</footer>';

  var CFG = {
    all:   {gens:ALLG,   n:16, intro:"اختبار شامل على كلّ المحاور — <b>أسئلة جديدة كل مرة</b>.", label:"تربية خاصة — شامل"},
    def:   {gens:DEFG,   n:10, intro:"<b>التعريف والمصطلح:</b> أصل كلمة "+en("Autism")+"، ليو كانر، المسمّيات، عمر الظهور، ثالوث الأعراض.", label:"تربية خاصة — التعريف"},
    prev:  {gens:PREVG,  n:8,  intro:"<b>الانتشار والنسب:</b> ديترويت ١٩٩٨، إيدلسون، الجمعية الأمريكية للتوحدية ١٩٩٩، نسبة الذكور إلى الإناث.", label:"تربية خاصة — الانتشار"},
    theo:  {gens:THEOG,  n:10, intro:"<b>النظريات المفسّرة:</b> البيولوجية، الوراثية، البيوكيميائية، الأيضية، الفيروسات والتطعيم، التلوّث البيئي، نظرية العقل.", label:"تربية خاصة — النظريات"},
    neuro: {gens:NEUROG, n:8,  intro:"<b>الدماغ والنواقل العصبية:</b> المخيخ، السيروتونين ومعدّلاته، ولماذا دُرست النواقل.", label:"تربية خاصة — النواقل العصبية"},
    char:  {gens:CHARG,  n:10, intro:"<b>الخصائص:</b> السلوكية والنمطية، التواصلية، الحسّية، والتفاعل الاجتماعي.", label:"تربية خاصة — الخصائص"},
    diag:  {gens:DIAGG,  n:9,  intro:"<b>التشخيص والأدلّة:</b> الدليل الدولي التاسع ١٩٧٨، "+en("DSM-III")+" ١٩٨٠، المعدّل ١٩٨٧، "+en("DSM-IV")+" و"+en("ICD-10")+".", label:"تربية خاصة — التشخيص"},
    rel:   {gens:RELG,   n:10, intro:"<b>الفروق والمتلازمات:</b> ريت، التحطّم الطفوليّ، أسبرجر، والفرق بين التوحد والإعاقة السمعية.", label:"تربية خاصة — الفروق"},
    assess:{gens:ASSESSG,n:9,  intro:"<b>مبادئ القياس والتشخيص:</b> الفريق، الأسرة، النموذج النمائيّ، التكيّف الوظيفيّ، تعدّد المواقف.", label:"تربية خاصة — مبادئ القياس"}
  };

  function render(id){
    var c = CFG[id], sec = document.getElementById(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score>0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false;
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && !saved){ saved=true; saveScore(c.label, correct, total);
            if(id!=="all" && id!=="rem"){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/total*100)})); }catch(e){} } }
        });
      });
    });
    function savePartial(){ var n=Object.keys(answered).length; if(saved||n<3) return; saved=true; saveScore(c.label, correct, n); if(id!=="all"&&id!=="rem"){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/n*100)})); }catch(e){} } }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

  // ===== علاجي =====
  var REM_PAGE="khassa", REM_LABEL="التوحد";
  var REMTOPICS=[
    {id:"def", name:"١) التعريف والمصطلح", tip:"اربط المصطلح بأصله: "+en("Autos")+" = الذات. وثبّت الأرقام: كانر و١١ طفلًا، الإصابة في السنوات الثلاث الأولى، ٣٠–٤٢ شهرًا، ونسبة ٢–٤ لكل ١٠٠٠٠.", yt:"شرح تعريف اضطراب التوحد كفايات تربية خاصة"},
    {id:"prev", name:"٢) الانتشار والنسب", tip:"الأرقام هي المفتاح: ديترويت ١٩٩٨ (٤–٥ لكل ١٠٠٠٠، والذكور ٣–٤ أضعاف)، والجمعية الأمريكية ١٩٩٩ (١:٥٠٠ = ٢٠:١٠٠٠٠، والبنين للبنات ٤:١).", yt:"نسبة انتشار التوحد إحصائيات كفايات"},
    {id:"theo", name:"٣) النظريات المفسّرة", tip:"لكلّ نظريةٍ كلمةٌ مفتاحية: البيولوجية=تلف الدماغ · الوراثية=الأخوة والكروموسومات · البيوكيميائية=النواقل · الأيضية=الجلوتين والكازين · التطعيم=المناعة · التلوّث=الزئبق والرصاص · نظرية العقل=معرفية لا فسيولوجية.", yt:"النظريات المفسرة لاضطراب التوحد"},
    {id:"neuro", name:"٤) الدماغ والنواقل العصبية", tip:"الدماغ طبيعيّ الشكل إلّا <b>المخيخ</b>. والسيروتونين <b>مرتفع</b> في الدم بنسبة ٣٠–٥٠٪، وينخفض للنصف عند الأسوياء بعد سنّ <b>الخامسة</b>.", yt:"النواقل العصبية والسيروتونين في التوحد"},
    {id:"char", name:"٥) الخصائص", tip:"اجمعها في أربع: سلوكية نمطية (رفرفة، دوران) · تواصلية (الإشارة بدل الكلام، المصاداة) · اجتماعية (لا يستجيب للنظر، كالأصمّ) · حسّية (التذوّق والنظر للإضاءة).", yt:"خصائص الأطفال التوحديين"},
    {id:"diag", name:"٦) التشخيص والأدلّة", tip:"رتّب الأدلّة بالسنوات: ١٩٧٨ الدولي التاسع (٣٠ شهرًا) · ١٩٨٠ "+en("DSM-III")+" (قبل الشهر ٣٠، ولا هلوسة) · ١٩٨٧ المعدّل (٨ من ١٦: ٤+٢+٢).", yt:"معايير تشخيص التوحد DSM"},
    {id:"rel", name:"٧) الفروق والمتلازمات", tip:"ريت=إناث فقط، ٦–١٨ شهرًا · التحطّم الطفوليّ=قبل العاشرة · أسبرجر=ذكاء ٩٠–١١٠ وطفولة متأخّرة وبلا مصاداة · والأصمّ يستجيب للأصوات العالية ويكوّن صداقات.", yt:"الفرق بين التوحد ومتلازمة أسبرجر"},
    {id:"assess", name:"٨) مبادئ القياس", tip:"المبادئ تدور على: فريقٌ متعدّد التخصّصات · الأسرة شريكة · النموذج النمائيّ · التكيّف الوظيفيّ · تعدّد المواقف · المعزّزات لجذب الانتباه.", yt:"مبادئ القياس والتشخيص في التربية الخاصة"}
  ];
  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=document.getElementById("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب المحاور من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل محور.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت المحاور. جرّب محاور '+REM_LABEL+' ويرجع هنا يعرض أضعف محور مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent(x.t.yt||x.t.name)+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">راجع «'+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 محاور ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ var tb=document.querySelector('.tabs [data-tab="'+b.dataset.go+'"]'); if(tb) tb.click(); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }
  render("def");

  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
      var id=b.dataset.tab; var pan=document.getElementById(id); pan.classList.add("active");
      if(id==="rem"){ renderRem(); } else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
    });
  });
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); } });
}
</script>
