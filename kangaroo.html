<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:130px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 8px;border-radius:13px;font-size:.98rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 10px;font-size:1.1rem}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:13px 15px;border-radius:12px;font-size:1.15rem;font-weight:700;cursor:pointer;font-family:inherit}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good)}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:200px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>

<script>

// روابط بحث يوتيوب (لا فيديو محدّد — البحث لا ينكسر) لأصعب مهارات الاستدلال الرياضي.
var VIDEO_Q = {

  gDigitCount:"كم مرة يتكرر الرقم من 1 الى 100",

  gFraction:"شرح الكسر من شكل مظلل كيف نحسب الكسر"
};

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";

function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function gp(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function opt3(correct,cand){
  var seen={};seen[String(correct)]=1;var ds=[];
  (cand||[]).forEach(function(d){d=Math.round(d);var k=String(d);if(!seen[k]&&d>=0){seen[k]=1;ds.push(d);}});
  var k=1;while(ds.length<3){var up=correct+k,dn=correct-k;if(!seen[String(up)]){seen[String(up)]=1;ds.push(up);}else if(dn>=0&&!seen[String(dn)]){seen[String(dn)]=1;ds.push(dn);}k++;if(k>80)break;}
  var o=[correct].concat(ds.slice(0,3));shuffle(o);return [o,o.indexOf(correct)];
}
/* ===== مولّدات الاستدلال الرياضي (مطابقة لأسلوب كتاب كانجرو) ===== */
function gPattern(lvl){
  var type=gp(["arith","geom","addinc","muladd"]);var n=4,seq=[],next,a;
  if(type==="arith"){a=ri(1,3+lvl*2);var d=ri(2,3+lvl*2);for(var i=0;i<n;i++)seq.push(a+i*d);next=a+n*d;}
  else if(type==="geom"){a=ri(1,3);var r=gp([2,3]);for(var i=0;i<n;i++)seq.push(a*Math.pow(r,i));next=a*Math.pow(r,n);}
  else if(type==="addinc"){var cur=ri(1,3+lvl),inc=ri(1,2+lvl);seq.push(cur);for(var i=1;i<n;i++){cur+=inc;inc++;seq.push(cur);}next=cur+inc;}
  else {var cur=ri(1,3),k=gp([2,3]),add=ri(1,2);seq.push(cur);for(var i=1;i<n;i++){cur=cur*k+add;seq.push(cur);}next=cur*k+add;}
  var o=opt3(next,[next+ri(1,3),next-ri(1,3),seq[n-1]+seq[n-2]]);
  return ["ما العدد التالي في النمط: "+seq.join("، ")+"، ...؟",o[0],o[1],"القاعدة تُكمِل النمط ليعطي "+next+"."];
}
function gOdd(lvl){
  var type=gp(["parity","mult"]);var nums=[],correct,expl;
  if(type==="parity"){
    var isEven=Math.random()<0.5;
    var E=function(){return ri(1,8+lvl*3)*2;},O=function(){return ri(0,8+lvl*3)*2+1;};
    var majFn=isEven?E:O,minFn=isEven?O:E;var s={},maj=[];while(maj.length<3){var v=majFn();if(!s[v]){s[v]=1;maj.push(v);}}
    var mn;do{mn=minFn();}while(maj.indexOf(mn)>=0);nums=maj.concat([mn]);correct=mn;
    expl=isEven?(mn+" عدد فردي والبقية زوجية."):(mn+" عدد زوجي والبقية فردية.");
  } else {
    // كل الأعداد بنفس الزوجية حتى لا يصير «الزوجي/الفردي الوحيد» إجابة منافسة:
    // k=4 → كلها زوجية؛ k فردي → كلها فردية.
    var k=gp([3,4,5]), par=(k%2===0)?0:1, s={}, maj=[], t=0;
    while(maj.length<3 && t<400){ t++; var v=k*ri(2,6+lvl*2); if(v%2!==par || s[v]) continue; s[v]=1; maj.push(v); }
    if(maj.length<3) return null;
    var mn, t3=0; do{ mn=ri(2,k*8); t3++; }while((mn%k===0||mn%2!==par||maj.indexOf(mn)>=0)&&t3<400);
    if(mn%k===0||mn%2!==par||maj.indexOf(mn)>=0) return null;
    nums=maj.concat([mn]);correct=mn;
    expl=mn+" ليس من مضاعفات "+k+"، والبقية من مضاعفاته.";
  }
  shuffle(nums);return ["أيّ عدد مختلف عن البقية: "+nums.join("، ")+"؟",nums.slice(),nums.indexOf(correct),expl];
}
function gDist(lvl){var per=gp([2,3,4,5]),plates=ri(2,4+lvl),total=per*plates,fruit=gp(["تفاحة","موزة","برتقالة","حبة"]);
  var o=opt3(plates,[plates+1,plates-1,per]);return ["توزّع سارة كل "+per+" "+fruit+" في طبق واحد. عندها "+total+" "+fruit+". كم طبقًا تحتاج؟",o[0],o[1],total+" ÷ "+per+" = "+plates+" أطباق."];}
function gSave(lvl){var per=ri(2,5+lvl),days=ri(3,5+lvl),total=per*days;
  var o=opt3(total,[total+per,total-per,per+days]);return ["يوفّر أحمد "+per+" ريالات كل يوم. بعد "+days+" أيام، كم ريالًا معه؟",o[0],o[1],per+" × "+days+" = "+total+" ريال."];}
function gShare(lvl){var k=gp([2,3,4,5]),each=ri(2,4+lvl),total=k*each;
  var o=opt3(each,[each+1,each-1,total-each]);return ["قُسِّمت "+total+" قطعة حلوى على "+k+" أطفال بالتساوي. كم لكل طفل؟",o[0],o[1],total+" ÷ "+k+" = "+each+"."];}
function gPuzzle(lvl){
  /* الشرح السابق كان يتحقّق من الجواب فقط (n + n/2 = res) بلا طريقة حلّ —
     لا يعلّم كيف يُحسب العدد من الناتج. الآن نشرح الطريقة العكسية:
     اجمع الكسور مع الواحد الصحيح، فيصير الناتج = العدد × (المجموع)،
     فالعدد = الناتج ÷ (المجموع). */
  if(lvl>=3){
    var n=ri(2,6)*4, res=n+n/2+n/4;
    var o=opt3(n,[n+2,n-2,res-n]);
    return ["عدد إذا أُضيف إليه نصفه وربعه صار "+res+". ما هذا العدد؟",o[0],o[1],
      "العدد ونصفه وربعه = العدد × (1 + ½ + ¼) = العدد × 7⁄4. إذًا العدد = "+res+" ÷ 7⁄4 = "+res+" × 4⁄7 = "+n+". (تأكيد: "+n+" + "+(n/2)+" + "+(n/4)+" = "+res+")"];
  }
  var n=ri(2,8)*2, res=n+n/2;
  var o=opt3(n,[n+2,n-2,res-n]);
  return ["عدد إذا أُضيف إليه نصفه صار "+res+". ما هذا العدد؟",o[0],o[1],
    "العدد ونصفه = العدد × (1 + ½) = العدد × 3⁄2. إذًا العدد = "+res+" ÷ 3⁄2 = "+res+" × 2⁄3 = "+n+". (تأكيد: "+n+" + "+(n/2)+" = "+res+")"];
}
/* ===== مولّدات الاستدلال اللغوي (مطابقة لأسلوب الكتاب) ===== */
function optS(correct,cand){
  var seen={};seen[correct]=1;var ds=[];
  shuffle((cand||[]).slice()).forEach(function(d){if(d&&!seen[d]){seen[d]=1;ds.push(d);}});
  var o=[correct].concat(ds.slice(0,3));shuffle(o);return [o,o.indexOf(correct)];
}
// تحويل الأرقام العربية إلى إنجليزية وتجريدها للمقارنة (يمنع فروق التنسيق)
function normNum(s){ return String(s==null?"":s).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d);}).replace(/[^\d\-]/g,"").trim(); }
var REL={
 "صغير الحيوان":[["قطة","هريرة"],["كلبة","جرو"],["بقرة","عجل"],["فرس","مهر"],["دجاجة","كتكوت"],["نعجة","حمل"]],
 "صوت الحيوان":[["أسد","زئير"],["كلب","نباح"],["قط","مواء"],["حصان","صهيل"],["حمار","نهيق"],["طائر","تغريد"]],
 "أداة المهنة":[["نجار","منشار"],["طبيب","سماعة"],["رسام","فرشاة"],["خياط","إبرة"],["فلاح","محراث"]],
 "وظيفة الأداة":[["مقص","قص"],["قلم","كتابة"],["ممحاة","مسح"],["مفتاح","فتح"],["مكنسة","كنس"]],
 "الكل والجزء":[["يد","إصبع"],["شجرة","غصن"],["كتاب","صفحة"],["بيت","غرفة"],["وجه","عين"],["سيارة","عجلة"]]
};
function gAnalogy(){
  var keys=Object.keys(REL),g=gp(keys),pairs=shuffle(REL[g].slice()),p1=pairs[0],p2=pairs[1],correct=p2[1];
  var cand=[];REL[g].forEach(function(p){if(p[1]!==correct)cand.push(p[1]);});
  keys.forEach(function(k){if(k!==g)REL[k].forEach(function(p){cand.push(p[1]);});});
  var o=optS(correct,cand);
  return ["أكمل التناظر: "+p1[0]+" : "+p1[1]+"  مثل  "+p2[0]+" : ؟",o[0],o[1],p1[0]+" ← "+p1[1]+" وكذلك "+p2[0]+" ← "+p2[1]+".","an:"+g];
}
var SENT=[
 ["يحيط بـ",[["الإطار","الصورة"],["السور","البيت"],["الغلاف","الكتاب"],["القشرة","الموزة"]]],
 ["يعيش في",[["السمكة","الماء"],["الأسد","الغابة"],["الجمل","الصحراء"],["الدب القطبي","الجليد"]]],
 ["يعمل في",[["الطبيب","المستشفى"],["المعلم","المدرسة"],["الطباخ","المطعم"],["المزارع","المزرعة"]]]
];
function gComplete(){
  var s=gp(SENT),verb=s[0],pairs=shuffle(s[1].slice()),p1=pairs[0],p2=pairs[1],correct=p2[1];
  var cand=[];s[1].forEach(function(p){if(p[1]!==correct)cand.push(p[1]);});
  SENT.forEach(function(ss){if(ss[0]!==verb)ss[1].forEach(function(p){cand.push(p[1]);});});
  var o=optS(correct,cand);
  return [p1[0]+" "+verb+" "+p1[1]+"، و"+p2[0]+" "+verb+" ؟",o[0],o[1],p2[0]+" "+verb+" "+p2[1]+".","sc:"+verb];
}
var CATS={
 "فاكهة":["تفاح","موز","عنب","برتقال","تمر","رمان","تين"],
 "خُضار":["جزر","خيار","طماطم","بصل","بطاطس","خس"],
 "حيوانات":["أسد","قط","فيل","حصان","أرنب","نمر"],
 "طيور":["عصفور","حمامة","صقر","ببغاء","بطة"],
 "ألوان":["أحمر","أزرق","أخضر","أصفر","أسود"],
 "وسائل نقل":["سيارة","طائرة","قطار","سفينة","دراجة"]
};
function gCategory(){
  var keys=Object.keys(CATS),c=gp(keys),items=shuffle(CATS[c].slice()).slice(0,3);
  var o=optS(c,keys.filter(function(k){return k!==c;}));
  return ["إلى أيّ مجموعة تنتمي: "+items.join("، ")+"؟",o[0],o[1],"كلها من «"+c+"».","cat:"+c];
}
var SEQ=[
 ["مراحل عمر الإنسان",["جنين","رضيع","طفل","صبي","شاب","كهل","شيخ"]],
 ["أيام الأسبوع",["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"]],
 ["مراحل النبات",["بذرة","برعم","نبتة","شجرة"]]
];
function gSequence(){
  var s=gp(SEQ),arr=s[1],k=ri(2,Math.min(arr.length-1,4)),shown=arr.slice(0,k),correct=arr[k];
  var cand=arr.filter(function(x){return x!==correct&&shown.indexOf(x)<0;});
  SEQ.forEach(function(ss){if(ss[0]!==s[0])cand=cand.concat(ss[1]);});
  var o=optS(correct,cand);
  return ["ما الكلمة التالية في الترتيب: "+shown.join("، ")+"، ...؟",o[0],o[1],"الترتيب: "+arr.join(" ← ")+".","seq:"+s[0]];
}
var COLL=[["الطيور","سرب"],["الغنم","قطيع"],["النحل","خلية"],["السفن","أسطول"],["الجنود","جيش"],["الإبل","قافلة"]];
function gCollective(){
  var c=gp(COLL),correct=c[1],cand=COLL.filter(function(x){return x[1]!==correct;}).map(function(x){return x[1];});
  var o=optS(correct,cand);
  return ["ماذا نسمّي جماعة "+c[0]+"؟",o[0],o[1],"جماعة "+c[0]+" = "+correct+".","coll"];
}

/* ===== المعرفة العامة ===== */
var GK=[
 ["كم عدد أرجل الحشرة؟","٦",["٤","٨","٢"]],
 ["ما أكبر كوكب في المجموعة الشمسية؟","المشتري",["الأرض","المريخ","زحل"]],
 ["الماء يتجمّد ويصير ثلجًا عند درجة؟","صفر",["١٠٠","٥٠","٢٠"]],
 ["كم لونًا في قوس قزح؟","٧",["٥","٦","٨"]],
 ["أيّ حاسة نستخدمها للشمّ؟","الأنف",["العين","الأذن","اللسان"]],
 ["ما العضو الذي يضخّ الدم في الجسم؟","القلب",["الرئة","المعدة","الكبد"]],
 ["كم عدد حواس الإنسان؟","٥",["٤","٦","٣"]],
 ["ما الغاز الذي نتنفّسه للحياة؟","الأكسجين",["ثاني أكسيد الكربون","النيتروجين","الهيدروجين"]],
 ["بمساعدة أيّ شيء يصنع النبات غذاءه؟","الشمس",["القمر","الرياح","الظلام"]],

           "كان الطائر يبني عشّه","كانت الشمس تشرق صباحًا","كان النحل ينتج العسل"];
function gCounterfactual(lvl){
  var a=gp(CFOBJ), b, t=0;
  do{ b=gp(CFOBJ); t++; }while((b.n===a.n||b.use===a.use)&&t<40);
  if(b.n===a.n) return null;
  var cand=[a.use];
  CFOBJ.forEach(function(x){ if(x.use!==b.use&&x.use!==a.use) cand.push(x.use); });
  var o=optS(b.use,cand);
  var kan=a.f?"كانت":"كان", ust=a.f?"تُستخدم":"يُستخدم", sar=a.f?"صارت":"صار";
  var bUst=b.f?"تُستخدم":"يُستخدم";
  return ["إذا "+kan+" "+a.n+" "+b.acc+"، و"+gp(CFILL)+"، فإنّ "+a.n+" "+ust+" في ......",
    o[0],o[1],

function gTrueStat(lvl){

}

/* ١١) العدد المختلف: أوّلي بين غير أوّلية */
function isPrime(n){ if(n<2) return false; for(var d=2;d*d<=n;d++){ if(n%d===0) return false; } return true; }
function gPrimeOdd(lvl){
  // كل الأعداد فردية وغير مربّعة كاملة، حتى يبقى معيار «المختلف» هو الأوّلية وحدها
  // (لو كان مشتّت زوجيًّا وحيدًا صار مختلفًا بالزوجية، فيصير للسؤال إجابتان).
  function isSq(n){ var r=Math.round(Math.sqrt(n)); return r*r===n; }
  var comp=[], seen={}, t=0;
  while(comp.length<3 && t<500){ t++; var v=ri(4,60); if(v%2===0||isPrime(v)||isSq(v)||seen[v]) continue; seen[v]=1; comp.push(v); }
  if(comp.length<3) return null;
  var p=0, t2=0; do{ p=ri(5,59); t2++; }while((!isPrime(p)||seen[p])&&t2<300);
  if(!isPrime(p)||seen[p]) return null;
  var nums=shuffle(comp.concat([p]));
  return ["ما العدد المختلف عن البقيّة: "+nums.join("، ")+"؟",nums.slice(),nums.indexOf(p),
    p+" عدد أوّلي، لا يقبل القسمة إلّا على 1 وعلى نفسه. والبقيّة أعداد غير أوّلية."];
}

/* ١٢) عدّ المثلّثات في شكل مرسوم */
function gCountTri(lvl){
  var k=ri(1, lvl>=2?5:3), total=(k+1)*(k+2)/2;
  /* الرؤوس الثلاثة، والأشعّة تخرج من رأسٍ نختاره عشوائيًّا إلى الضلع المقابل.
     القانون نفسه في الحالات كلّها: عدد المثلّثات = C(k+2, 2). */
  var from=ri(0,2);                                  // من أيّ رأس تخرج الأشعّة
  var apexX=ri(70,130);                              // موضع القمّة يتغيّر فيتغيّر شكل المثلّث
  var P=[[apexX,12],[10,112],[190,112]];             // 0 القمّة · 1 يسار · 2 يمين
  var A=P[from], B=P[(from+1)%3], C=P[(from+2)%3];   // الأشعّة من A إلى الضلع BC
  var lines="";
  for(var i=1;i<=k;i++){
    var f=i/(k+1);
    var x=(B[0]+(C[0]-B[0])*f).toFixed(1), y=(B[1]+(C[1]-B[1])*f).toFixed(1);
    lines+='<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+x+'" y2="'+y+'" stroke="currentColor" stroke-width="2"/>';
  }
  var svg='<svg viewBox="0 0 200 124" width="190" height="118" style="display:block;margin:10px auto;color:var(--accent)">'+
    '<polygon points="'+P.map(function(p){return p[0]+","+p[1];}).join(" ")+'" fill="none" stroke="currentColor" stroke-width="2.5"/>'+lines+'</svg>';
  var o=opt3(total,[k+1,total+1,total-1,2*k+1]);
  return ["كم مثلّثًا في الشكل التالي؟"+svg,o[0],o[1],
    "الأجزاء الصغيرة "+(k+1)+"، وكلّ مثلّثٍ يتحدّد باختيار خطّين من الخطوط الـ"+(k+2)+" الخارجة من الرأس: "+
    (k+2)+"×"+(k+1)+" ÷ 2 = "+total+" مثلّثًا.","ct:"+from+"-"+k];
}

/* ١٣) الكسر من شكل مظلّل */
function gFraction(lvl){
  function gcd(a,b){ return b?gcd(b,a%b):a; }
  var n=gp([6,8,9]), kC=ri(1,n-1), g=gcd(kC,n), num=kC/g, den=n/g;
  var used={}, alts=[], t=0; used[kC]=1;
  while(alts.length<3 && t<200){ t++; var v=ri(1,n-1); if(used[v]) continue; used[v]=1; alts.push(v); }
  if(alts.length<3) return null;
  var cols = n===9?3:(n===6?3:(n===4?2:4)), rows=n/cols, cw=20;
  function grid(sh){
    var out="";
    for(var i=0;i<n;i++){
      var r=Math.floor(i/cols), c=i%cols;
      out+='<rect x="'+(c*cw+1)+'" y="'+(r*cw+1)+'" width="'+(cw-2)+'" height="'+(cw-2)+
           '" fill="'+(i<sh?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.5"/>';
    }
    return '<svg viewBox="0 0 '+(cols*cw+2)+' '+(rows*cw+2)+'" height="'+(rows*cw+2)+
           '" style="color:var(--accent);vertical-align:middle">'+out+'</svg>';
  }
  var o=optS(grid(kC), alts.map(grid));
  return ["أيّ الأشكال التالية الجزء المظلّل فيه يساوي "+num+"/"+den+"؟",o[0],o[1],
    "الشكل الصحيح فيه "+kC+" من "+n+" مظلّلة، و"+kC+"/"+n+" = "+num+"/"+den+".","frac:"+n+":"+kC];
}

/* ١٤) ترتيب ومقارنة */
function gCompareAges(lvl){
  var names=shuffle(["سالم","فارس","فهد","بدر","ياسر"]).slice(0,3);
  var A=names[0],B=names[1],C=names[2], d=ri(2,4), askBig=Math.random()<0.5;
  var correct=askBig?A:C;
  var cand=[A,B,C].filter(function(x){return x!==correct;}).concat(["لا يمكن تحديده"]);
  var o=optS(correct,cand);
  return [A+" أكبر من "+B+" بـ"+d+" سنوات، و"+C+" أصغر من الجميع. فمن "+(askBig?"أكبرهم":"أصغرهم")+"؟",
    o[0],o[1],
    askBig ? (A+" أكبر من "+B+"، و"+C+" أصغر من الجميع، فيكون "+A+" هو الأكبر.")
           : (C+" أصغر من الجميع كما نصّت المقدّمة."),
    "age"];
}

/* ١٥) طاولات مصفوفة في صفّ: شخصان لكلّ طاولة + شخصان في الطرفين */
function gTableRow(lvl){
  /* ثلاث هيئات مختلفة بقوانين مختلفة، حتى لا يحفظ الطالب «2ن + 2» ويكفّ عن التفكير. */
  var mode = gp(["joined","separate","square"]);
  var tw=34, out="", n, s, correct, stem, why, W, H=66;

  if(mode==="joined"){
    n=ri(3, lvl>=2?8:6); s=(lvl>=2 && Math.random()<0.5)?2:1;
    correct=2*s*n+2;
    for(var i=0;i<n;i++){
      var x=i*tw+10, cx=x+(tw-3)/2;
      out+='<rect x="'+x+'" y="24" width="'+(tw-3)+'" height="18" rx="3" fill="#7dd3fc" stroke="currentColor" stroke-width="1.5"/>';
      for(var j=0;j<s;j++){
        var off=(s===1)?0:(j===0?-7:7);
        out+='<circle cx="'+(cx+off)+'" cy="13" r="4.5" fill="#f59e0b"/>'+
             '<circle cx="'+(cx+off)+'" cy="53" r="4.5" fill="#f59e0b"/>';
      }
    }
    out+='<circle cx="4" cy="33" r="4.5" fill="#f59e0b"/><circle cx="'+(n*tw+15)+'" cy="33" r="4.5" fill="#f59e0b"/>';
    W=n*tw+22;
    stem="تُصفّ "+n+" طاولات ملتصقة في صفٍّ واحد كما في الشكل: يجلس "+(s===1?"شخصٌ واحد":"شخصان")+
         " على كلّ جانبٍ من كلّ طاولة، وشخصٌ عند كلّ طرفٍ من طرفَي الصفّ. كم شخصًا يجلس؟";
    why="لكلّ طاولة "+(2*s)+" أشخاص على الجانبين: (2 × "+s+" × "+n+") + 2 للطرفين = "+correct+" شخصًا.";
  }
  else if(mode==="separate"){
    n=ri(2, lvl>=2?6:4); correct=4*n;
    for(var i2=0;i2<n;i2++){
      var x2=i2*(tw+12)+12, c2=x2+(tw-3)/2;
      out+='<rect x="'+x2+'" y="24" width="'+(tw-3)+'" height="18" rx="3" fill="#bbf7d0" stroke="currentColor" stroke-width="1.5"/>'+
           '<circle cx="'+c2+'" cy="13" r="4.5" fill="#f59e0b"/><circle cx="'+c2+'" cy="53" r="4.5" fill="#f59e0b"/>'+
           '<circle cx="'+(x2-6)+'" cy="33" r="4.5" fill="#f59e0b"/><circle cx="'+(x2+tw-3+6)+'" cy="33" r="4.5" fill="#f59e0b"/>';
    }
    W=n*(tw+12)+18;
    stem=n+" طاولات منفصلة، حول كلّ طاولةٍ 4 أشخاص كما في الشكل. كم شخصًا يجلس؟";
    why="الطاولات منفصلة فلا تُدمج المقاعد: 4 × "+n+" = "+correct+" شخصًا.";
  }
  else{
    /* مربّع مفرّغ: ن طاولة في كلّ ضلع، والزوايا مشتركة */
    n=ri(2,4); correct=4*n-4>0?4*n-4:4;
    var side=n, cell=30, pad=14;
    for(var r=0;r<side;r++) for(var c=0;c<side;c++){
      if(r>0 && r<side-1 && c>0 && c<side-1) continue;      // الداخل فارغ
      out+='<rect x="'+(pad+c*cell)+'" y="'+(pad+r*cell)+'" width="'+(cell-6)+'" height="'+(cell-6)+'" rx="3" fill="#fde68a" stroke="currentColor" stroke-width="1.5"/>';
    }
    W=side*cell+pad*2; H=side*cell+pad*2;
    stem="رُتِّبت طاولات على شكل مربّعٍ مفرّغٍ، في كلّ ضلعٍ "+n+" طاولة (وطاولات الزوايا مشتركة بين ضلعين). كم طاولةً في الشكل؟";
    why="4 أضلاع × "+n+" = "+(4*n)+"، لكنّ الزوايا الأربع عُدَّت مرّتين فنطرحها: "+(4*n)+" − 4 = "+correct+" طاولة.";
  }

  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+Math.min(300,W)+'" style="display:block;margin:10px auto;color:var(--ink)">'+out+'</svg>';
  var o=opt3(correct,[correct+2,correct-2,4*n,2*n]);
  return [stem+svg,o[0],o[1],why,"tr:"+mode+"-"+n+"-"+(s||0)];
}

/* ١٦) قراءة رسم بيانيّ بالأعمدة */
function gBarChart(lvl){
  var names=shuffle(["سالم","فارس","فهد","بدر","ياسر"]).slice(0,3);
  var vals=[], seen={};
  while(vals.length<3){ var v=ri(2,9)*5; if(seen[v]) continue; seen[v]=1; vals.push(v); }
  var mx=Math.max.apply(null,vals), cols=["#f97316","#a78bfa","#ef4444"], bars="";
  names.forEach(function(nm,i){
    var w=Math.round(150*vals[i]/mx), y=i*30+10;
    bars+='<text x="256" y="'+(y+13)+'" font-size="13" text-anchor="end" fill="currentColor">'+nm+'</text>'+
          '<rect x="'+(200-w)+'" y="'+y+'" width="'+w+'" height="17" rx="4" fill="'+cols[i]+'"/>'+
          '<text x="'+(194-w)+'" y="'+(y+13)+'" font-size="12" text-anchor="end" fill="currentColor">'+vals[i]+'</text>';
  });
  /* direction:ltr ضروري — في صفحة RTL ينقلب معنى text-anchor فتُقصّ الأسماء خارج الرسم */
  var svg='<svg viewBox="0 0 260 100" width="290" style="display:block;margin:10px auto;color:var(--ink);direction:ltr">'+bars+'</svg>';
  var kind=gp(["max","min","diff"]), stem, o, exp;
  if(kind==="diff"){
    var i1=ri(0,2), i2; do{ i2=ri(0,2); }while(i2===i1);
    var d=Math.abs(vals[i1]-vals[i2]);
    o=opt3(d,[d+5,d-5,vals[i1]+vals[i2]]);
    stem="يبيّن الرسم عدد الكتب التي قرأها كلّ طالب. كم الفرق بين "+names[i1]+" و"+names[i2]+"؟";
    exp="الفرق = "+Math.max(vals[i1],vals[i2])+" − "+Math.min(vals[i1],vals[i2])+" = "+d+".";
  } else {
    var want = kind==="max" ? Math.max.apply(null,vals) : Math.min.apply(null,vals);
    var who2 = names[vals.indexOf(want)];
    o=optS(who2, names.filter(function(x){return x!==who2;}).concat(["لا يمكن تحديده"]));
    stem="يبيّن الرسم عدد الكتب التي قرأها كلّ طالب. من قرأ "+(kind==="max"?"أكثر":"أقلّ")+" عددًا؟";
    exp=who2+" عمودُه "+(kind==="max"?"الأطول":"الأقصر")+" بـ"+want+" كتابًا.";
  }
  return [stem+svg,o[0],o[1],exp];
}

/* ١٧) عدّ الأعداد التي تحتوي رقمًا معيّنًا داخل مدى */
function gDigitCount(lvl){
  var d=ri(1,9), N=gp([30,40,50,55,60]), c=0;
  for(var i=1;i<=N;i++){ if(String(i).indexOf(String(d))>=0) c++; }
  var o=opt3(c,[c+1,c-1,c+2]);
  return ["كم عددًا يحتوي على الرقم "+d+" من 1 إلى "+N+"؟",o[0],o[1],
    "نعدّ الأعداد التي فيها الرقم "+d+" في الآحاد أو في العشرات، فنجدها "+c+" عددًا."];
}

/* ١٨) ترتيب أرقام لتكوين أكبر أو أصغر عدد */
function gBiggestNumber(lvl){
  var k=(lvl>=2)?5:4, ds=[], seen={}, t=0;
  while(ds.length<k && t<200){ t++; var v=ri(1,9); if(seen[v]) continue; seen[v]=1; ds.push(v); }
  if(ds.length<k) return null;
  var big=Math.random()<0.5;
  var sorted=ds.slice().sort(function(a,b){ return big?b-a:a-b; });
  var rev=ds.slice().sort(function(a,b){ return big?a-b:b-a; });
  var sw=sorted.slice(), tmp=sw[0]; sw[0]=sw[1]; sw[1]=tmp;
  var correct=+sorted.join("");
  var o=opt3(correct,[+rev.join(""),+sw.join(""),+ds.join("")]);
  return ["رتّب الأرقام "+ds.join("، ")+" لتكوين "+(big?"أكبر":"أصغر")+" عدد ممكن.",o[0],o[1],
    "نضع "+(big?"أكبر":"أصغر")+" رقم في أعلى منزلة ثمّ ننتقل إلى المنازل الأقلّ بالطريقة نفسها: "+sorted.join("")+"."];
}

/* ١٩) عدّ المربّعات/المستطيلات بكلّ الأحجام في شبكة m×n
   شبكة غير مربّعة + سؤال المستطيلات ⟵ عشرات الأشكال بدل ٣ فقط،
   حتى لا يحفظ الطالب الشكل بدل أن يعدّ. */
function gCountSquares(lvl){
  var hi=(lvl>=2)?5:4;
  var m=ri(2,hi), n=ri(2,hi);                 // m أعمدة × n صفوف
  var wantRect = (Math.random()<0.4) && lvl>=2;

  var mn=Math.min(m,n), sq=0, i;
  for(i=1;i<=mn;i++) sq += (m-i+1)*(n-i+1);   // عدد المربّعات بكلّ الأحجام
  var rects = (m*(m+1)/2) * (n*(n+1)/2);      // عدد المستطيلات بكلّ الأحجام
  var total = wantRect ? rects : sq;

  var cw = (Math.max(m,n)>=5) ? 22 : 26, out="";
  for(var r=0;r<n;r++){ for(var c=0;c<m;c++){
    out+='<rect x="'+(c*cw+2)+'" y="'+(r*cw+2)+'" width="'+cw+'" height="'+cw+'" fill="none" stroke="currentColor" stroke-width="2"/>';
  } }
  var W=m*cw+4, H=n*cw+4;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="display:block;margin:10px auto;color:var(--accent)">'+out+'</svg>';

  var o=opt3(total,[m*n, total+1, total-2, sq+m*n]);
  var stem = wantRect
    ? "كم مستطيلًا في الشكل التالي؟ (احسب المستطيلات بجميع الأحجام، والمربّع مستطيل)"
    : "كم مربّعًا في الشكل التالي؟ (احسب المربّعات بجميع الأحجام)";
  var why;
  if(wantRect){
    why = "نختار خطّين رأسيّين من "+(m+1)+" وخطّين أفقيّين من "+(n+1)+": "
        + (m*(m+1)/2)+" × "+(n*(n+1)/2)+" = "+rects+" مستطيلًا.";
  } else {
    var parts=[];
    for(i=1;i<=mn;i++) parts.push(i+"×"+i+": "+((m-i+1)*(n-i+1)));
    why = "الشبكة "+m+"×"+n+" — "+parts.join(" ، ")+" ← المجموع "+sq+" مربّعًا.";
  }
  return [stem+svg,o[0],o[1],why,"cs:"+m+"x"+n+(wantRect?"r":"s")];
}

/* ===== دفعة الاختبارات التجريبية ١١+ من الكتاب (كمّي ومكاني) ===== */

/* ٢٠) معادلات بالصور: رمزان بقيمتين ومعادلتان */
function gPicEquation(lvl){
  var pair=gp([["🏀","⚽"],["🍎","🍌"],["⭐","🔷"],["🐢","🐇"],["🔴","🟡"]]);
  var A=pair[0], B=pair[1], a=ri(2,9), b=ri(2,9);
  if(a===b) b = (b%9)+1;
  var askA = Math.random()<0.5, correct = askA?a:b;
  var o=opt3(correct,[correct+1,correct-1,askA?b:a]);
  var eq='<div style="direction:ltr;font-size:1.25rem;line-height:2.1;margin:8px 0">'+
    A+' + '+B+' + '+B+' = '+(a+2*b)+'<br>'+A+' + '+B+' = '+(a+b)+'</div>';
  return ["إذا كان:"+eq+"فما قيمة "+(askA?A:B)+"؟",o[0],o[1],
    "بطرح المعادلة الثانية من الأولى: "+B+" = "+(a+2*b)+" − "+(a+b)+" = "+b+"، ومنها "+A+" = "+a+"."];
}

/* ٢١) عدّ المسارات — مبدأ الضرب */
function gPaths(lvl){
  /* مرحلتان أو ثلاث، وعدد الطرق حتى ٥ ⟵ عشرات الأشكال بدل ٩. */
  var three = (lvl>=2) && Math.random()<0.45;
  var legs = three ? [ri(2,4),ri(2,4),ri(2,3)] : [ri(2,5),ri(2,5)];
  var correct = legs.reduce(function(a,b){ return a*b; }, 1);
  var LAB=["أ","ب","ج","د"], COL=["#f97316","#7c3aed","#0891b2"];
  var nodes=legs.length+1, W=three?300:260;
  var xs=[]; for(var i=0;i<nodes;i++) xs.push(28 + i*((W-56)/(nodes-1)));

  var arcs=function(x1,x2,n,base){
    var s="";
    for(var i=0;i<n;i++){
      var dy=(i-(n-1)/2)*12;
      s+='<path d="M'+x1.toFixed(1)+',40 Q'+((x1+x2)/2).toFixed(1)+','+(40+dy*1.9).toFixed(1)+' '+x2.toFixed(1)+',40" fill="none" stroke="'+base+'" stroke-width="2"/>';
    }
    return s;
  };
  var body="";
  for(var L=0;L<legs.length;L++) body+=arcs(xs[L],xs[L+1],legs[L],COL[L]);
  var FILL=["#0ea5e9","#f472b6","#22c55e","#eab308"];
  for(var k=0;k<nodes;k++){
    body+='<circle cx="'+xs[k].toFixed(1)+'" cy="40" r="15" fill="'+FILL[k]+'"/>'+
          '<text x="'+xs[k].toFixed(1)+'" y="45" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">'+LAB[k]+'</text>';
  }
  var svg='<svg viewBox="0 0 '+W+' 80" width="'+(W+10)+'" style="display:block;margin:10px auto;direction:ltr">'+body+'</svg>';

  var parts=[];
  for(var p=0;p<legs.length;p++) parts.push("من ("+LAB[p]+") إلى ("+LAB[p+1]+") "+legs[p]+" طرق");
  var sum=legs.reduce(function(a,b){ return a+b; },0);
  var o=opt3(correct,[sum, correct+1, correct-1, legs[0]+legs[1]]);
  return [parts.join("، ")+". فكم طريقًا من (أ) إلى ("+LAB[nodes-1]+")؟"+svg, o[0],o[1],
    "نضرب عدد خيارات كلّ مرحلة: "+legs.join(" × ")+" = "+correct+" طريقًا.","pa:"+legs.join("-")];
}

/* ٢٢) فخّ منطقي: التزامن لا يضاعف الزمن */
function gTrap(lvl){
  var t=gp([
    {q:function(n){ return "فترة حمل الفأر الواحد "+n+" يومًا. فكم تكون فترة حمل توأم من الفئران؟"; },
     e:function(n){ return "التوأم يحملان في الوقت نفسه، فالمدّة تبقى "+n+" يومًا ولا تتضاعف."; }, lo:14, hi:22},
    {q:function(n){ return "تُطبخ البيضة الواحدة في "+n+" دقائق. فكم تحتاج ثلاث بيضات تُطبخ معًا في القِدر نفسه؟"; },
     e:function(n){ return "تُطبخ الثلاث في وقت واحد، فالزمن يبقى "+n+" دقائق."; }, lo:4, hi:9},
    {q:function(n){ return "تحترق الشمعة في "+n+" دقيقة. فكم تستغرق شمعتان تُشعلان معًا؟"; },
     e:function(n){ return "الشمعتان تحترقان في الوقت نفسه، فالزمن يبقى "+n+" دقيقة."; }, lo:20, hi:60}
  ]);
  var n=ri(t.lo,t.hi);
  var o=opt3(n,[n*2,n*3,Math.round(n/2)]);
  return [t.q(n),o[0],o[1],t.e(n)];
}

/* ٢٣) أيام الأسبوع بعد عدد من الأيام */
var WDAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function gWeekday(lvl){
  var i=ri(0,6), n=ri(9,60), j=(i+n)%7, correct=WDAYS[j];
  var o=optS(correct, WDAYS.filter(function(d){ return d!==correct; }));
  return ["إذا كان اليوم هو "+WDAYS[i]+"، فبعد "+n+" يومًا سيكون يوم:",o[0],o[1],
    n+" ÷ 7 باقيها "+(n%7)+"، فنعدّ "+(n%7)+" يومًا بعد "+WDAYS[i]+" فنصل إلى "+correct+"."];
}

/* ٢٤) تناظر الوحدات */
var UNITS=[[12,"شهر","سنة"],[7,"يوم","أسبوع"],[60,"دقيقة","ساعة"],[24,"ساعة","يوم"],
           [100,"سنة","قرن"],[10,"سنوات","عقد"],[1000,"غرام","كيلوغرام"],[100,"سنتيمتر","متر"]];
function gUnitAnalogy(lvl){
  var u=gp(UNITS), correct=u[2];
  var o=optS(correct, UNITS.filter(function(x){ return x[2]!==correct; }).map(function(x){ return x[2]; }));
  return ["أكمل بالعلاقة نفسها:  1 : "+u[0]+"   مثل   "+u[1]+" : ؟",o[0],o[1],
    "في الـ"+u[2]+" الواحد "+u[0]+" "+u[1]+"."];
}

/* ٢٥) طيّ المكعب: أيّ وجهين متقابلان في المخطط الصليبي */
function gCubeOpposite(lvl){
  var S=shuffle(["🔺","🔵","⭐","🟩","🟣","🔶"]).slice(0,6);
  /* المخطط:      S0
                S1 S2 S3
                  S4
                  S5        المتقابلات: S0–S4 · S1–S3 · S2–S5 */
  var pairs=[[0,4],[1,3],[2,5]];
  var right=gp(pairs), correct=S[right[0]]+" و "+S[right[1]];
  var wrong=[], t=0;
  while(wrong.length<3 && t<200){
    t++;
    var a=ri(0,5), b=ri(0,5);
    if(a===b) continue;
    var isPair=pairs.some(function(p){ return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a); });
    if(isPair) continue;
    var s=S[a]+" و "+S[b];
    if(wrong.indexOf(s)<0) wrong.push(s);
  }
  if(wrong.length<3) return null;
  var o=optS(correct,wrong);
  var c=34, cell=function(col,row,sym){
    return '<rect x="'+(col*c+2)+'" y="'+(row*c+2)+'" width="'+(c-4)+'" height="'+(c-4)+'" fill="none" stroke="currentColor" stroke-width="2"/>'+
           '<text x="'+(col*c+c/2)+'" y="'+(row*c+c/2+7)+'" text-anchor="middle" font-size="17">'+sym+'</text>';
  };
  var svg='<svg viewBox="0 0 '+(3*c+4)+' '+(4*c+4)+'" height="'+(4*c+4)+'" style="display:block;margin:10px auto;color:var(--accent);direction:ltr">'+
    cell(1,0,S[0])+cell(0,1,S[1])+cell(1,1,S[2])+cell(2,1,S[3])+cell(1,2,S[4])+cell(1,3,S[5])+'</svg>';
  /* تلميح توجيهي لا يكشف القاعدة: يوجّه الطفل لتخيّل الطيّ، ويبقى الاستنتاج عليه */
  var hint='<div style="font-size:.86rem;color:var(--muted);margin-top:4px">💡 تخيّل المربّعات وهي تُطوى لأعلى حول المربّع الأوسط.</div>';
  return ["عند طيّ هذا المخطّط ليصير مكعّبًا، أيّ شكلين يقعان على وجهين متقابلين؟"+svg+hint,
    o[0],o[1],"في المخطّط الصليبي يتقابل الوجهان اللذان يفصل بينهما وجه واحد: "+correct+"."];
}

/* ٢٦) مصفوفة بصرية ٣×٣ — كل صفّ وكل عمود فيه الأشكال الثلاثة */
function gMatrix(lvl){
  var E=shuffle(["🔴","🟡","🔵","🟢","🟣","🟠"]).slice(0,3);
  var extra=gp(["⬛","⭐","🔺","💠"]);
  var hr=ri(0,2), hc=ri(0,2), correct=E[(hr+hc)%3];
  var rows="";
  for(var r=0;r<3;r++){
    var cells="";
    for(var c2=0;c2<3;c2++){
      var isHole=(r===hr&&c2===hc);
      cells+='<td style="border:1.5px solid var(--line);width:44px;height:44px;text-align:center;font-size:1.35rem">'+
             (isHole?'<span style="color:var(--accent);font-weight:800">؟</span>':E[(r+c2)%3])+'</td>';
    }
    rows+='<tr>'+cells+'</tr>';
  }
  var tbl='<table style="border-collapse:collapse;margin:10px auto;direction:ltr">'+rows+'</table>';
  var o=optS(correct, E.filter(function(x){ return x!==correct; }).concat([extra]));
  return ["ما الشكل الذي يكمل المجموعة؟"+tbl,o[0],o[1],
    "في كلّ صفّ وكلّ عمود تظهر الأشكال الثلاثة مرّة واحدة، والناقص هنا هو "+correct+"."];
}

/* ===== المرايا وطيّ الورق ===== */
function _grid(cells, cols, rows, cell, holes){
  var c=cell||18, s="";
  for(var r=0;r<rows;r++){ for(var k=0;k<cols;k++){
    var on = cells.some(function(x){ return x[0]===r && x[1]===k; });
    s+='<rect x="'+(k*c+1)+'" y="'+(r*c+1)+'" width="'+(c-2)+'" height="'+(c-2)+
       '" fill="'+(on&&!holes?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.2"/>';
    if(on&&holes) s+='<circle cx="'+(k*c+c/2)+'" cy="'+(r*c+c/2)+'" r="'+(c*0.26)+'" fill="currentColor"/>';
  } }
  return s;
}
function _svg(inner, cols, rows, cell, h){
  var c=cell||18;
  return '<svg viewBox="0 0 '+(cols*c+2)+' '+(rows*c+2)+'" height="'+(h||60)+
         '" style="color:var(--accent);vertical-align:middle;direction:ltr">'+inner+'</svg>';
}
function _key(cells){ return cells.map(function(x){ return x[0]*10+x[1]; }).sort(function(a,b){ return a-b; }).join(","); }

/* ٢٩) صورة المرآة — يُتحقَّق أن الشكل لا يطابق صورته بأيّ دوران (وإلا فلا إجابة مميّزة) */
function gMirror(lvl){
  var rot=function(cs){ return cs.map(function(x){ return [x[1], 2-x[0]]; }); };
  var mir=function(cs){ return cs.map(function(x){ return [x[0], 2-x[1]]; }); };
  for(var t=0;t<80;t++){
    var all=[]; for(var r=0;r<3;r++) for(var k=0;k<3;k++) all.push([r,k]);
    var cells=shuffle(all).slice(0, ri(3,4));
    var r1=rot(cells), r2=rot(r1), r3=rot(r2), m=mir(cells);
    var rots=[_key(cells),_key(r1),_key(r2),_key(r3)];
    if(rots.indexOf(_key(m))>=0) continue;              /* الشكل غير أصيل الانعكاس */
    var opts=[m, cells, r1, r2];
    var keys=opts.map(_key);
    if(new Set(keys).size!==4) continue;
    var svgs=opts.map(function(cs){ return _svg(_grid(cs,3,3),3,3); });
    var o=optS(svgs[0], svgs.slice(1));
    return ["أيّ الأشكال هو صورة هذا الشكل في مرآة رأسية؟<div style=\"margin:8px 0\">"+
      _svg(_grid(cells,3,3),3,3,18,74)+"</div>", o[0], o[1],
      "صورة المرآة تقلب اليمين واليسار ولا تُدير الشكل؛ فما كان في العمود الأيمن ينتقل إلى الأيسر.", "mir"];
  }
  return null;
}

/* ٣٠) طيّ الورق والثقب: تُطوى الورقة نصفين رأسيًّا ثم تُثقب، فما شكلها مفرودة؟ */
function gPaperFold(lvl){
  for(var t=0;t<60;t++){
    var n=4, nh=(lvl>=2)?ri(1,2):1, half=[], seen={};
    while(half.length<nh){
      var r=ri(0,n-1), c=ri(0,1), k=r*10+c;
      if(seen[k]) continue; seen[k]=1; half.push([r,c]);
    }
    var full=[];                                   /* الثقب وانعكاسه حول خطّ الطيّ */
    half.forEach(function(h){ full.push([h[0],h[1]]); full.push([h[0], n-1-h[1]]); });
    var wrong=[
      half.slice(),                                /* بلا انعكاس */
      full.map(function(h){ return [n-1-h[0], h[1]]; }),   /* انعكاس أفقيّ خاطئ */
      half.map(function(h){ return [h[0], h[1]+2]; }).concat(half)   /* إزاحة بدل الانعكاس */
    ];
    var keys=[_key(full)].concat(wrong.map(_key));
    if(new Set(keys).size!==4) continue;
    var mk=function(cs){ return _svg(_grid(cs,n,n,16,true),n,n,16,66); };
    var o=optS(mk(full), wrong.map(mk));
    /* خطّ الطيّ يُرسم داخل الشكل على حافّته لا كنصّ بجانبه: في صفحة RTL ينقلب
       ترتيب العنصرين فيصير السهم مشيرًا إلى الجهة الخطأ. */
    var foldLine='<line x1="'+(2*16+1)+'" y1="0" x2="'+(2*16+1)+'" y2="'+(n*16+2)+
      '" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 3"/>';
    var fold=_svg(_grid(half,2,n,16,true)+foldLine,2,n,16,70);
    return ["طُويت ورقة مربّعة نصفين حول الخطّ المنقّط، ثمّ ثُقبت كما في الشكل. فما شكلها بعد فردها؟"+
      '<div style="margin:8px 0;text-align:center">'+fold+'</div>',
      o[0], o[1],
      "عند الفرد يظهر لكلّ ثقب ثقبٌ مقابل على الجهة الأخرى من خطّ الطيّ، فيصير العدد "+full.length+" ثقوب.", "fold"];
  }
  return null;
}

/* ===== ألغاز الاستنتاج: تُولَّد ثم يُتحقَّق من وحدانيّة حلّها قبل عرضها ===== */
function permsOf(arr){
  if(arr.length<=1) return [arr.slice()];
  var out=[];
  for(var i=0;i<arr.length;i++){
    var rest=arr.slice(0,i).concat(arr.slice(i+1));
    permsOf(rest).forEach(function(p){ out.push([arr[i]].concat(p)); });
  }
  return out;
}
var PERM4 = permsOf([0,1,2,3]);

/* ٢٧) الاستنتاج بالاستبعاد: أربعة أشخاص وأربع وسائل */
var VEH=["السيارة","الطائرة","القطار","السفينة"];   /* 0 برّ · 1 جوّ · 2 برّ · 3 بحر */
function gElimination(lvl){
  for(var t=0;t<60;t++){
    var names=shuffle(["محمد","عليّ","مازن","خالد","سعد","فهد"]).slice(0,4);
    var assign=gp(PERM4);                 /* assign[i] = رقم وسيلة الشخص i */
    var air=assign.indexOf(1), car=assign.indexOf(0);
    var others=[0,1,2,3].filter(function(i){ return i!==air && i!==car; });
    var k=gp(others), notV=(assign[k]===2)?3:2;
    var preds=[
      function(a){ return a[air]===1; },
      function(a){ return a[car]===0; },
      function(a){ return a[k]!==notV; }
    ];
    var sols=PERM4.filter(function(a){ return preds.every(function(f){ return f(a); }); });
    if(sols.length!==1) continue;         /* لا نعرض لغزًا له أكثر من حلّ */
    var ask=others.filter(function(i){ return i!==k; })[0];
    var correct=VEH[assign[ask]];
    var o=optS(correct, VEH.filter(function(v){ return v!==correct; }));
    var clues='<div style="margin:8px 0;font-weight:600">'+
      '– '+names[air]+' لم يسافر برًّا ولا بحرًا.<br>'+
      '– '+names[car]+' سافر بسيارته الخاصّة.<br>'+
      '– '+names[k]+' لم يسافر بـ'+VEH[notV]+'.</div>';
    return ["سافر "+names.join(" و")+" بوسائل مختلفة (سيارة – طائرة – قطار – سفينة)، فإذا كان:"+clues+
      "فبِمَ سافر "+names[ask]+"؟", o[0], o[1],
      names[air]+" بالطائرة، و"+names[car]+" بالسيارة، و"+names[k]+" ليس بـ"+VEH[notV]+
      "، فلم يبقَ لـ"+names[ask]+" إلّا "+correct+".", "elim"];
  }
  return null;
}

/* ٢٨) الترتيب من قيود */
function gOrderConstraints(lvl){
  for(var t=0;t<80;t++){
    var names=shuffle(["سالم","خالد","سعيد","يوسف","بدر","ماجد"]).slice(0,4);
    var order=gp(PERM4);                  /* order[المركز] = رقم الاسم */
    var first=order[0], preds=[function(o){ return o[0]===first; }];
    var texts=["كان "+names[first]+" أوّل الواصلين"];
    shuffle([[0,1],[0,2],[1,2],[1,3],[2,3]]).slice(0,2).forEach(function(pr){
      var a=order[pr[0]], b=order[pr[1]];
      texts.push("ووصل "+names[a]+" قبل "+names[b]);
      preds.push(function(o){ return o.indexOf(a) < o.indexOf(b); });
    });
    var sols=PERM4.filter(function(o){ return preds.every(function(f){ return f(o); }); });
    if(sols.length!==1) continue;
    var nm=function(o){ return o.map(function(i){ return names[i]; }).join(" ، "); };
    var correct=nm(order);
    var cand=shuffle(PERM4.filter(function(o){ return o.join()!==order.join(); })).slice(0,6).map(nm);
    var o2=optS(correct,cand);
    return ["تسابق أربعة أصدقاء ("+names.join(" ، ")+")، "+texts.join("، ")+
      ". فما ترتيب وصولهم من الأوّل إلى الأخير؟", o2[0], o2[1],
      "القيود لا يحقّقها إلّا ترتيب واحد: "+correct+".", "ord"];
  }
  return null;
}

/* أسئلة الكتاب تُعرض أوّلًا حسب ترتيبه، ويُحفظ موضع الطفل محليًّا حتى لا تتكرّر.
   بعد أن يُنهي الكتاب يتولّى التوليد فيمدّه بأسئلة جديدة بلا نهاية. */
function bookKey(kind){ return "moheba_book_"+who+"_"+kind; }
function bookTake(kind, n){
  var B = (window.MOHEBA_BOOK && window.MOHEBA_BOOK[kind]) || [];
  if(!B.length || !n) return [];
  var at = 0;
  try{ at = parseInt(localStorage.getItem(bookKey(kind))||"0",10)||0; }catch(e){}
  if(at >= B.length) return [];
  var out = B.slice(at, at+n).map(function(q){
    /* أسئلة الكتاب مكتوبة والإجابة الصحيحة أوّلًا؛ نخلط الخيارات عند العرض
       حتى لا يتعوّد الطفل على أن الجواب دائمًا في الخيار الأوّل. */
    var right = q[1][q[2]], o = shuffle(q[1].slice());
    var c = [q[0], o, o.indexOf(right), q[3]];
    c.gen = "📘 " + (SKILL_BOOK[kind] || "أسئلة الكتاب");
    return c;
  });
  try{ localStorage.setItem(bookKey(kind), String(at+out.length)); }catch(e){}
  return out;
}
var SKILL_BOOK = { vis:"تناظر بصري (الكتاب)", verb:"لفظي (الكتاب)", math:"كمّي (الكتاب)", gk:"معرفة عامة (الكتاب)" };
function genN(gens,n,seen){
  var out=[],t=0; seen = seen || {};
  while(out.length<n && t<n*30){
    var f=gp(gens), q;
    try{ q=f(lvl); }catch(e){ t++; continue; }
    t++;
    // نمنع التكرار بمفتاح المولّد ونصّ السؤال معًا: بعض المولّدات تعطي نفس النصّ
    // بمفتاح مختلف، فبدون فحص النصّ يتسرّب سؤال مكرّر.
    var _k=(q&&q[4])||(q&&q[0]), _t=(q&&q[0]);
    if(!q||seen[_k]||seen[_t]) continue;
    seen[_k]=1; seen[_t]=1;
    q.gen = SKILL_AR[f.name] || f.name || "غير محدّد";
    q._fn = f.name;
    out.push(q);
  }
  return out;
}

/* ===== تركيز الجولة + المراجعة المتباعدة =====
   جولة فيها سؤال واحد عن ثلاثين مهارة لا تكشف شيئًا، فنركّز على ثلاث مهارات.
   واختيارها ليس عشوائيًا: المهارة التي يخطئ فيها ترجع بعد يوم، ثم يومين، ثم
   أربعة، ثم أسبوع — والتي يتقنها تبتعد. هذا هو أثر التباعد في الترسيخ. */
var FOCUS_N = 3;
var SR_DAYS = [0, 1, 2, 4, 7];          // فترة الانتظار حسب درجة الإتقان
function srKey(kind){ return "kang_sr_"+who+"_"+kind; }
function srLoad(kind){ try{ return JSON.parse(localStorage.getItem(srKey(kind))||"{}") || {}; }catch(e){ return {}; } }
function srSave(kind,o){ try{ localStorage.setItem(srKey(kind), JSON.stringify(o)); }catch(e){} }

function focusGens(kind, gens){
  var st = srLoad(kind), now = Date.now(), DAY = 86400000;
  var scored = gens.map(function(f){
    var s = st[f.name];
    if(!s || !s.n) return {f:f, a:0, b:0, r:Math.random()};      // لم تُجرَّب بعد → الأولوية القصوى
    var acc = s.c / s.n;
    var due = (now - (s.last||0)) >= SR_DAYS[Math.min(s.box||0, SR_DAYS.length-1)] * DAY;
    return {f:f, a:(due?1:2), b:acc, r:Math.random()};           // المستحقّة أوّلًا، والأضعف قبل الأقوى
  });
  scored.sort(function(x,y){ return (x.a-y.a) || (x.b-y.b) || (x.r-y.r); });
  return scored.slice(0, Math.min(FOCUS_N, scored.length)).map(function(x){ return x.f; });
}

/* يُستدعى عند حفظ الجولة: يحدّث الإتقان وموعد المراجعة القادمة */
function srCommit(kind, round){
  var st = srLoad(kind), now = Date.now();
  Object.keys(round).forEach(function(fn){
    var r = round[fn];
    if(!r || !r.t) return;
    var s = st[fn] || (st[fn] = {n:0, c:0, box:0, last:0});
    s.n += r.t; s.c += r.c; s.last = now;
    var acc = r.c / r.t;
    if(acc >= 0.8)      s.box = Math.min(SR_DAYS.length-1, (s.box||0) + 1);
    else if(acc < 0.5)  s.box = 0;
    else                s.box = Math.max(0, (s.box||0) - 1);
  });
  srSave(kind, st);
}

      if(kind==="math" && MATH_BOOST.length){
        // أولوية إضافية لأيام الأسبوع (أعند نقطة): نضمن سؤالين على الأقل في كل جولة.
        var prio = c.gens.filter(function(f){ return f.name==="gWeekday"; });
        if(prio.length) gen = genN(prio, 2, seen);
        var boostGens = c.gens.filter(function(f){ return MATH_BOOST.indexOf(f.name)>=0; });
        if(boostGens.length) gen = gen.concat(genN(boostGens, Math.ceil(need*0.4)-gen.length, seen));
      }
      gen = gen.concat(genN(focusGens(kind, c.gens), need - gen.length, seen));
      /* بعض المولّدات لا تنتج إلا سؤالًا واحدًا في الجولة (مفتاح تكرار ثابت)،
         فنكمّل النقص من بقيّة المولّدات حتى لا تقصر الجولة. */
      if(gen.length < need) gen = gen.concat(genN(c.gens, need - gen.length, seen));
      items = items.concat(gen);
    }
    // لو قصرت الجولة بسبب تفادي المكرّر (بنك صغير)، نكمّلها بالسماح بتكرار قديم حتى لا تنقص.
    if(items.length < QN){
      var s2={}; items.forEach(function(q){ if(q){ if(q[4])s2[q[4]]=1; if(q[0])s2[q[0]]=1; } });
      items = items.concat(genN(c.gens, QN - items.length, s2));
    }
    // نحدّث الذاكرة: نصوص هذه الجولة أوّلًا ثم القديم، بلا تكرار، حدّ ٢٠.
    var _mem=[], _ms={};
    /* نخزّن مفتاح المولّد إن وُجد بدل النصّ الكامل: أدقّ في منع تكرار نفس الشكل،
       وأخفّ بكثير من تخزين رسوم SVG كاملة في localStorage. */
    items.map(function(q){ return (q && (q[4]||q[0]))||""; }).concat(recent).forEach(function(k){ if(k && !_ms[k]){ _ms[k]=1; _mem.push(k); } });
    try{ localStorage.setItem(recentKey, JSON.stringify(_mem.slice(0,20))); }catch(e){}
    var html = '';
    // صندوق دروس الشرح (فيديو) لأصعب مهارات الاستدلال الرياضي — يبرز الأضعف حسب بيانات الطفل.
    if(kind==="math"){
      var st = srLoad("math");
      var vids = Object.keys(VIDEO_Q).map(function(fn){
        var s = st[fn], acc = (s && s.n) ? s.c/s.n : null, n = (s && s.n) || 0;
        return { fn:fn, name:(SKILL_AR[fn]||fn), acc:acc, n:n, weak:(acc!=null && n>=2 && acc<0.5) };
      });
      vids.sort(function(a,b){ return (a.weak===b.weak ? ((a.acc==null?9:a.acc)-(b.acc==null?9:b.acc)) : (a.weak?-1:1)); });
      var rows = vids.map(function(v){
        var pct = v.acc!=null ? Math.round(v.acc*100) : null;
        var badge = pct==null ? '' : ' <span style="color:'+(v.weak?'var(--bad)':'var(--muted)')+';font-weight:800;font-size:.85rem">('+pct+'%)</span>';
        var url = 'https://www.youtube.com/results?search_query='+encodeURIComponent(VIDEO_Q[v.fn]);
        return '<a href="'+url+'" target="_blank" rel="noopener" style="display:block;text-decoration:none;padding:9px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:700">🎬 '+v.name+badge+'</a>';
      }).join('');
      var anyWeak = vids.some(function(v){ return v.weak; });
      html += '<details '+(anyWeak?'open':'')+' style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:10px;box-shadow:var(--shadow)">'+
        '<summary style="font-weight:800;cursor:pointer;padding:8px 0">🎬 دروس شرح (فيديو) للمهارات الصعبة'+(anyWeak?' — عندك مهارة تحت ٥٠٪':'')+'</summary>'+
        '<div style="padding:2px 0 8px"><p style="color:var(--muted);font-size:.82rem;margin:2px 0 6px">شاهد الشرح ثم ارجع حُلّ الأسئلة تحت.</p>'+rows+'</div></details>';
    }
    html += '<div class="intro">'+c.intro+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div>';
      if(input){
        html += '<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><input class="ans" inputmode="numeric" placeholder="اكتب الإجابة..." style="flex:1;min-width:120px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1.15rem;font-weight:700;font-family:inherit;text-align:center">'+
          '<button class="chk" style="background:var(--accent);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit">تحقّق ✅</button></div>';
      } else {
        html += '<div class="opts">';
        q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
        html += '</div>';
      }
      html += '<div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score dir="ltr">0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false;
    var scoreEl = sec.querySelector("[data-score]");
    var t0=Date.now(), lastTs=t0, fast=0;
    /* تسجيل تفصيلي: صح/خطأ لكل مهارة على حدة، ليعرف التقرير أين الضعف بالضبط */
    var skills={}, srRound={};
    function mark(i, ok){
      var g=(items[i] && items[i].gen) || "غير محدّد";
      var s=skills[g] || (skills[g]={c:0,t:0});
      s.t++; if(ok) s.c++;
      var fn=(items[i] && items[i]._fn);
      if(fn){ var r=srRound[fn] || (srRound[fn]={c:0,t:0}); r.t++; if(ok) r.c++; }
    }
    function meta(n){ return {dur:Math.round((Date.now()-t0)/1000), fast:fast, trusted:(fast<Math.ceil(n/2)), skills:skills}; }
    function savePartial(){ var n=Object.keys(answered).length; if(saved||n<3) return; saved=true; srCommit(kind, srRound); saveScore(c.label, correct, n, meta(n)); }
    sec._leave = savePartial; sec._done=function(){ return saved; };
    function afterAnswer(){ var now=Date.now(); if(now-lastTs<1500) fast++; lastTs=now; scoreEl.textContent = correct+" / "+total; if(Object.keys(answered).length===total && !saved){ saved=true; srCommit(kind, srRound); saveScore(c.label, correct, total, meta(total)); } }
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2], correctVal=items[i][1][ans];
      if(input){
        var inp=qEl.querySelector(".ans"), chk=qEl.querySelector(".chk"), exp=qEl.querySelector(".explain");
        function submit(){
          if(answered[i]) return; if(normNum(inp.value)==="") return; answered[i]=1;
          inp.disabled=true; chk.disabled=true;
          var ok = normNum(inp.value)===normNum(correctVal);
          mark(i, ok);
          if(ok){ correct++; inp.style.borderColor="var(--good)"; inp.style.color="var(--good)"; }
          else{ inp.style.borderColor="var(--bad)"; inp.style.color="var(--bad)"; exp.innerHTML='<b style="color:var(--good)">الإجابة: '+correctVal+'</b> — '+items[i][3]; }
          exp.classList.add("show"); afterAnswer();
        }
        chk.addEventListener("click", submit);
        inp.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
      } else {
        qEl.querySelectorAll(".opts button").forEach(function(btn){
          btn.addEventListener("click",function(){
            if(answered[i]) return; answered[i]=1;
            qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
            var ok=(+btn.dataset.j===ans);
            mark(i, ok);
            if(ok){ btn.classList.add("correct"); correct++; }
            else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
            qEl.querySelector(".explain").classList.add("show");
            afterAnswer();
          });
        });
      }
    });
    var resetBtn = sec.querySelector(".reset");
    resetBtn.addEventListener("click", function(){
      /* منع تكديس جولات جديدة بلا حلّ — الضغط المتتالي على «أسئلة جديدة» يضيّع أثر التباعد. */
      var done = Object.keys(answered).length, need = Math.ceil(total*0.6);
      if(done < need){
        resetBtn.textContent = "✍️ خلّص جولتك أول ("+done+"/"+total+")";
        setTimeout(function(){ resetBtn.textContent = "أسئلة جديدة 🔄"; }, 2200);
        return;
      }
      savePartial(); render(kind);
    });
  }
  // ===== البند ١: خطة اليوم — قسمان بالتناوب (ثابتان خلال اليوم، يدوران كل يوم) =====
  var LABELS={math:"🔢 استدلال رياضي",verb:"🧩 استدلال لغوي",gk:"🌍 معرفة عامة",vis:"👁️ فهم الصور"};
  // «معرفة عامة» استرجاع معلومات لا تفكير (٤ ث/سؤال) فتُنهي الجلسة بسرعة —
  // فأخرجناها من خطة اليوم وحصرناها في مهارات التفكير الحقيقية (رياضي/لغوي/صور).
  // تبقى متاحة كتبويب اختياري. الجرعة تنصّ: «قسمان من مهارات التفكير».
  var PLAN=[["math","verb"],["verb","vis"],["vis","math"]];
  var dayNum=Math.floor((Date.now()+3*3600000)/86400000);        // يوم السعودية
  var todays=PLAN[dayNum % PLAN.length];
  // نبرز قسمَي اليوم في التبويبات
  document.querySelectorAll(".tabs button").forEach(function(b){
    if(todays.indexOf(b.dataset.tab)>=0){ b.textContent="⭐ "+b.textContent; b.style.outline="2px solid var(--accent)"; }
  });

  // ===== البند ٢: ميزانية وقت الجلسة (سعود/أسامة ١٠-١٢ د · رفيف/حسن ١٥-٢٠ د) =====
  var YOUNG=(who==="saud"||who==="osama");
  var softMin=YOUNG?10:15, hardMin=YOUNG?12:20;
  var t0=Date.now(), doseDone=false;
  var planEl=document.getElementById("plan");
  function renderPlan(){
    var el=Math.floor((Date.now()-t0)/60000), sec=Math.floor(((Date.now()-t0)%60000)/1000);
    var clock=el+":"+String(sec).padStart(2,"0");
    var col=el>=hardMin?"var(--bad)":(el>=softMin?"#d97706":"var(--muted)");
    var timeHtml='<span style="font-weight:800;color:'+col+'">⏱️ <span dir="ltr">'+clock+' / '+hardMin+'</span> د</span>';
    if(el>=hardMin && !doseDone){ doseDone=true; }
    var note = doseDone ? '<span style="color:var(--bad);font-weight:800">🎉 كفاية اليوم — خلّصت جرعتك، ارتاح وباجر نكمّل</span>'
             : (el>=softMin ? '<span style="color:#d97706;font-weight:700">قربت تخلّص — أنهِ جولتك الحالية</span>' : '');
    planEl.innerHTML='<span style="font-weight:800">📅 خطة اليوم: <span style="color:var(--accent)">'+LABELS[todays[0]]+'</span> + <span style="color:var(--accent)">'+LABELS[todays[1]]+'</span></span>'+
      '<span style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+note+timeHtml+'</span>';
  }
  renderPlan(); setInterval(renderPlan, 1000);

  // نبدأ بأول قسم في خطة اليوم بدل «رياضي» دائمًا
  document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected", String(x.dataset.tab===todays[0])); });
  document.getElementById(todays[0]).classList.add("active");
  render(todays[0]);
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
      var id=b.dataset.tab, pan=document.getElementById(id); pan.classList.add("active");
      if(!pan.innerHTML || (pan._done && pan._done())) render(id);
    });
  });
  // لا نحفظ جزئيًا عند مجرّد اختفاء الصفحة (فتح فيديو يوتيوب ثم الرجوع لإكمال الجولة)،
  // وإلا قُفل الحفظ على جزء ناقص فلم يُسجَّل الاختبار كاملًا. الحفظ الجزئي يبقى عند
  // تبديل القسم فعليًا (معالِج التبويبات). حالة الجولة تبقى محفوظة في الذاكرة عند الرجوع.
}
</script>
</body>
</html>
