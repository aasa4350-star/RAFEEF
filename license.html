<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الرخصة المهنية — التربوي العام</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#b45309; --accent-deep:#92400e;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:105px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;text-align:right;line-height:1.7}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:420px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"khassa").toLowerCase();
var NAMES = {khassa:"التربية الخاصة"};
var GRADES = {khassa:"الرخصة المهنية — التربوي العام"};
var name = NAMES[who] || "التربية الخاصة";

var SUPA_URL = APP_CONFIG.supaUrl;
var SUPA_KEY = APP_CONFIG.supaKey;
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function en(s){ return '<span class="en">'+s+'</span>'; }

/* ══════════════════════════════════════════════════════════════════
   الرخصة المهنية للمعلمين — الاختبار التربويّ العامّ
   الصيغة: [السؤال، [الصحيح، مشتت، مشتت]، الشرح]
   ══════════════════════════════════════════════════════════════════ */

/* ١) نظريات التعلّم */
var THEO = [
  ["صاحب نظرية الإشراط الكلاسيكيّ (الاستجابة الشرطية) هو:",
    ["بافلوف","سكنر","ثورندايك"],

  ["التعلّم بالاستبصار (الفهم المفاجئ للعلاقات) من نظرية:",
    ["الجشتالت عند كوهلر","السلوكية عند سكنر","التعلّم الاجتماعي عند باندورا"],

  ["صاحب «التعلّم بالاكتشاف» و«المنهج الحلزونيّ» هو:",
    ["برونر","أوزوبل","جانييه"],
    "برونر يرى أن يكتشف المتعلّم المعرفة بنفسه، ونادى بالمنهج الحلزونيّ الذي تُعاد فيه المفاهيم بعمقٍ متزايد."],
  ["«المنظّمات المتقدّمة» و«التعلّم ذو المعنى» من إسهامات:",
    ["أوزوبل","باندورا","ماسلو"],
    "أوزوبل صاحب التعلّم ذي المعنى، والمنظّم المتقدّم: مادّةٌ تمهيدية تُقدَّم قبل الدرس لتربط الجديد بمعرفة المتعلّم السابقة."],
  ["التعلّم بالملاحظة والنمذجة (التعلّم الاجتماعيّ) من نظرية:",
    ["باندورا","سكنر","ثورندايك"],
    "باندورا صاحب نظرية التعلّم الاجتماعيّ: يتعلّم الفرد بملاحظة الآخرين وتقليدهم دون أن يمارس السلوك بنفسه."],

/* ٢) مراحل النموّ وخصائص المتعلّمين */

function bankExpl(p){ return (typeof p[2] === "number") ? p[3] : p[2]; }
function bankGen(bank){ return function(){ var p=gp(bank); var o=[p[1][0],p[1][1],p[1][2]]; shuffle(o); return [p[0], o, o.indexOf(p[1][0]), bankExpl(p)]; }; }
var THEOG=[bankGen(THEO)], GROWG=[bankGen(GROW)], BLOOMG=[bankGen(BLOOM)], PLANG=[bankGen(PLAN)],
    EVALG=[bankGen(EVAL)], CLASSG=[bankGen(CLASS)], SPECG=[bankGen(SPEC)], ETHICG=[bankGen(ETHIC)];
var ALLG=[THEOG[0], GROWG[0], BLOOMG[0], PLANG[0], EVALG[0], CLASSG[0], SPECG[0], ETHICG[0]];

function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*30){ var f=gp(gens), q; try{ q=f(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; try{ q.__g=f.name||""; q.__gf=f; }catch(e){} out.push(q); } return out; }

    {id:"plan", name:"٤) التخطيط والتدريس", tip:"التخطيط يبدأ بالهدف. والتهيئة للدافعية، والغلق للتلخيص. وللتعاونيّ خمسة أسس أهمّها الاعتماد المتبادل والمسؤولية الفردية. ولحلّ المشكلات خطواتٌ مرتّبة تبدأ بتحديد المشكلة.", yt:"استراتيجيات التدريس الرخصة المهنية"},
    {id:"eval", name:"٥) التقويم", tip:"أربعة أنواع بأغراضها: قبليّ=قبل · تشخيصيّ=أسباب الضعف · تكوينيّ=أثناء للتحسين · ختاميّ=بعد للحكم. والصدق=يقيس ما وُضع له، والثبات=ثبات النتائج. وقائمة الرصد نعم/لا، وسلّم التقدير متدرّج.", yt:"أنواع التقويم وأدواته الرخصة المهنية"},
    {id:"class", name:"٦) إدارة الصفّ", tip:"النمط الديمقراطيّ أفضلها. والقواعد في بداية العام وبمشاركة الطلاب. وميّز: الإطفاء=سحب التعزيز · الاقتصاد الرمزيّ=نقاط تُستبدل · الإقصاء=إبعادٌ مؤقّت. وأفضل ضبطٍ درسٌ مخطَّط.", yt:"إدارة الصف وتعديل السلوك"},
    {id:"spec", name:"٧) التربية الخاصة والدمج", tip:"الخطّة الفردية لكلّ طالبٍ وحده، يُعدّها فريقٌ بمشاركة الأسرة. والبيئة الأقلّ تقييدًا مبدأٌ أساس. وصعوبات التعلّم مع ذكاءٍ عاديّ — وهذا ما يميّزها عن الإعاقة الذهنية.", yt:"الخطة التربوية الفردية والدمج"},
    {id:"ethic", name:"٨) الأخلاقيات والتطوير", tip:"السرّية والعدالة والقدوة والأمانة العلمية. والشراكة مع الأسرة تواصلٌ مستمرّ لا عند المشكلة. والبحث الإجرائيّ يحلّ مشكلةً في صفّك، والتأمّل الذاتيّ محرّك النموّ.", yt:"أخلاقيات مهنة التعليم والتطوير المهني"}
  ];
  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=document.getElementById("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب المحاور من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل محور.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت المحاور. جرّب محاور '+REM_LABEL+' ويرجع هنا يعرض أضعف محور مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent(x.t.yt||x.t.name)+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">راجع «'+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 محاور ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ var tb=document.querySelector('.tabs [data-tab="'+b.dataset.go+'"]'); if(tb) tb.click(); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }
  render("theo");

  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
      var id=b.dataset.tab; var pan=document.getElementById(id); pan.classList.add("active");
      if(id==="rem"){ renderRem(); } else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
    });
  });
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); } });
}
</script>
</body>
</html>
