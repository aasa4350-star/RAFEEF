<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الرياضيات — ثاني متوسط</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#7c3aed; --accent-deep:#5b21b6;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:8px;margin:14px 0 8px}
  .chapsel button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 8px;border-radius:13px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:104px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.1rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .ax{direction:rtl;unicode-bidi:isolate;display:inline-block;font-weight:inherit}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.1rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"rafeef").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function fmt(n){ var s = Number(Math.abs(n)).toLocaleString('en-US'); return (n<0 ? "\u2212" : "")+s; } // فاصلة آلاف + إشارة سالب رياضية
function mn(s){ return '<span class="en">'+s+'</span>'; }
// خيارات رقمية مميّزة: الصحيح + مشتّتات
function numOpts(correct, cands){
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([correct+1, correct-1, correct+2, correct+10, correct*2+1]);
  for(var i=0;i<pool.length && others.length<2;i++){ var v=pool[i]; if(v!==correct && v>=0 && !seen[v]){ seen[v]=1; others.push(v); } }
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}

/* ===== دوالّ مساعدة ===== */
var SUP = ["⁰","¹","²","³","⁴","⁵","⁶","⁷","⁸","⁹"];
function sup(n){ return String(n).split("").map(function(d){ return SUP[+d]; }).join(""); }
function pw(b,e){ return mn(b+sup(e)); }
function tmz(n, sing, plur){ return (n>=3 && n<=10) ? plur : sing; }
function ryl(n){ return tmz(n,"ريالًا","ريالات"); }
function ax(s){ return '<span class="ax">'+s+'</span>'; }   /* عبارة جبرية بحروف عربية: عزل RTL */
function pz(n){ return n<0 ? "("+fmt(n)+")" : fmt(n); }
/* خيارات لأعداد صحيحة (تسمح بالسالب) */
function zOpts(correct, cands){
  var seen={}; seen[correct]=1; var others=[];
  var pool = cands.concat([-correct, correct+1, correct-1, correct+2, correct+10]);
  for(var i=0;i<pool.length && others.length<2;i++){ var v=pool[i]; if(v!==correct && !seen[v]){ seen[v]=1; others.push(v); } }
  var arr=[correct].concat(others).map(fmt); shuffle(arr); return [arr, arr.indexOf(fmt(correct))];
}
/* خيارات نصّية متمايزة */
function sOpts(right, cands){
  var o=[right];
  for(var i=0;i<cands.length && o.length<3;i++){ if(o.indexOf(cands[i])<0) o.push(cands[i]); }
  shuffle(o); return [o, o.indexOf(right)];
}

/* ============================================================
   رياضيات ثاني متوسط — الفصل ٢: العلاقات والدوال الخطية
   من كتاب رفيف نفسه (ص ٥٠–٧١):
     ٢-١ العلاقات · ٢-٢ الدوال · ٢-٣ تمثيل المعادلات الخطية بيانيًا
     ٢-٤ حل المعادلات الخطية بيانيًا
   ============================================================ */

function nz(a,b){ var v=ri(a,b); return v===0 ? (Math.random()<0.5?1:-1)*ri(1,b) : v; }  /* عدد غير صفريّ */
function pairS(p){ return "(" + fmt(p[0]) + " ، " + fmt(p[1]) + ")"; }
function setS(a){ return "{ " + a.join(" ، ") + " }"; }

/* ---------- ٢-١ العلاقات ---------- */

/* الربع الذي تقع فيه نقطة */
function gQuadrant(){
  var x=nz(-9,9), y=nz(-9,9);
  var q = (x>0&&y>0)?"الربع الأول":(x<0&&y>0)?"الربع الثاني":(x<0&&y<0)?"الربع الثالث":"الربع الرابع";
  var all=["الربع الأول","الربع الثاني","الربع الثالث","الربع الرابع"];
  var o=sOpts(q, shuffle(all.filter(function(z){return z!==q;})));
  return ["في أيّ ربعٍ من المستوى الإحداثيّ تقع النقطة "+ax(pairS([x,y]))+"؟",o[0],o[1],
    "الإحداثيّ السينيّ "+fmt(x)+" "+(x>0?"موجب":"سالب")+" والصاديّ "+fmt(y)+" "+(y>0?"موجب":"سالب")+" ← "+q+".",
    "qd:"+x+","+y];
}

/* المجال أو المدى لمجموعة أزواج مرتبة */
function gDomainRange(){
  var n=4, xs=[], ys=[], seen={}, t=0;
  while(xs.length<n && t<80){ t++; var v=nz(-8,8); if(seen["x"+v]) continue; seen["x"+v]=1; xs.push(v); }
  while(ys.length<n && t<200){ t++; var w=nz(-8,8); if(seen["y"+w]) continue; seen["y"+w]=1; ys.push(w); }
  if(xs.length<n||ys.length<n) return null;
  var pairs=[]; for(var i=0;i<n;i++) pairs.push([xs[i],ys[i]]);
  var wantDomain = Math.random()<0.5;
  var vals = (wantDomain?xs:ys).slice().sort(function(a,b){return a-b;});
  var other= (wantDomain?ys:xs).slice().sort(function(a,b){return a-b;});
  var correct=setS(vals.map(fmt));
  var w1=setS(other.map(fmt));
  var w2=setS(vals.slice().reverse().map(fmt));
  var o=sOpts(correct,[w1,w2]);
  return ["أوجد "+(wantDomain?"<b>مجال</b>":"<b>مدى</b>")+" العلاقة "+
          ax(setS(pairs.map(pairS)))+" :",
    o[0].map(ax),o[1],
    (wantDomain
      ? "المجال مجموعة الإحداثيّات <b>السينيّة</b> (الأولى) مرتّبةً تصاعديًّا."
      : "المدى مجموعة الإحداثيّات <b>الصاديّة</b> (الثانية) مرتّبةً تصاعديًّا."),
    "dr:"+(wantDomain?"d":"r")+":"+xs.join("_")+"|"+ys.join("_")];
}

/* المتغيّر المستقل والتابع في موقف من الحياة */
var IDPAIRS = [
  ["كلّما زاد عددُ ساعات العمل زاد أجرُ العامل.","عدد ساعات العمل","أجر العامل"],
  ["كلّما زادت كميّةُ المطر ارتفع منسوبُ الماء في السدّ.","كميّة المطر","منسوب الماء"],
  ["كلّما زاد عددُ الحاضرين زادت كميّةُ الطعام المطلوبة.","عدد الحاضرين","كميّة الطعام"],
  ["كلّما زادت سرعةُ السيّارة زادت مسافةُ التوقّف.","سرعة السيّارة","مسافة التوقّف"],
  ["كلّما زاد عددُ التذاكر المُباعة زاد دخلُ الحفل.","عدد التذاكر","دخل الحفل"],
  ["كلّما زاد عمقُ الغوص زاد الضغطُ على الجسم.","عمق الغوص","الضغط على الجسم"],
  ["كلّما زادت درجةُ الحرارة زاد ضغطُ الهواء داخل الإطار.","درجة الحرارة","ضغط الهواء"],
  ["كلّما زاد عددُ الأشجار المزروعة زادت المساحةُ الخضراء.","عدد الأشجار","المساحة الخضراء"],
  ["كلّما زادت ساعاتُ المذاكرة ارتفعت درجةُ الاختبار.","ساعات المذاكرة","درجة الاختبار"],
  ["كلّما زاد عددُ العمّال قلّ زمنُ إنجاز العمل.","عدد العمّال","زمن إنجاز العمل"]
];
function gIndepDep(){
  var p=gp(IDPAIRS), askIndep=Math.random()<0.5;
  var correct = askIndep ? p[1] : p[2];
  var o=sOpts(correct,[askIndep?p[2]:p[1], "لا يوجد متغيّر في هذا الموقف"]);
  return [p[0]+"<br>ما <b>المتغيّر "+(askIndep?"المستقل":"التابع")+"</b>؟",o[0],o[1],
    "«"+p[1]+"» لا يتأثّر بغيره فهو <b>المستقل</b>، و«"+p[2]+"» يعتمد مقداره عليه فهو <b>التابع</b>.",
    "id:"+p[0]+(askIndep?"i":"d")];
}

/* نقطة على المحاور أو نقطة الأصل */
function gAxisPoint(){
  var mode=gp(["x","y","o"]);
  var v=nz(-8,8);
  var pt = mode==="x" ? [v,0] : (mode==="y" ? [0,v] : [0,0]);
  var correct = mode==="x" ? "على المحور السينيّ" : (mode==="y" ? "على المحور الصاديّ" : "نقطة الأصل");
  var o=sOpts(correct, shuffle(["على المحور السينيّ","على المحور الصاديّ","نقطة الأصل","في الربع الأول"]
        .filter(function(z){return z!==correct;})));
  return ["أين تقع النقطة "+ax(pairS(pt))+" ؟",o[0],o[1],
    mode==="o" ? "الإحداثيّان صفران، فهي نقطة تقاطع المحورين: نقطة الأصل."
      : ("الإحداثيّ "+(mode==="x"?"الصاديّ":"السينيّ")+" يساوي صفرًا، فالنقطة تقع على المحور "+(mode==="x"?"السينيّ":"الصاديّ")+"."),
    "ap:"+mode+":"+v];
}

/* ---------- ٢-٢ الدوال ---------- */

/* أيّ العلاقات تمثّل دالة؟ (واحدة فقط بلا تكرار في المجال) */
function gIsFunction(){
  function rel(isFunc){
    var xs=[], seen={}, t=0;
    while(xs.length<3 && t<60){ t++; var v=nz(-6,6); if(seen[v]) continue; seen[v]=1; xs.push(v); }
    if(xs.length<3) return null;
    var pairs=xs.map(function(x){ return [x, nz(-6,6)]; });
    if(!isFunc){
      /* نكرّر أوّل إحداثيّ سينيّ بصاديٍّ مختلف ← ليست دالة */
      var y2=pairs[0][1]; var g=0;
      while(y2===pairs[0][1] && g++<40) y2=nz(-6,6);
      if(y2===pairs[0][1]) return null;
      pairs.push([pairs[0][0], y2]);
    } else {
      var x4=nz(-6,6), g2=0;
      while(seen[x4] && g2++<40) x4=nz(-6,6);
      if(seen[x4]) return null;
      pairs.push([x4, nz(-6,6)]);
    }
    return setS(shuffle(pairs).map(pairS));
  }
  var right=rel(true), w1=rel(false), w2=rel(false);
  if(!right||!w1||!w2||w1===w2||right===w1||right===w2) return null;
  var o=sOpts(right,[w1,w2]);
  return ["أيّ العلاقات الآتية تمثّل <b>دالة</b>؟",o[0].map(ax),o[1],
    "العلاقة دالةٌ إذا ارتبط كلّ عنصرٍ في المجال بعنصرٍ واحدٍ فقط من المدى — أي ألّا يتكرّر الإحداثيّ السينيّ بإحداثيَّين صاديَّين مختلفين.",
    "if:"+right];
}

/* قيمة دالة خطّية */
function gFuncValueLin(){
  var a=nz(-6,6), b=nz(-9,9), k=nz(-6,6);
  var val=a*k+b;
  var o=zOpts(val,[a*k-b, a+b*k, a*k]);
  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س + "+fmt(b))+" ، فأوجد "+ax("د("+fmt(k)+")")+" .",
    o[0],o[1],
    ax("د("+fmt(k)+") = "+fmt(a)+" × "+pz(k)+" + "+fmt(b)+" = "+fmt(a*k)+" + "+fmt(b)+" = "+fmt(val))+".",
    "fl:"+a+","+b+","+k];
}

/* قيمة دالة غير خطّية (تربيعية) */
function gFuncValueQuad(){
  var a=nz(-4,4), b=nz(-6,6), k=nz(-5,5);
  var val=a*k*k+b;
  var o=zOpts(val,[a*k*k-b, (a*k)*(a*k)+b, a*k+b]);
  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س" + "²" + " + "+fmt(b))+" ، فأوجد "+ax("د("+fmt(k)+")")+" .",
    o[0],o[1],
    "نعوّض عن س بـ"+pz(k)+" : "+ax(pz(k)+"² = "+fmt(k*k))+" ، ثمّ "+
    ax(fmt(a)+" × "+fmt(k*k)+" + "+fmt(b)+" = "+fmt(val))+
    ". <b>لاحظ:</b> نُربّع أوّلًا ثمّ نضرب في المُعامِل.",
    "fq:"+a+","+b+","+k];
}

/* تركيب قيمتين: د(a) + د(b) أو د(a) − د(b) */
function gFuncCombo(){
  var a=nz(-5,5), b=nz(-8,8), p=nz(-5,5), q=nz(-5,5);
  if(p===q) q = q+1;
  var plus=Math.random()<0.5;
  var fp=a*p+b, fq=a*q+b;
  var val = plus ? fp+fq : fp-fq;
  var o=zOpts(val,[plus?fp-fq:fp+fq, a*(p+q)+b, fp*fq]);
  return ["إذا كانت "+ax("د(س) = "+fmt(a)+"س + "+fmt(b))+" ، فأوجد "+
          ax("د("+fmt(p)+") "+(plus?"+":"−")+" د("+fmt(q)+")")+" .",
    o[0],o[1],
    ax("د("+fmt(p)+") = "+fmt(fp))+" و"+ax("د("+fmt(q)+") = "+fmt(fq))+" ، فالناتج "+
    ax(fmt(fp)+" "+(plus?"+":"−")+" "+pz(fq)+" = "+fmt(val))+".",
    "fc:"+a+","+b+","+p+","+q+(plus?"+":"-")];
}

/* متّصلة أم منفصلة */
var CONTCASES = [
  ["عددُ الطلاب في كلّ فصلٍ من فصول المدرسة.","منفصلة"],
  ["كميّةُ الماء في خزّانٍ يُفرَّغ مع مرور الزمن.","متّصلة"],
  ["عددُ السيّارات التي يبيعها معرضٌ كلّ شهر.","منفصلة"],
  ["درجةُ حرارة الجوّ خلال اليوم.","متّصلة"],
  ["عددُ القلاع التي بناها كلّ فريقٍ في مسابقة.","منفصلة"],
  ["المسافةُ التي تقطعها سيّارةٌ مع مرور الزمن.","متّصلة"],
  ["عددُ التذاكر المُباعة في كلّ يوم.","منفصلة"],
  ["طولُ نبتةٍ مع مرور الأيام.","متّصلة"],
  ["عددُ الكتب في كلّ رفٍّ من رفوف المكتبة.","منفصلة"],
  ["كتلةُ ثلجٍ يذوب مع ارتفاع الحرارة.","متّصلة"]
];
function gDiscreteCont(){
  var c=gp(CONTCASES);
  var o=sOpts(c[1]==="متّصلة"?"دالة متّصلة":"دالة منفصلة",

    "dc:"+c[0]];
}

/* ---------- ٢-٣ تمثيل المعادلات الخطية بيانيًا ---------- */

/* أيّ المعادلات خطّية؟ (واحدة فقط) */
function gIsLinear(){
  var a=ri(2,9), b=ri(2,9), c=nz(-9,9);
  var right = gp([
    fmt(a)+"س + "+fmt(b)+"ص = "+fmt(c),
    "ص = "+fmt(a)+"س + "+fmt(c),
    fmt(a)+"س − ص = "+fmt(c)
  ]);
  var wrongs = shuffle([
    fmt(a)+"س² + ص = "+fmt(c),
    "س ص = "+fmt(c),
    "ص = "+fmt(a)+"س² − "+fmt(b),
    fmt(a)+"س + ص² = "+fmt(c),
    fmt(a)+" ÷ س = ص"
  ]).slice(0,2);
  var o=sOpts(right,wrongs);
  return ["أيُّ المعادلات الآتية <b>خطّية</b>؟",o[0].map(ax),o[1],
    "المعادلة الخطّية تُكتب على الصورة "+ax("أ س + ب ص = جـ")+" : أُسُّ كلٍّ من س و ص هو <b>1</b>، ولا يوجد حدٌّ فيه <b>س ص</b>، ولا متغيّرٌ في المقام.",
    "il:"+right];
}

/* الصورة القياسية من ص = م س + ب */
function gStandardForm(){
  var m=nz(-6,6), b=nz(-9,9);
  var correct, why;
  if(m>0){ correct = fmt(m)+"س − ص = "+fmt(-b);
    why = "ننقل "+ax(fmt(m)+"س")+" إلى اليسار: "+ax("ص − "+fmt(m)+"س = "+fmt(b))+
          " ، ثمّ نضرب الطرفين في "+ax("−1")+" ليكون مُعامِل س موجبًا ← "+ax(correct); }
  else { correct = fmt(-m)+"س + ص = "+fmt(b);
    why = "ننقل "+ax(fmt(m)+"س")+" إلى اليسار فيصير "+ax("+"+fmt(-m)+"س")+" ← "+ax(correct); }
  var w1 = fmt(Math.abs(m))+"س + ص = "+fmt(b);
  var w2 = fmt(Math.abs(m))+"س − ص = "+fmt(b);
  var cand=[w1,w2].filter(function(z){ return z!==correct; });
  cand.push(fmt(Math.abs(m))+"س + ص = "+fmt(-b));
  var o=sOpts(correct,cand);
  return ["اكتب المعادلة "+ax("ص = "+fmt(m)+"س + "+fmt(b))+" بالصورة <b>القياسية</b> "+ax("أ س + ب ص = جـ")+" :",
    o[0].map(ax),o[1], why+" .", "sf:"+m+","+b];
}

/* المقطع السيني */
function gXIntercept(){
  var a=nz(-6,6), b=nz(-6,6), k=nz(-6,6), c=a*k;   /* جـ من مضاعفات أ ← المقطع صحيح */
  var xint=c/a;
  var o=zOpts(xint,[c/b|0, -xint, c]);
  return ["أوجد <b>المقطع السينيّ</b> للمعادلة "+ax(fmt(a)+"س + "+fmt(b)+"ص = "+fmt(c))+" .",
    o[0],o[1],
    "المقطع السينيّ قيمة س عندما "+ax("ص = 0")+" : "+ax(fmt(a)+"س = "+fmt(c))+" ← "+
    ax("س = "+fmt(c)+" ÷ "+pz(a)+" = "+fmt(xint))+".",
    "xi:"+a+","+b+","+c];
}

/* المقطع الصادي */
function gYIntercept(){
  var a=nz(-6,6), b=nz(-6,6), k=nz(-6,6), c=b*k;
  var yint=c/b;
  var o=zOpts(yint,[c/a|0, -yint, c]);
  return ["أوجد <b>المقطع الصاديّ</b> للمعادلة "+ax(fmt(a)+"س + "+fmt(b)+"ص = "+fmt(c))+" .",
    o[0],o[1],
    "المقطع الصاديّ قيمة ص عندما "+ax("س = 0")+" : "+ax(fmt(b)+"ص = "+fmt(c))+" ← "+
    ax("ص = "+fmt(c)+" ÷ "+pz(b)+" = "+fmt(yint))+".",
    "yi:"+a+","+b+","+c];
}

/* أيّ زوجٍ مرتّبٍ يحقّق المعادلة؟ */
function gPointOnLine(){
  var a=nz(-5,5), b=nz(-5,5), x0=nz(-6,6), y0=nz(-6,6);
  var c=a*x0+b*y0;
  var w=[], t=0;
  while(w.length<2 && t<80){
    t++;
    var x=nz(-6,6), y=nz(-6,6);
    if(a*x+b*y===c) continue;
    var s=pairS([x,y]);
    if(s===pairS([x0,y0]) || w.indexOf(s)>=0) continue;
    w.push(s);
  }
  if(w.length<2) return null;
  var o=sOpts(pairS([x0,y0]), w);
  return ["أيُّ الأزواج المرتّبة الآتية يحقّق المعادلة "+ax(fmt(a)+"س + "+fmt(b)+"ص = "+fmt(c))+" ؟",
    o[0].map(ax),o[1],
    "نعوّض: "+ax(fmt(a)+" × "+pz(x0)+" + "+fmt(b)+" × "+pz(y0)+" = "+fmt(a*x0)+" + "+fmt(b*y0)+" = "+fmt(c))+
    " ، فالزوج يحقّق المعادلة.",
    "pl:"+a+","+b+","+x0+","+y0];
}

/* ---------- ٢-٤ حل المعادلات الخطية بيانيًا ---------- */

/* صفر الدالة الخطّية */
function gZero(){
  var a=nz(-6,6), k=nz(-6,6), b=-a*k;   /* الصفر = k عددٌ صحيح */
  var z=-b/a;
  var o=zOpts(z,[b/a, -b, a*b]);
  return ["أوجد <b>صفر</b> الدالة "+ax("د(س) = "+fmt(a)+"س + "+fmt(b))+" .",
    o[0],o[1],
    "صفر الدالة قيمة س التي تجعل "+ax("د(س) = 0")+" : "+ax(fmt(a)+"س + "+fmt(b)+" = 0")+" ← "+
    ax(fmt(a)+"س = "+fmt(-b))+" ← "+ax("س = "+fmt(z))+".",
    "z0:"+a+","+b];
}

/* جذر معادلة خطّية */
function gRoot(){
  var a=nz(-6,6), k=nz(-8,8), b=-a*k;
  var r=-b/a;
  var o=zOpts(r,[b/a, b, -r]);
  return ["ما <b>جذر</b> المعادلة "+ax(fmt(a)+"س + "+fmt(b)+" = 0")+" ؟",
    o[0],o[1],
    "الجذر هو الحلّ: "+ax(fmt(a)+"س = "+fmt(-b))+" ← "+ax("س = "+fmt(-b)+" ÷ "+pz(a)+" = "+fmt(r))+
    " . وهو نفسه <b>المقطع السينيّ</b> للتمثيل البيانيّ و<b>صفر</b> الدالة المرتبطة.",
    "rt:"+a+","+b];
}

  var REM_PAGE="math8", REM_LABEL="الرياضيات";
  var REMTOPICS=[
    {id:"r1", name:"2-1 العلاقات", tip:"الزوج المرتّب (س ، ص): الأول سينيّ (أفقيّ) والثاني صاديّ (رأسيّ) — لا تعكسهما. والمجال مجموعة قيم س، والمدى مجموعة قيم ص. والمتغيّر المستقل هو الذي لا يتأثّر بغيره، والتابع يعتمد عليه: «كلّما زاد كذا زاد كذا» ← الأول مستقل والثاني تابع.", yt:"شرح العلاقات المجال والمدى ثاني متوسط"},
    {id:"r2", name:"2-2 الدوال", tip:"العلاقة دالةٌ إذا ارتبط كلّ عنصرٍ في المجال بعنصرٍ واحدٍ فقط من المدى — أي ألّا تتكرّر قيمة س بقيمتَي ص مختلفتين. وبيانيًّا: اختبار الخطّ الرأسيّ. وفي د(س) عوّض عن س بالعدد كاملًا بين قوسين، وربّع قبل أن تضرب.", yt:"شرح الدوال واختبار الخط الرأسي ثاني متوسط"},
    {id:"r3", name:"2-3 تمثيل المعادلات", tip:"الصورة القياسية أ س + ب ص = جـ: أُسّ س و ص يساوي 1، ولا حدّ فيه س ص، ولا متغيّر في المقام. وللمقطع السينيّ ضع ص = 0، وللمقطع الصاديّ ضع س = 0 — نقطتان تكفيان لرسم المستقيم.", yt:"شرح تمثيل المعادلات الخطية بيانيا ثاني متوسط"},
    {id:"r4", name:"2-4 الحل بيانيًّا", tip:"ثلاثة أسماء لشيء واحد: جذر المعادلة = صفر الدالة = المقطع السينيّ. والدالة المولّدة (الأم) للدوال الخطّية هي د(س) = س، ومجالها ومداها جميع الأعداد الحقيقية.", yt:"شرح حل المعادلات الخطية بيانيا وأصفار الدالة ثاني متوسط"}
  ];
  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=panelOf("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الدروس من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل درس.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الدروس. جرّب دروس '+REM_LABEL+' ويرجع هنا يعرض أضعف درس مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">راجع «'+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel("allr2");
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
</script>
