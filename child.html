<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>صفحة الابن</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>

<style>
  :root{
    --accent:#3b5bdb; --accent-soft:#bac8ff; --accent-deep:#2b3fa0;
    --bg:#f5f7fb; --card:#ffffff; --ink:#131a2b; --muted:#5c6577;
    --line:#e5e9f2; --good:#15803d; --good-bg:#e7f6ec; --warn:#b45309; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(19,26,43,.05),0 8px 24px rgba(19,26,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0a0f1a;--card:#121a2b;--ink:#e8edf7;--muted:#94a0b8;--line:#22304850;
      --good:#4ade80;--good-bg:#12321f;--warn:#fbbf24;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff;border-radius:22px;padding:24px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;letter-spacing:.06em;opacity:.9;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.7rem;font-weight:800;display:flex;align-items:center;gap:8px}
  header.top .big{margin-top:10px;font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums}
  header.top .big small{font-size:1rem;font-weight:600;opacity:.9}
  .bar{display:flex;gap:10px;align-items:center;margin:16px 0;flex-wrap:wrap}
  .bar a,.bar button{background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow);text-decoration:none;font-size:.9rem}
  .bar .muted{color:var(--muted);font-size:.82rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;
    box-shadow:var(--shadow);margin-bottom:16px}
  .sec-title{display:flex;align-items:center;gap:9px;margin:22px 4px 12px;font-size:1.05rem;font-weight:800}
  .sec-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .stat .lbl{color:var(--muted);font-size:.85rem;margin-bottom:4px}
  .stat .val{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
  .trend{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}
  .trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end}
  .trend .bxr{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:6px}
  .trend .pc{font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
  .trend .dt{font-size:.68rem;color:var(--muted)}
  .behav{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:13px;font-size:.95rem}
  .behav.ok{background:var(--good-bg);border:1px solid var(--good)}
  .behav.no{background:#fff7ed;border:1px solid var(--warn)}
  @media (prefers-color-scheme:dark){ .behav.no{background:#2a1c07} }
  .behav .be{font-size:1.3rem}
  ul.weak{margin:0;padding-inline-start:20px}
  ul.weak li{margin-bottom:7px;font-size:.93rem}
  ul.weak .cnt{color:var(--bad);font-weight:700}
  .note{border-inline-start:4px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0;
    padding:12px 16px;margin-bottom:12px}
  .note .nd{font-size:.75rem;color:var(--muted);margin-bottom:4px;font-weight:700}
  .note .nt{font-weight:800;margin-bottom:5px}
  .note .nb{font-size:.95rem}
  .note .nb b{font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:30px 12px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty"><span class="spin"></span> جارٍ التحميل...</p></div>

<script>
const SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
const SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
const META = {
  hasan:{name:"حسن",grade:"ثالث متوسط",emoji:"📘",accent:"#0d9488",deep:"#0f766e"},
  rafeef:{name:"رفيف",grade:"ثاني متوسط",emoji:"📗",accent:"#4f46e5",deep:"#3730a3"},
  osama:{name:"أسامة",grade:"خامس ابتدائي",emoji:"📙",accent:"#ea580c",deep:"#c2410c"},
  saud:{name:"سعود",grade:"رابع ابتدائي",emoji:"📕",accent:"#16a34a",deep:"#15803d"}
};
function qs(k){ return new URLSearchParams(location.search).get(k); }
const who = (qs("who")||"").toLowerCase();
const app = document.getElementById("app");

function pct(c,t){ return t?Math.round(c/t*100):0; }
function saTime(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,16).replace("T"," "); d=new Date(d.getTime()+3*3600*1000); var p=function(n){return String(n).padStart(2,"0");}; return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes()); }
function saToday(){ var d=new Date(new Date().getTime()+3*3600*1000); var p=function(n){return String(n).padStart(2,"0");}; return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate()); }
var SKILLNAMES=[
  {name:"الجذور",rx:/√/},{name:"حل المعادلات",rx:/حل\s*:|معادلة|\dx|\dس|x\s*=|س\s*=|x²|س²/},
  {name:"الأسس",rx:/[²³⁴⁵⁶⁷]|الأس/},{name:"الهندسة",rx:/مساحة|محيط|حجم|مثلث|زاوية|الوتر|قطر/},
  {name:"النسبة المئوية",rx:/%|نسبة/},{name:"الكسور",rx:/[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚]|\d\/\d|كسر/},
  {name:"ترتيب العمليات",rx:/[+\-−].*×|×.*[+\-−]/},{name:"الأعداد السالبة",rx:/−\d|احسب:\s*−/},
  {name:"الجموع الشاذة",rx:/plural/i},{name:"الأضداد",rx:/opposite/i},
  {name:"المقارنة والتفضيل",rx:/than|comparative/i},{name:"الأزمنة",rx:/\bhad\b|\bhas\b|\bhave\b|\bwas\b|\bwere\b|\bwill\b|since|yet|already/i}
];
function autoRec(rows){
  if(!rows.length) return null;
  var latest=rows[0];
  var lp=pct(latest.en_correct+latest.ma_correct,latest.en_total+latest.ma_total);
  var trend="";
  if(rows.length>=2){ var prev=pct(rows[1].en_correct+rows[1].ma_correct,rows[1].en_total+rows[1].ma_total);
    trend= lp>prev+5?"📈 في تحسّن":lp<prev-5?"📉 نزل شوي":"➡️ ثابت"; }
  var wrongs=[]; rows.slice(0,3).forEach(function(r){(r.wrong||[]).forEach(function(w){wrongs.push(w);});});
  var counts={}; wrongs.forEach(function(w){ var t=(w.q||"")+" "+(w.subject||""); for(var i=0;i<SKILLNAMES.length;i++){ if(SKILLNAMES[i].rx.test(t)){ counts[SKILLNAMES[i].name]=(counts[SKILLNAMES[i].name]||0)+1; break; } } });
  var top=SKILLNAMES.filter(function(s){return counts[s.name];}).sort(function(a,b){return counts[b.name]-counts[a.name];}).slice(0,3);
  var beh=behavior(latest);
  var h="المستوى الحالي: <b>"+lp+"%</b> "+trend+".<br>إنجليزي "+latest.en_correct+"/"+latest.en_total+" · رياضيات "+latest.ma_correct+"/"+latest.ma_total+".<br>";
  if(top.length){ h+="<b>ركّز على:</b> "+top.map(function(s){return s.name+" ("+counts[s.name]+")";}).join(" · ")+" — روح تبويب علاجي 💪 فيه شرح وتمارين لها.<br>"; }
  else { h+="🎉 ما فيه أخطاء متكررة — ممتاز!<br>"; }
  if(beh && beh.avg!=null && beh.avg<4){ h+="⚠️ تروّى شوي — سرعتك عالية ("+beh.avg+"ث/سؤال) فتغلط في التفاصيل."; }
  return {date:saToday(),title:"📊 تقرير تلقائي محدّث — المستوى "+lp+"% "+trend, html:h, auto:true};
}
function behavior(row){
  const m=row.meta; if(!m||!m.per||!m.per.length) return null;
  const dts=m.per.map(p=>p.dt).filter(x=>x!=null);
  const avg=dts.length?dts.reduce((a,b)=>a+b,0)/dts.length:null;
  const acc=(row.en_correct+row.ma_correct)/((row.en_total+row.ma_total)||1);
  const cs=m.per.map(p=>p.c),counts={}; cs.forEach(c=>counts[c]=(counts[c]||0)+1);
  const sameR=cs.length?Math.max.apply(null,Object.values(counts))/cs.length:0;
  let label,emoji,good;
  if(avg!=null&&avg<4&&acc<0.6){label="حلّ عشوائي (تخمين سريع)";emoji="🎲";good=false;}
  else if(sameR>=0.7&&acc<0.6){label="يختار نفس الترتيب (تخمين)";emoji="🎲";good=false;}
  else if(avg!=null&&avg<4){label="حلّ بسرعة ودقة";emoji="🏃";good=true;}
  else if(avg!=null&&avg>20&&acc<0.6){label="يتعثّر ويحتاج مساعدة";emoji="🐢";good=false;}
  else if(acc>=0.8){label="متأنٍّ ومركّز";emoji="🎯";good=true;}
  else{label="أداء عادي — يحتاج تدريب";emoji="📚";good=false;}
  return {label,emoji,good,avg:avg!=null?Math.round(avg*10)/10:null};
}

async function main(){
  if(!META[who]){ app.innerHTML='<p class="empty">اختر ابنًا صحيحًا من الرابط (?who=hasan…)</p>'; return; }
  const S=META[who];
  document.documentElement.style.setProperty("--accent",S.accent);
  document.documentElement.style.setProperty("--accent-deep",S.deep);
  document.title="صفحة "+S.name;

  let rows=[];
  try{
    const r=await fetch(SUPA_URL+"/rest/v1/attempts?select=*&student=eq."+encodeURIComponent(S.name)+"&order=created_at.desc",
      {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
    rows=await r.json();
    rows=Array.isArray(rows)?rows:[];
  }catch(e){}
  // نفصل الاختبارات التجريبية والنشاط عن اختبارات المدرسة
  const practice=rows.filter(x=> x.meta && x.meta.kind==="practice");
  rows=rows.filter(x=> !(x.meta && (x.meta.kind==="activity"||x.meta.kind==="practice")));
  /* الورقة الناقصة (خرج قبل إكمال المادّتين): تُعرض في السجلّ ولا تُحسب
     في المستوى ولا في المعدّلات — مقامها عدد ما أجاب لا عدد الأسئلة،
     فجلسةُ خمسة أسئلة تُزحزح «المستوى الحالي» كأنّها ورقةٌ كاملة. */
  const isPartial=x=> !!(x.meta && x.meta.partial);
  const full=rows.filter(x=> !isPartial(x));

  let notes=[];
  try{ const nr=await fetch("notes/"+who+".json?t="+Date.now()); if(nr.ok) notes=await nr.json(); }catch(e){}

  const latest=full[0];
  const latPct=latest?pct(latest.en_correct+latest.ma_correct,latest.en_total+latest.ma_total):null;
  const enAvg=full.length?Math.round(full.reduce((s,r)=>s+pct(r.en_correct,r.en_total),0)/full.length):0;
  const maAvg=full.length?Math.round(full.reduce((s,r)=>s+pct(r.ma_correct,r.ma_total),0)/full.length):0;
  const beh=latest?behavior(latest):null;

  // weak areas aggregate — الأخطاء تُجمع من الناقصة أيضًا، فالخطأ خطأ
  const wmap={}; rows.forEach(r=>(r.wrong||[]).forEach(w=>{const k="["+(w.subject||"")+"] "+w.q; wmap[k]=(wmap[k]||0)+1;}));
  const weak=Object.entries(wmap).sort((a,b)=>b[1]-a[1]).slice(0,6);

  // trend (oldest -> newest, last 6) — من الأوراق الكاملة وحدها
  const tr=full.slice(0,6).reverse().map(r=>pct(r.en_correct+r.ma_correct,r.en_total+r.ma_total));

  let html=`
    <header class="top">
      <p class="eyebrow">${S.grade} · صفحة المتابعة</p>
      <h1>${S.emoji} ${S.name}</h1>
      ${latPct!=null?`<div class="big">${latPct}% <small>آخر اختبار</small></div>`:`<div class="big"><small>ما فيه اختبارات بعد</small></div>`}
    </header>
    <div class="bar">
      <button onclick="location.reload()">🔄 تحديث</button>
      <a href="home.html?who=${who}">🏠 الصفحة الرئيسية</a>
      <a href="quiz.html?who=${who}">📝 اختبر نفسك</a>
      <a href="reading.html?who=${who}">🔊 استماع وقراءة</a>
      ${who==="saud"?`<a href="practice.html?who=${who}">📖 قدرات لفظي</a>`:`<a href="quiz.html?who=${who}&set=2">🔄 مجموعة 2</a><a href="practice.html?who=${who}">📊 قدرات وتحصيلي</a>`}
    </div>
    ${who==="saud"?`<div class="sec-title"><span class="dot"></span> 📚 المنهج الدراسي (مطابق لكتب سعود)</div>
    <div class="bar">
      <a href="lughati.html?who=${who}">📗 لغتي</a>
      <a href="english.html?who=${who}">🇬🇧 إنجليزي</a>
      <a href="math4.html?who=${who}">🔢 رياضيات</a>
      <a href="science4.html?who=${who}">🧪 علوم</a>
    </div>`:""}`;

  if(practice.length){
    const SUBJ_EMOJI={"لغتي":"📗","إنجليزي":"🔤","رياضيات":"🔢","علوم":"🔬"};
    /* الملاحظة تُعرض ٤٨ ساعة ثمّ تسقط — انظر report-rules.js */
    const fresh=p=> !window.RR || RR.freshFlag(p);
    const durTxt=p=>{ let s=``; const d=p.meta.dur; if(d!=null){ const spw=p.meta.total?Math.round(d/p.meta.total):d; const warn=(p.meta.total && spw<2 && fresh(p))?` <span style="color:var(--bad)">⚠️ سريع جدًا</span>`:``; s+=` · ⏱️ ${d}ث (${spw}ث/سؤال)${warn}`; } if(p.meta.exits && fresh(p)){ s+=` · <span style="color:var(--bad)">🚪 خرج من الصفحة ${p.meta.exits} مرة${p.meta.away?` (غاب ${p.meta.away}ث)`:``} ⚠️</span>`; } return s; };
    const untrustedTxt=p=> (p.meta.trusted===false && fresh(p))?` <b style="color:var(--bad)">🚫 غير محتسبة</b>`:``;
    /* بلاغ الأب (٣١ أغسطس ٢٠٢٦): «احذف قسم لغتي حق أسامة، لأنه حق صفّ
       رابع وأسامة صفّ خامس». lughati.html مطابقٌ لكتاب رابع ابتدائي،
       وأسامة صار في الخامس، فلا يصحّ أن يظهر في منهجه الدراسي مادّةٌ
       من صفٍّ دونه — ولو بقيت جلساتٌ قديمةٌ مسجَّلةً له فيها (سُجّلت
       عبر رابطٍ أُزيل الآن من math5.html). النطاق مُعرَّفٌ بالاسم لا
       بالابن وحده، ليتّسع بسهولةٍ لو تكرّر نظير هذا الموقف. */
    const HIDE_SUBJ = { osama: ["لغتي"] };
    const hidden = HIDE_SUBJ[who] || [];
    const currMap={}, otherMap={};
    const vocabAll=[];
    practice.forEach(p=>{ const t=(p.meta.test||""); const subj=t.split(" ")[0];
      if(hidden.indexOf(subj)>-1) return;
      if(t.indexOf("كلمات")===0){ vocabAll.push(p); }
      else if(SUBJ_EMOJI[subj]){ if(!currMap[t]) currMap[t]=p; }
      else { if(!otherMap[t]) otherMap[t]=p; } });
    // 📖 حفظ الكلمات (إنجليزي)
    if(vocabAll.length){
      let vLearned=0, vTotal=300;
      /* عدد المحفوظ تراكميّ فيُقرأ من كلّ الجلسات؛ وما عداه محصورٌ
         بأسبوع بطلب الأب — الجلسات القديمة كانت تزاحم جلسات اليوم. */
      /* vocTotal يُؤخذ من أحدث جلسةٍ تحمله لا من أقدمها: الجلسات
         مرتّبةٌ تنازليًّا، وكان الإسناد يمرّ عليها كلّها فيستقرّ على
         الأقدم — فظهر «450 / 300 كلمة (150%)». ثمّ نجعل المقام لا
         يقلّ عن المحفوظ، فلا تتجاوز النسبة مئةً بحال. */
      let vTotSet=false;
      vocabAll.forEach(p=>{ if(p.meta.learned!=null && p.meta.learned>vLearned) vLearned=p.meta.learned; if(p.meta.vocTotal && !vTotSet){ vTotal=p.meta.vocTotal; vTotSet=true; } });
      vTotal=Math.max(vTotal, vLearned);
      let vocabWk=vocabAll.filter(p=> !window.RR || RR.recentVocab(p));
      if(!vocabWk.length) vocabWk=vocabAll.slice(0,1);   /* لا نُفرغ البطاقة تمامًا */
      const rev=vocabWk.filter(p=> p.meta.mode==="review");
      const neu=vocabWk.filter(p=> p.meta.mode==="new");
      const revT=rev.filter(p=> p.meta.trusted!==false), neuT=neu.filter(p=> p.meta.trusted!==false), vocabT=vocabWk.filter(p=> p.meta.trusted!==false);
      const rW=revT.reduce((s,p)=>s+(p.meta.total||0),0), rC=revT.reduce((s,p)=>s+(p.meta.correct||0),0);
      const nW=neuT.reduce((s,p)=>s+(p.meta.total||0),0), nC=neuT.reduce((s,p)=>s+(p.meta.correct||0),0);
      const allW=vocabT.reduce((s,p)=>s+(p.meta.total||0),0), allC=vocabT.reduce((s,p)=>s+(p.meta.correct||0),0);
      const untrustedN=vocabWk.filter(p=> p.meta.trusted===false && fresh(p)).length;
      const lpct=vTotal?Math.round(vLearned/vTotal*100):0, rpct=rW?Math.round(rC/rW*100):0, npct=nW?Math.round(nC/nW*100):0, apct=allW?Math.round(allC/allW*100):0;
      const isFlag=p=> fresh(p) && (p.meta.trusted===false || p.meta.exits>0 || (p.meta.dur!=null && p.meta.total && (p.meta.dur/p.meta.total)<2));
      const mIco=p=> p.meta.mode==="review"?"🔁":p.meta.mode==="new"?"📚":"📖";
      const flagged=vocabWk.filter(isFlag), show=vocabWk.filter(p=>!isFlag(p)).slice(0,3).concat(flagged).sort((a,b)=> (a.created_at<b.created_at)?1:-1).slice(0,8);
      const revList=show.map(p=>{ const pc=pct(p.meta.correct,p.meta.total); const dt=(p.meta.dur==null)?` · ⏱️ —`:durTxt(p); const ut=untrustedTxt(p); return `<li>${mIco(p)} ${saTime(p.created_at)} — <b>${p.meta.correct}/${p.meta.total} (${pc}%)</b>${dt}${ut}</li>`; }).join("");
      const byDay={}; vocabT.forEach(p=>{ const f=saTime(p.created_at); const d=f.slice(0,10), hm=f.slice(11,16); if(!byDay[d]) byDay[d]={w:0,c:0,t0:hm,t1:hm}; byDay[d].w+=(p.meta.total||0); byDay[d].c+=(p.meta.correct||0); if(hm<byDay[d].t0)byDay[d].t0=hm; if(hm>byDay[d].t1)byDay[d].t1=hm; });
      const days=Object.keys(byDay).sort().reverse().slice(0,6);
      const dayList=days.map(d=>{ const o=byDay[d]; const dp=o.w?Math.round(o.c/o.w*100):0; const tm=(o.t0===o.t1)?o.t0:(o.t0+'–'+o.t1); return `<li>📅 ${d} <span style="color:var(--muted);font-size:.85rem">(${tm})</span>: راجع <b>${o.w} كلمة</b> (${o.c}/${o.w} · ${dp}%)</li>`; }).join("");
      html+=`<div class="sec-title"><span class="dot"></span> 📖 حفظ الكلمات (إنجليزي)</div><div class="card"><ul class="weak">`+
        (vLearned>0?`<li>📚 حفظ: <b><span dir="ltr">${vLearned} / ${vTotal}</span> كلمة</b> (${lpct}%)</li>`:``)+
        dayList+
        `<li>📊 جلسات الكلمات هذا الأسبوع (المحتسبة): <b>${allC}/${allW} (${apct}%)</b> · ${vocabT.length} جلسة</li>`+
        (rW?`<li>🔁 راجع محفوظ: <b><span dir="ltr">${rC}/${rW}</span> كلمة</b> (${rpct}%)</li>`:``)+
        (nW?`<li>📚 راجع جديد: <b><span dir="ltr">${nC}/${nW}</span> كلمة</b> (${npct}%)</li>`:``)+
        (untrustedN?`<li style="color:var(--bad)">🚫 جلسات غير محتسبة (خرج لتطبيق ثاني أثناء الحل): <b>${untrustedN}</b></li>`:``)+
        `</ul>`+
        (revList?`<div style="font-weight:700;margin:8px 2px 4px;font-size:.9rem">📖 جلسات الكلمات — آخر ${window.RR?RR.VOCAB_DAYS:7} أيام:</div><ul class="weak">${revList}</ul>`:``)+
        `</div>`;
    }
    // 📚 تقرير المنهج الدراسي — مجمّع حسب المادة
    const bySubj={}; Object.keys(currMap).forEach(t=>{ const subj=t.split(" ")[0]; (bySubj[subj]=bySubj[subj]||[]).push(currMap[t]); });
    if(Object.keys(bySubj).length){
      html+=`<div class="sec-title"><span class="dot"></span> 📚 تقرير المنهج الدراسي</div>`;
      ["لغتي","إنجليزي","رياضيات","علوم"].forEach(subj=>{
        const arr=bySubj[subj]; if(!arr||!arr.length) return;
        arr.sort((a,b)=> (a.meta.test<b.meta.test)?-1:1);
        const avg=Math.round(arr.reduce((s,p)=>s+pct(p.meta.correct,p.meta.total),0)/arr.length);
        const acol=avg>=80?"var(--good)":avg>=50?"var(--warn)":"var(--bad)";
        html+=`<div class="card"><div style="font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span>${SUBJ_EMOJI[subj]} ${subj}</span><span style="font-size:.85rem;color:${acol}">المتوسط ${avg}%</span></div><ul class="weak">`+
          arr.map(p=>{ const pc=pct(p.meta.correct,p.meta.total); const lesson=(p.meta.test||"").replace(subj+" ",""); const col=pc>=80?"var(--good)":pc>=50?"var(--warn)":"var(--bad)";
            return `<li>${lesson}: <b style="color:${col}">${p.meta.correct}/${p.meta.total} (${pc}%)</b> <span style="color:var(--muted);font-size:.8rem">${saTime(p.created_at)}</span></li>`; }).join("")+
          `</ul></div>`;
      });
    }
    // الاختبارات التجريبية (قدرات/تحصيلي/STEP)
    if(Object.keys(otherMap).length){
      html+=`<div class="sec-title"><span class="dot"></span> الاختبارات التجريبية (قدرات/تحصيلي/STEP)</div>
        <div class="card"><ul class="weak">`+
        Object.keys(otherMap).map(t=>{ const p=otherMap[t]; const pc=pct(p.meta.correct,p.meta.total);
          return `<li><b>${t}</b>: ${p.meta.correct}/${p.meta.total} (${pc}%) <span class="cnt">${saTime(p.created_at)}</span>${durTxt(p)}${untrustedTxt(p)}</li>`; }).join("")+
        `</ul></div>`;
    }
  }

  if(rows.length){
    /* المستوى يُعرض فقط إن وُجدت ورقةٌ كاملة؛ ومن لم يُكمل بعدُ
       تظهر جلساته في السجلّ ولا يُختلق له معدّل من لا شيء. */
    if(full.length) html+=`
    <div class="sec-title"><span class="dot"></span> المستوى (متوسط ${full.length} محاولة كاملة)</div>
    <div class="card"><div class="grid2">
      <div class="stat"><div class="lbl">الإنجليزي</div><div class="val">${enAvg}%</div></div>
      <div class="stat"><div class="lbl">الرياضيات</div><div class="val">${maAvg}%</div></div>
    </div>
    ${beh?`<div style="margin-top:12px" class="behav ${beh.good?'ok':'no'}"><span class="be">${beh.emoji}</span>
      <span><b>أسلوب الحل:</b> ${beh.label}${beh.avg!=null?` · ${beh.avg}ث/سؤال`:''}${(latest.meta&&latest.meta.total_sec)?` · المدة الكلية ${latest.meta.total_sec}ث`:''}${(latest.meta&&latest.meta.exits&&(!window.RR||RR.freshFlag(latest)))?` · <span style="color:var(--bad)">🚪 خرج من الصفحة ${latest.meta.exits} مرة ⚠️</span>`:''}</span></div>`:''}
    ${tr.length>1?`<div class="sec-title" style="margin:16px 4px 6px"><span class="dot"></span> التطوّر</div>
      <div class="trend">${tr.map(p=>`<div class="col"><div class="pc">${p}%</div><div class="bxr" style="height:${Math.max(6,p*0.8)}px"></div></div>`).join("")}</div>`:''}
    </div>`;

    html+=`<div class="sec-title"><span class="dot"></span> نقاط يحتاج يراجعها</div><div class="card">`;
    html+= weak.length? `<ul class="weak">${weak.map(w=>`<li>${w[0]} ${w[1]>1?`<span class="cnt">(×${w[1]})</span>`:''}</li>`).join("")}</ul>`
      : `<p class="empty">ما فيه أخطاء متكررة 🎉</p>`;
    html+=`</div>`;

    // سجل كل الاختبارات السابقة
    const nPart=rows.length-full.length;
    html+=`<div class="sec-title"><span class="dot"></span> سجل الاختبارات (${rows.length}${nPart?` · منها ${nPart} غير مكتملة`:""})</div>
      <div class="card" style="overflow-x:auto;padding:0">
      <table style="width:100%;border-collapse:collapse;font-size:.92rem">
        <thead><tr style="color:var(--muted);text-align:center">
          <th style="padding:11px 8px;font-weight:700">#</th>
          <th style="padding:11px 8px;font-weight:700">التاريخ</th>
          <th style="padding:11px 8px;font-weight:700">النتيجة</th>
          <th style="padding:11px 8px;font-weight:700">إنجليزي</th>
          <th style="padding:11px 8px;font-weight:700">رياضيات</th>
        </tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const t=pct(r.en_correct+r.ma_correct,r.en_total+r.ma_total);
      const col=t>=80?"var(--good)":t>=50?"var(--warn)":"var(--bad)";
      const dt=saTime(r.created_at);
      /* الناقصة تُعرض ولا يُقاس عليها: مقامها عدد ما أجاب لا عدد
         الأسئلة، فنسبتها ليست نسبة ورقةٍ كاملة ولا تُقارن بها. */
      const part=isPartial(r);
      html+=`<tr style="border-top:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums${part?';opacity:.72':''}">
        <td style="padding:11px 8px;color:var(--muted)">${rows.length-i}</td>
        <td style="padding:11px 8px;color:var(--muted);font-size:.82rem">${dt}${part?'<br><span style="font-size:.78rem">غير مكتمل</span>':''}</td>
        <td style="padding:11px 8px;font-weight:800;color:${part?'var(--muted)':col}">${t}%</td>
        <td style="padding:11px 8px">${r.en_correct}/${r.en_total}</td>
        <td style="padding:11px 8px">${r.ma_correct}/${r.ma_total}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;

    // 📄 آخر نموذجين محلولين (بالأسئلة والأجوبة والدرجة) — محفوظة لا تنحذف
    const papers = rows.filter(r=> r.meta && r.meta.paper).slice(0,2);
    if(papers.length){
      html+=`<div class="sec-title"><span class="dot"></span> 📄 آخر نموذجين محلولين (بالأسئلة والأجوبة)</div>`;
      papers.forEach((r,pi)=>{
        const P=r.meta.paper;
        const tot=(P.en_correct+P.ma_correct), all=(P.en_total+P.ma_total), pc=pct(tot,all);
        const secHtml=(title,arr,ltr)=>{
          if(!arr||!arr.length) return "";
          let h=`<div style="font-weight:800;margin:12px 0 6px">${title}</div>`;
          arr.forEach((it,idx)=>{
            h+=`<div style="border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px">
              <div style="font-weight:700;margin-bottom:6px"${ltr?' dir="ltr"':''}>${idx+1}. ${it.q}</div>`;
            (it.opts||[]).forEach((o,j)=>{
              let bg="transparent",bd="var(--line)",cl="var(--ink)",tag="";
              if(j===it.correct){ bg="var(--good-bg)";bd="var(--good)";cl="var(--good)";tag=" ✅"; }
              if(j===it.chosen && it.chosen!==it.correct){ bg="var(--bad-bg)";bd="var(--bad)";cl="var(--bad)";tag=" ❌ (اختياره)"; }
              h+=`<div style="border:1px solid ${bd};background:${bg};color:${cl};border-radius:8px;padding:6px 10px;margin:4px 0;font-size:.9rem"${ltr?' dir="ltr"':''}>${o}${tag}</div>`;
            });
            if(it.chosen===-1) h+=`<div style="color:var(--muted);font-size:.82rem;margin-top:4px">لم يُجب على هذا السؤال</div>`;
            h+=`</div>`;
          });
          return h;
        };
        html+=`<details ${pi===0?'open':''} class="card" style="margin-bottom:12px">
          <summary style="cursor:pointer;font-weight:800;padding:6px 0">📄 نموذج ${saTime(r.created_at)} — النتيجة ${tot}/${all} (${pc}%) · إنجليزي ${P.en_correct}/${P.en_total} · رياضيات ${P.ma_correct}/${P.ma_total}</summary>
          <div style="margin-top:8px">${secHtml("الإنجليزي",P.en,true)}${secHtml("الرياضيات",P.ma,false)}</div>
        </details>`;
      });
    }
  }

  html+=`<div class="sec-title"><span class="dot"></span> توصيات المعلّم 📌</div>`;
  const auto=autoRec(full);   // المستوى من الأوراق الكاملة وحدها
  const allNotes=auto?[auto].concat(notes):notes;
  if(allNotes.length){
    html+=allNotes.map(n=>`<div class="note"${n.auto?' style="border-color:var(--accent)"':''}><div class="nd">${n.date||""}${n.auto?' · يتحدّث تلقائيًا':''}</div>
      <div class="nt">${n.title||""}</div><div class="nb">${n.html||n.body||""}</div></div>`).join("");
  }else{
    html+=`<div class="card empty">لسه ما فيه توصيات. بتظهر هنا أول ما يختبر.</div>`;
  }

  html+=`<footer>تتحدّث تلقائيًا · صفحة خاصة بـ ${S.name}</footer>`;
  app.innerHTML=html;
}
main();
</script>
</body>
</html>
