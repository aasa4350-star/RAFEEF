<style>
  :root{
    --accent:#0d9488; --accent-soft:#5eead4; --accent-deep:#0f766e;
    --bg:#f6f8fa; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c50;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff;border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;letter-spacing:.06em;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.7rem;font-weight:800}
  header.top p{margin:8px 0 0;opacity:.93;font-size:.95rem}
  .tabs{display:flex;gap:8px;margin:18px 0;position:sticky;top:8px;z-index:5}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:12px 6px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:var(--shadow);transition:.15s}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  section.panel{display:none}
  section.panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .block-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.05rem;font-weight:800}
  .block-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:var(--shadow)}
  .review details{border-bottom:1px solid var(--line);padding:4px 0}
  .review details:last-child{border-bottom:0}
  .review summary{cursor:pointer;font-weight:700;padding:12px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .review summary::-webkit-details-marker{display:none}
  .review summary::after{content:"+";color:var(--accent);font-weight:800;font-size:1.25rem}
  .review details[open] summary::after{content:"–"}
  .review .body{padding:0 4px 14px;color:var(--muted)}
  .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .q .stem{font-weight:700;margin:4px 0 12px;font-size:1.08rem}
  .opts{display:grid;gap:8px}
  .opts button{text-align:right;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;transition:.12s}
  .opts button:hover:not(:disabled){border-color:var(--accent)}
  .opts button:disabled{cursor:default}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.9rem;color:var(--muted);padding:8px 12px;background:var(--bg);border-radius:10px;display:none}
  .explain.show{display:block}
  .say{background:var(--accent);color:#fff;border:0;padding:9px 13px;border-radius:11px;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit}
  .say.small{padding:8px 12px;font-size:.88rem}
  .prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
  .prow .azbtn{background:#0a7cff}
  .prow .ltr{direction:ltr;unicode-bidi:isolate;font-weight:700}
  .prow .pfb{font-weight:700;font-size:.9rem}
  .scorebar{position:sticky;bottom:12px;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .scorebar .track{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .scorebar .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
  .scorebar .txt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .reset{margin:16px auto 0;display:block;background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
  .res-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);text-align:center}
  .res-emoji{font-size:2.6rem;line-height:1}
  .res-hero h2{margin:8px 0 2px;font-size:1.3rem}
  .res-hero .sub{color:var(--muted);font-size:.95rem;margin:0}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .res-cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .res-cell .lbl{color:var(--muted);font-size:.9rem;margin-bottom:4px}
  .res-cell .val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .res-cell .pct{font-size:.85rem;color:var(--accent);font-weight:700}
  .mistakes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;box-shadow:var(--shadow)}
  .mistakes .mi{border-bottom:1px solid var(--line);padding:11px 2px;font-size:.95rem}
  .mistakes .mi:last-child{border-bottom:0}
  .mistakes .mi .qq{font-weight:700;margin-bottom:3px}
  .mistakes .mi .pick{color:var(--bad)}
  .mistakes .mi .corr{color:var(--good);font-weight:700}
  .save-status{text-align:center;font-weight:800;margin:14px 0 4px;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
  .note{color:var(--muted);font-size:.88rem;text-align:center;margin-top:6px}
  .locked{color:var(--muted);text-align:center;padding:40px 10px}
  .picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .picker a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:14px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow)}
</style>
</head>

  /* بنك الإنجليزي المنسّق مكتوب يدويًا بلا وسوم، فنستنتج مهارته من نصّ السؤال
     ومن شكل الخيارات — والخيارات أدقّ دلالة من النصّ. الترتيب مهمّ: الأخصّ أوّلًا. */
  function enSkill(stem, opts){
    var s = String(stem||"").toLowerCase();
    var o = (opts||[]).map(function(x){ return String(x).toLowerCase().trim(); });
    var any = function(re){ return o.some(function(x){ return re.test(x); }); };
    var all = function(re){ return o.length>0 && o.every(function(x){ return re.test(x); }); };
    /* خياران أحدهما جمع الآخر (book/books، knife/knives) */
    /* لا نعدّها جمعًا إذا بدت الخيارات صيغ أفعال (goes/going، walked/walks) */
    var verbish = o.some(function(x){ return /ing$|ed$/.test(x); });
    var pluralPair = !verbish && o.some(function(a){ return o.some(function(b){ return b!==a && (b===a+"s" || b===a+"es"); }); });

    /* ١) ما يصرّح به نصّ السؤال */
    if(/opposite of|antonym of/.test(s))            return "الأضداد";
    if(/synonym|same meaning/.test(s))              return "المرادفات";
    if(/plural of/.test(s))                         return "الجمع";
    if(/which one is a|which one is an|which is a|which is an/.test(s)) return "تصنيف المفردات";
    if(/says "|says \\"|is called a|gives us/.test(s)) return "مفردات ومعلومات";
    if(/first letter|letter of|how many letters/.test(s)) return "الحروف الأبجدية";
    if(/asked me|told me|said that|wondered/.test(s)) return "الكلام المنقول";
    if(/which day|the day comes/.test(s))           return "الأيام والشهور";
    if(/has a |have a |can \w+ and/.test(s) && !/\?$/.test(s.slice(0,1))) {}
    if(/the number (before|after)|in numbers/.test(s)) return "الأعداد";
    if(/the day (after|before)|the month|which season/.test(s)) return "الأيام والشهور";
    if(/spell|correct sentence/.test(s))            return "تمييز الجملة الصحيحة";

    /* ٢) ما تكشفه الخيارات */
    if(all(/^(who|which|whom|whose|that)$/))        return "ضمائر الوصل";
    if(any(/^(after|during|while|before)$/))        return "أدوات الربط";
    if(all(/^(he|she|it|they|we|i|you|him|her|them|his|hers)$/)) return "الضمائر";
    if(any(/ly$/) && any(/^\w+ful$|^\w+y$/))       return "الظروف";
    if(/look forward to|good at|instead of|denied|enjoys?\s/.test(s)) return "المصدر وصيغة ing";
    if(/was \w+ing|were \w+ing/.test(s))            return "الماضي المستمرّ";
    if(/a person who|has a long|a baby \w+ is/.test(s)) return "مفردات ومعلومات";
    if(any(/^(what|where|when|why|how)$/))           return "أدوات الاستفهام";
    if(any(/^how (many|much)$/) || any(/^(much|many|few|little)$/)) return "الكمّيات";
    if(any(/^(although|because|so|but|however)$/))   return "أدوات الربط";
    if(any(/n't (you|it|he|she|they)$/))            return "الأسئلة الذيلية";
    if(any(/^(must|should|can't|mustn't|don't have to|should have|must not)$/)) return "الأفعال الناقصة";
    if(any(/^(this|that|these|those)$/))            return "أسماء الإشارة";
    if(any(/^(already|yet|ever|never|just)$/))      return "المضارع التامّ";
    if(any(/^had\s/))                               return "الماضي التامّ";
    if(any(/^have been|^has been/))                 return "المضارع التامّ المستمرّ";
    if(any(/^(was|were|is|are|been)\s+\S+/))        return "المبني للمجهول";
    if(/^if\b/.test(s) || any(/^would( have)?$/))   return "الجمل الشرطية";
    if(o.filter(function(x){ return /^(since|for|during|from|ago)$/.test(x); }).length>=2) return "since / for";
    if(all(/^(in|on|at|to|from|under|over|behind|between|near|with|by|for|of|into|above|below)$/)) return "حروف الجرّ";
    if(all(/^(a|an|the)$/))                         return "أدوات التعريف";
    if(any(/^(than|then|that)$/) && /\w+er\b/.test(s)) return "المقارنة";
    if(any(/^(more|most)\s/) || any(/\w+est$/))     return "المقارنة والتفضيل";
    if(any(/ing$/) && any(/^to\s/))                 return "المصدر وصيغة ing";

    /* ٣) الأزمنة قبل قاعدة الجمع، وإلا ابتلعت صيغ الأفعال */
    if(/\b(have|has)\s+(never|already|just|ever)\b/.test(s)) return "المضارع التامّ";
    if(/yesterday|last \w+|\bago\b/.test(s))       return "الماضي البسيط";
    if(/next (week|year|month|monday)|tomorrow/.test(s)) return "المستقبل";
    if(/every (day|evening|morning|week)|usually|always|often|sometimes/.test(s)) return "المضارع البسيط";
    if(/\bnow\b|at the moment|look!|listen!/.test(s)) return "المضارع المستمرّ";
    if(/\b(didn't|doesn't|don't)\b/.test(s))        return "الأفعال المساعدة";
    if(pluralPair)                                  return "الجمع";

    if(any(/^(has|have|having)$/))                  return "have / has";
    if(any(/^(do|does|did|don't|doesn't|didn't)$/)) return "الأفعال المساعدة";
    if(any(/^(will|shall|going to)$/))              return "المستقبل";
    if(any(/ing$/) && any(/s$/))                    return "مطابقة الفاعل والفعل";
    if(any(/^(is|are|am|was|were|be|isn't|aren't)$/)) return "أفعال الكينونة";
    if(/what color|what is the capital|where do/.test(s)) return "معلومات عامة";
    if(o.some(function(x){ return x.split(" ").length>2; })) return "فهم الجملة";
    return "إنجليزي (عامّ)";
  }

    var rb=sec.querySelector('[data-arreset]'); if(rb) rb.addEventListener('click', renderArb);
  }

  // توقيت السعودية (UTC+3، بدون توقيت صيفي)
  function saTime(iso){
    if(!iso) return "";
    var d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,16).replace("T"," ");
    d=new Date(d.getTime()+3*3600*1000);
    var p=function(n){return String(n).padStart(2,"0");};
    return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());
  }
  let logLoaded = false;
  async function renderLog(force){
    const sec = document.getElementById("log");
    if (logLoaded && !force) return;
    sec.innerHTML = '<div class="locked">⏳ جارٍ تحميل محاولاتك السابقة...</div>';
    try{
      const r = await fetch(SUPA_URL+"/rest/v1/attempts?select=*&student=eq."+encodeURIComponent(S.name)+"&order=created_at.desc",
        {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
      const rows = await r.json();
      logLoaded = true;
      if(!Array.isArray(rows) || !rows.length){
        sec.innerHTML = '<div class="locked">ما عندك محاولات سابقة بعد. حل الاختبار وبتنحفظ هنا تلقائيًا.</div>'; return;
      }
      let h = '<div class="block-title"><span class="dot"></span> محاولاتك السابقة ('+rows.length+')</div>';
      rows.forEach(function(x,i){
        var tot = Math.round((x.en_correct+x.ma_correct)/((x.en_total+x.ma_total)||1)*100);
        var dt = saTime(x.created_at) + " (السعودية)";
        var wrong = x.wrong || [];
        h += '<div class="q"><div class="num">محاولة '+(rows.length-i)+' · '+dt+'</div>'+
             '<div class="stem">النتيجة: '+tot+'% — إنجليزي '+x.en_correct+'/'+x.en_total+' · رياضيات '+x.ma_correct+'/'+x.ma_total+'</div>';
        if(wrong.length){
          h += '<div class="explain show"><b>الأخطاء للمراجعة:</b><br>'+
               wrong.map(function(w){ return '• ['+(w.subject||'')+'] '+w.q+' → إجابتك: <span style="color:var(--bad)">'+w.picked+'</span> · الصحيح: <span style="color:var(--good);font-weight:700">'+w.correct+'</span>'; }).join('<br>')+'</div>';
        }else{
          h += '<div class="explain show">🎉 بدون أخطاء في هذي المحاولة</div>';
        }
        h += '</div>';
      });
      h += '<button class="reset" id="logRefresh">🔄 تحديث</button>';
      sec.innerHTML = h;
      var rb = document.getElementById("logRefresh"); if(rb) rb.addEventListener("click", function(){ renderLog(true); });
    }catch(e){
      sec.innerHTML = '<div class="locked">⚠️ تعذّر التحميل — تأكد من الاتصال بالإنترنت وأعد المحاولة.</div>';
    }
  }

  // كتالوج المهارات — يكتشف الضعف من أخطاء الطالب الفعلية
  const SKILLS = [
    {name:"الجذور", rx:/√/, yt:"شرح الجذر التربيعي رياضيات", vid:"ZCqUScj68io",
     lesson:`<p>√ العدد = ما نضربه بنفسه فيعطيه. √144 = 12 لأن 12×12 = 144.</p>`,
     gen:function(){var r=ri(2,15),v=r*r,o=opt3(r,[r+1,r-1,v]);return ["احسب: √"+v,o[0],o[1],r+"×"+r+"="+v+" → √"+v+"="+r+".","ma"];}},
    {name:"حل المعادلات", rx:/حل\s*:|معادلة|\dx|\dس|x\s*=|س\s*=|x²|س²/, yt:"شرح حل المعادلات من الدرجة الأولى", vid:"DOvRWNhHNfw",
     lesson:`<p>نعزل x: ننقل الأرقام ثم نقسم على معامل x. 3x+2=11 → 3x=9 → x=3.</p>`,
     gen:function(){var x=ri(2,9),a=ri(2,6),b=ri(1,9),c=a*x+b,o=opt3("x="+x,["x="+(x+1),"x="+(x-1),"x="+(x+2)]);return ["حل: "+a+"x + "+b+" = "+c,o[0],o[1],a+"x="+(c-b)+" → x="+x+".","ma"];}},
    {name:"الأسس", rx:/[²³⁴⁵⁶⁷]|الأس/, yt:"شرح الأسس والقوى رياضيات", vid:"Fe7wwArseKs",
     lesson:`<p>الأس = نضرب العدد بنفسه. 7² = 7×7 = 49 (وليس 7×2). 2⁴ = 16.</p>`,
     gen:function(){var b=ri(2,7),e=gpick([2,3]),v=Math.pow(b,e),o=opt3(v,[b*e,v+b,v-b]);return ["احسب: "+b+sup(e),o[0],o[1],b+" مضروب بنفسه "+e+" مرات = "+v+".","ma"];}},
    {name:"الهندسة", rx:/مساحة|محيط|حجم|مثلث|زاوية|الوتر|قطر/, yt:"شرح المساحة والمحيط للمستطيل والمربع رياضيات", vid:"YdfAeX3oztU",
     lesson:`<p>مساحة المستطيل = الطول×العرض. المحيط = (الطول+العرض)×2. مساحة المربع = الضلع².</p>`,
     gen:function(){var L=ri(4,12),W=ri(3,9),o=opt3(L*W,[2*(L+W),L+W,L*W-W]);return ["مساحة مستطيل طوله "+L+" وعرضه "+W+"؟",o[0],o[1],L+"×"+W+"="+(L*W)+".","ma"];}},
    {name:"النسبة المئوية", rx:/%|النسبة|نسبة/, yt:"شرح النسبة المئوية رياضيات", vid:"-l_eKKlqVYA",
     lesson:`<p>p% من N = (p÷100)×N. مثال: 20% من 150 = 30.</p>`,
     gen:function(){var cf=gpick([[10,10],[20,5],[25,4],[50,2]]),p=cf[0],N=cf[1]*ri(3,20),v=N*p/100,o=opt3(v,[v+5,v-5,v*2]);return ["كم يساوي "+p+"% من "+N+"؟",o[0],o[1],"("+p+"÷100)×"+N+"="+v+".","ma"];}},
    {name:"الكسور", rx:/[½⅓⅔¼¾⅕⅖⅗⅘⅙⅚]|\d\/\d|كسر/, yt:"شرح جمع الكسور المتشابهة رياضيات", vid:"NZWbiTZCyLw",
     lesson:`<p>عند تساوي المقام: نجمع البسط فقط والمقام يبقى. ⅓ + ⅓ = ⅔.</p>`,
     gen:function(){var d=ri(3,8),a=ri(1,d-2),b=ri(1,d-a-1),n=a+b,o=opt3(n+"/"+d,[a+"/"+d,n+"/"+(2*d),(n+1)+"/"+d]);return ["احسب: "+a+"/"+d+" + "+b+"/"+d,o[0],o[1],"نجمع البسط: "+n+"/"+d+".","ma"];}},
    {name:"ترتيب العمليات", rx:/[+\-−].*×|×.*[+\-−]/, yt:"شرح ترتيب العمليات الحسابية أولويات", vid:"SmhDFKL6HD0",
     lesson:`<p>نبدأ بالضرب والقسمة قبل الجمع والطرح. 6+4×3 = 6+12 = 18.</p>`,
     gen:function(){var a=ri(2,9),b=ri(2,9),c=ri(2,5),s=a+b*c,o=opt3(s,[(a+b)*c,s+c,a+b+c]);return ["احسب: "+a+" + "+b+" × "+c,o[0],o[1],b+"×"+c+"="+(b*c)+" ثم +"+a+"="+s+".","ma"];}},
    {name:"الأعداد السالبة", rx:/−\d|احسب:\s*−/, yt:"شرح جمع وطرح الأعداد الصحيحة السالبة", vid:"MUHOqZBDqtY",
     lesson:`<p>خط الأعداد: الجمع تقدّم يمين، الطرح رجوع يسار. −6+10=4. سالب×موجب=سالب.</p>`,
     gen:function(){var a=ri(2,15),b=ri(2,15),s=-a+b,o=opt3(s,[a+b,-(a+b),-a-b]);return ["احسب: −"+a+" + "+b,o[0],o[1],"من −"+a+" نتقدّم "+b+" → "+s+".","ma"];}},
    {name:"الجموع الشاذة", rx:/plural/i, yt:"شرح الجمع الشاذ irregular plural انجليزي", vid:"ft5TVez5wRA",
     lesson:`<p><span class="ltr">man→men · child→children · foot→feet · leaf→leaves · woman→women</span></p>`, gen:ePluralAdv},
    {name:"الأضداد", rx:/opposite/i, yt:"شرح الأضداد opposites في اللغة الانجليزية بالعربي",
     lesson:`<p><span class="ltr">big↔small · hot↔cold · easy↔difficult · cheap↔expensive · ancient↔modern</span></p>`, gen:eOpp},
    {name:"المقارنة والتفضيل", rx:/than|comparative/i, yt:"شرح درس المقارنة والتفضيل comparative superlative انجليزي", vid:"xpebYn5P64U",
     lesson:`<p><span class="ltr">taller than · the tallest · more famous than · the most famous</span></p>`, gen:eComp},
    {name:"الأزمنة", rx:/\bhad\b|\bhas\b|\bhave\b|\bwas\b|\bwere\b|\bwill\b|since|yet|already/i, yt:"شرح جميع الأزمنة في اللغة الانجليزية tenses", vid:"ObdBVilW8r0",
     lesson:`<p><span class="ltr">Past: went · Present perfect: has done · Past continuous: was playing</span></p>`, gen:ePast}
  ];

  async function renderRemedial(){
    const sec = document.getElementById("rem");
    sec.innerHTML = `<div class="block-title"><span class="dot"></span> تمارين علاجية 💪</div><div class="review"><p class="hint" style="padding:14px">⏳ نحلّل نقاط ضعفك من آخر اختباراتك...</p></div>`;
    // نقرأ أخطاء الطالب الفعلية من قاعدة البيانات (تتحدّث بعد كل اختبار)
    let wrongs = [];
    try{
      const r = await fetch(SUPA_URL+"/rest/v1/attempts?select=wrong,meta&student=eq."+encodeURIComponent(S.name)+"&order=created_at.desc&limit=15",
        {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
      const rows = await r.json();
      // نأخذ أخطاء آخر 3 اختبارات مدرسية فقط — فأي مهارة يتقنها لاحقًا تختفي تلقائيًا
      const school = (Array.isArray(rows)?rows:[]).filter(x=> !(x.meta && x.meta.kind));
      school.slice(0, 3).forEach(x=> (x.wrong||[]).forEach(w=> wrongs.push(w)));
    }catch(e){}
    const counts = {};
    wrongs.forEach(w=>{ const t=(w.q||"")+" "+(w.subject||""); for(let i=0;i<SKILLS.length;i++){ if(SKILLS[i].rx.test(t)){ counts[SKILLS[i].name]=(counts[SKILLS[i].name]||0)+1; break; } } });
    const top = SKILLS.filter(s=>counts[s.name]).sort((a,b)=>counts[b.name]-counts[a.name]).slice(0,4);

    let html = `<div class="block-title"><span class="dot"></span> تمارين علاجية 💪</div>`;
    if(top.length){
      html += `<div class="review"><details open><summary>🎯 نقاط ضعفك الآن (من آخر ٣ اختبارات)</summary><div class="body">هذي نقاط ضعفك الحالية — <b>لما تتقن أي مهارة وتجاوبها صح، تختفي تلقائيًا ✅</b>:<br>`+
        top.map(s=>`• <b>${s.name}</b> <span style="color:var(--accent)">(${counts[s.name]} مرة)</span>`).join("<br>")+`</div></details></div>`;
      html += `<div class="block-title"><span class="dot"></span> دروس الشرح 🎬 (لنقاط ضعفك)</div><div class="review">`;
      top.forEach(s=>{
        const q = encodeURIComponent(s.yt);
        let vid = `<div style="margin-top:12px">`;
        if(s.vid){ vid += `<a href="https://www.youtube.com/watch?v=${s.vid}" target="_blank" rel="noopener" data-vid="${s.name}" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800">🎬 شاهد فيديو الشرح</a> `; }
        vid += `<a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" data-vid="${s.name}" style="display:inline-block;text-decoration:none;color:var(--muted);font-size:.85rem;padding:10px 6px;font-weight:700">🔎 دروس أكثر</a></div>`;
        html += `<details data-lesson="${s.name}"><summary>🎬 ${s.name}</summary><div class="body">${s.lesson}${vid}</div></details>`;
      });
      html += `</div>`;
    } else {
      html += `<div class="review"><details open><summary>🎉 ما عندك أخطاء متكررة!</summary><div class="body">أداؤك ممتاز — هذي تمارين عامة للحفاظ على مستواك.</div></details></div>`;
    }

    let items = [];
    if(top.length){ top.forEach(s=>{ for(let k=0;k<3;k++){ try{ items.push(s.gen()); }catch(e){} } }); }
    else { if(MGEN[who]) items=items.concat(genN(MGEN[who],6)); if(EGEN[who]) items=items.concat(genN(EGEN[who],4)); }
    items = shuffle(items);

    html += `<div class="block-title"><span class="dot"></span> تدرّب على نقاط ضعفك</div>`;
    items.forEach((q,i)=>{
      const isEn = q[4]==="en";
      html += `<div class="q" data-i="${i}"><div class="num">تمرين ${i+1}</div>`+
        `<div class="stem ${isEn?'ltr':''}">${q[0]}</div><div class="opts">`;
      q[1].forEach((o,j)=>{ html += `<button class="${isEn?'ltr':''}" data-j="${j}">${o}</button>`; });
      html += `</div><div class="explain" ${(q[4]==="ma")?'dir="ltr"':''}>${q[3]}</div></div>`;
    });
    html += `<div class="scorebar"><span class="txt" data-score>0 / ${items.length}</span>`+
      `<div class="track"><div class="fill" data-fill></div></div></div>`+
      `<button class="reset">إعادة التمارين 🔄</button>`;
    sec.innerHTML = html;
    const answered = new Set(); const total = items.length; let correct = 0;
    const scoreEl = sec.querySelector("[data-score]"), fillEl = sec.querySelector("[data-fill]");
    sec.querySelectorAll(".q").forEach(qEl=>{
      const i = +qEl.dataset.i, ans = items[i][2];
      qEl.querySelectorAll(".opts button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(answered.has(i)) return; answered.add(i);
          qEl.querySelectorAll(".opts button").forEach(b=>b.disabled=true);
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          if(items[i][4]==="en") injectProw(qEl, items[i][0], items[i][1][ans]);
          scoreEl.textContent = `${correct} / ${total}`;
          fillEl.style.width = (answered.size/total*100)+"%";
        });
      });
    });
    sec.querySelector(".reset").addEventListener("click", renderRemedial);
    // تتبّع فتح الدروس والفيديوهات
    sec.querySelectorAll("[data-vid]").forEach(function(a){ a.addEventListener("click", function(){ logEvent("video", a.getAttribute("data-vid")); }); });
    // نسجّل الدرس فقط إذا بقي مفتوحًا ٦ ثوانٍ فأكثر (دراسة فعلية مب نقرة خاطفة)، ونخزّن مدة البقاء
    sec.querySelectorAll("details[data-lesson]").forEach(function(d){
      var openedAt=null;
      function commit(){ if(d._logged || openedAt==null) return; var secs=Math.round((Date.now()-openedAt)/1000); if(secs<6) return; d._logged=true; logEvent("lesson", d.getAttribute("data-lesson"), secs); }
      d.addEventListener("toggle", function(){ if(d.open){ openedAt=Date.now(); } else { commit(); } });
      document.addEventListener("visibilitychange", function(){ if(document.hidden && d.open) commit(); });
      window.addEventListener("pagehide", function(){ if(d.open) commit(); });
    });
  }

  ["en","ma"].forEach(build);
  renderResults();
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById(b.dataset.tab).classList.add('active');
      if(b.dataset.tab==="res") renderResults();
      if(b.dataset.tab==="log") renderLog();
      if(b.dataset.tab==="arb") renderArb();
      if(b.dataset.tab==="rem") renderRemedial();
    });
  });
}
