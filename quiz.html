<style>
  :root{
    --accent:#0d9488; --accent-soft:#5eead4; --accent-deep:#0f766e;
    --bg:#f6f8fa; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c50;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff;border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;letter-spacing:.06em;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.7rem;font-weight:800}
  header.top p{margin:8px 0 0;opacity:.93;font-size:.95rem}
  .tabs{display:flex;gap:8px;margin:18px 0;position:sticky;top:8px;z-index:5}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:12px 6px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:var(--shadow);transition:.15s}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  section.panel{display:none}
  section.panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .block-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.05rem;font-weight:800}
  .block-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:var(--shadow)}
  .review details{border-bottom:1px solid var(--line);padding:4px 0}
  .review details:last-child{border-bottom:0}
  .review summary{cursor:pointer;font-weight:700;padding:12px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .review summary::-webkit-details-marker{display:none}
  .review summary::after{content:"+";color:var(--accent);font-weight:800;font-size:1.25rem}
  .review details[open] summary::after{content:"–"}
  .review .body{padding:0 4px 14px;color:var(--muted)}
  .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .q .stem{font-weight:700;margin:4px 0 12px;font-size:1.08rem}
  .opts{display:grid;gap:8px}
  .opts button{text-align:right;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;transition:.12s}
  .opts button:hover:not(:disabled){border-color:var(--accent)}
  .opts button:disabled{cursor:default}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.9rem;color:var(--muted);padding:8px 12px;background:var(--bg);border-radius:10px;display:none}
  .explain.show{display:block}
  .scorebar{position:sticky;bottom:12px;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .scorebar .track{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .scorebar .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
  .scorebar .txt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .reset{margin:16px auto 0;display:block;background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
  .res-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);text-align:center}
  .res-emoji{font-size:2.6rem;line-height:1}
  .res-hero h2{margin:8px 0 2px;font-size:1.3rem}
  .res-hero .sub{color:var(--muted);font-size:.95rem;margin:0}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .res-cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .res-cell .lbl{color:var(--muted);font-size:.9rem;margin-bottom:4px}
  .res-cell .val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .res-cell .pct{font-size:.85rem;color:var(--accent);font-weight:700}
  .mistakes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;box-shadow:var(--shadow)}
  .mistakes .mi{border-bottom:1px solid var(--line);padding:11px 2px;font-size:.95rem}
  .mistakes .mi:last-child{border-bottom:0}
  .mistakes .mi .qq{font-weight:700;margin-bottom:3px}
  .mistakes .mi .pick{color:var(--bad)}
  .mistakes .mi .corr{color:var(--good);font-weight:700}
  .save-status{text-align:center;font-weight:800;margin:14px 0 4px;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
  .note{color:var(--muted);font-size:.88rem;text-align:center;margin-top:6px}
  .locked{color:var(--muted);text-align:center;padding:40px 10px}
  .picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .picker a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:14px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow)}
</style>
</head>

function pickVoice(lang){
  try{
    var isAr = lang && lang.indexOf("ar")===0;
    var langRe = isAr ? /^ar/i : /^en/i;
    var cands = speechSynthesis.getVoices().filter(function(x){return langRe.test(x.lang);});
    var good = cands.filter(function(x){return /(siri|enhanced|premium|natural|neural|eloquence|maged|majed|tarik|laila|samantha|daniel|karen|serena)/i.test(x.name);});
    return good[0] || cands[0] || null;
  }catch(e){ return null; }
}

var AUDIO_VER = "s6";
var MANIFEST = null, MANI_DONE = false, CUR_AUDIO = null;
var MANI_P = fetch("audio/manifest.json?v=" + AUDIO_VER)
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(m){ MANIFEST = m; MANI_DONE = true; })
  .catch(function(){ MANI_DONE = true; });
var AUDIO_FIX = {"منى":"مُنى"};
function stripTash(s){ return (s||"").replace(/[ً-ْٰ]/g,""); }
function audioKey(s){ s = stripTash(s); for(var k in AUDIO_FIX){ s = s.split(k).join(AUDIO_FIX[k]); } return s; }
function speakAr(text, rate){
  if(!MANI_DONE){ MANI_P.then(function(){ speakAr(text, rate); }); return; }
  var key = audioKey(text); // بدون حركات ليُقرأ أصح
  if(MANIFEST && MANIFEST.ar && MANIFEST.ar[key]){
    try{
      if(CUR_AUDIO){ CUR_AUDIO.pause(); }
      var a = new Audio("audio/" + MANIFEST.ar[key] + "?v=" + AUDIO_VER);
      a.playbackRate = Math.max(0.5, rate || 1);
      CUR_AUDIO = a; a.play(); return;
    }catch(e){}
  }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(key);
    u.lang = "ar-SA"; u.rate = rate || 0.9;
    var v = pickVoice("ar-SA"); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ alert("المتصفح لا يدعم النطق. جرّب Chrome أو Safari."); }
}

  function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function gpick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function sup(n){ return ({1:"¹",2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶"})[n] || ("^"+n); }
  function opt3(correct, distractors){
    var o=[correct];
    (distractors||[]).forEach(function(d){ if(o.indexOf(d)<0 && o.length<3) o.push(d); });
    var p=1;
    while(o.length<3){ var c=(typeof correct==="number")?correct+p:String(correct)+"×"; if(o.indexOf(c)<0)o.push(c); p++; if(p>40)break; }
    for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
    return [o.map(function(v){ return String(v).replace(/-/g,"−"); }), o.indexOf(correct)];
  }
  const MGEN = {
    saud:[
      function(){var a=ri(120,480),b=ri(120,480),s=a+b,o=opt3(s,[s+10,s-10,s+100]);return ["احسب: "+a+" + "+b,o[0],o[1],"= "+s+".","ma"];},
      function(){var a=ri(320,900),b=ri(60,a-60),s=a-b,o=opt3(s,[s+10,s-10,s+100]);return ["احسب: "+a+" − "+b,o[0],o[1],"= "+s+".","ma"];},
      function(){var a=ri(11,29),b=ri(3,9),s=a*b,o=opt3(s,[s+b,s-b,s+10]);return ["احسب: "+a+" × "+b,o[0],o[1],"= "+s+".","ma"];},
      function(){var b=ri(3,9),q=ri(4,9),a=b*q,o=opt3(q,[q+1,q-1,q+2]);return ["احسب: "+a+" ÷ "+b,o[0],o[1],"= "+q+".","ma"];},

      function(){var b=ri(4,9),q=ri(11,19),a=b*q,o=opt3(q,[q+1,q-1,q+2]);return ["احسب: "+a+" ÷ "+b,o[0],o[1],"= "+q+".","ma"];},
      function(){var cf=gpick([[10,10],[20,5],[25,4],[50,2]]),p=cf[0],N=cf[1]*ri(3,20),v=N*p/100,o=opt3(v,[v+5,v-5,v*2]);return ["كم يساوي %"+p+" من "+N+"؟",o[0],o[1],"("+p+"÷100)×"+N+" = "+v+".","ma"];},
      function(){var a=ri(2,8),b=ri(1,9),c=ri(2,8),d=ri(1,9),x=a+b/10,y=c+d/10,s=Math.round((x+y)*10)/10,o=opt3(s,[Math.round((x+y+0.1)*10)/10,Math.round((x+y-1)*10)/10,s+1]);return ["احسب: "+x+" + "+y,o[0],o[1],"= "+s+".","ma"];},
      function(){var a=ri(2,9),b=ri(2,9),c=ri(2,9),s=a+b*c,o=opt3(s,[(a+b)*c,s+c,a+b+c]);return ["احسب: "+a+" + "+b+" × "+c,o[0],o[1],"نبدأ بالضرب: "+b+"×"+c+"="+(b*c)+" ثم +"+a+" = "+s+".","ma"];},
      function(){var m=ri(6,20),arr=gpick([[m-4,m,m+4],[m-6,m-2,m+2,m+6]]),o=opt3(m,[m+2,m-2,m+5]);return ["متوسط الأعداد: "+arr.join(" ، "),o[0],o[1],"المجموع ÷ العدد = "+m+".","ma"];}
    ],
    rafeef:[
      function(){var a=ri(2,15),b=ri(2,15),s=-a+b,o=opt3(s,[a+b,-(a+b),-a-b]);return ["احسب: −"+a+" + "+b,o[0],o[1],"من −"+a+" نتقدّم "+b+" → "+s+".","ma"];},
      function(){var a=ri(2,9),b=ri(a+1,18),s=a-b,o=opt3(s,[b-a,-(a+b),s+2]);return ["احسب: "+a+" − "+b,o[0],o[1],a+" أصغر من "+b+" → "+s+".","ma"];},
      function(){var a=ri(2,9),b=ri(2,9),s=-a*b,o=opt3(s,[a*b,-a-b,s+2]);return ["احسب: −"+a+" × "+b,o[0],o[1],"إشارتان مختلفتان → سالب: "+s+".","ma"];},
      function(){var base=ri(2,6),e=ri(2,4),v=Math.pow(base,e),o=opt3(v,[base*e,v+base,v-base]);return ["احسب: "+base+sup(e),o[0],o[1],base+" مضروب بنفسه "+e+" مرات = "+v+".","ma"];},
      function(){var x=ri(2,9),a=ri(2,6),b=ri(1,9),c=a*x+b,o=opt3("x="+x,["x="+(x+1),"x="+(x-1),"x="+(x+2)]);return ["حل: "+a+"x + "+b+" = "+c,o[0],o[1],a+"x = "+(c-b)+" → x = "+x+".","ma"];},
      function(){var cf=gpick([[10,10],[20,5],[25,4],[50,2]]),p=cf[0],N=cf[1]*ri(3,20),v=N*p/100,o=opt3(v,[v+5,v-5,v*2]);return ["كم يساوي %"+p+" من "+N+"؟",o[0],o[1],"("+p+"÷100)×"+N+" = "+v+".","ma"];}

      function(){var base=ri(2,5),m=ri(3,6),n=ri(1,m-1),v=Math.pow(base,m-n),o=opt3(v,[Math.pow(base,m+n),base*(m-n),v+base]);return ["احسب: "+base+sup(m)+" ÷ "+base+sup(n),o[0],o[1],"نطرح الأسس: "+m+"−"+n+"="+(m-n)+" → "+base+sup(m-n)+" = "+v+".","ma"];},
      function(){var a=ri(2,15),b=ri(2,15),s=-a+b,o=opt3(s,[-a-b,a+b,s+3]);return ["احسب: −"+a+" + "+b,o[0],o[1],"= "+s+".","ma"];},
      function(){var x=ri(2,12),a=ri(2,7),b=ri(1,12),c=a*x-b,o=opt3("x="+x,["x="+(x+1),"x="+(x-1),"x="+(x+2)]);return ["حل: "+a+"x − "+b+" = "+c,o[0],o[1],a+"x = "+(c+b)+" → x = "+x+".","ma"];},
      function(){var t=gpick([[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25]]),o=opt3(t[2],[t[2]+2,t[2]-2,t[0]+t[1]]);return ["مثلث قائم ضلعاه "+t[0]+" و "+t[1]+"، الوتر؟",o[0],o[1],"√("+t[0]+"²+"+t[1]+"²) = "+t[2]+".","ma"];},

  function genN(gens, n){ var out=[], seen={}, tries=0; while(out.length<n && tries<n*10){ var q=gpick(gens)(); tries++; if(seen[q[0]])continue; seen[q[0]]=1; out.push(q); } return out; }

  // ===== مولّد جمل إنجليزية (الأسماء والأفعال تتغيّر كل مرة) =====
  function eSv(){
    var subs=[["He",1],["She",1],["It",1],["They",0],["We",0],["I",0],["You",0]];
    var s=gpick(subs), v=gpick(["play","read","eat","help","clean","open","jump","walk","work","sing","cook","call","talk","love","want"]);
    var correct=s[1]?v+"s":v, o=opt3(correct,[v,v+"s",v+"ing"]);
    return [s[0]+" ___ every day.",o[0],o[1],(s[1]?("مع "+s[0]+" نضيف s للفعل"):("مع "+s[0]+" الفعل يبقى مجرّد"))+".","en"];
  }
  function ePlural(){
    var ns=[["box","boxes"],["baby","babies"],["man","men"],["child","children"],["foot","feet"],["tooth","teeth"],["bus","buses"],["city","cities"],["leaf","leaves"],["knife","knives"]];
    var n=gpick(ns), o=opt3(n[1],[n[0]+"s",n[0]+"es",n[0]+"ies"]);
    return ['The plural of "'+n[0]+'" is:',o[0],o[1],"جمع "+n[0]+" = "+n[1]+".","en"];
  }
  function ePrep(){
    var t=gpick([["in","May"],["in","2020"],["in","summer"],["on","Monday"],["on","Friday"],["on","my birthday"],["at","night"],["at","6 o'clock"],["at","noon"]]);
    return ["We meet ___ "+t[1]+".",["in","on","at"],["in","on","at"].indexOf(t[0]),"مع «"+t[1]+"» نستخدم "+t[0]+".","en"];
  }
  function eOpp(){
    var ps=[["big","small"],["hot","cold"],["fast","slow"],["happy","sad"],["old","new"],["open","closed"],["day","night"],["up","down"],["easy","difficult"],["cheap","expensive"],["clean","dirty"],["strong","weak"]];
    var p=gpick(ps), others=[]; ps.forEach(function(x){ if(x!==p){ others.push(x[0],x[1]); } });
    others=shuffle(others).filter(function(w){return w!==p[0]&&w!==p[1];});
    var o=opt3(p[1],others.slice(0,2));
    return ['The opposite of "'+p[0]+'" is:',o[0],o[1],"عكس "+p[0]+" = "+p[1]+".","en"];
  }
  function eAan(){
    var ns=[["apple","an"],["orange","an"],["egg","an"],["umbrella","an"],["book","a"],["car","a"],["hat","a"],["dog","a"],["pen","a"]];
    var n=gpick(ns);
    return ["I have ___ "+n[0]+".",["a","an","the"],["a","an","the"].indexOf(n[1]),(n[1]==="an"?("«"+n[0]+"» تبدأ بحرف متحرك → an"):("«"+n[0]+"» تبدأ بحرف ساكن → a"))+".","en"];
  }
  function ePast(){
    var v=gpick(["play","work","walk","talk","cook","clean","help","wait","call","watch","rain","start","jump","open","visit"]);
    var correct=v+"ed", o=opt3(correct,[v,v+"ing",v+"s"]);
    return ["Yesterday, they ___ a lot.",o[0],o[1],"yesterday تدل على الماضي: "+correct+".","en"];
  }
  function ePresCont(){
    var subs=[["I","am"],["He","is"],["She","is"],["It","is"],["They","are"],["We","are"],["You","are"]];
    var s=gpick(subs), v=gpick(["play","read","eat","work","cook","clean","sleep","sing","walk","jump","help","watch","talk","call"]);
    var correct=s[1]+" "+v+"ing", o=opt3(correct,[v+"s",v,s[1]+" "+v]);

  function eComp(){

  function eColl(){

  function ePluralAdv(){

  function build(id){
    const sec = document.getElementById(id);
    const isEn = id === "en";
    let quiz;
    if (usePool) {
      // أسئلة مولّدة (أرقام/جمل جديدة كل مرة) + المجموعات المنسّقة
      var extra = [];
      if (id==="ma" && MGEN[who]) extra = genN(MGEN[who], 8);
      else if (id==="en" && EGEN[who]) extra = genN(EGEN[who], 6);
      quiz = shuffle(pool(id).concat(extra)).slice(0, QN);
    } else {
      quiz = DATA[id].quiz.slice();
    }
    const d = { review: DATA[id].review, quiz: quiz };
    RESULTS[id] = {correct:0, total:d.quiz.length, wrong:[], done:0, events:[], lastTs:null};
    let html = `<div class="block-title"><span class="dot"></span> المراجعة السريعة</div><div class="review">`;
    d.review.forEach(r=>{ html += `<details><summary>${r[0]}</summary><div class="body">${r[1]}</div></details>`; });
    html += `</div><div class="block-title"><span class="dot"></span> الاختبار</div>`;
    d.quiz.forEach((q,i)=>{
      html += `<div class="q" data-i="${i}"><div class="num">سؤال ${i+1}</div>
        <div class="stem ${isEn?'ltr':''}">${q[0]}</div><div class="opts">`;
      q[1].forEach((o,j)=>{ html += `<button class="${isEn?'ltr':''}" data-j="${j}">${o}</button>`; });
      html += `</div><div class="explain">${q[3]}</div></div>`;
    });
    html += `<div class="scorebar"><span class="txt" data-score>0 / ${d.quiz.length}</span>
      <div class="track"><div class="fill" data-fill></div></div></div>
      <button class="reset">إعادة المحاولة 🔄</button>`;
    sec.innerHTML = html;
    const answered = new Set(); const total = d.quiz.length;
    const scoreEl = sec.querySelector("[data-score]"), fillEl = sec.querySelector("[data-fill]");
    sec.querySelectorAll(".q").forEach(qEl=>{
      const i = +qEl.dataset.i, ans = d.quiz[i][2];
      qEl.querySelectorAll(".opts button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(answered.has(i)) return; answered.add(i);
          const j = +btn.dataset.j;
          const now = Date.now();
          const dt = RESULTS[id].lastTs ? (now - RESULTS[id].lastTs)/1000 : null;
          RESULTS[id].lastTs = now;
          qEl.querySelectorAll(".opts button").forEach(b=>b.disabled=true);
          if(j===ans){ btn.classList.add("correct"); RESULTS[id].correct++; }
          else{
            btn.classList.add("wrong");
            qEl.querySelectorAll(".opts button")[ans].classList.add("correct");
            RESULTS[id].wrong.push({q:d.quiz[i][0], picked:d.quiz[i][1][j], correct:d.quiz[i][1][ans]});
          }
          RESULTS[id].events.push({ok:(j===ans), dt: dt!=null? Math.round(dt*10)/10 : null, c:j});
          qEl.querySelector(".explain").classList.add("show");
          RESULTS[id].done = answered.size;
          scoreEl.textContent = `${RESULTS[id].correct} / ${total}`;
          fillEl.style.width = (answered.size/total*100)+"%";
          renderResults();
        });
      });
    });
    sec.querySelector(".reset").addEventListener("click",()=>{ build(id); renderResults(); });
  }

  function renderResults(){
    const sec = document.getElementById("res");
    const en = RESULTS.en, ma = RESULTS.ma;
    const bothDone = en && ma && en.done===en.total && ma.done===ma.total;
    if(!bothDone){
      savedThisRound = false; saveState = "pending";
      const total = (en?en.total:0)+(ma?ma.total:0);
      const done = (en?en.done:0)+(ma?ma.done:0);
      sec.innerHTML = `<div class="locked">🏁 أكمل حل <b>الإنجليزي</b> و<b>الرياضيات</b> كاملين، وبعدها تظهر النتيجة وتُحفظ تلقائيًا.<br><br>
        تم حلّ <b>${done}</b> من <b>${total}</b> سؤال.</div>`;
      return;
    }
    const totCorrect = en.correct+ma.correct, totAll = en.total+ma.total;
    const pct = Math.round(totCorrect/totAll*100);
    const emoji = pct>=90?"🏆":pct>=70?"🌟":pct>=50?"👍":"💪";
    const msg = pct>=90?"ممتاز جدًا!":pct>=70?"أداء حلو!":pct>=50?"جيد، وفي مجال للتحسّن":"يحتاج مراجعة أكثر — وهذا طبيعي!";
    const enP = Math.round(en.correct/en.total*100), maP = Math.round(ma.correct/ma.total*100);
    let mist = "";
    const allWrong = [...en.wrong.map(w=>["إنجليزي",w]),...ma.wrong.map(w=>["رياضيات",w])];
    if(allWrong.length===0){ mist = `<div class="mi" style="text-align:center">🎉 ما في أي خطأ! إجابات كاملة صحيحة.</div>`; }
    else allWrong.forEach(a=>{
      const sub=a[0], w=a[1];
      mist += `<div class="mi"><div class="qq">[${sub}] ${w.q}</div>
        <div>إجابته: <span class="pick">${w.picked}</span> · الصحيح: <span class="corr">${w.correct}</span></div></div>`;
    });
    sec.innerHTML = `
      <div class="res-hero"><div class="res-emoji">${emoji}</div><h2>${msg}</h2>
        <p class="sub">المجموع ${totCorrect} من ${totAll} · ${pct}%</p></div>
      <div class="res-grid">
        <div class="res-cell"><div class="lbl">الإنجليزي</div><div class="val">${en.correct}/${en.total}</div><div class="pct">${enP}%</div></div>
        <div class="res-cell"><div class="lbl">الرياضيات</div><div class="val">${ma.correct}/${ma.total}</div><div class="pct">${maP}%</div></div>
      </div>
      <div class="block-title"><span class="dot"></span> الأخطاء والتصحيح</div>
      <div class="mistakes">${mist}</div>
      <p class="save-status" id="saveStatus">${statusText()}</p>
      <p class="note">تُحفظ تلقائيًا في لوحة متابعة والدك — لا حاجة لإرسال أي شيء.</p>`;

    if(!savedThisRound){
      savedThisRound = true;
      const per = [
        ...en.events.map(e=>({s:"en", ok:e.ok, dt:e.dt, c:e.c})),
        ...ma.events.map(e=>({s:"ma", ok:e.ok, dt:e.dt, c:e.c}))
      ];
      const dts = per.map(p=>p.dt).filter(x=>x!=null);
      const avg = dts.length ? Math.round(dts.reduce((a,b)=>a+b,0)/dts.length*10)/10 : null;
      const total = dts.length ? Math.round(dts.reduce((a,b)=>a+b,0)) : null;
      saveResult({
        student: S.name, grade: S.grade,
        en_correct: en.correct, en_total: en.total,
        ma_correct: ma.correct, ma_total: ma.total,
        wrong: allWrong.map(a=>({subject:a[0], q:a[1].q, picked:a[1].picked, correct:a[1].correct})),
        meta: { per, avg_sec: avg, total_sec: total }
      });
    }
  }

  let arbBuilt = false;
  function renderArb(){
    if(arbBuilt) return; arbBuilt = true;
    const sec = document.getElementById("arb");
    const A = ARABIC[who];
    if(!A){ sec.innerHTML='<div class="locked">قسم العربية غير متاح.</div>'; return; }
    let h = '<div class="block-title"><span class="dot"></span> الإملاء (اسمع واكتب)</div>'+
      '<p class="explain show" style="display:block">اضغط 🔊 استمع، ثم اكتب ما سمعته، ثم «تحقّق».</p>';
    A.dictation.forEach(function(text,i){
      h += '<div class="q" data-d="'+i+'"><div class="num">إملاء '+(i+1)+'</div>'+
        '<div class="opts" style="grid-auto-flow:column;justify-content:start;gap:8px">'+
        '<button type="button" data-say style="background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800">🔊 استمع</button>'+
        '<button type="button" data-slow>🐢 أبطأ</button></div>'+
        '<input class="dinp" placeholder="اكتب هنا..." style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:1.1rem;margin:10px 0;font-family:inherit;background:transparent;color:var(--ink)">'+
        '<div class="opts" style="grid-auto-flow:column;justify-content:start;gap:8px">'+
        '<button type="button" data-chk>تحقّق</button><button type="button" data-show>👁️ أظهر</button></div>'+
        '<div class="dfb" style="margin-top:8px;font-weight:700;min-height:20px"></div></div>';
    });
    h += '<div class="block-title"><span class="dot"></span> أسئلة اللغة العربية</div>';
    A.quiz.forEach(function(q,i){
      h += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div>'+
        '<div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ h += '<button type="button" data-j="'+j+'">'+o+'</button>'; });
      h += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    h += '<div class="scorebar"><span class="txt" data-ars>0 / '+A.quiz.length+'</span>'+
         '<div class="track"><div class="fill" data-arf></div></div></div>';
    sec.innerHTML = h;

    // إملاء
    sec.querySelectorAll('.q[data-d]').forEach(function(qEl){
      var i = +qEl.dataset.d, text = A.dictation[i];
      var inp = qEl.querySelector('.dinp'), fb = qEl.querySelector('.dfb');
      qEl.querySelector('[data-say]').addEventListener('click', function(){ speakAr(text, 1); });
      qEl.querySelector('[data-slow]').addEventListener('click', function(){ speakAr(text, 0.7); });
      qEl.querySelector('[data-show]').addEventListener('click', function(){ fb.style.color='var(--good)'; fb.textContent='الإجابة: '+text; });
      qEl.querySelector('[data-chk]').addEventListener('click', function(){
        if(normAr(inp.value)===normAr(text)){ fb.style.color='var(--good)'; fb.textContent='✅ صحيح!'; }
        else{ fb.style.color='var(--bad)'; fb.textContent='❌ حاول ثانية · الصحيح: '+text; }
      });
    });
    // أسئلة
    var answered = new Set(), correct = 0, total = A.quiz.length;
    var scoreEl = sec.querySelector('[data-ars]'), fillEl = sec.querySelector('[data-arf]');
    sec.querySelectorAll('.q[data-i]').forEach(function(qEl){
      var i = +qEl.dataset.i, ans = A.quiz[i][2];
      qEl.querySelectorAll('.opts button').forEach(function(btn){
        btn.addEventListener('click', function(){
          if(answered.has(i)) return; answered.add(i);
          var j = +btn.dataset.j;
          qEl.querySelectorAll('.opts button').forEach(function(b){b.disabled=true;});
          if(j===ans){ btn.classList.add('correct'); correct++; }
          else{ btn.classList.add('wrong'); qEl.querySelectorAll('.opts button')[ans].classList.add('correct'); }
          qEl.querySelector('.explain').classList.add('show');
          scoreEl.textContent = correct+' / '+total;
          fillEl.style.width = (answered.size/total*100)+'%';
        });
      });
    });
  }

  let logLoaded = false;
  async function renderLog(force){
    const sec = document.getElementById("log");
    if (logLoaded && !force) return;
    sec.innerHTML = '<div class="locked">⏳ جارٍ تحميل محاولاتك السابقة...</div>';
    try{
      const r = await fetch(SUPA_URL+"/rest/v1/attempts?select=*&student=eq."+encodeURIComponent(S.name)+"&order=created_at.desc",
        {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}});
      const rows = await r.json();
      logLoaded = true;
      if(!Array.isArray(rows) || !rows.length){
        sec.innerHTML = '<div class="locked">ما عندك محاولات سابقة بعد. حل الاختبار وبتنحفظ هنا تلقائيًا.</div>'; return;
      }
      let h = '<div class="block-title"><span class="dot"></span> محاولاتك السابقة ('+rows.length+')</div>';
      rows.forEach(function(x,i){
        var tot = Math.round((x.en_correct+x.ma_correct)/((x.en_total+x.ma_total)||1)*100);
        var dt = (x.created_at||"").slice(0,16).replace("T"," ");
        var wrong = x.wrong || [];
        h += '<div class="q"><div class="num">محاولة '+(rows.length-i)+' · '+dt+'</div>'+
             '<div class="stem">النتيجة: '+tot+'% — إنجليزي '+x.en_correct+'/'+x.en_total+' · رياضيات '+x.ma_correct+'/'+x.ma_total+'</div>';
        if(wrong.length){
          h += '<div class="explain show"><b>الأخطاء للمراجعة:</b><br>'+
               wrong.map(function(w){ return '• ['+(w.subject||'')+'] '+w.q+' → إجابتك: <span style="color:var(--bad)">'+w.picked+'</span> · الصحيح: <span style="color:var(--good);font-weight:700">'+w.correct+'</span>'; }).join('<br>')+'</div>';
        }else{
          h += '<div class="explain show">🎉 بدون أخطاء في هذي المحاولة</div>';
        }
        h += '</div>';
      });
      h += '<button class="reset" id="logRefresh">🔄 تحديث</button>';
      sec.innerHTML = h;
      var rb = document.getElementById("logRefresh"); if(rb) rb.addEventListener("click", function(){ renderLog(true); });
    }catch(e){
      sec.innerHTML = '<div class="locked">⚠️ تعذّر التحميل — تأكد من الاتصال بالإنترنت وأعد المحاولة.</div>';
    }
  }

  function renderRemedial(){
    const sec = document.getElementById("rem");
    const R = REMEDIAL[who];
    if(!R){ sec.innerHTML = '<p class="hint">لا توجد تمارين علاجية لهذا الطالب حاليًا.</p>'; return; }
    // رياضيات وإنجليزي مولّدان بأرقام/جمل جديدة كل مرة
    const mathItems = MGEN[who] ? genN(MGEN[who], 7) : R.items.filter(q=>q[4]==="ma");
    const engItems = EGEN[who] ? genN(EGEN[who], 5) : R.items.filter(q=>q[4]==="en");
    const items = shuffle(mathItems.concat(engItems));
    let html = `<div class="block-title"><span class="dot"></span> تمارين علاجية 💪</div>`+
      `<div class="review"><details open><summary>على وش نركّز؟</summary><div class="body">${R.focus}</div></details></div>`;
    const lessons = LESSONS[who] || [];
    if(lessons.length){
      html += `<div class="block-title"><span class="dot"></span> دروس الشرح 🎬 (افتحها قبل الحل)</div><div class="review">`;
      lessons.forEach(l=>{
        const q = encodeURIComponent((l[2] || l[0].replace('🎬','').trim()) + ' شرح مبسط للأطفال');
        const vid = `<div style="margin-top:12px"><a href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800">🎬 شاهد فيديو شرح على يوتيوب</a></div>`;
        html += `<details><summary>${l[0]}</summary><div class="body">${l[1]}${vid}</div></details>`;
      });
      html += `</div>`;
    }
    html += `<div class="block-title"><span class="dot"></span> تدرّب وتعلّم</div>`;
    items.forEach((q,i)=>{
      const isEn = q[4]==="en";
      html += `<div class="q" data-i="${i}"><div class="num">تمرين ${i+1}</div>`+
        `<div class="stem ${isEn?'ltr':''}">${q[0]}</div><div class="opts">`;
      q[1].forEach((o,j)=>{ html += `<button class="${isEn?'ltr':''}" data-j="${j}">${o}</button>`; });
      html += `</div><div class="explain">${q[3]}</div></div>`;
    });
    html += `<div class="scorebar"><span class="txt" data-score>0 / ${items.length}</span>`+
      `<div class="track"><div class="fill" data-fill></div></div></div>`+
      `<button class="reset">إعادة التمارين 🔄</button>`;
    sec.innerHTML = html;
    const answered = new Set(); const total = items.length; let correct = 0;
    const scoreEl = sec.querySelector("[data-score]"), fillEl = sec.querySelector("[data-fill]");
    sec.querySelectorAll(".q").forEach(qEl=>{
      const i = +qEl.dataset.i, ans = items[i][2];
      qEl.querySelectorAll(".opts button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(answered.has(i)) return; answered.add(i);
          qEl.querySelectorAll(".opts button").forEach(b=>b.disabled=true);
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = `${correct} / ${total}`;
          fillEl.style.width = (answered.size/total*100)+"%";
        });
      });
    });
    sec.querySelector(".reset").addEventListener("click", renderRemedial);
  }

  ["en","ma"].forEach(build);
  renderResults();
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById(b.dataset.tab).classList.add('active');
      if(b.dataset.tab==="res") renderResults();
      if(b.dataset.tab==="log") renderLog();
      if(b.dataset.tab==="arb") renderArb();
      if(b.dataset.tab==="rem") renderRemedial();
    });
  });
}
</script>
</body>
</html>
