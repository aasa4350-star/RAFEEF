<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختبارات ومراجعات الأبناء</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --accent:#0d9488; --accent-soft:#5eead4; --accent-deep:#0f766e;
    --bg:#f6f8fa; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c50;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));
    color:#fff;border-radius:22px;padding:26px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%);border-radius:50%}
  header.top .eyebrow{font-size:.82rem;letter-spacing:.06em;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.7rem;font-weight:800}
  header.top p{margin:8px 0 0;opacity:.93;font-size:.95rem}
  .tabs{display:flex;gap:8px;margin:18px 0;position:sticky;top:8px;z-index:5}
  .tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:12px 6px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;
    font-family:inherit;box-shadow:var(--shadow);transition:.15s}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  section.panel{display:none}
  section.panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .block-title{display:flex;align-items:center;gap:10px;margin:22px 4px 12px;font-size:1.05rem;font-weight:800}
  .block-title .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;box-shadow:var(--shadow)}
  .review details{border-bottom:1px solid var(--line);padding:4px 0}
  .review details:last-child{border-bottom:0}
  .review summary{cursor:pointer;font-weight:700;padding:12px 4px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .review summary::-webkit-details-marker{display:none}
  .review summary::after{content:"+";color:var(--accent);font-weight:800;font-size:1.25rem}
  .review details[open] summary::after{content:"–"}
  .review .body{padding:0 4px 14px;color:var(--muted)}
  .ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800;letter-spacing:.05em}
  .q .stem{font-weight:700;margin:4px 0 12px;font-size:1.08rem}
  .opts{display:grid;gap:8px}
  .opts button{text-align:right;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;transition:.12s}
  .opts button:hover:not(:disabled){border-color:var(--accent)}
  .opts button:disabled{cursor:default}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.9rem;color:var(--muted);padding:8px 12px;background:var(--bg);border-radius:10px;display:none}
  .explain.show{display:block}
  .scorebar{position:sticky;bottom:12px;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .scorebar .track{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .scorebar .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
  .scorebar .txt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .reset{margin:16px auto 0;display:block;background:none;border:1px solid var(--line);color:var(--muted);padding:9px 18px;border-radius:11px;cursor:pointer;font-family:inherit;font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
  .res-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);text-align:center}
  .res-emoji{font-size:2.6rem;line-height:1}
  .res-hero h2{margin:8px 0 2px;font-size:1.3rem}
  .res-hero .sub{color:var(--muted);font-size:.95rem;margin:0}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
  .res-cell{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .res-cell .lbl{color:var(--muted);font-size:.9rem;margin-bottom:4px}
  .res-cell .val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
  .res-cell .pct{font-size:.85rem;color:var(--accent);font-weight:700}
  .mistakes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;box-shadow:var(--shadow)}
  .mistakes .mi{border-bottom:1px solid var(--line);padding:11px 2px;font-size:.95rem}
  .mistakes .mi:last-child{border-bottom:0}
  .mistakes .mi .qq{font-weight:700;margin-bottom:3px}
  .mistakes .mi .pick{color:var(--bad)}
  .mistakes .mi .corr{color:var(--good);font-weight:700}
  .save-status{text-align:center;font-weight:800;margin:14px 0 4px;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
  .note{color:var(--muted);font-size:.88rem;text-align:center;margin-top:6px}
  .locked{color:var(--muted);text-align:center;padding:40px 10px}
  .picker{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .picker a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);
    padding:14px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow)}
</style>

      savedThisRound = false;
    }
    paintStatus();
  }

  function build(id){
    const d = DATA[id], sec = document.getElementById(id);
    const isEn = id === "en";
    RESULTS[id] = {correct:0, total:d.quiz.length, wrong:[], done:0, events:[], lastTs:null};
    let html = `<div class="block-title"><span class="dot"></span> المراجعة السريعة</div><div class="review">`;
    d.review.forEach(r=>{ html += `<details><summary>${r[0]}</summary><div class="body">${r[1]}</div></details>`; });
    html += `</div><div class="block-title"><span class="dot"></span> الاختبار</div>`;
    d.quiz.forEach((q,i)=>{
      html += `<div class="q" data-i="${i}"><div class="num">سؤال ${i+1}</div>
        <div class="stem ${isEn?'ltr':''}">${q[0]}</div><div class="opts">`;
      q[1].forEach((o,j)=>{ html += `<button class="${isEn?'ltr':''}" data-j="${j}">${o}</button>`; });
      html += `</div><div class="explain">${q[3]}</div></div>`;
    });
    html += `<div class="scorebar"><span class="txt" data-score>0 / ${d.quiz.length}</span>
      <div class="track"><div class="fill" data-fill></div></div></div>
      <button class="reset">إعادة المحاولة 🔄</button>`;
    sec.innerHTML = html;
    const answered = new Set(); const total = d.quiz.length;
    const scoreEl = sec.querySelector("[data-score]"), fillEl = sec.querySelector("[data-fill]");
    sec.querySelectorAll(".q").forEach(qEl=>{
      const i = +qEl.dataset.i, ans = d.quiz[i][2];
      qEl.querySelectorAll(".opts button").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(answered.has(i)) return; answered.add(i);
          const j = +btn.dataset.j;
          const now = Date.now();
          const dt = RESULTS[id].lastTs ? (now - RESULTS[id].lastTs)/1000 : null;
          RESULTS[id].lastTs = now;
          qEl.querySelectorAll(".opts button").forEach(b=>b.disabled=true);
          if(j===ans){ btn.classList.add("correct"); RESULTS[id].correct++; }
          else{
            btn.classList.add("wrong");
            qEl.querySelectorAll(".opts button")[ans].classList.add("correct");
            RESULTS[id].wrong.push({q:d.quiz[i][0], picked:d.quiz[i][1][j], correct:d.quiz[i][1][ans]});
          }
          RESULTS[id].events.push({ok:(j===ans), dt: dt!=null? Math.round(dt*10)/10 : null, c:j});
          qEl.querySelector(".explain").classList.add("show");
          RESULTS[id].done = answered.size;
          scoreEl.textContent = `${RESULTS[id].correct} / ${total}`;
          fillEl.style.width = (answered.size/total*100)+"%";
          renderResults();
        });
      });
    });
    sec.querySelector(".reset").addEventListener("click",()=>{ build(id); renderResults(); });
  }

  function renderResults(){
    const sec = document.getElementById("res");
    const en = RESULTS.en, ma = RESULTS.ma;
    const bothDone = en && ma && en.done===en.total && ma.done===ma.total;
    if(!bothDone){
      savedThisRound = false; saveState = "pending";
      const total = (en?en.total:0)+(ma?ma.total:0);
      const done = (en?en.done:0)+(ma?ma.done:0);
      sec.innerHTML = `<div class="locked">🏁 أكمل حل <b>الإنجليزي</b> و<b>الرياضيات</b> كاملين، وبعدها تظهر النتيجة وتُحفظ تلقائيًا.<br><br>
        تم حلّ <b>${done}</b> من <b>${total}</b> سؤال.</div>`;
      return;
    }
    const totCorrect = en.correct+ma.correct, totAll = en.total+ma.total;
    const pct = Math.round(totCorrect/totAll*100);
    const emoji = pct>=90?"🏆":pct>=70?"🌟":pct>=50?"👍":"💪";
    const msg = pct>=90?"ممتاز جدًا!":pct>=70?"أداء حلو!":pct>=50?"جيد، وفي مجال للتحسّن":"يحتاج مراجعة أكثر — وهذا طبيعي!";
    const enP = Math.round(en.correct/en.total*100), maP = Math.round(ma.correct/ma.total*100);
    let mist = "";
    const allWrong = [...en.wrong.map(w=>["إنجليزي",w]),...ma.wrong.map(w=>["رياضيات",w])];
    if(allWrong.length===0){ mist = `<div class="mi" style="text-align:center">🎉 ما في أي خطأ! إجابات كاملة صحيحة.</div>`; }
    else allWrong.forEach(a=>{
      const sub=a[0], w=a[1];
      mist += `<div class="mi"><div class="qq">[${sub}] ${w.q}</div>
        <div>إجابته: <span class="pick">${w.picked}</span> · الصحيح: <span class="corr">${w.correct}</span></div></div>`;
    });
    sec.innerHTML = `
      <div class="res-hero"><div class="res-emoji">${emoji}</div><h2>${msg}</h2>
        <p class="sub">المجموع ${totCorrect} من ${totAll} · ${pct}%</p></div>
      <div class="res-grid">
        <div class="res-cell"><div class="lbl">الإنجليزي</div><div class="val">${en.correct}/${en.total}</div><div class="pct">${enP}%</div></div>
        <div class="res-cell"><div class="lbl">الرياضيات</div><div class="val">${ma.correct}/${ma.total}</div><div class="pct">${maP}%</div></div>
      </div>
      <div class="block-title"><span class="dot"></span> الأخطاء والتصحيح</div>
      <div class="mistakes">${mist}</div>
      <p class="save-status" id="saveStatus">${statusText()}</p>
      <p class="note">تُحفظ تلقائيًا في لوحة متابعة والدك — لا حاجة لإرسال أي شيء.</p>`;

    if(!savedThisRound){
      savedThisRound = true;
      const per = [
        ...en.events.map(e=>({s:"en", ok:e.ok, dt:e.dt, c:e.c})),
        ...ma.events.map(e=>({s:"ma", ok:e.ok, dt:e.dt, c:e.c}))
      ];
      const dts = per.map(p=>p.dt).filter(x=>x!=null);
      const avg = dts.length ? Math.round(dts.reduce((a,b)=>a+b,0)/dts.length*10)/10 : null;
      const total = dts.length ? Math.round(dts.reduce((a,b)=>a+b,0)) : null;
      saveResult({
        student: S.name, grade: S.grade,
        en_correct: en.correct, en_total: en.total,
        ma_correct: ma.correct, ma_total: ma.total,
        wrong: allWrong.map(a=>({subject:a[0], q:a[1].q, picked:a[1].picked, correct:a[1].correct})),
        meta: { per, avg_sec: avg, total_sec: total }
      });
    }
  }

  ["en","ma"].forEach(build);
  renderResults();
  document.querySelectorAll('.tabs button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));
      b.setAttribute('aria-selected','true');
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      document.getElementById(b.dataset.tab).classList.add('active');
      if(b.dataset.tab==="res") renderResults();
    });
  });
}
</script>
</body>
</html>
