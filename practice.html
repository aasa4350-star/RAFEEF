<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>اختبارات تجريبية — قدرات وتحصيلي</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="gate.js"></script>
<style>
  :root{
    --accent:#0d9488; --soft:#5eead4; --deep:#0f766e;
    --bg:#f6f8fa; --card:#fff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1216;--card:#121e25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c50;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .tabs{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:110px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--good-bg);border:1px solid var(--good);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:6px 0 10px;font-size:1.05rem}
  .stem.ltr{direction:ltr;text-align:left}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.02rem;cursor:pointer;font-family:inherit;text-align:right}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);display:none}
  .explain.show{display:block}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .timer{position:sticky;top:8px;z-index:5;background:var(--accent);color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;text-align:center;box-shadow:var(--shadow);margin-bottom:12px;font-variant-numeric:tabular-nums}
  .timer.low{background:var(--bad)}
  .timer.done{background:var(--muted)}
  .reset{margin-top:12px;width:100%;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>

<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"hasan").toLowerCase();
var NAMES = {hasan:"حسن",rafeef:"رفيف",osama:"أسامة",saud:"سعود"};
var GRADES = {hasan:"ثالث متوسط",rafeef:"ثاني متوسط",osama:"خامس ابتدائي",saud:"رابع ابتدائي"};
var name = NAMES[who] || "الطالب";
var YOUNG = (who==="saud" || who==="osama"); // الصغار: لفظي + STEP فقط (بدون كمي/تحصيلي)

// حفظ نتيجة الاختبار التجريبي لتظهر في لوحة ولي الأمر
var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total, wrongs){
  try{
    fetch(SUPA_URL+"/rest/v1/attempts", {
      method:"POST",
      headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
      body: JSON.stringify({ student:name, grade:GRADES[who]||"", en_correct:0, en_total:0, ma_correct:0, ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total, wrong:(wrongs||[]) } })
    });
  }catch(e){}
}

// ===== مولّدات كمي (أرقام جديدة كل مرة) =====
function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function opt3(correct, ds){
  var o=[correct];
  (ds||[]).forEach(function(d){ if(o.indexOf(d)<0 && o.length<3) o.push(d); });
  var p=1; while(o.length<3){ var c=(typeof correct==="number")?correct+p:String(correct)+"×"; if(o.indexOf(c)<0)o.push(c); p++; if(p>40)break; }
  for(var i=o.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=o[i]; o[i]=o[j]; o[j]=t; }
  return [o.map(function(v){return String(v).replace(/-/g,"−");}), o.indexOf(correct)];
}
var QUANT = [
  function(){var cf=gp([[10,10],[15,20],[20,5],[25,4],[40,5],[50,2]]),p=cf[0],N=cf[1]*ri(3,20),v=N*p/100,o=opt3(v,[v+5,v-5,v*2]);return ["كم يساوي "+p+"% من "+N+"؟",o[0],o[1],"("+p+"÷100)×"+N+" = "+v+"."];},
  function(){var a=ri(2,9),b=ri(2,9),x=ri(2,12),c=a*x+b,o=opt3(x,[x+1,x-1,x+2]);return ["إذا كان "+a+"س + "+b+" = "+c+"، فما قيمة س؟",o[0],o[1],a+"س = "+(c-b)+" → س = "+x+"."];},
  function(){var r1=ri(2,6),r2=ri(2,6),k=ri(2,8),o=opt3(r2*k,[r1*k,(r1+r2)*k,r2*k+1]);return ["إذا كانت النسبة "+r1+":"+r2+" وكان الأول "+(r1*k)+"، فما الثاني؟",o[0],o[1],"معامل التناسب "+k+" → الثاني = "+(r2*k)+"."];},
  function(){var n=gp([3,4,5]),m=ri(6,20),arr=[];for(var i=0;i<n;i++)arr.push(m+(i-Math.floor(n/2))*2);var s=arr.reduce(function(a,b){return a+b;},0),av=s/n,o=opt3(av,[av+2,av-2,s]);return ["ما متوسط الأعداد: "+arr.join("، ")+"؟",o[0],o[1],"المجموع "+s+" ÷ "+n+" = "+av+"."];},
  function(){var L=ri(5,15),W=ri(3,L-1),o=opt3(L*W,[2*(L+W),L*W+L,L*W-W]);return ["مستطيل طوله "+L+" وعرضه "+W+"، ما مساحته؟",o[0],o[1],L+"×"+W+" = "+(L*W)+"."];},
  function(){var L=ri(5,15),W=ri(3,L-1),o=opt3(2*(L+W),[L*W,L+W,2*L+W]);return ["مستطيل طوله "+L+" وعرضه "+W+"، ما محيطه؟",o[0],o[1],"(الطول+العرض)×2 = "+(2*(L+W))+"."];},
  function(){var t=gp([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]),o=opt3(t[2],[t[2]+1,t[0]+t[1],t[2]-2]);return ["مثلث قائم ضلعاه "+t[0]+" و "+t[1]+"، فما طول الوتر؟",o[0],o[1],"√("+t[0]+"²+"+t[1]+"²) = "+t[2]+"."];},
  function(){var a=ri(2,9),step=gp([2,3,5]),start=ri(1,5),seq=[start,start+step,start+2*step,start+3*step],nx=start+4*step,o=opt3(nx,[nx+step,nx-1,nx+1]);return ["أكمل النمط: "+seq.join("، ")+"، ...؟",o[0],o[1],"نزيد "+step+" كل مرة → "+nx+"."];},
  function(){var base=ri(20,60),inc=gp([10,20,25,50]),nv=base+base*inc/100,o=opt3(nv,[base+inc,nv+5,base]);return ["زاد سعر من "+base+" بنسبة "+inc+"%، فما السعر الجديد؟",o[0],o[1],base+" + "+inc+"% = "+nv+"."];},
  function(){var w=ri(2,9),d=ri(2,9),o=opt3(w*d,[w+d,w*d+w,w*d-d]);return ["عامل ينجز "+w+" قطع في الساعة، كم ينجز في "+d+" ساعات؟",o[0],o[1],w+"×"+d+" = "+(w*d)+" قطعة."];},
  function(){var v=ri(3,20),t=ri(2,9),d=v*t,o=opt3(v,[v+2,v-1,d]);return ["قطع متسابق "+d+" كم في "+t+" ساعات، فما سرعته (كم/ساعة)؟",o[0],o[1],d+" ÷ "+t+" = "+v+" كم/س."];},
  function(){var son=ri(6,16),diff=ri(18,32),f=son+diff,o=opt3(son,[son+2,diff,f]);return ["الأب أكبر من ابنه بـ "+diff+" سنة، وعمر الأب "+f+"، فكم عمر الابن؟",o[0],o[1],f+" − "+diff+" = "+son+"."];},
  function(){var r=ri(1,5),b=ri(1,5),tot=r+b,o=opt3(r+"/"+tot,[b+"/"+tot,r+"/"+b,tot+"/"+r]);return ["كيس فيه "+r+" كرات حمراء و "+b+" زرقاء، ما احتمال سحب حمراء؟",o[0],o[1],"عدد الحمراء ÷ الكل = "+r+"/"+tot+"."];},
  function(){var a=ri(30,150),o=opt3(180-a,[a,180+a,90]);return ["زاويتان متكاملتان (مجموعهما 180°)، إحداهما "+a+"°، فما الأخرى؟",o[0],o[1],"180 − "+a+" = "+(180-a)+"°."];},
  function(){var a=ri(10,80),o=opt3(90-a,[a,90+a,180-a]);return ["زاويتان متتامتان (مجموعهما 90°)، إحداهما "+a+"°، فما الأخرى؟",o[0],o[1],"90 − "+a+" = "+(90-a)+"°."];},
  function(){var r=gp([7,14,21]),area=22*r*r/7,o=opt3(area,[2*22*r/7,area+r,r*r]);return ["مساحة دائرة نصف قطرها "+r+" (π≈22/7)؟",o[0],o[1],"22/7 × "+r+"² = "+area+"."];},
  function(){var arr=[ri(2,9),ri(11,19),ri(21,29)];shuffle(arr);var sorted=arr.slice().sort(function(x,y){return x-y;});var med=sorted[1],o=opt3(med,[sorted[0],sorted[2],sorted[0]+sorted[2]]);return ["ما الوسيط (القيمة الوسطى) للأعداد: "+arr.join("، ")+"؟",o[0],o[1],"بعد الترتيب الوسيط = "+med+"."];},
  function(){var st=ri(3,15),sum=st+(st+1)+(st+2),o=opt3(sum,[sum+3,sum-3,st*3]);return ["مجموع ثلاثة أعداد متتالية أولها "+st+"؟",o[0],o[1],st+"+"+(st+1)+"+"+(st+2)+" = "+sum+"."];},
  function(){var base=ri(40,90),dec=gp([10,20,25,50]),nv=base-base*dec/100,o=opt3(nv,[base-dec,nv+5,base]);return ["نقص سعر من "+base+" بنسبة "+dec+"%، فما السعر الجديد؟",o[0],o[1],base+" − "+dec+"% = "+nv+"."];},
  function(){var den=gp([3,4,5,6]),mult=ri(2,9),N=den*mult,num=ri(1,den-1),v=N*num/den,o=opt3(v,[N-v,v+num,v+2]);return ["كم يساوي "+num+"/"+den+" من "+N+"؟",o[0],o[1],"("+N+"÷"+den+")×"+num+" = "+v+"."];},
  function(){var a=ri(1,4),b=ri(1,4),k=ri(2,9),N=(a+b)*k,first=a*k,o=opt3(first,[b*k,N-first+1,N]);return ["قُسِّم مبلغ "+N+" ريال بين شخصين بنسبة "+a+":"+b+"، فما نصيب الأول؟",o[0],o[1],"الوحدة = "+N+"÷"+(a+b)+" = "+k+" → "+a+"×"+k+" = "+first+"."];},
  function(){var cost=ri(20,80),profit=ri(5,40),sell=cost+profit,o=opt3(profit,[sell,cost,profit+5]);return ["اشترى تاجر سلعة بـ "+cost+" وباعها بـ "+sell+"، فما الربح؟",o[0],o[1],sell+" − "+cost+" = "+profit+" ريال."];},
  function(){var cf=gp([[10,10],[20,5],[25,4],[50,2]]),p=cf[0],price=cf[1]*ri(4,18),disc=price*p/100,fin=price-disc,o=opt3(fin,[disc,price,fin+5]);return ["خصم "+p+"% على سعر "+price+" ريال، فكم السعر بعد الخصم؟",o[0],o[1],"الخصم "+disc+" → "+price+"−"+disc+" = "+fin+"."];},
  function(){var m=ri(2,9),o=opt3(m*100,[m*10,m*1000,m*60]);return ["كم سنتيمترًا في "+m+" أمتار؟ (المتر = 100 سم)",o[0],o[1],m+"×100 = "+(m*100)+" سم."];},
  function(){var pr=gp([[2,3,6],[3,4,12],[4,6,12],[2,5,10],[6,8,24],[3,5,15]]),o=opt3(pr[2],[pr[0]*pr[1],pr[0]+pr[1],pr[2]+2]);return ["ما أصغر مضاعف مشترك للعددين "+pr[0]+" و "+pr[1]+"؟",o[0],o[1],"أصغر عدد يقبل القسمة على "+pr[0]+" و "+pr[1]+" هو "+pr[2]+"."];},
  function(){var b=ri(2,9),n=ri(2,9),tot=b*n,o=opt3(n,[n+1,n-1,tot]);return ["وُزّع "+tot+" قلمًا بالتساوي على "+b+" طلاب، فكم نصيب كلٍّ؟",o[0],o[1],tot+" ÷ "+b+" = "+n+"."];},
  function(){var s=ri(3,15),o=opt3(4*s,[s*s,2*s,4*s+1]);return ["مربّع طول ضلعه "+s+"، ما محيطه؟",o[0],o[1],"4×"+s+" = "+(4*s)+"."];},
  function(){var s=ri(3,12),o=opt3(s*s,[4*s,2*s,s*s+s]);return ["مربّع طول ضلعه "+s+"، ما مساحته؟",o[0],o[1],s+"×"+s+" = "+(s*s)+"."];},
  function(){var b=gp([4,6,8,10]),h=ri(3,10),area=b*h/2,o=opt3(area,[b*h,b+h,area+b]);return ["مثلث قاعدته "+b+" وارتفاعه "+h+"، ما مساحته؟",o[0],o[1],"(القاعدة×الارتفاع)÷2 = "+area+"."];},
  function(){var l=ri(2,6),w=ri(2,6),h=ri(2,6),o=opt3(l*w*h,[l+w+h,2*(l+w+h),l*w]);return ["صندوق أبعاده "+l+"×"+w+"×"+h+"، ما حجمه؟",o[0],o[1],l+"×"+w+"×"+h+" = "+(l*w*h)+"."];},
  function(){var h=ri(2,9),o=opt3(h*60,[h*100,h*24,h*30]);return ["كم دقيقة في "+h+" ساعات؟ (الساعة = 60 دقيقة)",o[0],o[1],h+"×60 = "+(h*60)+" دقيقة."];},
  function(){var kg=ri(2,9),o=opt3(kg*1000,[kg*100,kg*10,kg*500]);return ["كم غرامًا في "+kg+" كيلوغرامات؟ (الكيلو = 1000غ)",o[0],o[1],kg+"×1000 = "+(kg*1000)+" غ."];},
  function(){var pr=gp([[4,6,2],[6,9,3],[8,12,4],[10,15,5],[9,12,3]]),o=opt3(pr[2],[pr[0]*pr[1],pr[0]+pr[1],pr[2]+1]);return ["ما أكبر قاسم مشترك للعددين "+pr[0]+" و "+pr[1]+"؟",o[0],o[1],"أكبر عدد يقسم "+pr[0]+" و "+pr[1]+" هو "+pr[2]+"."];},
  function(){var d=gp([4,5,8,10]),a=ri(1,d-2),b=ri(1,d-a-1),o=opt3((a+b)+"/"+d,[a+"/"+d,(a+b)+"/"+(2*d),(a*b)+"/"+d]);return ["احسب: "+a+"/"+d+" + "+b+"/"+d+" =؟",o[0],o[1],"نجمع البسط: ("+a+"+"+b+")/"+d+" = "+(a+b)+"/"+d+"."];},
  function(){var st=gp([2,4,6,8]),seq=[st,st+2,st+4,st+6],nx=st+8,o=opt3(nx,[nx+2,nx-2,nx+1]);return ["أكمل نمط الأعداد الزوجية: "+seq.join("، ")+"، ...؟",o[0],o[1],"نزيد 2 → "+nx+"."];},
  function(){var n=gp([12,16,20,24,30,40]),o=opt3(n/2,[n/4,n*2,n-2]);return ["نصف العدد "+n+" يساوي؟",o[0],o[1],n+" ÷ 2 = "+(n/2)+"."];}
];
function genQuant(n){ var out=[],seen={},t=0; while(out.length<n && t<n*10){ var q=gp(QUANT)(); t++; if(seen[q[0]])continue; seen[q[0]]=1; out.push(q); } return out; }

// ===== لفظي (قدرات) — تدريبي =====
var VERBAL = [
  ["<b>تناظر لفظي:</b> طبيب : مستشفى ، معلم : ؟",["مدرسة","مريض","دواء"],0,"العلاقة: مكان العمل."],
  ["<b>تناظر لفظي:</b> قلم : كتابة ، سكين : ؟",["قطع","طبخ","أكل"],0,"الأداة ووظيفتها."],
  ["<b>تناظر لفظي:</b> ماء : عطش ، طعام : ؟",["جوع","شبع","طبخ"],0,"الشيء وما يزيله."],
  ["<b>تناظر لفظي:</b> جندي : جيش ، لاعب : ؟",["فريق","ملعب","كرة"],0,"الفرد والمجموعة."],
  ["<b>إكمال جمل:</b> لم يكن الطالب ______ في دراسته، لذلك رسب.",["مجتهدًا","كسولًا","نائمًا"],0,"السياق يدل على نفي الاجتهاد."],
  ["<b>إكمال جمل:</b> رغم ______ الطريق، وصلنا في الوقت المحدد.",["صعوبة","سهولة","قصر"],0,"«رغم» تدل على تضاد مع الوصول."],
  ["<b>الخطأ السياقي:</b> استيقظ مبكرًا، وتناول فطوره، ثم ______ إلى المدرسة.",["ذهب","نام","جلس"],0,"الكلمة المناسبة للسياق: ذهب."],
  ["<b>معنى كلمة:</b> ما معنى «يافع»؟",["شاب","عجوز","طفل رضيع"],0,"اليافع: الشاب المراهق."],
  ["<b>مرادف:</b> مرادف كلمة «مسرور»:",["سعيد","حزين","غاضب"],0,"مسرور = سعيد."],
  ["<b>ضد:</b> ضد كلمة «كريم»:",["بخيل","شجاع","ذكي"],0,"ضد الكريم: البخيل."],
  ["<b>استيعاب مقروء:</b> «الماء أساس الحياة، ويجب ترشيد استهلاكه.» ما فكرة النص؟",["أهمية الماء وترشيده","أنواع المياه","تلوث الهواء"],0,"الفكرة العامة عن أهمية الماء."],
  ["<b>تناظر لفظي:</b> نجاح : اجتهاد ، فشل : ؟",["كسل","تعب","نوم"],0,"السبب المؤدي للنتيجة."],
  ["<b>تناظر لفظي:</b> صوف : خروف ، ريش : ؟",["طائر","سمكة","شجرة"],0,"الغطاء الخارجي للكائن."],

function shuffleQ(q){
  var pairs = q[1].map(function(o,i){ return [o,i]; });
  for(var i=pairs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=pairs[i]; pairs[i]=pairs[j]; pairs[j]=t; }
  var idx=0, newOpts=pairs.map(function(p,ni){ if(p[1]===q[2]) idx=ni; return p[0]; });
  return [q[0], newOpts, idx, q[3]];
}
var SECS = { v:780, q:720, t:900, s:720 }; // ثواني كل قسم (مثل الاختبار الحقيقي)

function fmt(s){ if(s<0)s=0; var m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function renderSet(id, items, intro, regen, label){
  var sec = document.getElementById(id);
  items = items.map(shuffleQ);
  var secsAll = TIMED ? (SECS[id] || 0) : 0;
  var html = '<div class="intro">'+intro+'</div>';
  if(secsAll) html += '<div class="timer" data-timer>⏱️ الوقت المتبقّي: '+fmt(secsAll)+'</div>';
  items.forEach(function(q,i){
    html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div>'+
      '<div class="stem">'+q[0]+'</div><div class="opts">';
    q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
    html += '</div><div class="explain">'+q[3]+'</div></div>';
  });
  html += '<div class="scorebar"><span data-score>0 / '+items.length+'</span></div>';
  if(regen) html += '<button class="reset">أسئلة جديدة 🔄</button>';
  sec.innerHTML = html;
  var answered = {}, correct = 0, total = items.length, wrongs = [];
  var scoreEl = sec.querySelector("[data-score]");
  sec.querySelectorAll(".q").forEach(function(qEl){
    var i = +qEl.dataset.i, ans = items[i][2];
    qEl.querySelectorAll(".opts button").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(answered[i]) return; answered[i]=1;
        qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
        if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
        else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); wrongs.push(items[i][0]); }
        qEl.querySelector(".explain").classList.add("show");
        scoreEl.textContent = correct+" / "+total;
        if(Object.keys(answered).length===total){ finish(false); }
      });
    });
  });

  // ===== المؤقّت =====
  var tb = sec.querySelector("[data-timer]");
  var remaining = secsAll, tId = null, started = false, ended = false;
  function finish(auto){
    if(ended) return; ended = true;
    if(tId){ clearInterval(tId); tId = null; }
    if(auto){
      sec.querySelectorAll(".q").forEach(function(qEl){
        var i = +qEl.dataset.i;
        if(!answered[i]){
          answered[i] = 1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled = true; });
          qEl.querySelectorAll(".opts button")[items[i][2]].classList.add("correct");
          qEl.querySelector(".explain").classList.add("show");
        }
      });
      scoreEl.textContent = correct+" / "+total;
    }
    if(tb){ tb.classList.remove("low"); tb.classList.add("done"); tb.textContent = auto ? "⏱️ انتهى الوقت — النتيجة "+correct+"/"+total : "✅ خلّصت — النتيجة "+correct+"/"+total; }
    if(label) saveScore(label, correct, total, wrongs);
  }
  // حفظ جزئي: لو بدّل القسم أو طلع قبل ما يكمّل، نحفظ اللي جاوبه (عشان لا يضيع تعبه)
  function savePartial(){
    if(ended) return;
    var n = Object.keys(answered).length;
    if(n<1 || !label) return;
    ended = true; if(tId){ clearInterval(tId); tId=null; }
    saveScore(label, correct, n, wrongs);
  }
  sec._leave = savePartial;
  sec._reopen = function(){ if(ended) renderSet(id, regen?regen():items, intro, regen, label); };
  sec._start = function(){
    if(started || !secsAll || ended) return; started = true;
    tId = setInterval(function(){
      remaining--;
      if(tb){ tb.textContent = "⏱️ الوقت المتبقّي: "+fmt(remaining); if(remaining<=60) tb.classList.add("low"); }
      if(remaining<=0){ finish(true); }
    }, 1000);
  };

  if(regen){ sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); renderSet(id, regen(), intro, regen, label); }); }
  if(sec.classList.contains("active")) sec._start();
}

// ===== قسم علاجي — يشرح نقاط ضعف القدرات الكمي والتحصيلي وSTEP + فيديو + تدريب =====
function pickBank(arr, rx){ var f = arr.filter(function(x){ return rx.test(x[0]+" "+(x[3]||"")); }); return (f.length?gp(f):gp(arr)).slice(); }

   lesson:"السرعة = المسافة ÷ الزمن. المعدل = المقدار ÷ الزمن. مسائل الأعمار: عبّر بالعلاقة بينهم ثم كوّن معادلة.",

   lesson:"الخلية وحدة بناء الكائن الحي. البناء الضوئي هو صنع الغذاء في النبات. الحمض النووي DNA يحمل الصفات الوراثية.",

   lesson:"راجع الأزمنة: المضارع/الماضي/التام. «since» مع نقطة زمنية و«for» مع مدة. الماضي التام had + p.p. المبني للمجهول be + p.p.",

   lesson:"في الاستيعاب: اقرأ السؤال أولًا ثم ابحث عن الفكرة الرئيسة. في الخطأ النحوي: تأكّد من تطابق الفعل مع الفاعل والزمن.",

function skillItems(s, n){ var out=[], seen={}, t=0; n=n||3; while(out.length<n && t<40){ var q; try{ q=s.gen(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; out.push(q); } return out; }
function renderMini(box, items){
  items = items.map(shuffleQ);
  var h="";
  items.forEach(function(q,i){ h+='<div class="q" data-i="'+i+'"><div class="stem">'+q[0]+'</div><div class="opts">'; q[1].forEach(function(o,j){ h+='<button data-j="'+j+'">'+o+'</button>'; }); h+='</div><div class="explain">'+q[3]+'</div></div>'; });
  box.innerHTML=h;
  box.querySelectorAll(".q").forEach(function(qEl){ var i=+qEl.dataset.i, ans=items[i][2];
    qEl.querySelectorAll(".opts button").forEach(function(btn){ btn.addEventListener("click",function(){
      if(qEl.dataset.done) return; qEl.dataset.done=1;
      qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
      if(+btn.dataset.j===ans){ btn.classList.add("correct"); } else { btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
      qEl.querySelector(".explain").classList.add("show");
    }); });
  });
}
function lessonCard(s, count, open){
  var idx = SKILLS.indexOf(s);
  var badge = count>0 ? ' <span style="color:#dc2626;font-weight:800">(ضعف: '+count+')</span>' : '';
  var yt = 'https://www.youtube.com/results?search_query='+encodeURIComponent(s.yt);
  return '<details '+(open?'open':'')+' style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:10px;box-shadow:var(--shadow)">'+
    '<summary style="font-weight:800;cursor:pointer;padding:8px 0">🎬 '+s.name+badge+'</summary>'+
    '<div style="padding:4px 0 12px">'+
      '<div style="background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.9">'+s.lesson+'</div>'+
      '<div style="margin-top:10px"><a href="'+yt+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 15px;border-radius:11px;font-weight:800">🎬 شاهد فيديو شرح على يوتيوب</a></div>'+
      '<button data-practice="'+idx+'" style="margin-top:10px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:9px 15px;border-radius:11px;font-weight:800;cursor:pointer;font-family:inherit">✏️ تدرّب (3 أسئلة)</button>'+
      '<div data-mini style="margin-top:8px"></div>'+
    '</div></details>';
}
async function renderRemedial(){
  var sec = document.getElementById("rem");
  sec.innerHTML = '<div class="intro">⏳ نحلّل نتائجك من آخر اختبارات القدرات والتحصيلي وSTEP...</div>';
  var rows=[];
  try{
    var r = await fetch(SUPA_URL+"/rest/v1/attempts?select=meta,created_at&student=eq."+encodeURIComponent(name)+"&order=created_at.desc&limit=40",
      {headers:{apikey:SUPA_KEY, Authorization:"Bearer "+SUPA_KEY}});
    rows = await r.json(); if(!Array.isArray(rows)) rows=[];
  }catch(e){}
  // نأخذ آخر محاولتين فقط لكل اختبار (كمي/تحصيلي/STEP) — فالمهارة اللي يجاوبها صح لاحقًا تختفي تلقائيًا
  var practice = rows.filter(function(x){ return x.meta && x.meta.kind==="practice" && Array.isArray(x.meta.wrong); });
  var byTest={}, wrongs=[];
  practice.forEach(function(x){ var t=x.meta.test||"?"; if(!byTest[t]) byTest[t]=0; if(byTest[t]<2){ byTest[t]++; (x.meta.wrong||[]).forEach(function(w){ wrongs.push(w); }); } });
  var counts={};
  wrongs.forEach(function(w){ for(var i=0;i<SKILLS.length;i++){ if(SKILLS[i].rx.test(w)){ counts[SKILLS[i].name]=(counts[SKILLS[i].name]||0)+1; break; } } });
  var weak = SKILLS.filter(function(s){ return counts[s.name]; }).sort(function(a,b){ return counts[b.name]-counts[a.name]; });

  var html='';
  if(weak.length){
    html += '<div class="intro">🎯 <b>نقاط ضعفك الحالية فقط</b> (من آخر اختباراتك). <b>لما تجاوب المهارة صح في اختباراتك الجاية تختفي من هنا تلقائيًا ✅</b></div>';
    weak.forEach(function(s){ html += lessonCard(s, counts[s.name], true); });
  } else if(practice.length){
    html += '<div class="intro">🎉 ما شاء الله! ما عندك ضعف حاليًا في القدرات/التحصيلي/STEP — جاوبت آخر اختباراتك صح. استمر 💪 (لو غلطت بأي مهارة لاحقًا تظهر لك هنا تلقائيًا مع الشرح والفيديو).</div>';
  } else {
    html += '<div class="intro">لسّا ما اختبرت في «كمي / تحصيلي / STEP». اختبر فيها، ويرجع هنا يعرض لك <b>نقاط ضعفك فقط</b> مع الشرح والفيديو والتمارين.</div>';
  }
  // مكتبة كل الدروس — مطويّة، لا تظهر تلقائيًا (اختيارية للمراجعة)
  var lib='';
  var groups = YOUNG ? [["STEP","🌍 STEP إنجليزي"]] : [["كمي","🔢 القدرات الكمي"],["تحصيلي","🧪 التحصيلي"],["STEP","🌍 STEP إنجليزي"]];
  groups.forEach(function(g){
    lib += '<div style="font-weight:800;margin:12px 2px 6px">'+g[1]+'</div>';
    SKILLS.filter(function(s){ return s.group===g[0]; }).forEach(function(s){ lib += lessonCard(s, 0, false); });
  });
  html += '<details style="margin-top:18px"><summary style="cursor:pointer;font-weight:800;color:var(--accent);padding:8px 0">📚 تصفّح كل الدروس (اختياري — للمراجعة العامة)</summary><div style="margin-top:8px">'+lib+'</div></details>';
  sec.innerHTML = html;
  sec.querySelectorAll("[data-practice]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var box = btn.parentNode.querySelector("[data-mini]");
      renderMini(box, skillItems(SKILLS[+btn.dataset.practice], 3));
      btn.textContent = "أسئلة أخرى 🔄";
    });
  });
}

document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    var cur = document.querySelector(".panel.active");
    if(cur && typeof cur._leave === "function") cur._leave(); // احفظ الجزئي للقسم اللي نطلع منه
    document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
    b.setAttribute("aria-selected","true");
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = document.getElementById(b.dataset.tab);
    pan.classList.add("active");
    if(typeof pan._reopen === "function") pan._reopen(); // لو كان محفوظ جزئيًا، ابدأه من جديد
    if(b.dataset.tab==="rem"){ renderRemedial(); }
    if(typeof pan._start === "function") pan._start(); // يبدأ المؤقّت عند فتح القسم
  });
});
// لو طلع من الصفحة (أو صغّر التطبيق) وهو في نص قسم، نحفظ اللي جاوبه
document.addEventListener("visibilitychange", function(){ if(document.hidden){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); } });
