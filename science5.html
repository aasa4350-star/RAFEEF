<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>العلوم — الصف الخامس</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#4d7c0f; --accent-deep:#3f6212;
    --bg:#f7faf3; --card:#ffffff; --ink:#18220f; --muted:#5f6b52;
    --line:#e6ece0; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(24,34,15,.05),0 8px 24px rgba(24,34,15,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0d1208;--card:#161d10;--ink:#eaf2e0;--muted:#a3b094;--line:#2a341f60;
      --accent:#a3e635;--accent-deep:#84cc16;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.9}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .chapsel{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
  .chapsel button{flex:1;min-width:88px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 6px;border-radius:13px;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:112px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.08rem}
  .sh{color:var(--accent-deep);font-weight:800}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.06rem;cursor:pointer;font-family:inherit;text-align:right}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.93rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:380px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"osama").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = APP_CONFIG.supaUrl;
var SUPA_KEY = APP_CONFIG.supaKey;
/* معرّف المحاولة — الحفظ الجزئيّ لا يُقفل الجلسة بعده (انظر math8.html) */
var __PIDN = 0;
function newPid(){ return Date.now().toString(36) + "_" + (++__PIDN) + Math.random().toString(36).slice(2,7); }
/* طلبُ الأب (٢٥ سبتمبر ٢٠٢٦): «سوّ تفصيل المهارات لصفحات المنهج».
   كانت هذه الصفحةُ تحفظ الدرجةَ وحدَها، فيطبع التقريرُ «[بلا تفصيل
   مهارات]» ويعمى العلاجيُّ عن موضعِ الخلل. فصار extra يُدمَج في meta
   ليحمل skills وitems كما في math9.html. */
function saveScore(test, correct, total, pid, extra){
  try{
    var meta = { kind:"practice", test:test, correct:correct, total:total, pid:pid||null };
    if(extra) for(var __k in extra) meta[__k]=extra[__k];
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:meta };
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sh(s){ return '<span class="sh">'+s+'</span>'; }

/* ============================================================
   العلوم — الصف الخامس الابتدائي
   مبنيّةٌ على فهرس الكتاب الذي أرسله الأب (١٥ سبتمبر ٢٠٢٦):
     الوحدة الأولى: تنوّعُ الحياة
       الفصل ١ ممالك المخلوقات الحيّة (ص٢٢) — تصنيف المخلوقات · النباتات
       الفصل ٢ الآباء والأبناء (ص٥٤)      — التكاثر · دورات الحياة
     الوحدة الثانية: الأنظمة البيئيّة
       الفصل ٣ التفاعلات في الأنظمة البيئيّة (ص٨٢) — العلاقات · التكيّف والبقاء
       الفصل ٤ الدورات والتغيّرات (ص١١٢)  — الدورات · التغيّرات
     الوحدة الثالثة: الأرض ومواردها
       الفصل ٥ أرضنا المتغيّرة (ص١٤٢)     — معالم سطح الأرض · العمليات المؤثّرة فيه
       الفصل ٦ حماية موارد الأرض (ص١٧٢)   — مصادر الطاقة · الهواء والماء
   بنك أسئلة: [السؤال، [الصحيح، مشتت، مشتت]، الشرح]
   وكلّ بنكٍ عشرون سؤالًا ويُعرض منها عشرة.
   ============================================================ */

/* ══════════ ١-١ تصنيف المخلوقات الحيّة (ص٢٤) ══════════ */
var L11 = [

   "التصنيف ترتيبٌ للمخلوقات في مجموعاتٍ حسب صفاتها المشتركة، والترتيب يجعل الدراسة ممكنة."],
  ["ما أكبر مستوى في تصنيف المخلوقات الحيّة؟",["المملكة","النوع","الفصيلة"],

  ["ما أصغر مستوى في التصنيف وأدقّه؟",["النوع","المملكة","الشعبة"],

  ["ممَّ يتكوّن الاسم العلميّ للمخلوق الحيّ؟",["اسم الجنس واسم النوع","اسم المملكة واسم الشعبة","اسم المكتشِف وسنة الاكتشاف"],
   "مثل "+sh("Homo sapiens")+" للإنسان: Homo جنسٌ وsapiens نوع."],
  ["كم عدد الممالك في التصنيف الحديث؟",["ستّ ممالك","مملكتان","عشر ممالك"],

  ["ما دور الفطريّات في النظام البيئيّ؟",["تحليل بقايا المخلوقات الميّتة وإعادة موادّها إلى التربة","صنع الغذاء بالبناء الضوئيّ","افتراس الحيوانات الصغيرة"],
   "لولا المحلِّلات لتراكمت البقايا ولم تعُد عناصرها إلى التربة."],

   "مملكتا البكتيريا وحدهما بدائيّتا النواة."],
  ["ما الأشكال الرئيسة للبكتيريا؟",["كرويّة وعصويّة وحلزونيّة","مربّعة ومثلّثة","نجميّة فقط"],
   "ويُستدلّ بالشكل على نوع البكتيريا عند فحصها بالمجهر."],
  ["أيّ ممّا يلي مثالٌ على نفع البكتيريا؟",["تحويل الحليب إلى لبن وزبادي","إصابة الإنسان بالتهاب الحلق","تعفّن الطعام"],

/* ══════════ ١-٢ النباتات (ص٣٨) ══════════ */

/* ═══ وسمُ سؤالِ البنكِ الثابت ══════════════════════════════════════
   بنوكُ الدروسِ تُلفّ في دالّةٍ مجهولةِ الاسم، فكان f.name فراغًا وq.__g
   فراغًا، فلا يعرف التقريرُ عن الجلسةِ إلّا درجتَها — وهو ما طبعه تقريرُ
   حسنٍ «[بلا تفصيل مهارات]». فصار كلُّ سؤالٍ يحمل مفتاحَ بنكِه ورقمَه
   فيه («L2#17»)، فيُعرَف السؤالُ بعينِه لا درسُه فقط، ويُعرَف أيُّ خيارٍ
   اختاره. ووسمُ المهارةِ يُشتقّ من CFG نفسِه لا يُؤلَّف، فلا يتناقض مع
   اسمِ الدرسِ المعروضِ على الشاشة. */
function bankGen(bank, key){
  var f = function(){
    var i = Math.floor(Math.random()*bank.length), p = bank[i];
    var o=[p[1][0],p[1][1],p[1][2]]; shuffle(o);
    var r = [p[0], o, o.indexOf(p[1][0]), p[2]];
    r.__bk = (key||"")+"#"+i;
    return r;
  };
  f.__bank = key || "";
  return f;
}

  var curCh = "c1", curId = "l11";

  function panelOf(id){
    var pan = document.getElementById("p_"+id);
    if(!pan){ pan = document.createElement("section"); pan.className="panel"; pan.id="p_"+id; document.getElementById("panels").appendChild(pan); }
    return pan;
  }
  function leaveCur(){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); }

  function ytLinkHtml(id){
    var rt=null;
    for(var i=0;i<REMTOPICS.length;i++){ if(REMTOPICS[i].id===id){ rt=REMTOPICS[i]; break; } }
    if(!rt) return '';
    return '<div style="margin-top:10px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(rt.yt||rt.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800;font-size:.88rem">🎬 شاهد شرح الدرس</a></div>';
  }
  function render(id){
    var c = CFG[id], sec = panelOf(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+
      /* رقم الصفحة من فهرس الكتاب: الابن يفتح الدرس نفسه حين يخطئ فيه */
      (c.pg ? '<div style="margin-top:8px;font-size:.88rem;opacity:.82">📖 في كتاب العلوم: '+c.pg+'</div>' : '')+
      ytLinkHtml(id)+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score dir="ltr">0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false, savedN=0, pid=newPid();
    /* تفصيلُ المهارات: لكلِّ سؤالٍ وسمُه وأصاب أم أخطأ وكم مكث. والعتبةُ
       حدٌّ أدنى صريحٌ لا رقمٌ معاير — المعياريّةُ تُحسَب عند التحليلِ من
       تاريخِ الطفلِ نفسِه (كما شُرح في math9.html). */
    var RG_MS = 2000;
    var SKILLS={}, ITEMS=[], __t0=Date.now(), __lastTs=__t0, __fastN=0;
    function __meta(n){
      return { dur: Math.round((Date.now()-__t0)/1000), fast: __fastN,
               trusted: (__fastN < Math.ceil(n/2)),
               skills: SKILLS, items: ITEMS, rgMs: RG_MS };
    }
    /* وسمُ بنكِ الدرسِ يُشتقّ من CFG نفسِه لا يُؤلَّف، فلا يتناقض مع اسمِ
       الدرسِ المعروضِ على الشاشة. ويُقرأ عند الحاجةِ لا عند التحميلِ،
       فلا يتعلّق بترتيبِ التعريفات. */
    function __bankAr(key){
      try{
        if(typeof CFG==="undefined" || !CFG) return null;
        var ks=Object.keys(CFG);
        for(var i=0;i<ks.length;i++){
          if(/^all/.test(ks[i])) continue;          /* الشاملُ يخلط الدروس */
          var c=CFG[ks[i]];
          if(c && Array.isArray(c.gens) && c.gens.some(function(g){ return g && g.__bank===key; }))
            return c.label || c.tab || null;
        }
      }catch(e){}
      return null;
    }
    function __genLessonAr(gname){
      if(!gname) return null;
      try{
        if(typeof CFG==="undefined" || !CFG) return null;
        var ks=Object.keys(CFG);
        for(var i=0;i<ks.length;i++){
          if(/^all/.test(ks[i])) continue;
          var c=CFG[ks[i]];
          if(c && Array.isArray(c.gens) && c.gens.some(function(g){ return g && g.name===gname; }))
            return c.label || c.tab || null;
        }
      }catch(e){}
      return null;
    }
    function __tally(it, ok, j, ans){
      /* __bk أوّلًا: بنوكُ الدروسِ دوالُّ مجهولةُ الاسمِ فـ f.name لا يدلّ */
      var g = (it && (it.__bk || it.__sk || it.__g)) || "";
      var sk, __mb = /^([A-Za-z0-9_]+)#\d+$/.exec(g);
      if(__mb) sk = __bankAr(__mb[1]) || __mb[1];
      /* لا يُطبَع اسمُ دالّةٍ في تقريرٍ يقرأه الأبُ أبدًا — وهو عيبٌ وقع
         في math9.html فظهر «gConsecFamily» في تقريرِ حسن. فإن لم يكن
         للمولّدِ وسمٌ عربيٌّ في GEN_AR نزلنا إلى اسمِ درسِه من CFG،
         وهو أخشنُ من الوسمِ لكنّه صحيحٌ ومفهوم. */
      else sk = (typeof GEN_AR!=="undefined" && GEN_AR[g]) || __genLessonAr(g) || "غير محدّد";
      var now=Date.now(), ms=now-__lastTs; __lastTs=now;
      if(ms < RG_MS) __fastN++;
      var s = SKILLS[sk] || (SKILLS[sk]={c:0,t:0}); s.t++; if(ok) s.c++;
      ITEMS.push({ g:g, ok:(ok?1:0), ms:ms, j:j, a:ans });
    }
    var TALLY={};   /* نتيجةُ كلّ درسٍ داخل الاختبار الشامل */
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          var __ok = (+btn.dataset.j===ans);
          __tally(items[i], __ok, +btn.dataset.j, ans);
          if(/^all/.test(id)){ var __t=topicOfGen(items[i].__g, items[i].__gf); if(__t){ var __e=TALLY[__t]||(TALLY[__t]={c:0,t:0}); __e.t++; if(__ok) __e.c++; } }
          if(__ok){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && savedN<total){ savedN=total; saved=true; saveScore(c.label, correct, total, pid, __meta(total));
            if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/total*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
        });
      });
    });
    /* الحفظ الجزئيّ لا يُقفل الجلسة بعده — انظر شرحه في math8.html */
    function savePartial(){ var n=Object.keys(answered).length; if(n<3||n<=savedN) return; savedN=n; saved=true; saveScore(c.label, correct, n, pid, __meta(n)); if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/n*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

  var REM_PAGE="science5", REM_LABEL="العلوم";
  var REMTOPICS=[
    {id:"l11", name:"1-1 تصنيف المخلوقات الحيّة", tip:"نصنّف لتسهل الدراسة. والمستويات من الأكبر إلى الأصغر: المملكة ← الشعبة ← الطائفة ← الرتبة ← الفصيلة ← الجنس ← النوع. ولينيوس وضع التسمية الثنائيّة (اسم الجنس ثمّ النوع). والممالك ستّ: بكتيريا بدائيّة وبكتيريا حقيقيّة وطلائعيّات وفطريّات ونباتات وحيوانات. والفطر ليس نباتًا لأنّه لا كلوروفيل فيه فلا يصنع غذاءه، بل يُحلّل البقايا. والفيروس لا يُصنَّف لأنّه لا يتكاثر إلّا داخل خليّةٍ حيّة.", yt:"شرح تصنيف المخلوقات الحية والممالك الست علوم خامس ابتدائي"},
    {id:"l12", name:"1-2 النباتات", tip:"اللاوعائيّة (الحزازيّات) صغيرةٌ لأنّها بلا أوعية. والوعائيّة لابذريّة (السرخس يتكاثر بالأبواغ) أو بذريّة: معرّاة البذور (الصنوبر — بذوره في مخاريط) ومغطّاة البذور (الثمار). والخشب يصعد بالماء واللحاء ينزل بالغذاء. والبناء الضوئيّ: ماء + ثاني أكسيد الكربون + ضوء ⇐ غذاء + أكسجين، وموضعه البلاستيدات الخضراء بالكلوروفيل. والنتح خروج بخار الماء من الثغور. وفي الزهرة: السداة (متك تنتج حبوب اللقاح) والكربلة (ميسم وقلم ومبيض يصير ثمرة).", yt:"شرح تصنيف النباتات والبناء الضوئي علوم خامس ابتدائي"},
    {id:"l21", name:"2-1 التكاثر", tip:"اللاجنسيّ من أبٍ واحدٍ ونسلُه مطابقٌ له: الانشطار الثنائيّ (البكتيريا)، والتبرعم (الخميرة)، والتجدّد (نجم البحر)، والتكاثر الخضريّ (العُقل والدرنات). والجنسيّ من أبوين: الحيوان المنويّ + البويضة ⇐ اللاقحة، ونسلُه متنوّعٌ لأنّه يأخذ نصف صفاته من كلّ أب. والصفات الوراثيّة تُورَّث (لون العينين)، والمكتسبة تُتعلَّم (السباحة). والجينات على الكروموسومات داخل النواة.", yt:"شرح التكاثر الجنسي واللاجنسي علوم خامس ابتدائي"},
    {id:"l22", name:"2-2 دورات الحياة", tip:"دورة النبات الزهريّ: بذرة ← بادرة ← نبات ناضج ← زهرة ← ثمرة وبذور. والتلقيح نقل حبوب اللقاح من المتك إلى الميسم، ثمّ يأتي الإخصاب. والتحوّل الكامل أربع مراحل (بيضة ← يرقة ← عذراء ← حشرة كاملة) كالفراشة، والناقص ثلاث (بيضة ← حوريّة ← حشرة كاملة) كالجراد، والفارق هو مرحلة العذراء. ودورة الضفدع: بيضة ← شرغوف يتنفّس بالخياشيم ← ضفدع برئتين.", yt:"شرح دورات الحياة والتحول الكامل والناقص علوم خامس ابتدائي"},
    {id:"l31", name:"3-1 العلاقات في الأنظمة البيئيّة", tip:"النظام البيئيّ = مخلوقاتٌ حيّةٌ وغير حيّةٍ وعلاقاتها. الفرد ← الجماعة (أفراد نوعٍ واحد) ← المجتمع (جماعاتٌ مختلفة) ← النظام البيئيّ. والمنتِج يصنع غذاءه، والمستهلك يأكل غيره (عاشب/لاحم/قارت/كاسح)، والمحلِّل يُرجع العناصر إلى التربة. والسهم في السلسلة يشير إلى من يأخذ الطاقة. والعلاقات: تنافس، وافتراس، وتعايش ثلاثة أنواع — تبادل منفعة (ينتفع الاثنان)، وتقايض (ينتفع واحدٌ ولا يتضرّر الآخر)، وتطفّل (ينتفع واحدٌ ويتضرّر الآخر).", yt:"شرح العلاقات في الأنظمة البيئية والسلاسل الغذائية علوم خامس ابتدائي"},
    {id:"l32", name:"3-2 التكيّف والبقاء", tip:"التكيّف صفةٌ أو سلوكٌ يعين على البقاء: تركيبيّ في الجسم (سنام الجمل، فرو الدبّ) وسلوكيّ في التصرّف (الهجرة، البيات الشتويّ، الخمول الصيفيّ). والتمويه اندماجٌ بلون البيئة، والمحاكاة تشبّهٌ بمخلوقٍ ضارّ. والغريزة سلوكٌ يولد به الحيوان، والمكتسب يتعلّمه. والانقراض اختفاء النوع نهائيًّا، وأشجار القرم تتحمّل الملوحة وجذورها تبرز لتتنفّس.", yt:"شرح التكيف والبقاء عند الكائنات الحية علوم خامس ابتدائي"},
    {id:"l41", name:"4-1 الدورات في الأنظمة البيئيّة", tip:"دورة الماء: تبخّر (من البحر) ونتح (من النبات) ← تكاثف (سحب) ← هطول ← جريان سطحيّ وتسرّب (ماء جوفيّ). ودورة الكربون والأكسجين تقوم على عمليّتين متقابلتين: البناء الضوئيّ يأخذ ثاني أكسيد الكربون ويُخرج الأكسجين، والتنفّس يعكسها. ودورة النيتروجين: الهواء ٧٨٪ نيتروجين لكنّه خاملٌ لا يستعمله النبات إلّا بعد تثبيته ببكتيريا العقد الجذريّة أو البرق، وهو لازمٌ لبناء البروتين. والمادّة تدور وتعود، والطاقة تسري في اتّجاهٍ واحد.", yt:"شرح دورة الماء ودورة الكربون والنيتروجين علوم خامس ابتدائي"},
    {id:"l42", name:"4-2 التغيّرات في الأنظمة البيئيّة", tip:"التعاقب تغيّرٌ تدريجيٌّ في أنواع المخلوقات: أوّليّ يبدأ على صخرٍ عارٍ بلا تربة ورائدُه الأشنات، وثانويّ بعد حريقٍ أو فيضانٍ والتربة موجودةٌ فهو أسرع، وينتهي بمجتمعٍ ذروةٍ مستقرّ. والتغيّرات نوعان: طبيعيّة (بركان، جفاف، حريق، فيضان) وبفعل الإنسان (تلوّث، قطع غابات، توسّع عمرانيّ). والمهدّد بالانقراض لم يختفِ بعد — والمها العربيّ مثالٌ أُعيد توطينه في محميّات المملكة.", yt:"شرح التعاقب البيئي والتغيرات في الأنظمة البيئية علوم خامس ابتدائي"},
    {id:"l51", name:"5-1 معالم سطح الأرض", tip:"طبقات الأرض من الخارج: القشرة (أرقّها) ← الوشاح ← اللبّ الخارجيّ (منصهر) ← اللبّ الداخليّ (صلبٌ لشدّة الضغط). ومعالم اليابسة: جبل (قمّة ومنحدرات)، وهضبة (مرتفعٌ سطحه مستوٍ)، وسهل (منبسطٌ منخفض)، ووادٍ (منخفضٌ بين مرتفعين). ومعالم قاع المحيط: الجرف القاريّ ثمّ المنحدر ثمّ السهل العميق، والأخاديد أعمقها، وحيود وسط المحيط أطول سلسلة جبال. والخريطة الطبوغرافيّة تبيّن الارتفاعات بخطوط الكنتور: تقاربها انحدارٌ شديد. وفيجنر قال بزحزحة القارّات من بانجيا، ودليله تطابق السواحل وتشابه الأحافير.", yt:"شرح طبقات الأرض ومعالم سطح الأرض علوم خامس ابتدائي"},
    {id:"l52", name:"5-2 العمليّات المؤثّرة في سطح الأرض", tip:"ثلاث عمليّاتٍ مرتّبة: التجوية تكسر الصخر في مكانه — ميكانيكيّة (تجمّد الماء في الشقوق) أو كيميائيّة (تفاعلٌ يغيّر التركيب كذوبان الحجر الجيريّ فتتكوّن الكهوف). ثمّ التعرية تنقل الفتات، وعواملها الماء (أقواها) والرياح والجليد والجاذبيّة. ثمّ الترسيب يضع الفتات حين تضعف قوّة النقل: الدلتا عند مصبّ النهر، والكثبان بالرياح. والتغيّرات سريعة (زلزال، بركان، انهيار) أو بطيئة (تجوية، تكوّن تربة). وتُحمى التربة بالأشجار ومصدّات الرياح والمصاطب.", yt:"شرح التجوية والتعرية والترسيب علوم خامس ابتدائي"},
    {id:"l61", name:"6-1 مصادر الطاقة", tip:"المتجدّد لا ينفد أو يتجدّد سريعًا (شمس، رياح، ماء، حراريّة جوفيّة، كتلة حيويّة)، وغير المتجدّد ينفد (النفط والغاز والفحم — وهي الوقود الأحفوريّ المتكوّن من بقايا مخلوقاتٍ دُفنت ملايين السنين، والنوويّة أيضًا). وأصل معظم الطاقة على الأرض هو الشمس. وحرق الوقود الأحفوريّ يلوّث الهواء ويزيد الاحتباس الحراريّ. والترشيد استعمالٌ بقدر الحاجة. ومن مهن الوحدة: الجيولوجيّ يدرس الصخور وطبقات الأرض، وفنّيّ حفر الآبار يشغّل معدّات الحفر.", yt:"شرح مصادر الطاقة المتجددة وغير المتجددة علوم خامس ابتدائي"},
    {id:"l62", name:"6-2 الهواء والماء", tip:"الهواء ٧٨٪ نيتروجين و٢١٪ أكسجين. وطبقة الأوزون تمتصّ الأشعّة فوق البنفسجيّة. ومشكلات الهواء: الاحتباس الحراريّ (غازاتٌ تحبس الحرارة)، والمطر الحمضيّ (أكاسيد الكبريت والنيتروجين تذوب في بخار الماء)، والضباب الدخانيّ. والماء: ٩٧٪ مالحٌ و٣٪ عذب، ومعظم العذب متجمّدٌ في الجليد. والماء الجوفيّ مخزونٌ في مسامّ الصخور ويُستخرج بالآبار، والتحلية تُزيل الأملاح من ماء البحر. والقاعدة الثلاثيّة: قلّل ثمّ أعد الاستعمال ثمّ أعد التدوير.", yt:"شرح تلوث الهواء والماء وحماية الموارد علوم خامس ابتدائي"}
  ];

  var ALL_IDS = ["all1","all2","all3","all4","all5","all6"];

  /* ═══ الاختبار الشامل يُغذّي «علاجي» — راجع تعليل هذا النمط في
     math9.html: الشامل يُسجَّل مقسَّمًا على الدروس بوسم كلّ سؤالٍ
     باسم مولّده، فلا يبقى «علاجي» فارغًا لمن اختبر الشامل فقط، ولا
     يُطمَس تقييم درسٍ اختُبر وحده بتقديرٍ من الشامل. */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1 || id==="rem") return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      /* نتيجةُ درسٍ اختُبر وحده لا تُطمَس بتقديرٍ من الشامل */
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify(
        { pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=panelOf("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null, est:!!(s&&s.from==="all"), n:(s&&s.n)||null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الدروس من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل درس.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الدروس. جرّب دروس '+REM_LABEL+' ويرجع هنا يعرض أضعف درس مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+(x.est?' <span style="font-weight:400;font-size:.78rem;color:var(--muted)">تقديريّ من الشامل ('+(x.n===1?'سؤال واحد':x.n===2?'سؤالان':x.n+' أسئلة')+')</span>':'')+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel(curId);
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });
  window.addEventListener("pagehide", function(){ leaveCur(); });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;try{leaveCur();}catch(e){}var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
</script>
