<style>
  :root{
    --accent:#0891b2; --accent-deep:#0e7490;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:8px;margin:14px 0 8px}
  .chapsel button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:11px 8px;border-radius:13px;font-weight:800;font-size:.95rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:105px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit;text-align:right}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:280px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>

<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"hasan").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";
var SUPA_KEY = "sb_publishable_fVHi2d2S5yNdve8ErqDvVw_RvphbHH_";
function saveScore(test, correct, total){
  try{
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:{ kind:"practice", test:test, correct:correct, total:total } };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */

    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function en(s){ return '<span class="en">'+s+'</span>'; }

/* ============================================================
   العلوم — ثالث متوسط (حسن)
   مبنيّةٌ من كتاب حسن نفسه، فصلًا بعد فصل، فور اكتمال كلّ فصل من
   الصور المُرسَلة (لا اختلاق، ولا سؤال إلا وله أصلٌ في نصّ الكتاب).
   بنك أسئلة: [السؤال، [الصحيح، مشتت، مشتت]، الشرح]
   ============================================================ */

/* ============================================================
   الفصل الأول: طبيعة العلم (ص ١٨–٤٦)
     الدرس ١: أسلوب العلم (ص 20–25) · الدرس ٢: عمل العلم (ص 26–36)
     الدرس ٣: العلم والتقنية والمجتمع (ص 38–41)
   ============================================================ */

/* ===== الدرس ١: أسلوب العلم ===== */
var L1 = [
  ["ما <b>العلم</b>"+en(" (Science)")+" بمعناه الذي افتتح به الفصل؟",["طريقةٌ منظّمة أو عملية تُستخدم في استقصاء ما يجري حولك، وتُعينك على توفير إجابات لأسئلتك","مادّةٌ دراسية تُحفظ حقائقها فقط دون تطبيق","مجموعة قوانين ثابتة لا تتغيّر أبدًا مهما ظهرت أدلّة جديدة"],
    "العلم Science طريقة منظّمة أو عملية تُستخدم في استقصاء ما يجري حولك، ويُعينك على توفير إجابات لأسئلتك — فإنّك تستخدم التفكير العلمي كلّ يوم لاتّخاذ قرارات."],
  ["العلم ليس جديدًا؛ فقد اعتمد الناس عبر التاريخ في تفسير ما يحدث للأشياء حولهم على:",["ملاحظاتهم على الأشياء التي توصّلوا إليها عن طريق حواسّهم الخمس","الحاسوب والإنترنت فقط","التجارب المخبرية المعقّدة فقط"],
    "حاوَل الناس عبر التاريخ تفسير ما يحدث للأشياء حولهم، معتمدين على ملاحظاتهم التي توصّلوا إليها عن طريق حواسّهم الخمس (البصر واللمس والشمّ والتذوّق والسمع)."],
  ["إذا وصفت شيئًا بأنّه «بارد» أو «ساخن» بالاعتماد على حواسّك فقط، فإنّك:",["لم تُحدِّد درجة حرارته بدقّة، تمامًا كما لو وصفت شيئًا بأنّه ثقيل أو خفيف فأنت لم تُحدِّد مقدار كتلته","حصلت على قياسٍ دقيقٍ تمامًا","وصفتَ الشيء بطريقةٍ علميةٍ كاملة لا تحتاج أدوات"],
    "استخدام الحواسّ فقط يؤدّي إلى فهمٍ غير دقيق؛ فإن وصفت شيئًا بأنّه بارد أو ساخن فإنّك لم تُحدِّد درجة حرارته، وإن وصفته بأنّه ثقيل أو خفيف فأنت لم تُحدِّد مقدار كتلته، وإن وصفته بأنّه قريب أو بعيد فأنت لم تُحدِّد مقدار المسافة التي يبعدها."],
  ["لماذا تُستخدم الأرقام والأدوات (كمقياس الحرارة والمسطرة المترية) في وصف الملاحظات العلمية؟",["لإعطاء قيمٍ رقميةٍ دقيقة للوصف، بدلًا من الاعتماد على الحواسّ فقط","لأنّها أسهل من الحواسّ بلا أيّ سببٍ علميّ","لأنّ القانون يفرض استخدامها في كلّ تجربة"],
    "تُستخدَم الأرقام في وصف الملاحظات، وتُستخدَم أدواتٌ منها مقياس الحرارة والمساطر المترية لإعطاء قيمٍ رقميةٍ لهذا الوصف؛ حيث يُلاحِظ العلماء ويستقصون ويُجرِّبون؛ للتوصّل إلى إجابات."],
  ["في قصّة تتبُّع مصدر وباء الكوليرا (١٨٧١م) ومصدر بكتيريا القولون "+en("E.coli")+" (الآن)، أراد أحمد وبدر معرفة أوجه التشابه والاختلاف بين التقنيات المستخدمة في كلّ منهما، لذا استخدما مهارة:",["المقارنة","الحفظ","التخمين العشوائي"],
    "أراد أحمد وبدر أن يجدا أوجه التشابه والاختلاف بين التقنيات التي استُخدمت لتتبُّع المرض في أواخر عام ١٨٠٠م والمستخدَمة الآن، لذا فإنّهما يستخدمان مهارة المقارنة — فهي إيجاد أوجه التشابه وأوجه الاختلاف."],
  ["من مصادر الحصول على المعلومات الموثوقة (كما في الشكل ٢ من الكتاب):",["الصحف والمجلّات والكتب والإنترنت جميعها","الكتب فقط دون غيرها","الإنترنت فقط دون غيره"],
    "الصحف والمجلّات والكتب والإنترنت جميعها مصادر جيّدة للحصول على المعلومات، وقد استخدمها أحمد وبدر في مشروعهما عن مقارنة تتبُّع مصدر المرضين."],
  ["يستعين العلماء بالمعرفة السابقة (نتائج استقصاءاتٍ سابقة) من أجل:",["توقُّع نتائج استقصاءاتهم الجديدة","تجاهل أيّ معلومةٍ جديدة تخالفها","إثبات أنّ كلّ النظريات القديمة خاطئة دائمًا"],
    "يستعين العلماء بالمعارف السابقة ليتوقّعوا ما يحدث في أثناء الاستقصاءات، وبذلك يضعون النظريّات بعد اختبار التوقّعات جيّدًا."],
  ["ما الفرق بين <b>النظرية</b> و<b>القانون</b> العلميّ؟",["النظرية تفسيرٌ للأشياء مدعومٌ بالحقائق، أمّا القانون فيصف نمطًا ثابتًا في الطبيعة (كقوانين الجاذبية)","لا فرق بينهما إطلاقًا","القانون تخمينٌ والنظرية حقيقةٌ مؤكَّدة لا تتغيّر"],
    "يضع العلماء النظريّات بعد اختبار التوقُّعات جيّدًا، والنظرية تفسيرٌ للأشياء مدعومٌ بالحقائق. كما يضعون القوانين، وهي قواعد تصف نمطًا في الطبيعة، ومن أمثلة ذلك قوانين الجاذبية."],
  ["الحاسوب مثالٌ على استخدام العلم والتقنية معًا؛ إذ يستخدمه العلماء كأداةٍ من الأدوات التي يستخدمها العلماء في:",["البحث عن المعلومات، والحصول على البيانات، وتحليلها","التفكير بدلًا عن العالِم نفسه في كلّ خطوة","إجراء التجربة كاملةً دون أيّ تدخّلٍ بشريّ"],
    "الحاسوب أحد الأدوات التي يستخدمها العلماء كالأدوات التي يستخدمها العلماء من الأدوات؛ فالحاسوب يُستخدَم للبحث عن المعلومات، والحصول على البيانات، وتحليلها. والتقنية Technology هي تطبيق العلم لصناعة أدوات أو منتجات يمكن أن يستخدمها الناس."],
  ["ما المهارات الثلاث التي يستخدمها العلماء أكثر من غيرهم؟",["الملاحظة، والقياس، والمقارنة","الحفظ والتكرار والتخمين","الرسم والتلوين والتصنيف فقط"],
    "استُخدمت في التجربة الاستهلالية في بداية الفصل ثلاث مهارات، هي: الملاحظة، والقياس، والمقارنة، تمامًا كالعلماء الذين يستخدمون هذه المهارات أكثر من غيرهم."],
  ["لماذا لا تكفي <b>الملاحظة</b> وحدها أحيانًا لإعطاء صورةٍ كاملةٍ عمّا يحدث؟",["لأنّها قد لا توفّر معلوماتٍ كافيةٍ دقيقة، فيجب أخذ قياساتٍ صحيحةٍ أيضًا فضلًا عن جمع الملاحظات بعناية","لأنّ الملاحظة غير علميةٍ إطلاقًا","لأنّ القياس أسهل من الملاحظة دومًا فيُستغنى عنها"],
    "تستعلم أنّ الملاحظة وحدها غير كافيةٍ أحيانًا لإعطاء صورةٍ كاملةٍ عمّا يحدث. ولضمان أن تكون البيانات التي تحصل عليها مفيدةً يجب أخذ قياساتٍ صحيحة، فضلًا عن أنّه ينبغي جمع الملاحظات بعناية."],
  ["كيف يوثِّق العلماء عادةً نتائج التجارب والاستنتاجات لإيصالها إلى سائر العالم؟",["بتوثيقها ونشرها في المجلّات العلمية التي تُنشَر دوريًّا","بالاحتفاظ بها سرّيةً دائمًا","بإخبار عائلاتهم عنها فقط"],
    "لن يفعل العلماء بنتائج تجاربهم وملاحظاتهم واستقصاءاتهم شيئًا ما لم يُوصِلوها لسائر العالم، لذا يستخدم العلماء عدّة طرائق لإيصال ملاحظاتهم إلى الآخرين، وغالبًا ما تُوثَّق نتائج التجارب والاستنتاجات في المجلّات العلمية التي تُنشَر دوريًّا."],
  ["ما <b>دفتر العلوم</b>؟",["طريقةٌ أخرى للتواصل بالبيانات العلمية والنتائج، يمكن أن تُسجَّل فيه الملاحظات وخطط الاستقصاءات وخطواتها ونتائجها","كتابٌ مدرسيٌّ جاهزٌ لا يُكتَب فيه شيء","سجلّ درجات الطالب في الاختبارات فقط"],
    "يحتفظ العلماء بدفتر العلوم طريقةً أخرى للتواصل بالبيانات العلمية والنتائج؛ إذ يمكن أن تُسجَّل الملاحظات وخطط الاستقصاءات في أثناء تنفيذ الاستقصاء، بالإضافة إلى الخطوات المتّبعة، وتُلخَّص البيانات في صورة جداول أو رسومٍ بيانية أو فقرة."]
];

/* ===== الدرس ٢: عمل العلم ===== */
var L2 = [
  ["عندما يجيب أنجز أحمد وبدر بحثهما أجابا عن السؤال المطروح، إلّا أنّ هناك أكثر من طريقةٍ للإجابة عن السؤال، لذا فإنّ العلماء:",["يبذلون جهودًا لحلّ المشكلات العلمية، ويكرِّرون بعض الخطوات في الاستقصاءات جميعها رغم اختلافها","يتّبعون طريقةً واحدةً ثابتة لكلّ مشكلةٍ مهما اختلفت","يتجاهلون المشكلة إن تعدّدت طرق حلّها"],
    "بذل العلماء جهودًا لحلّ المشكلات العلمية، وكلّ مشكلةٍ علميةٍ تتطلّب استقصاءً بصورةٍ مختلفة، إلّا أنّهم يُكرِّرون بعض الخطوات في الاستقصاءات جميعها."],
  ["بعد الشعور بوجود مشكلة، ما أوّل ما يركِّز عليه العلماء؟",["فهم المشكلة بوضوحٍ أوّلًا قبل حلّها","جمع النتائج مباشرةً دون فهم المشكلة","نشر البحث في مجلّةٍ علميةٍ فورًا قبل أيّ خطوة"],
    "تحديد المشكلة: بعد الشعور بوجود مشكلة، يركِّز العلماء على فهمها بوضوحٍ أوّلًا قبل حلّها. وقد يجدون أحيانًا أنّه من السهل تحديد المشكلة، وقد يكون هذا بعض المشكلات يحتاج تحديدها إلى تحليلٍ أعمق."],
  ["تندرج طرائق حلّ المشكلات العلمية في قسمين أساسيّين هما:",["البحث الوصفي والبحث التجريبي","البحث السريع والبحث البطيء","البحث الفرديّ والبحث الجماعيّ فقط"],

  ["متى يُستخدَم <b>البحث الوصفي</b> عادةً؟",["في الاستقصاءات التي يصعب فيها إجراء التجارب، ويعتمد غالبًا على الملاحظة","فقط في التجارب المخبرية الدقيقة جدًّا","عندما تتوفّر عينةٌ ضابطةٌ صارمة"],

  ["تتبَّع الطبيب البريطاني <b>جون سنو</b> مصدر وباء الكوليرا عام ١٨٠٠م مستخدمًا:",["البحث الوصفي، بالاعتماد على الملاحظة (كخريطة أماكن سكن المرضى)","البحث التجريبي بتجربةٍ مخبريةٍ مضبوطة","الفرضية فقط دون أيّ ملاحظة"],

  ["ما أوّل خطوةٍ في تنفيذ <b>البحث الوصفي</b>؟",["تحديد هدف البحث؛ أي ما تريد أن تكتشفه أو السؤال الذي ترغب في الإجابة عنه","تحليل البيانات مباشرة","اختيار العينة الضابطة أوّلًا"],

  ["عندما يتوقّع العالِم نتيجةً معيّنةً قبل إجراء الاستقصاء، ويسمح لهذا التوقُّع بالتأثير في جمعه للبيانات، فإنّ هذا يُسمّى:",["التحيُّز، وهو ما يجب أن يتجنّبه الاستقصاء الجيّد","الموضوعية العلمية المطلوبة دائمًا","الفرضية الصحيحة الثابتة"],

  ["ما <b>النموذج</b>"+en(" (Model)")+" في العلم؟",["تمثيلٌ لشيءٍ يصعب ملاحظته مباشرةً؛ لأنّه كبيرٌ جدًّا أو صغيرٌ جدًّا أو يحدث بسرعةٍ شديدة","نسخةٌ طبق الأصل من الشيء الحقيقيّ دائمًا","أداة قياسٍ فيزيائيةٌ فقط لا علاقة لها بالتمثيل"],

  ["النظام العالميّ للوحدات الذي يستخدمه العلماء لجمع الملاحظات في جميع أنحاء العالم يُسمّى اختصارًا:",[en("SI")+" (النظام العالمي للوحدات)", en("GPS"), en("DNA")],

  ["بعد إكمال الاستقصاء وتحليل البيانات، لا يتوقّف العلماء عند هذا الحدّ، بل:",["يتواصلون مع علماء آخرين، وينقلون إليهم نتائجهم بكتابة التقارير وتقديم عروض", "يحتفظون بالنتائج لأنفسهم فقط دون أيّ تواصل", "يعيدون التجربة من الصفر دون داعٍ في كلّ مرّة"],

  ["في تجربةٍ اختُبر فيها أثر مضادَّين حيويَّين مختلفَين في قتل البكتيريا (الشكل ١٦)، ما <b>المتغيّر المستقل</b>؟",["نوع المضادّ الحيويّ المستخدَم","نوع البكتيريا نفسها في كلّ الأطباق","درجة حرارة المختبر"],

  ["<b>الثوابت</b>"+en(" (Constants)")+" في التجربة العلمية هي:",["المتغيّرات التي تبقى ثابتةً دون أن تتغيّر طوال التجربة، ليتأكّد العالِم أنّ التغيّر الوحيد جاء من المتغيّر المستقل","المتغيّر المستقل نفسه بالضبط","نتائج التجربة النهائية فقط"],

  ["لماذا يجب إجراء التجربة أكثر من مرّةٍ (عدد المحاولات)؟",["لأنّ نتائج التجارب التي تُجرى بالطريقة نفسها لن تكون متماثلةً دائمًا، فإعادة المحاولات تتأكّد من صحّة النتائج","لأنّ التجربة الأولى دائمًا خاطئة","لإضاعة الوقت فقط دون أيّ فائدةٍ علمية"],

  ["هل تقتصر ممارسة العلم على إتمام نشاطٍ علميّ، أو قراءة محتوًى علميّ، أو حفظ مفردات؟",["لا، بل تتعدّى ذلك إلى جوانب أخرى عديدةٍ ومهمّة في الحياة اليومية","نعم، تقتصر على ذلك فقط","تقتصر على الاختبارات المدرسية فقط"],

/* نَسِم كلّ سؤالٍ باسم مولّده (q.__g) لنعرف من أيّ درسٍ جاء.
   يحتاجه الاختبار الشامل ليُغذّي «علاجي» بنتيجة كلّ درسٍ على حدة. */
function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*30){ var f=gp(gens), q; try{ q=f(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; try{ q.__g=f.name||""; q.__gf=f; }catch(e){} out.push(q); } return out; }

  /* بلاغ الأب (٣١ أغسطس ٢٠٢٦): «الأولاد يبون رابط يوتيوب على كل درس»
     — لا رابط فيديوٍ محدَّد لكل درس (يحتاج تحقّقًا يدويًّا من مطابقته
     للكتاب لكلّ درسٍ في كلّ مادّة، وقد يُحذف الفيديو أو يُخفى لاحقًا
     فيموت الرابط بصمت)، بل رابط بحثٍ في يوتيوب بعبارةٍ مخصَّصةٍ لكلّ
     درس (نفس عبارة REMTOPICS.yt المستعملة أصلًا في «علاجي»)، يظهر
     من أوّل ما يفتح الطالب الدرس لا بعد اختباره وإخفاقه فيه فقط. */
  function ytLinkHtml(id){
    var rt=null;
    for(var i=0;i<REMTOPICS.length;i++){ if(REMTOPICS[i].id===id){ rt=REMTOPICS[i]; break; } }
    if(!rt) return '';
    return '<div style="margin-top:10px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(rt.yt||rt.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800;font-size:.88rem">🎬 شاهد شرح الدرس</a></div>';
  }
  function render(id){
    var c = CFG[id], sec = panelOf(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+ytLinkHtml(id)+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score dir="ltr">0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false;
    var TALLY={};   /* نتيجةُ كلّ درسٍ داخل الاختبار الشامل */
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          var __ok = (+btn.dataset.j===ans);
          if(/^all/.test(id)){ var __t=topicOfGen(items[i].__g, items[i].__gf); if(__t){ var __e=TALLY[__t]||(TALLY[__t]={c:0,t:0}); __e.t++; if(__ok) __e.c++; } }
          if(+btn.dataset.j===ans){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && !saved){ saved=true; saveScore(c.label, correct, total);
            if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/total*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
        });
      });
    });
    function savePartial(){ var n=Object.keys(answered).length; if(saved||n<3) return; saved=true; saveScore(c.label, correct, n); if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/n*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

  // ===== علاجي =====
  var REM_PAGE="science9", REM_LABEL="العلوم";
  var REMTOPICS=[
    {id:"l1", name:"1-1 أسلوب العلم", tip:"استخدم الأرقام والأدوات (كمقياس الحرارة والمسطرة) لا الحواسّ فقط، فهي أدقّ. النظرية تفسير مدعوم بالحقائق، والقانون يصف نمطًا ثابتًا في الطبيعة. والمهارات الثلاث الأهمّ: الملاحظة والقياس والمقارنة.", yt:"شرح أسلوب العلم ثالث متوسط علوم"},
    {id:"l2", name:"1-2 عمل العلم", tip:"البحث الوصفي يعتمد على الملاحظة (كجون سنو والكوليرا)، والتجريبي يختبر فرضية. المتغيّر المستقل هو ما تغيّره أنت، والتابع ما تقيسه، والثوابت ما يبقى كما هو. والعيّنة الضابطة لا تتعرّض للمتغيّر المستقل لتُقارَن بها النتائج.", yt:"شرح عمل العلم والمتغيرات ثالث متوسط علوم"},
    {id:"l3", name:"1-3 العلم والتقنية", tip:"الاكتشافات العلمية تراكمية: تُبنى على ما قبلها حتى يظهر ما يُثبت قصوره. لا تقتصر على جنس أو ثقافة أو زمن معيّن. وتحقّق من دقّة أيّ معلومة على الإنترنت قبل قبولها.", yt:"شرح العلم والتقنية والمجتمع ثالث متوسط علوم"},
    {id:"eq", name:"2-1 الزلازل", tip:"الصدع العادي (شدّ) تهبط فيه الصخور، والعكسي (ضغط) ترتفع، والجانبي (قصّ) تنزلق جانبيًّا. والبؤرة داخل الأرض، والمركز السطحي فوقها على السطح مباشرة. وموجات P طولية وأسرع، وS مستعرضة ولا تعبر السوائل، والسطحية أبطأ وأكثر دمارًا. ريختر يقيس قوّة الزلزال (الطاقة)، وميركالي يقيس شدّته (الدمار).", yt:"شرح الزلازل ثالث متوسط علوم"},
    {id:"volc", name:"2-2 البراكين", tip:"اللابة الغنية بالسيليكا لزجة فثورانها عنيف، والفقيرة بالسيليكا (غنية بالحديد والماغنسيوم) سيّالة فثورانها هادئ. الدرعية: لابة سيّالة، أكبر حجمًا وأقلّ انحدارًا (جبل مار). المخروطية: أصغر وحادّة الانحدار وثورانها قصير الأمد (حرّة البرك). المركّبة: طبقات متبادلة من اللابة والمقذوفات (جبل القدر).", yt:"شرح البراكين ثالث متوسط علوم"},
    {id:"plate", name:"2-3 الصفائح", tip:"الحدود المتباعدة تكوّن حفر انهدام وثوران شقوق. المتقاربة أشهر أماكن تكوّن البراكين (اندساس صفيحة تحت أخرى فتنصهر). الجانبية (التحويلية) تسبّب زلازل بلا براكين عادةً. البقع الساخنة (كهاواي) تتكوّن وسط الصفيحة لا عند حدودها. ويحرّك الصفائحَ تيّاراتُ الحمل الحراري في الستار. والنشاط الزلزالي بالمملكة على امتداد البحر الأحمر.", yt:"شرح الصفائح الأرضية وعلاقتها بالزلازل والبراكين ثالث متوسط"}
  ];
  var ALL_IDS = ["all1", "all2"];

  /* ═══ الاختبار الشامل يُغذّي «علاجي» — راجع تعليل هذا النمط في
     math9.html: الشامل يُسجَّل مقسَّمًا على الدروس بوسم كلّ سؤالٍ
     باسم مولّده، فلا يبقى «علاجي» فارغًا لمن اختبر الشامل فقط، ولا
     يُطمَس تقييم درسٍ اختُبر وحده بتقديرٍ من الشامل. */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1 || id==="rem") return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      /* نتيجةُ درسٍ اختُبر وحده لا تُطمَس بتقديرٍ من الشامل */
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify(
        { pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=panelOf("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null, est:!!(s&&s.from==="all"), n:(s&&s.n)||null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الدروس من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل درس.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الدروس. جرّب دروس '+REM_LABEL+' ويرجع هنا يعرض أضعف درس مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+(x.est?' <span style="font-weight:400;font-size:.78rem;color:var(--muted)">تقديريّ من الشامل ('+(x.n===1?'سؤال واحد':x.n===2?'سؤالان':x.n+' أسئلة')+')</span>':'')+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel(curId);   // يتبع curId لا اسمًا مكتوبًا
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
