<style>
  :root{
    --accent:#7c3aed; --accent-deep:#6d28d9;
    --bg:#f8f7fd; --card:#ffffff; --ink:#1b1630; --muted:#645c7a;
    --line:#e9e5f4; --good:#15803d; --good-bg:#e7f6ec; --warn:#b45309; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(27,22,48,.05),0 8px 24px rgba(27,22,48,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e0b18;--card:#181328;--ink:#ece8f8;--muted:#a79fbe;--line:#2c254560;
      --accent:#c4b5fd;--accent-deep:#a78bfa;
      --good:#4ade80;--good-bg:#12321f;--warn:#fbbf24;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.9}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .chapsel{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
  .chapsel button{flex:1;min-width:88px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 6px;border-radius:13px;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:112px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.08rem}
  .sh{color:var(--accent-deep);font-weight:800}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.06rem;cursor:pointer;font-family:inherit;text-align:right}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.93rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:420px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .say{border:1.5px solid var(--accent);background:var(--card);color:var(--accent);padding:10px 15px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem}
  .say.small{padding:8px 13px;font-size:.88rem}
  .txt{background:var(--bg);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;font-size:1.15rem;line-height:2.4;font-weight:700;margin:10px 0}
  .txt .pz{color:var(--accent);font-weight:800}
  .tipbox{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--muted);margin-top:8px}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>

<script>

var who = (qs("who")||"saud").toLowerCase();

/* مستوى نصوص الإلقاء لا مستوى الأسئلة: مبادئ الإلقاء واحدةٌ للأربعة،

var LVL   = {saud:1, osama:2, rafeef:3, hasan:4};

var SUPA_URL = "https://kmopkxlhisrwxllagjbu.supabase.co";

/* معرّف المحاولة — الحفظ الجزئيّ لا يُقفل الجلسة بعده (انظر math8.html) */
var __PIDN = 0;
function newPid(){ return Date.now().toString(36) + "_" + (++__PIDN) + Math.random().toString(36).slice(2,7); }
function saveScore(test, correct, total, extra){
  try{
    var meta = { kind:"practice", test:test, correct:correct, total:total, at:new Date().toISOString() };
    if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra,k)) meta[k]=extra[k]; } }

    });

function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function sh(s){ return '<span class="sh">'+s+'</span>'; }

/* ============================================================
   فنّ الإلقاء والخطابة — طلبُ الأب (٢٥ سبتمبر ٢٠٢٦):
     «حط قسم جديد لحسن ورفيف وأسامة وسعود — فنّ الإلقاء والخطابة».

   وهو قسمٌ واحدٌ للأربعة لا مقرَّرٌ مدرسيّ، فبنيتُه ثلاثُ وحداتٍ
   وستّة فصول، كلُّ فصلٍ درسان وامتحانٌ شامل:

     الوحدة الأولى: الصوتُ والأداء
       ١ أساسيّاتُ الإلقاء    — ما الإلقاء وأنواعه · التحضير والجمهور
       ٢ الصوتُ وأداؤه        — وضوح النطق · النبرة والسرعة والوقف
     الوحدة الثانية: الجسدُ والبناء
       ٣ لغةُ الجسد           — النظر والوقفة · اليدان والوجه والحركة
       ٤ بناءُ الخطبة         — المقدّمة والعرض والخاتمة · الإقناع والحجّة
     الوحدة الثالثة: الثقةُ والبلاغة
       ٥ الثقةُ ورهبةُ المنصّة — الرهبة وعلاجها · التدريب والأخطاء
       ٦ من بلاغة العرب       — الأساليب البلاغيّة · نماذجُ وآدابُ المنصّة

   وفوقها تبويبان دائمان: «🎙️ تدرّب» يُلقي فيه الابن نصًّا بصوته
   فيُقاس وضوحُ نطقه وسرعتُه، و«علاجي 💪» يرتّب الدروس من الأضعف.

   بنك الأسئلة: [السؤال، [الصحيح، مشتت، مشتت]، الشرح] — ستّة عشر
   في كلّ درسٍ ويُعرض ثمانية، فالجولة الثانية نصفُها جديد.
   ============================================================ */

/* ══════════ ١-١ ما الإلقاء وأنواعه ══════════ */
var K11 = [

   "الإلقاء "+sh("أداء")+": صوتٌ وملامحُ وحركةٌ تحمل المعنى إلى السامع. والكلام الواحد يُلقيه اثنان فيصل من أحدهما ويضيع من الآخر."],
  ["ما الفرق بين القراءة والإلقاء؟",["القراءة نقلُ الحروف، والإلقاء نقلُ المعنى بالصوت والإحساس","القراءة أصعب من الإلقاء","لا فرق بينهما"],

  ["ما أركان الخطابة؟",["خطيبٌ وخطبةٌ وجمهورٌ ومقام","خطيبٌ وورقةٌ ومايكروفون","صوتٌ عالٍ وحركةٌ كثيرة"],
   "المقامُ ركنٌ يُنسى: الكلامُ الحسنُ في غير مقامه قبيح — كلمةُ فرحٍ في مجلس عزاء."],
  ["أيّ هذه ليس من أنواع الإلقاء؟",["كتابةُ رسالةٍ في الجوّال","إلقاءُ قصيدةٍ في الإذاعة المدرسيّة","تقديمُ حفلٍ مدرسيّ"],
   "الرسالةُ كتابةٌ لا إلقاء؛ فالإلقاء ما خرج بالصوت إلى سامع."],
  ["ما الإلقاء المرتجل؟",["أن تتكلّم من غير تحضيرٍ سابقٍ لأنّك فوجئت بالطلب","أن تقرأ من ورقةٍ مكتوبة","أن تحفظ الكلام حرفًا حرفًا"],
   "المرتجلُ يُنجّيه أمران: سعةُ اطّلاعك، وأن تبدأ بجملةٍ واحدةٍ ثمّ تُرتّب ثلاثَ أفكارٍ في ذهنك."],
  ["ما عيبُ حفظِ الخطبة حرفًا حرفًا؟",["إن نسيت كلمةً انقطع عليك الكلامُ كلّه","يجعل الصوت أوضح","يقصّر زمن الخطبة"],

  ["أفضلُ طريقةٍ للإلقاء في الإذاعة المدرسيّة أن...",["تحضّر وتُدرّب ثمّ تتكلّم ناظرًا إلى الطلّاب ببطاقةِ رؤوسِ أقلام","تقرأ الورقة كاملةً وعينك فيها","تتكلّم بلا تحضيرٍ لأنّك تعرف الموضوع"],

   "أشهرُ الخطباء بدأ مرتبكًا. والتمرينُ هو الفارق، والتسجيلُ ثمّ الإصلاحُ أسرعُ طريق."],

/* ══════════ ١-٢ التحضير والجمهور ══════════ */
var K12 = [
  ["ما أوّلُ خطوةٍ في تحضير خطبتك؟",["تحديدُ هدفك: ماذا تريد أن يفعل السامعُ بعدها","اختيارُ الملابس","كتابةُ المقدّمة"],

   "البطاقةُ أمانٌ لا قيد: تنظر فيها لحظةً ثمّ ترفع عينك."],
  ["أعطوك خمسَ دقائق فحضّرت كلامَ عشرٍ. ماذا تفعل؟",["تحذف حتّى يصير خمسًا في التدريب قبل الموعد","تتكلّم بسرعةٍ مضاعفة","تتجاوز الوقت ولا تهتمّ"],
   "تجاوزُ الوقت أوّلُ ما يُفقدك احترامَ الحاضرين والمنظّمين. والحذفُ يكون قبل المنصّة لا عليها."],

   "القراءةُ في السرّ أسرعُ من الإلقاء كثيرًا، فالتوقيتُ لا يصحّ إلّا بتدريبٍ بصوتٍ مرتفع."],

/* ═════════ نصوصُ الإلقاء — تتدرّج بالصفّ لا بالمبادئ ═════════

   لأنّ الوقفَ أوّلُ ما يُتعلَّم في الإلقاء. وتُنزع قبل إرسال النصّ

var PRACT = [
  /* ── المستوى ١: سعود (رابع) — جملةٌ أو جملتان ── */
  {lv:1, t:"صباحُ الخير يا زملائي. / اليومَ أحدّثكم عن نظافةِ مدرستنا. // نظافةُ المدرسةِ نظافةُ أخلاقنا.", tip:"ابدأ متمهّلًا، وارفع صوتك قليلًا عند «نظافةِ أخلاقنا»."},
  {lv:1, t:"في كتابٍ واحدٍ عالَمٌ كامل. / اقرأ عشرَ دقائقَ كلَّ يوم، // وسترى بعد شهرٍ عقلًا غيرَ عقلك.", tip:"قف عند «كلَّ يوم» ثانيتين قبل أن تُكمل."},
  {lv:1, t:"أمّي، / لو جمعتُ كلَّ كلماتِ الشكرِ ما كفتْك. // أنتِ أوّلُ معلّمةٍ عرفتُها.", tip:"صوتٌ هادئٌ في الجملة الأخيرة — المعنى يحتاج سكونًا لا علوًّا."},
  {lv:1, t:"الوقتُ أغلى ما نملك. / دقيقةٌ تذهب لا تعود، // فمن حفظ وقتَه حفظ عمرَه.", tip:"شدّد على «لا تعود» ثمّ قف."},
  {lv:1, t:"وطني بلادُ الحرمين. / فيه أهلي وبيتي ومدرستي. // أحبُّه وأحافظ عليه.", tip:"ثلاثُ جملٍ ثلاثُ نبرات: خبرٌ، ثمّ سرد، ثمّ عهدٌ تقوله بثبات."},
  {lv:1, t:"الصدقُ بابٌ واحد، / والكذبُ أبوابٌ كثيرة. // فاختر البابَ الذي لا يُغلق.", tip:"هذا طباقٌ (صدق/كذب): اجعل صوتك مختلفًا في الطرفين."},

  /* ── المستوى ٢: أسامة (خامس) — ثلاثُ جملٍ إلى أربع ── */
  {lv:2, t:"أيُّها الزملاء، / سأسألكم سؤالًا واحدًا: // هل تعلمون كم كتابًا قرأنا هذا العام؟ / الجوابُ في مكتبتنا، // وهي تنتظرنا كلَّ يومٍ في الفسحة.", tip:"السؤالُ يحتاج وقفةً بعده؛ لا تُجب عنه بسرعة."},
  {lv:2, t:"الماءُ نعمةٌ لا تُشترى بمال. / صنبورٌ مفتوحٌ دقيقةً يُهدر ما يكفي صفَّنا يومًا. // فلنغلق الصنبور، / ولنكن أهلًا للنعمة.", tip:"الرقمُ يحتاج تمهّلًا: قل «دقيقةً» ببطءٍ حتّى تصل الصورة."},
  {lv:2, t:"معلّمي، / أنت لم تُعلّمني الحروفَ فقط، // بل علّمتني كيف أقفُ اليومَ هنا وأتكلّم. / شكرًا لك من قلبي.", tip:"الجملةُ الأخيرة أخفضُ صوتًا وأبطأ — الصدقُ يُسمع في الهدوء."},
  {lv:2, t:"العلمُ كالنور: / من حمله رأى طريقَه، // ومن تركه سار يتعثّر. / ونحن في زمنٍ لا يُقاد فيه الجاهل، / بل يُترك في مكانه.", tip:"تشبيهٌ في أوّله: أعطِ «النور» نبرةً مرتفعةً قليلًا."},
  {lv:2, t:"يا شبابَ الوطن، / بلادُنا لا تحتاج من يمدحها، // بل من يعمل فيها. / كلمةٌ صادقةٌ وعملٌ صغيرٌ يبقيان، / والكلامُ الكثيرُ يذهب مع الريح.", tip:"«يا شبابَ الوطن» نداء: ارفع الصوتَ فيه ثمّ اخفضه بعده."},
  {lv:2, t:"جاري رجلٌ كبيرُ السنّ. / كنتُ أمرّ عليه كلَّ يومٍ ولا أسلّم، // حتّى سلّم عليَّ هو أوّلًا. / تعلّمتُ في تلك اللحظةِ درسًا لم أنسَه: / الكبيرُ يُبادر لأنّه يعرف قيمةَ الكلمة.", tip:"هذه قصّة: اسردها بصوتٍ هادئٍ ثمّ ارتفع عند الدرس في آخرها."},

  /* ── المستوى ٣: رفيف (ثاني متوسط) — فقرةٌ قصيرةٌ مبنيّة ── */
  {lv:3, t:"الحمدُ لله، والصلاةُ والسلامُ على رسول الله. / أمّا بعد: // فإنّ أوّلَ ما يُبنى في الإنسان همّتُه. / ثلاثةٌ من كلّ عشرةٍ في صفّنا يتركون واجبَهم لا لعجزٍ، / بل لأنّ أحدًا لم يُخبرهم أنّهم قادرون. // فإن أردتم أن تتغيّر أرقامُنا، / فابدأوا بأنفسكم: / صفحةٌ كلَّ ليلة، / وسؤالٌ كلَّ حصّة.", tip:"خطبةٌ صغيرةٌ كاملة: افتتاحٌ، فدليلٌ، فدعوةٌ إلى عمل. لا تُسرع في الأرقام."},
  {lv:3, t:"قالوا: العلمُ نورٌ. / وأنا أقول: النورُ لا ينفع من أغمض عينيه. // نحن نملك اليومَ من المكتبات والشبكةِ ما لم يملكه جدُّنا، / ومع ذلك نقرأ أقلَّ منه. / السببُ ليس في الكتاب، / السببُ في أنّنا نُحبّ ما يأتي سريعًا، / والعلمُ لا يأتي سريعًا.", tip:"التكرارُ المقصود («السببُ… السببُ») يحتاج وقفةً قبله وصوتًا أهدأ."},
  {lv:3, t:"أيّتها الزميلات، / لكلِّ واحدةٍ منكنّ موهبةٌ لا تعرفها بعد. // الموهبةُ لا تُكتشف في الغرفة، / إنّما تُكتشف حين تُجرّب أمام الناس. / أنا أقف اليومَ هنا وقلبي يدقّ، / لكنّي اخترتُ أن أقفَ، / وهذا وحده نصفُ الطريق.", tip:"الصدقُ هنا قوّتُك: قل «وقلبي يدقّ» بصوتٍ طبيعيٍّ لا متمثّل."},
  {lv:3, t:"في حجّة الوداع قال النبيُّ ﷺ كلمةً ما زالت تُتلى: / «ألا أبلغتُ؟» // سألَ جمهورَه وأشهدهم، / فصار الكلامُ عهدًا لا خبرًا. / وهذا درسُ الخطابةِ الأوّل: / الكلامُ الذي يُشرِك سامعَه يبقى، / والكلامُ الذي يُلقى فوق رؤوسهم يمرّ.", tip:"الاقتباسُ يحتاج وقفةً قبله وبعده حتّى يُسمع أنّه اقتباس."},
  {lv:3, t:"الوقتُ عجيب: / نطلبه كلَّ يومٍ ونُهدره كلَّ يوم. // احسبي معي: / ساعةٌ في الجوّال قبل النوم، / وساعةٌ بعد المدرسة، / تصير في السنة خمسَ مئةِ ساعةٍ وأكثر. / بهذه الساعاتِ يُحفظ كتابٌ، / وتُتعلّم لغة، / ويُبنى مشروعٌ صغير. // فالسؤالُ ليس: أين وقتي؟ / السؤالُ: فيمَ أنفقتُه؟", tip:"الأرقامُ ثمّ السؤالُ البلاغيّ: أبطئ عند الأرقام، وقف قبل السؤال الأخير."},
  {lv:3, t:"ثلاثُ كلماتٍ تصنع الفرقَ بين طالبٍ وطالب: / «لم أفهم بعد». // من قالها سأل، / ومن سأل فهم، / ومن فهم علّم غيره. / أمّا الذي يسكت خوفًا من نظرةٍ أو ضحكة، / فهو يدفع ثمنًا غاليًا لسكوتٍ لا قيمةَ له.", tip:"التدرّج (سأل، فهم، علّم) يُقال بصوتٍ يعلو درجةً في كلّ خطوة."},

    var pool=PRACT.filter(function(p){ return p.lv===lvl; });
    if(pool.length<4) pool=PRACT.filter(function(p){ return Math.abs(p.lv-lvl)<=1; });
    var k="kh_seen_"+who, seen=[];
    try{ seen=JSON.parse(localStorage.getItem(k)||"[]")||[]; }catch(e){}
    var left=pool.filter(function(p){ return seen.indexOf(p.t)<0; });
    if(!left.length){ left=pool.slice(); seen=[]; }
    var pick=gp(left);
    seen.push(pick.t); try{ localStorage.setItem(k, JSON.stringify(seen.slice(-40))); }catch(e){}
    return pick;
  }

  var REM_PAGE="khitaba", REM_LABEL="الإلقاء";
  var REMTOPICS=[
    {id:"k11", name:"1-1 ما الإلقاء وأنواعه", tip:"الإلقاءُ أداءٌ لا قراءة: صوتٌ ووجهٌ وحركةٌ تحمل المعنى. وأركانُ الخطابة أربعة: خطيبٌ وخطبةٌ وجمهورٌ ومقام. والمرتجلُ ما جاء بغتةً، والمحضَّرُ ما سبقه إعدادٌ وتدريب — والأفضلُ حفظُ رؤوس الأفكار لا الحروف. وحدّد هدفك أوّلًا: إفهامٌ أو إقناعٌ أو تحميسٌ أو إمتاع.", yt:"شرح فن الإلقاء والخطابة للمبتدئين أنواع الإلقاء"},
    {id:"k12", name:"1-2 التحضير والجمهور", tip:"ابدأ بالهدف: ماذا تريد أن يفعل السامعُ بعد كلامك؟ ثمّ اعرف جمهورك (أعمارَهم ومعرفتَهم) فاختر لغتك وأمثلتك. وثلاثُ أفكارٍ تكفي، ولكلّ فكرةٍ مثال. واحمل بطاقةَ رؤوس أقلامٍ لا نصًّا كاملًا. ودرّب بصوتٍ مرتفعٍ مع الساعة — فالقراءةُ في السرّ أسرعُ بالثلث فتخدعك في الزمن.", yt:"كيف تحضر خطبة أو كلمة قصيرة خطوة بخطوة"},
    {id:"k21", name:"2-1 وضوح النطق", tip:"الوضوحُ حقُّ السامع الأوّل. أتمِم أواخر الكلمات ولا تبلعها. وميّز المتشابهات: ض/ظ وس/ص وق/ك وذ/ز وث/س. وتنفّس من البطن لا من أعلى الصدر. ودرّب بالتدرّج: سطرٌ متمهّلٌ ثمّ أسرعُ قليلًا مع بقاء الحروف كاملة. وسجّل صوتك واسمعه — فصوتك في رأسك غيرُ صوتك في الهواء.", yt:"تمارين مخارج الحروف ووضوح النطق للإلقاء"},
    {id:"k22", name:"2-2 النبرة والسرعة والوقف", tip:"الرتابةُ تقتل الانتباه: نوّع صوتك، وارفعه عند المهمّ، واخفضه ليُنصتوا. والسرعةُ المناسبةُ نحو ١٢٠ كلمةً في الدقيقة. والوقفةُ سلاحُك: ثانيتان قبل الجملة المهمّة وبعد السؤال. واقرأ علامات الترقيم في صوتك: الفاصلةُ وقفةٌ قصيرةٌ والنقطةُ أطول. ولا تقف في وسط الإضافة أو بين الكلمة وصفتها.", yt:"تنويع نبرة الصوت والوقفات في الإلقاء الخطابي"},
    {id:"k31", name:"3-1 النظر والوقفة", tip:"وزّع نظرك: ثلاثُ ثوانٍ لكلّ ناحيةٍ (يمين، وسط، شمال). لا تُلصق عينك بالورقة — اقرأ جملةً في الوقفة ثمّ ارفع عينك. وقفةٌ مستقيمة، قدمان بعرض الكتفين، الثقلُ عليهما معًا، بلا اتّكاءٍ على المنبر ولا تمايل. وابقَ مواجهًا الجمهورَ وإن كانت الشاشةُ خلفك.", yt:"لغة الجسد للخطيب التواصل البصري والوقوف الصحيح"},
    {id:"k32", name:"3-2 اليدان والوجه والحركة", tip:"الإشارةُ بين الخصر والصدر، وتخدم المعنى ولا تُشغل عنه. لا تُدخل يديك في جيبك ولا تعبث بقلمٍ أو ساعة. والحركةُ خطواتٌ قليلةٌ عند الانتقال بين الأفكار لا ذهابًا وإيابًا. ووجهُك يوافق معناك — فالناسُ يصدّقون الوجهَ قبل الصوت. وعُدّ على أصابعك عند «أوّلًا وثانيًا».", yt:"حركة اليدين وتعبيرات الوجه في الخطابة"},
    {id:"k41", name:"4-1 المقدّمة والعرض والخاتمة", tip:"ثلاثةُ أجزاء: مقدّمةٌ تجذب وتُبيّن الموضوع (سؤال، قصّة، رقمٌ مدهش، آيةٌ أو مثل — ولا اعتذار)، وعرضٌ مرتّبٌ بروابطَ انتقاليّة («وأمّا الأمرُ الثاني…»)، وخاتمةٌ تُجمل وتدعو إلى عملٍ محدّد. ولا تُدخل فكرةً جديدةً في الخاتمة. والمقدّمةُ تُكتب آخرًا.", yt:"كيف تبني خطبة مقدمة وعرض وخاتمة"},
    {id:"k42", name:"4-2 الإقناع والحجّة والقصّة", tip:"لكلّ دعوى دليل: نقلٌ موثوقٌ، أو رقمٌ، أو تجربة، أو شهادةُ خبير — واذكر مصدرك. وقرّب الأرقامَ بتشبيهٍ يعرفه السامع. والقصّةُ تُحرّك القلبَ والرقمُ يُقنع العقل، فاجمعهما. واذكر رأيَ المخالف بإنصاف. والمبالغةُ إن كُشفت أسقطت كلامك كلَّه.", yt:"مهارات الإقناع في الخطابة الأدلة والقصة"},
    {id:"k51", name:"5-1 رهبة المنصّة وعلاجها", tip:"الرهبةُ طبيعيّةٌ ويشعر بها كبارُ الخطباء؛ وأقوى علاجٍ لها التحضيرُ والتدريبُ بصوتٍ مرتفع. تنفّس عميقًا من البطن، واحفظ جملتك الأولى حرفيًّا، وابدأ بوجهٍ مشجّعٍ ثمّ وسّع نظرك. وإن نسيتَ: وقفةٌ وشربةُ ماءٍ وإعادةُ آخرِ جملةٍ يُعيدان الخيط. ولا تعتذر عن خوفك — أكثرُهم لا يلاحظه.", yt:"كيف تتخلص من الخوف من التحدث أمام الجمهور"},
    {id:"k52", name:"5-2 التدريب والأخطاء الشائعة", tip:"سجّل نفسك وشاهد: ستكشف الحشوَ والتمايلَ والنظرَ إلى الأرض. واستبدل «أممم» و«يعني» بوقفةٍ صامتة. ودرّب بصوتٍ مرتفعٍ ثلاثَ مرّاتٍ كاملةً في أيّامٍ متفرّقة مع الساعة. ولا تتجاوز الزمنَ المحدّد. واطلب ملاحظةً محدّدةً: «هل سمعتَ كلَّ الكلمات؟ وهل عرفتَ فكرتي في جملة؟»", yt:"أخطاء شائعة في الإلقاء وكيف تتدرب عليها"},
    {id:"k61", name:"6-1 الأساليب البلاغيّة", tip:"التشبيهُ يُقرّب («العلمُ كالنور»)، والاستعارةُ تُصوّر («طارت الأخبار»)، والكنايةُ تُلطّف، والطباقُ يُبرز بالتضادّ، والنداءُ يُلفت، والاستفهامُ البلاغيُّ يُفكّر بلا جواب. والجملُ القصيرةُ أقوى وأسهلُ حفظًا. واحفظ قاعدةَ البلاغة كلّها: لكلّ مقامٍ مقال — وأوّلُها أن يفهمك السامع.", yt:"الأساليب البلاغية في الخطابة التشبيه والاستعارة والطباق"},
    {id:"k62", name:"6-2 نماذج وآداب المنصّة", tip:"خطبةُ حجّة الوداع للنبيّ ﷺ: جملٌ قصيرةٌ جامعةٌ وإشهادُ الجمهور («ألا أبلغتُ؟»). وأوّلُ خطبةٍ لأبي بكر: «أطيعوني ما أطعتُ اللهَ فيكم» — الولايةُ مسؤوليّة. وطارقُ بن زياد: مثالُ التحميس في الموقف الحرج. وأركانُ خطبة الجمعة: حمدٌ وشهادتان وصلاةٌ ووصيّةٌ بالتقوى وآية. ومن الأدب: الشكرُ القصير، و«لا أعلم» إن سُئلت، وألّا تسخر من أحد، والأمانةُ في النقل.", yt:"خطبة حجة الوداع وخطبة طارق بن زياد تحليل بلاغي"}

  var ALL_IDS = ["all1","all2","all3","all4","all5","all6"];

  /* الاختبارُ الشاملُ يُغذّي «علاجي» — انظر تعليل النمط في math9.html */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1) return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify({ pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }

    var sec=panelOf("rem");

        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div>'+(x.t.yt?'<div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent(x.t.yt)+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرحًا</a></div>':'')):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(id==="prac"){ if(!pan.innerHTML) renderPrac(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") +
      '<button data-tab="prac" aria-selected="'+(curId==="prac"?"true":"false")+'">تدرّب 🎙️</button>'+
      '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;

  function drawChap(){

      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';

    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel(curId);
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });
  window.addEventListener("pagehide", function(){ leaveCur(); });

/* ═══ تنبيهٌ عند الخروج، ولا قذفَ من الجلسة ═══
   هذه الصفحة فيها مايكروفون، وآيفون يُخفي الصفحة لحظةً عند فتحه —
   فالقذفُ هنا يطرد ابنًا يُلقي ولم يخرج من شيء. وهي عين علّة صفحة
   القراءة التي أزلتُ منها القذفَ ببلاغ الأب (٤ سبتمبر ٢٠٢٦). ويبقى
   التنبيهُ لأنّ الغرضَ تربويٌّ لا عقابيّ: أن يلزم الابنُ صفحته. */
(function(){ var h=null;
function tst(){ var t=document.getElementById("__extoast"); if(!t){ t=document.createElement("div"); t.id="__extoast"; t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b45309;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl"); document.body.appendChild(t); }
  t.innerHTML="⚠️ لا تخرج من الصفحة أثناء التدريب — ابقَ معنا حتّى تخلّص."; t.style.display="block"; clearTimeout(t._t); t._t=setTimeout(function(){ t.style.display="none"; },4000); }
function micBusy(){ return (window.__paBusy>0) || (window.__micGrace && Date.now()<window.__micGrace); }
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ h=Date.now(); return; }
  if(h==null) return; var dur=Date.now()-h; h=null;
  if(dur<=5000) return;        /* إشعارٌ عابرٌ أو نظرةُ ساعةٍ ليست خروجًا */
  if(micBusy()) return;        /* فتحُ المايك يُخفي الصفحة على آيفون */
  tst();
});})();
}
