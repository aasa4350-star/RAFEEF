<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الإنجليزي — الصف الخامس</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="gate.js"></script>

<!-- أداة النطق: الإصدار مثبَّتٌ عمدًا لا @latest.
     كان @latest يجلب أحدث إصدارٍ مهما كان، فأيّ تحديثٍ من مايكروسوفت
     يصل أجهزة الأولاد الأربعة من تلقائه ويكسر التسجيل بلا أن نلمس
     شيئًا ولا نعرف السبب. والترقية الآن قرارٌ نتّخذه ونختبره.
     1.51.0 هو ما كان @latest يخدمه يوم التثبيت (٥ سبتمبر ٢٠٢٦)
     بايتًا ببايت، فالتثبيت لم يغيّر سلوكًا قائمًا. -->
<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.51.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<style>
  :root{
    --accent:#2563eb; --accent-deep:#1d4ed8;
    --bg:#f6f7fb; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9ee; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec; --warn:#b45309;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;--warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:110px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.92rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .stem .en{direction:ltr;unicode-bidi:isolate}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit;direction:ltr;text-align:left}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:220px;padding:10px 12px}
  .explain .en{direction:ltr;unicode-bidi:isolate}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
  .say{background:var(--accent);color:#fff;border:0;padding:9px 13px;border-radius:11px;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit}
  .say.small{padding:8px 12px;font-size:.88rem}
  .prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;background:var(--bg);border-radius:10px;padding:10px 12px}
  .prow .say{background:#0a7cff;border-color:#0a7cff}
  .prow .listen{background:var(--accent)}
  .prow .en{direction:ltr;unicode-bidi:isolate;font-weight:700}
  .prow .pfb{font-weight:700;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"saud").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
var name = NAMES[who] || "الطالب";

var SUPA_URL = APP_CONFIG.supaUrl;
var SUPA_KEY = APP_CONFIG.supaKey;
/* ═══ معرّف المحاولة ═══
   بلاغ الأب (١٢ سبتمبر ٢٠٢٦): «رفيف تقول اليوم حلّت الرياضيات وفي التقرير
   ما طلع». وكان الحفظ يُقفل بعد أوّل مرّة: إذا خرجت من الصفحة بعد أربعة
   أسئلة حُفظت ١/٤ ورُفع العلم saved، ثمّ أكملت الدرس كلّه فلم يُحفظ شيء —
   فيبقى في التقرير ربع الجلسة ويضيع ثلاثة أرباعها. ومفتاحنا يُدخل ولا
   يُعدّل، فلا سبيل إلى تصحيح الصفّ القديم؛ فنُدخل صفًّا أكمل ونعطي
   المحاولتين معرّفًا واحدًا (pid)، وقواعد العرض تُبقي الأكمل وتُسقط ما
   دونه (RR.usable). فلا يضيع جهدُ الطفل ولا يُحسب مرّتين. */
var __PIDN = 0;
function newPid(){ return Date.now().toString(36) + "_" + (++__PIDN) + Math.random().toString(36).slice(2,7); }
/* طلبُ الأب (٢٥ سبتمبر ٢٠٢٦): «سوّ تفصيل المهارات لصفحات المنهج».
   كانت هذه الصفحةُ تحفظ الدرجةَ وحدَها، فيطبع التقريرُ «[بلا تفصيل
   مهارات]» ويعمى العلاجيُّ عن موضعِ الخلل: عشرُ جلساتٍ في درسٍ واحدٍ
   ولا يُعرَف أيُّ نوعٍ يسقط فيه. فصار extra يُدمَج في meta ليحمل
   skills وitems كما في math9.html. */
function saveScore(test, correct, total, pid, extra){
  try{
    var meta = { kind:"practice", test:test, correct:correct, total:total, pid:pid||null };
    if(extra) for(var __k in extra) meta[__k]=extra[__k];
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:meta };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}

function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function opt(correct, others){ var o=[correct].concat(others); shuffle(o); return [o, o.indexOf(correct)]; }
function en(s){ return '<span class="en">'+s+'</span>'; }
// مشتّتات مميّزة من نفس القائمة (تستبعد القيمة الصحيحة وتحذف المكرّر)
function dist(pool, item, idx, n){ var correct=item[idx], seen={}, o=[]; pool.forEach(function(x){ var v=x[idx]; if(v!==correct && !seen[v]){ seen[v]=1; o.push(v); } }); shuffle(o); return o.slice(0, n||2); }
function normEN(s){ return String(s||"").toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim(); }

/* ===== النطق: استماع (متصفح) + تقييم عبر Azure ===== */
function azureCreds(){ var A=window.AZURE_SPEECH||{}; var c=A[who]; if(c&&c.key&&c.region) return c; var d=A["default"]; return (d&&d.key&&d.region)?d:null; }
function azureConfigured(){ return !!azureCreds(); }
function azBtnHtml(){ return azureConfigured() ? '<button class="say small azbtn">🎙️ قيّم نطقي</button>' : ''; }
function speakEN(text){
  try{
    speechSynthesis.cancel();
    try{ speechSynthesis.resume(); }catch(e){} // Safari/iOS قد يعلّق المحرّك فيصير صامتًا — resume يفكّه
    var u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=0.9;
    var cands=speechSynthesis.getVoices().filter(function(x){return /^en/i.test(x.lang);});
    var good=cands.filter(function(x){return /(natural|neural|enhanced|premium|samantha|daniel|karen|serena|aria|guy|jenny)/i.test(x.name);});
    var v=good[0]||cands[0]; if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ alert("المتصفح لا يدعم النطق. جرّب Chrome أو Safari."); }
}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=function(){}; }catch(e){}
// استماع بصوت Azure العصبي البشري (مبطّأ للأطفال)، ويرجع لصوت المتصفح فقط إذا تعذّر
var _ttsSynth=null;
function azureSpeak(text){
  var cr=azureCreds();
  if(!cr || !window.SpeechSDK){ speakEN(text); return; }
  try{
    var SDK=window.SpeechSDK;
    if(_ttsSynth){ try{ _ttsSynth.close(); }catch(e){} _ttsSynth=null; }
    var sc=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    var synth=new SDK.SpeechSynthesizer(sc); _ttsSynth=synth;
    var esc=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
    var ssml='<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="en-GB"><voice name="en-GB-RyanNeural"><prosody rate="-15%">'+esc+'</prosody></voice></speak>';
    synth.speakSsmlAsync(ssml, function(){ try{ synth.close(); }catch(e){} if(_ttsSynth===synth)_ttsSynth=null; }, function(){ try{ synth.close(); }catch(e){} if(_ttsSynth===synth)_ttsSynth=null; speakEN(text); });
  }catch(e){ speakEN(text); }
}
/* ═══ لماذا أخفق التسجيل — يُحفظ لا يُخمَّن ═══
   انظر شرحه الكامل في mic-help.js (MIC.why). بلا هذا كان كلّ سببٍ —
   شبكةً أو مفتاحًا أو حصّةً نفدت — يُعرض «ما وضح صوتك» ويذهب بلا أثر. */
function saveMicFail(info){
  try{
    var e = (window.MIC && MIC.env) ? MIC.env() : {};
    var meta = { kind:"micfail", sect:"word",
      why:(info&&info.reason)||null, code:(info&&info.code)||null, detail:(info&&info.detail)||null,
      res:(info&&info.res)||null, txt:(info&&info.txt), pa:(info&&info.pa),
      br:e.br, ios:e.ios, osv:e.osv, inApp:e.inApp, online:e.online, build:((window.MIC&&MIC.build)||null) };
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:meta };
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body) }).catch(function(){});
  }catch(err){}
}
function micFailMsg(info){
  var c = (info && info.code) || "";
  if(info && info.reason === "canceled"){
    if(/Authentication|Forbidden/i.test(c)) return "❌ خدمة تقييم النطق رفضت الطلب (مفتاح الاشتراك). أخبر والدك — ما هي مشكلةٌ منك.";
    if(/TooManyRequests/i.test(c))          return "❌ خدمة تقييم النطق مشغولة الآن. انتظر دقيقة ثمّ أعد المحاولة.";
    if(/Connection|Timeout/i.test(c))       return "❌ انقطع الاتّصال بخدمة النطق. تأكّد من الإنترنت وأعد المحاولة — صوتك سليم.";
    return "❌ خدمة تقييم النطق توقّفت" + (c ? " ("+c+")" : "") + ". أعد المحاولة، وإن تكرّر فأخبر والدك.";
  }
  return null;
}

function _paRun(refText, statusEl, btn, tries){
  tries = tries || 0;
  var SDK=window.SpeechSDK, cr=azureCreds(), cfg, audio, rec, pa;
  /* نطلب إذن المايك أوّلًا ثمّ نبدأ التعرّف: على آيفون كانت نافذة «Allow»
     تظهر بعد أن تبدأ أزور، فتمشي مهلة الصمت الأوّليّ والطفل يقرأ النافذة
     فيضيع وقته — بلاغ ٤ سبتمبر ٢٠٢٦، وانظر MIC.ensure في mic-help.js. */
  MIC.ensure(statusEl, function(){ _go(); }, function(){ MIC.fail(statusEl, btn, { tail:MIC_TAIL }); });
  function _go(){
  try{
    cfg=SDK.SpeechConfig.fromSubscription(cr.key, cr.region);
    // لهجة التقييم تتبع لهجة الصوت الذي يسمعه الطفل (رايان بريطاني):
    // لو قيّمناه أمريكيًّا حُوسب على تقليد ما سمعه — car وwater وclass تختلف.
    cfg.speechRecognitionLanguage="en-GB";
    try{ cfg.setProperty(SDK.PropertyId.SpeechServiceConnection_InitialSilenceTimeoutMs,"12000"); cfg.setProperty(SDK.PropertyId.Speech_SegmentationSilenceTimeoutMs,"1500"); }catch(e){}
    audio=MIC.audioConfig(SDK);   /* مسارٌ جديد لكلّ تعرّف — انظر mic-help.js */
    rec=new SDK.SpeechRecognizer(cfg, audio);
    pa=new SDK.PronunciationAssessmentConfig(refText, SDK.PronunciationAssessmentGradingSystem.HundredMark, SDK.PronunciationAssessmentGranularity.Phoneme, true);
    pa.applyTo(rec);
  }catch(e){ statusEl.textContent="خطأ في الإعداد: "+(e.message||e); if(btn) btn.disabled=false; return; }
  if(btn) btn.disabled=true;
  statusEl.style.color="var(--muted)"; statusEl.innerHTML=(tries>0?"🔁 مرة ثانية — ":"🎙️ ")+"اقرأ الآن بصوت واضح...";
  var _fin=false;
  window.__paBusy=(window.__paBusy||0)+1; window.__micGrace=Date.now()+9000; // استثناء كشف الخروج أثناء تقييم النطق
  function _end(){ if(btn) btn.disabled=false; if(window.__paBusy>0) window.__paBusy--; window.__micGrace=Date.now()+9000; try{ rec.close(); }catch(e){} MIC.releaseSoon(); }
  // إعادة محاولة تلقائية واحدة عند عدم وضوح الصوت (الكلمات القصيرة تحتاج محاولتين أحيانًا)
  function _retryOrFail(finalMsg){
    if(tries<1){
      statusEl.style.color="var(--muted)"; statusEl.innerHTML="🔁 ما وضح — نعيد المحاولة تلقائيًا، قُل الكلمة مرة ثانية بصوت واضح...";
      setTimeout(function(){ _paRun(refText, statusEl, btn, tries+1); }, 700);
    } else { statusEl.style.color="var(--bad)"; statusEl.innerHTML=finalMsg; }
  }
  var _to=setTimeout(function(){ if(_fin) return; _fin=true; _end(); _retryOrFail("⚠️ ما التقطتُ صوتك. قرّب المايك من فمك واقرأ بصوتٍ أعلى، ثمّ اضغط الزرّ ثانية."); }, 15000);
  rec.recognizeOnceAsync(function(result){
    if(_fin) return; _fin=true; clearTimeout(_to);
    var outcome="nomatch";
    try{
      if(result && result.reason===SDK.ResultReason.RecognizedSpeech){
        outcome="ok";
        var r=SDK.PronunciationAssessmentResult.fromResult(result);
        var pron=Math.round(r.pronunciationScore), acc=Math.round(r.accuracyScore), flu=Math.round(r.fluencyScore);
        var col=pron>=80?"var(--good)":pron>=60?"var(--warn)":"var(--bad)";
        var wordsHtml="";
        try{
          var ws=(r.detailResult&&r.detailResult.Words)||[];
          wordsHtml = ws.map(function(w){
            var a=w.PronunciationAssessment||{}; var sc=(typeof a.AccuracyScore==="number")?a.AccuracyScore:100; var et=a.ErrorType||"None";
            var wc=(et==="Omission")?"#9ca3af":(sc>=80?"var(--good)":sc>=60?"var(--warn)":"var(--bad)");
            return '<span style="color:'+wc+'">'+w.Word+'</span>';
          }).join(' ');
        }catch(e){}
        var face=pron>=80?"🌟":pron>=60?"👍":"💪";
        statusEl.innerHTML=face+' <b style="color:'+col+'">النطق: '+pron+'/100</b> · دقّة '+acc+' · طلاقة '+flu+
          (wordsHtml?('<div style="direction:ltr;text-align:left;margin-top:8px;line-height:2.1;font-weight:700">'+wordsHtml+'</div>'+
            '<div style="font-size:.78rem;color:var(--muted);margin-top:4px;font-weight:400">🟢 صحيح · 🟡 وسط · 🔴 راجعه</div>'):' ✅ ممتاز!');
      }
    }catch(e){ outcome="error"; statusEl.style.color="var(--bad)"; statusEl.textContent="خطأ: "+(e.message||e); }
    _end();
    if(outcome==="nomatch"){
      var _w=null; try{ _w=MIC.why(SDK, result, null); }catch(e){}
      var _m=micFailMsg(_w);
      /* الإلغاء لا يُعالَج بالإعادة: نقوله صراحةً ونحفظه */
      if(_m){ statusEl.style.color="var(--bad)"; statusEl.innerHTML=_m; saveMicFail(_w); return; }
      if(tries>=1) saveMicFail(_w);
      _retryOrFail("❌ ما وضح الصوت — اقرأ أعلى وأوضح واضغط «قيّم نطقي» ثانية.");
    }
  }, function(err){ if(_fin) return; _fin=true; clearTimeout(_to); var _w=null; try{ _w=MIC.why(SDK, null, err); }catch(e){} saveMicFail(_w); MIC.fail(statusEl, btn, { tail:MIC_TAIL }); _end(); });
  }
}
var MIC_TAIL = '<div style="font-weight:400;font-size:.85rem;margin-top:6px">وتقدر تكمّل بقيّة الأسئلة عادي — تقييم النطق إضافةٌ لا شرط.</div>';
function azureAssess(refText, statusEl, btn){
  var cr=azureCreds();
  if(!cr){ statusEl.innerHTML="⚠️ لم يُضبط مفتاح Azure بعد." + MIC_TAIL; return; }
  /* كانت «جرّب بعد ثانية» تعود أبدًا إن لم تصل الأداة — انظر mic-help.js */
  if(!window.SpeechSDK){
    MIC.waitSDK(statusEl, btn, function(){ azureAssess(refText, statusEl, btn); },
      function(){ statusEl.style.color="var(--bad)";
        statusEl.innerHTML="❌ ما قدرت أحمّل أداة تقييم النطق — غالبًا الإنترنت." + MIC_TAIL;
        if(btn){ btn.disabled=false; } });
    return;
  }
  if(btn) btn.disabled=true;

function enTarget(stemEl, ansText){
  var parts=[]; try{ stemEl.querySelectorAll(".en").forEach(function(e){ parts.push(e.textContent); }); }catch(e){}
  var t=parts.join(" ").trim();
  var ansEn=/[A-Za-z]/.test(ansText||"");
  if(!t){ return ansEn ? clean(ansText) : ""; }
  if(/_{2,}|_/.test(t) && ansEn){ t=t.replace(/_{2,}|_/g, ansText); }
  t=clean(t);
  return /[A-Za-z]/.test(t) ? t : (ansEn ? clean(ansText) : "");
  function clean(s){ return String(s).replace(/[«»"?؟]/g,"").replace(/\s+/g," ").trim(); }
}

/* نَسِم كلّ سؤالٍ باسم مولّده (q.__g) لنعرف من أيّ درسٍ جاء.
   يحتاجه الاختبار الشامل ليُغذّي «علاجي» بنتيجة كلّ درسٍ على حدة. */
function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*20){ var f=gp(gens), q; try{ q=f(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; try{ q.__g=f.name||""; q.__gf=f; }catch(e){} out.push(q); } return out; }

  ];
  var ALL_IDS = ["all"];

  /* ═══ الاختبار الشامل يُغذّي «علاجي» ═══════════════════════════
     بلاغ الأب (٢٦ أغسطس ٢٠٢٦): «قسم علاجي ما حطّيت فيه دروس بعد
     الاختبار». وسببه أنّ تسجيل نتيجة الدرس كان مشروطًا بألّا يكون
     الاختبار شاملًا — فمن اختبر الشامل وحده لم يُسجَّل له درسٌ
     واحد، فيجد «علاجي» فارغًا وقد اختبر لتوّه.

     وهذا نقيض المقصود: الشامل هو الاختبار الوحيد الذي يمسح الدروس
     كلّها، فهو أولى ما يُبنى عليه ترتيب الضعف.

     ولكنّه اثنا عشر سؤالًا موزّعةً على الدروس، فنصيب الدرس سؤالان
     أو ثلاثة — وهذا تقديرٌ لا حكم. فنُسجّله موسومًا بعدده،
     ولا نطمس به نتيجةَ درسٍ اختُبر وحده، فالعشرة أصدق من الاثنين. */
  /* المطابقة بالاسم أوّلًا، وبهُويّة الدالّة إن كانت مجهولة الاسم —
     فبعض المولّدات تُصنع بمصنعٍ (bankGen) فتخرج بلا اسم، وكانت
     تسقط كلّها من الحصر فيبقى «علاجي» فارغًا رغم الاختبار. */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1 || id==="rem") return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      /* نتيجةُ درسٍ اختُبر وحده لا تُطمَس بتقديرٍ من الشامل */
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify(
        { pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=document.getElementById("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null, est:!!(s&&s.from==="all"), n:(s&&s.n)||null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الوحدات من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل وحدة.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الوحدات. جرّب وحدات '+REM_LABEL+' ويرجع هنا يعرض أضعف وحدة مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+(x.est?' <span style="font-weight:400;font-size:.78rem;color:var(--muted)">تقديريّ من الشامل ('+(x.n===1?'سؤال واحد':x.n===2?'سؤالان':x.n+' أسئلة')+')</span>':'')+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 وحدات ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ var tb=document.querySelector('.tabs [data-tab="'+b.dataset.go+'"]'); if(tb) tb.click(); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }
  /* نبدأ بالتبويب المختار في الأزرار لا باسمٍ مكتوب — وإلّا تخلّفت
     اللوحة عن الترتيب كما وقع حين صار «الشامل» آخرًا. */
  render((document.querySelector('.tabs [aria-selected="true"]')||{dataset:{tab:"w"}}).dataset.tab);

  document.querySelectorAll(".tabs button").forEach(function(b){
    b.addEventListener("click", function(){
      var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave();
      document.querySelectorAll(".tabs button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
      b.setAttribute("aria-selected","true");
      document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
      var id=b.dataset.tab; var pan=document.getElementById(id); pan.classList.add("active");
      if(id==="rem"){ renderRem(); } else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
    });
  });
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); } });
// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
// أثناء استخدام المايك (إملاء لوحة المفاتيح أو تقييم Azure) يخفي الآيفون الصفحة لحظة — لا نحسبها خروجًا
function _isMicEl(t){ return !!(t && /(^|\s)(kmic|dinp|pinp)(\s|$)/.test(t.className||"")); }
function _micActive(){ if(window.__paBusy>0) return true; if(_isMicEl(document.activeElement)) return true; if(window.__micGrace && Date.now()<window.__micGrace) return true; return false; }

function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}

document.addEventListener("visibilitychange",function(){if(document.hidden){if(_micActive()){window.__micGrace=Date.now()+9000;h=null;return;}h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(window.__eduExempt){window.__eduExempt=false;return;}if(dur<=2000)return;if(_micActive())return;ex++;if(ex>=2)ejc();else tst();}});})();
}
