<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>الأحياء — أوّل ثانوي</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="config.js"></script>
<script src="gate.js"></script>
<script src="attempts-queue.js"></script>
<style>
  :root{
    --accent:#15803d; --accent-deep:#14532d;
    --bg:#f6f8f6; --card:#ffffff; --ink:#14202b; --muted:#5b6b78;
    --line:#e4e9e5; --good:#15803d; --good-bg:#e7f6ec; --bad:#b91c1c; --bad-bg:#fdecec;
    --shadow:0 1px 2px rgba(20,32,43,.05),0 8px 24px rgba(20,32,43,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0b1016;--card:#141b25;--ink:#e7f0f5;--muted:#93a6b2;--line:#22323c60;
      --accent:#22a35a;--accent-deep:#15803d;
      --good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1616;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.8}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  header.top{background:linear-gradient(135deg,var(--accent-deep),var(--accent));color:#fff;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  header.top .eyebrow{font-size:.82rem;opacity:.92;margin:0 0 6px}
  header.top h1{margin:0;font-size:1.5rem;font-weight:800}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .bar a{text-decoration:none;background:var(--card);border:1px solid var(--line);color:var(--ink);padding:10px 15px;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow)}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 12px;box-shadow:var(--shadow);font-weight:800}
  .chapsel{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
  .chapsel button{flex:1 1 auto;min-width:74px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 6px;border-radius:13px;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .chapsel button[aria-selected="true"]{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
  .tabs button{flex:1;min-width:105px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 6px;border-radius:13px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none} .panel.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow);font-size:.95rem}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 17px;margin-bottom:13px;box-shadow:var(--shadow)}
  .q .num{font-size:.8rem;color:var(--accent);font-weight:800}
  .stem{font-weight:700;margin:5px 0 9px;font-size:1.06rem}
  .en{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .opts{display:grid;gap:8px}
  .opts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 14px;border-radius:12px;font-size:1.05rem;cursor:pointer;font-family:inherit;text-align:right}
  .opts button.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
  .opts button.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .explain{margin-top:10px;font-size:.92rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:0 12px;max-height:0;overflow:hidden;transition:max-height .25s,padding .25s}
  .explain.show{max-height:320px;padding:10px 12px}
  .scorebar{position:sticky;bottom:12px;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 18px;box-shadow:var(--shadow);font-weight:800;text-align:center}
  .reset{width:100%;margin-top:12px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  .locked{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 18px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
function qs(k){ return new URLSearchParams(location.search).get(k); }
var who = (qs("who")||"hasan").toLowerCase();
var NAMES = {saud:"سعود",osama:"أسامة",rafeef:"رفيف",hasan:"حسن"};
var GRADES = {saud:"رابع ابتدائي",osama:"خامس ابتدائي",rafeef:"ثاني متوسط",hasan:"ثالث متوسط"};
function gradeOf(w){ return GRADES[w] || ""; }
var name = NAMES[who] || "الطالب";

var SUPA_URL = APP_CONFIG.supaUrl;
var SUPA_KEY = APP_CONFIG.supaKey;
/* ═══ تُحفَظ النتيجة ولا تدخل التقييم ═══════════════════════════
   طلب الأب (١٤ سبتمبر ٢٠٢٦): «ما أبيها تُحتسب الكيمياء والأحياء،
   لكن أبي نتيجة اختباراتها تطلع لي في صفحتي».

   وكان الحفظ مقطوعًا من المنبع (٧ سبتمبر) لئلّا تدخل التقييم. وذاك
   قطعٌ زائدٌ على المطلوب: حرمه من رؤية ما يعمله ابنه. فالصواب أن
   تُحفظ موسومةً بـ preview، وتُعرض له في قسمٍ مستقلٍّ ظاهرٍ أنّه
   خارج التقييم.

   ووسمُ preview يُقرأ في report-rules.js (RR.isPreview) فتُستثنى من
   المتوسّطات والتشخيص في الصفحات الأربع جميعًا. ويحرس checks/pages.js
   أمرين: أنّها تحفظ فعلًا، وأنّ كلّ ما تحفظه موسومٌ بـ preview —
   فلو سقط الوسم يومًا لوقف الفحصُ التحديثَ قبل أن يصل الأب.

   والمحاولة صفٌّ واحدٌ ولو حُفظت مرّتين (meta.pid) — انظر math8.html. */
var __PIDN = 0;
function newPid(){ return Date.now().toString(36) + "_" + (++__PIDN) + Math.random().toString(36).slice(2,7); }
/* طلبُ الأب (٢٥ سبتمبر ٢٠٢٦): «سوّ تفصيل المهارات لصفحات المنهج».
   كانت هذه الصفحةُ تحفظ الدرجةَ وحدَها، فيطبع التقريرُ «[بلا تفصيل
   مهارات]» ويعمى العلاجيُّ عن موضعِ الخلل. فصار extra يُدمَج في meta
   ليحمل skills وitems كما في math9.html. */
function saveScore(test, correct, total, pid, extra){
  try{
    var meta = { kind:"practice", test:test, correct:correct, total:total, pid:pid||null, preview:true };
    if(extra) for(var __k in extra) meta[__k]=extra[__k];
    var body = { student:name, grade:GRADES[who]||"", en_correct:0,en_total:0,ma_correct:0,ma_total:0, wrong:[], meta:meta };
    /* عبر الطابور: ما يفشل إرساله يُحفظ ويُعاد تلقائيًّا (attempts-queue.js) */
    if(window.AQ){ AQ.post(SUPA_URL+"/rest/v1/attempts", SUPA_KEY, body); return; }
    fetch(SUPA_URL+"/rest/v1/attempts", { method:"POST", keepalive:true,
      headers:{ "apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal" },
      body: JSON.stringify(body)
    });
  }catch(e){}
}
function gp(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function en(s){ return '<span class="en">'+s+'</span>'; }

/* ============================================================
   الأحياء — أوّل ثانوي (حسن)
   مبنيّةٌ على فهرس كتابه الذي أرسله الأب (١٤ سبتمبر ٢٠٢٦):
   ثمانية فصولٍ وعشرون درسًا، بترتيب الكتاب نفسه وعناوينه نفسها.
   بنك أسئلة: [السؤال، [الصحيح، مشتت، مشتت]، الشرح]
   وكلّ بنكٍ عشرون سؤالًا ويُعرض منها عشرة — فالجولة الثانية نصفُها جديد.
   ============================================================ */

/* ══════════ الفصل ١: دراسة الحياة ══════════ */

/* ===== 1-1 مدخل إلى علم الأحياء ===== */
var B11 = [
  ["ما علم الأحياء؟",["دراسة الحياة وما يتّصف به الكائن الحيّ","دراسة الأرض وتكوين صخورها","دراسة المادّة والتغيّرات التي تطرأ عليها"],
   "علم الأحياء "+en("Biology")+" هو دراسة الحياة: الكائنات الحيّة، وتراكيبها، ووظائفها، وعلاقاتها ببعضها وببيئتها."],
  ["أيُّ هذه ليس من صفات الكائنات الحيّة؟",["أن تكون مصنوعةً من مادّةٍ صلبة","النموّ والتطوّر","الاستجابة للمثيرات"],
   "صفات الكائن الحيّ: التنظيم، والنموّ والتطوّر، والتكاثر، والاستجابة للمثيرات، والحاجة إلى الطاقة، والاتّزان الداخليّ، والتكيّف. وصلابة المادّة ليست منها."],
  ["ما المثير "+en("stimulus")+"؟",["أيّ تغيّرٍ في البيئة الداخليّة أو الخارجيّة يسبّب استجابةً في الكائن","العضو الذي يستقبل الضوء في العين","الطاقة التي يخزّنها الكائن في غذائه"],
   "المثير تغيّرٌ يُحدث استجابة: الضوء، الحرارة، الصوت، الملمس. والاستجابة هي ردّ فعل الكائن على ذلك المثير."],
  ["ما الاتّزان الداخليّ "+en("homeostasis")+"؟",["تنظيم الكائن بيئتَه الداخليّة ليبقيها ثابتةً نسبيًّا رغم تغيّر الخارج","بقاء الكائن ساكنًا لا يتحرّك","تساوي عدد الذكور والإناث في الجماعة الحيويّة"],
   "مثالُه أنّ حرارة جسم الإنسان تبقى نحو "+en("37°C")+" صيفًا وشتاءً، لأنّ الجسم يعرَق أو يرتجف ليعيدها إلى مداها."],
  ["رتّب مستويات التنظيم من الأصغر إلى الأكبر:",["خليّة ← نسيج ← عضو ← جهاز ← كائن حيّ","خليّة ← عضو ← نسيج ← جهاز ← كائن حيّ","نسيج ← خليّة ← جهاز ← عضو ← كائن حيّ"],
   "الخليّة وحدة البناء، ومجموعة خلايا متشابهة نسيج، ومجموعة أنسجة تؤدّي وظيفةً عضو، ومجموعة أعضاء جهاز، ومجموعة أجهزة كائنٌ حيّ."],
  ["ما الجماعة الحيويّة "+en("population")+"؟",["أفرادُ نوعٍ واحدٍ يعيشون في المكان نفسه والزمان نفسه","كلّ الكائنات الحيّة في منطقةٍ ما على اختلاف أنواعها","الكائنات الحيّة وغير الحيّة في منطقةٍ ما"],
   "الجماعة الحيويّة نوعٌ واحد. أمّا المجتمع الحيويّ "+en("community")+" فجماعاتٌ من أنواعٍ مختلفة، والنظام البيئيّ يضمّ معها العوامل غير الحيّة."],
  ["ما التكيّف "+en("adaptation")+"؟",["صفةٌ موروثة تزيد فرصة بقاء الكائن وتكاثره في بيئته","تغيُّرٌ يكتسبه الكائن في حياته ولا يورّثه","انتقال الكائن من بيئةٍ إلى أخرى"],
   "التكيّف صفةٌ وراثيّة نشأت عبر أجيال، مثل سنام الجمل وشوك الصبّار — لا عادةٌ يتعلّمها الفرد في حياته."],
  ["لماذا تحتاج الكائنات الحيّة كلُّها إلى الطاقة؟",["لتقوم بعمليّات الأيض: البناء والهدم والنموّ والحركة","لتبقى دافئةً فقط","لتتكاثر فقط دون غيره"],
   "كلّ عمليّات الحياة — بناء المواد وهدمها والنقل والحركة والتكاثر — تحتاج طاقةً، ومصدرها الأوّل في معظم الأنظمة هو الشمس."],
  ["ما الفرق بين النموّ والتطوّر في الكائن الحيّ؟",["النموّ زيادةٌ في الحجم أو عدد الخلايا، والتطوّر تغيّرٌ في الشكل والوظيفة خلال دورة الحياة","النموّ يحدث في النبات والتطوّر في الحيوان","لا فرق، وهما اسمان لعمليّةٍ واحدة"],
   "الشرغوف يكبر (نموّ) ثمّ يتحوّل إلى ضفدع بأطرافٍ ورئتين (تطوّر). والاثنان يحدثان في النبات والحيوان معًا."],
  ["ما التكاثر اللاجنسيّ؟",["إنتاج أفرادٍ جديدةٍ من أبٍ واحدٍ فتكون نسخةً وراثيّةً منه","اتّحاد مشيجٍ ذكريٍّ بآخر أنثويّ","انقسام الكائن إلى نصفين متساويين في الكتلة فقط"],
   "في اللاجنسيّ أبٌ واحدٌ ونسلٌ مطابقٌ وراثيًّا، كانقسام البكتيريا. وفي الجنسيّ أبوان فيختلف النسل عنهما — وهذا مصدر التنوّع."],
  /* ── الدفعة الثانية ── */
  ["الكائنات الحيّة كلّها مكوّنةٌ من:",["خليّةٍ واحدةٍ أو أكثر","أنسجةٍ وأعضاء","أجهزةٍ متكاملة"],
   "نظريّة الخليّة: كلّ الكائنات الحيّة تتكوّن من خليّةٍ أو أكثر، والخليّة أصغر وحدة حياة، وكلّ خليّةٍ تنشأ من خليّةٍ سابقة."],
  ["نبتةٌ مالت سيقانُها نحو النافذة. هذا مثالٌ على:",["الاستجابة لمثير","الاتّزان الداخليّ","التكاثر اللاجنسيّ"],
   "الضوء مثير، وميلُ الساق نحوه استجابة. والاستجابة صفةٌ من صفات الحياة."],
  ["ما الأيض "+en("metabolism")+"؟",["مجموع التفاعلات الكيميائيّة التي تحدث داخل الكائن الحيّ","حركة الكائن بحثًا عن الغذاء","انتقال الصفات من الآباء إلى الأبناء"],
   "الأيض يشمل بناء الجزيئات الكبيرة وهدمها لإطلاق الطاقة، وهو جارٍ في كلّ خليّةٍ حيّة."],
  ["ما النظام البيئيّ "+en("ecosystem")+"؟",["المجتمع الحيويّ مع العوامل غير الحيّة المحيطة به","كلّ أفراد النوع الواحد في منطقةٍ ما","الغلاف الحيويّ كلّه على سطح الأرض"],
   "النظام البيئيّ يجمع الحيّ وغير الحيّ: الكائنات مع التربة والماء والضوء والحرارة."],
  ["ما الغلاف الحيويّ "+en("biosphere")+"؟",["الجزء من الأرض الذي توجد فيه الحياة، بما فيه من هواءٍ وماءٍ وتربة","طبقة الأوزون التي تحمي الأرض","الطبقة السطحيّة من التربة وحدها"],
   "الغلاف الحيويّ أوسع مستويات التنظيم: يشمل كلّ الأنظمة البيئيّة على الأرض."],
  ["الجمل يحتفظ بالماء ويتحمّل العطش. هذا مثالٌ على:",["التكيّف مع بيئةٍ صحراويّة","الاتّزان الداخليّ وحده","التكاثر الجنسيّ"],
   "التكيّف صفةٌ موروثةٌ تزيد فرصة البقاء في بيئةٍ بعينها — وصفاتُ الجمل تكيّفٌ مع شحّ الماء وحرارة الصحراء."],
  ["لماذا يُعدّ التنوّع الحيويّ مهمًّا؟",["لأنّه يزيد استقرار النظام البيئيّ ويوفّر موارد غذائيّةً ودوائيّة","لأنّه يزيد عدد الكائنات المفترسة فقط","لأنّه يُسرّع دورة الماء في الطبيعة"],
   "كلّما تنوّعت الأنواع كان النظام أقدرَ على مقاومة الأمراض والتغيّرات، وكثيرٌ من الأدوية أصلُها كائناتٌ حيّة."],
  ["أيّ المستويات أشمل: العضو أم الجهاز؟",["الجهاز، لأنّه مجموعة أعضاء تعمل معًا","العضو، لأنّه يحوي أجهزةً متعدّدة","هما في مستوًى واحد"],
   "المعدة عضو، والجهاز الهضميّ جهازٌ يضمّها مع المريء والأمعاء والكبد والبنكرياس."],
  ["ما وجه الخطأ في القول: «الفيروس كائنٌ حيٌّ كامل»؟",["لأنّه لا يقوم بالأيض ولا يتكاثر إلّا داخل خليّةٍ حيّة","لأنّه لا يحمل مادّةً وراثيّة","لأنّه أكبر من الخليّة البكتيريّة"],
   "الفيروس يحمل مادّةً وراثيّة لكنّه لا يستوفي صفات الحياة: لا أيض له ولا نموّ، ولا يتكاثر إلّا داخل عائل — ولهذا يُعدّ على حدّ الحياة."],
  ["لماذا يحتاج الكائن إلى التكاثر مع أنّ الفرد يعيش بدونه؟",["لأنّ التكاثر ضروريٌّ لبقاء النوع لا لبقاء الفرد","لأنّه يمدّ الفرد بالطاقة","لأنّه يحفظ الاتّزان الداخليّ للفرد"],
   "التكاثر هو الصفة الوحيدة من صفات الحياة التي يستغني عنها الفردُ ولا يستغني عنها النوع."]
];

/* ===== 1-2 طبيعة العلم وطرائقه ===== */
var B12 = [

   فراغًا، فلا يعرف التقريرُ عن الجلسةِ إلّا درجتَها — وهو ما طبعه تقريرُ
   حسنٍ «[بلا تفصيل مهارات]». فصار كلُّ سؤالٍ يحمل مفتاحَ بنكِه ورقمَه
   فيه («L2#17»)، فيُعرَف السؤالُ بعينِه لا درسُه فقط، ويُعرَف أيُّ خيارٍ
   اختاره. ووسمُ المهارةِ يُشتقّ من CFG نفسِه لا يُؤلَّف، فلا يتناقض مع
   اسمِ الدرسِ المعروضِ على الشاشة. */
function bankGen(bank, key){
  var f = function(){
    var i = Math.floor(Math.random()*bank.length), p = bank[i];
    var o=[p[1][0],p[1][1],p[1][2]]; shuffle(o);
    var r = [p[0], o, o.indexOf(p[1][0]), p[2]];
    r.__bk = (key||"")+"#"+i;
    return r;
  };
  f.__bank = key || "";
  return f;
}

function genN(gens, n){ var out=[], seen={}, t=0; while(out.length<n && t<n*30){ var f=gp(gens), q; try{ q=f(); }catch(e){ t++; continue; } t++; if(!q||seen[q[0]]) continue; seen[q[0]]=1; try{ q.__g=f.name||""; q.__gf=f; }catch(e){} out.push(q); } return out; }

  var curCh = "c1", curId = "b11";

  function panelOf(id){
    var pan = document.getElementById("p_"+id);
    if(!pan){ pan = document.createElement("section"); pan.className="panel"; pan.id="p_"+id; document.getElementById("panels").appendChild(pan); }
    return pan;
  }
  function leaveCur(){ var cur=document.querySelector(".panel.active"); if(cur && typeof cur._leave==="function") cur._leave(); }

  /* رابط شرحٍ لكلّ درسٍ من أوّل ما يفتحه الطالب — لا بعد إخفاقه فيه.
     وهو رابط بحثٍ بعبارةٍ مخصّصة لا رابط فيديو بعينه، فلا يموت الرابط
     إن حُذف الفيديو أو أُخفي. (انظر الشرح نفسه في chem10.html) */
  function ytLinkHtml(id){
    var rt=null;
    for(var i=0;i<REMTOPICS.length;i++){ if(REMTOPICS[i].id===id){ rt=REMTOPICS[i]; break; } }
    if(!rt) return '';
    return '<div style="margin-top:10px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(rt.yt||rt.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800;font-size:.88rem">🎬 شاهد شرح الدرس</a></div>';
  }
  function render(id){
    var c = CFG[id], sec = panelOf(id);
    var items = genN(c.gens, c.n);
    var html = '<div class="intro">'+c.intro+ytLinkHtml(id)+'</div>';
    items.forEach(function(q,i){
      html += '<div class="q" data-i="'+i+'"><div class="num">سؤال '+(i+1)+'</div><div class="stem">'+q[0]+'</div><div class="opts">';
      q[1].forEach(function(o,j){ html += '<button data-j="'+j+'">'+o+'</button>'; });
      html += '</div><div class="explain">'+q[3]+'</div></div>';
    });
    html += '<div class="scorebar"><span data-score dir="ltr">0 / '+items.length+'</span></div>'+
      '<button class="reset">أسئلة جديدة 🔄</button>';
    sec.innerHTML = html;
    var answered={}, correct=0, total=items.length, saved=false, savedN=0, pid=newPid();
    /* تفصيلُ المهارات: لكلِّ سؤالٍ وسمُه وأصاب أم أخطأ وكم مكث. والعتبةُ
       حدٌّ أدنى صريحٌ لا رقمٌ معاير — المعياريّةُ تُحسَب عند التحليلِ من
       تاريخِ الطفلِ نفسِه (كما شُرح في math9.html). */
    var RG_MS = 2000;
    var SKILLS={}, ITEMS=[], __t0=Date.now(), __lastTs=__t0, __fastN=0;
    function __meta(n){
      return { dur: Math.round((Date.now()-__t0)/1000), fast: __fastN,
               trusted: (__fastN < Math.ceil(n/2)),
               skills: SKILLS, items: ITEMS, rgMs: RG_MS };
    }
    /* وسمُ بنكِ الدرسِ يُشتقّ من CFG نفسِه لا يُؤلَّف، فلا يتناقض مع اسمِ
       الدرسِ المعروضِ على الشاشة. ويُقرأ عند الحاجةِ لا عند التحميلِ،
       فلا يتعلّق بترتيبِ التعريفات. */
    function __bankAr(key){
      try{
        if(typeof CFG==="undefined" || !CFG) return null;
        var ks=Object.keys(CFG);
        for(var i=0;i<ks.length;i++){
          if(/^all/.test(ks[i])) continue;          /* الشاملُ يخلط الدروس */
          var c=CFG[ks[i]];
          if(c && Array.isArray(c.gens) && c.gens.some(function(g){ return g && g.__bank===key; }))
            return c.label || c.tab || null;
        }
      }catch(e){}
      return null;
    }
    function __genLessonAr(gname){
      if(!gname) return null;
      try{
        if(typeof CFG==="undefined" || !CFG) return null;
        var ks=Object.keys(CFG);
        for(var i=0;i<ks.length;i++){
          if(/^all/.test(ks[i])) continue;
          var c=CFG[ks[i]];
          if(c && Array.isArray(c.gens) && c.gens.some(function(g){ return g && g.name===gname; }))
            return c.label || c.tab || null;
        }
      }catch(e){}
      return null;
    }
    function __tally(it, ok, j, ans){
      /* __bk أوّلًا: بنوكُ الدروسِ دوالُّ مجهولةُ الاسمِ فـ f.name لا يدلّ */
      var g = (it && (it.__bk || it.__sk || it.__g)) || "";
      var sk, __mb = /^([A-Za-z0-9_]+)#\d+$/.exec(g);
      if(__mb) sk = __bankAr(__mb[1]) || __mb[1];
      /* لا يُطبَع اسمُ دالّةٍ في تقريرٍ يقرأه الأبُ أبدًا — وهو عيبٌ وقع
         في math9.html فظهر «gConsecFamily» في تقريرِ حسن. فإن لم يكن
         للمولّدِ وسمٌ عربيٌّ في GEN_AR نزلنا إلى اسمِ درسِه من CFG،
         وهو أخشنُ من الوسمِ لكنّه صحيحٌ ومفهوم. */
      else sk = (typeof GEN_AR!=="undefined" && GEN_AR[g]) || __genLessonAr(g) || "غير محدّد";
      var now=Date.now(), ms=now-__lastTs; __lastTs=now;
      if(ms < RG_MS) __fastN++;
      var s = SKILLS[sk] || (SKILLS[sk]={c:0,t:0}); s.t++; if(ok) s.c++;
      ITEMS.push({ g:g, ok:(ok?1:0), ms:ms, j:j, a:ans });
    }
    var TALLY={};   /* نتيجةُ كلّ درسٍ داخل الاختبار الشامل */
    var scoreEl = sec.querySelector("[data-score]");
    sec.querySelectorAll(".q").forEach(function(qEl){
      var i=+qEl.dataset.i, ans=items[i][2];
      qEl.querySelectorAll(".opts button").forEach(function(btn){
        btn.addEventListener("click",function(){
          if(answered[i]) return; answered[i]=1;
          qEl.querySelectorAll(".opts button").forEach(function(b){ b.disabled=true; });
          var __ok = (+btn.dataset.j===ans);
          __tally(items[i], __ok, +btn.dataset.j, ans);
          if(/^all/.test(id)){ var __t=topicOfGen(items[i].__g, items[i].__gf); if(__t){ var __e=TALLY[__t]||(TALLY[__t]={c:0,t:0}); __e.t++; if(__ok) __e.c++; } }
          if(__ok){ btn.classList.add("correct"); correct++; }
          else{ btn.classList.add("wrong"); qEl.querySelectorAll(".opts button")[ans].classList.add("correct"); }
          qEl.querySelector(".explain").classList.add("show");
          scoreEl.textContent = correct+" / "+total;
          if(Object.keys(answered).length===total && savedN<total){ savedN=total; saved=true; saveScore(c.label, correct, total, pid, __meta(total));
            if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/total*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
        });
      });
    });
    /* الحفظ الجزئيّ لا يُقفل الجلسة بعده — انظر شرحه في math8.html */
    function savePartial(){ var n=Object.keys(answered).length; if(n<3||n<=savedN) return; savedN=n; saved=true; saveScore(c.label, correct, n, pid, __meta(n)); if(!/^all/.test(id)){ try{ localStorage.setItem(remKey(id), JSON.stringify({pct:Math.round(correct/n*100)})); }catch(e){} } else saveTopicTallies(TALLY); }
    sec._leave=savePartial; sec._done=function(){ return saved; };
    sec.querySelector(".reset").addEventListener("click", function(){ savePartial(); render(id); });
  }

  var REMTOPICS=[
    {id:"b11", name:"1-1 مدخل إلى علم الأحياء", tip:"صفات الكائن الحيّ: تنظيم، ونموّ وتطوّر، وتكاثر، واستجابة لمثير، وحاجة إلى طاقة، واتّزان داخليّ، وتكيّف. ومستويات التنظيم صعودًا: خليّة ← نسيج ← عضو ← جهاز ← كائن ← جماعة ← مجتمع ← نظام بيئيّ ← غلاف حيويّ. والتكاثر وحده صفةٌ يستغني عنها الفرد ولا يستغني عنها النوع.", yt:"شرح مدخل إلى علم الأحياء وصفات الكائنات الحية اول ثانوي"},
    {id:"b12", name:"1-2 طبيعة العلم وطرائقه", tip:"المستقلّ ما يُغيّره الباحث، والتابع ما يُقاس، والثوابت ما يُثبَّت. والمجموعة الضابطة مرجعُ المقارنة. والفرضيّة لا بدّ أن تكون قابلةً للاختبار. والنظريّة تفسّر «لماذا» والقانون يصف «ماذا يحدث» — ولا تتحوّل النظريّة إلى قانونٍ بمرور الزمن.", yt:"شرح طبيعة العلم وطرائقه والمتغيرات احياء اول ثانوي"},
    {id:"b21", name:"2-1 تاريخ التصنيف", tip:"التسمية الثنائيّة للينيوس: اسم الجنس بحرفٍ كبير ثمّ النوع بحرفٍ صغير، والاثنان مائلان. والمراتب من الأعمّ: مملكة ← شعبة ← طائفة ← رتبة ← فصيلة ← جنس ← نوع. والنوع: يتزاوج أفراده وينتجون نسلًا خصبًا — ولهذا البغل ليس نوعًا.", yt:"شرح تاريخ التصنيف والتسمية الثنائية لينيوس احياء اول ثانوي"},
    {id:"b22", name:"2-2 التصنيف الحديث", tip:"المتماثلة: أصلٌ واحدٌ ووظائف مختلفة (ذراع الإنسان وجناح الخفّاش) ⇐ تدلّ على قرابة. والمتشابهة: وظيفةٌ واحدةٌ وأصلٌ مختلف (جناح الحشرة والطير) ⇐ لا تدلّ على قرابة. والأثريّة بقايا ضامرة. والدليل الجزيئيّ أقوى الأدلّة كلّها.", yt:"شرح التصنيف الحديث والتراكيب المتماثلة والمتشابهة احياء اول ثانوي"},
    {id:"b31", name:"3-1 الفيروسات والبريونات", tip:"الفيروس مادّةٌ وراثيّة في كابسيد بروتينيّ، لا أيض له ولا يتكاثر إلّا داخل عائل. دورة التحلّل: تنفجر الخليّة. ودورة الاندماج: يندمج في الكروموسوم ويكمن. والقهقريّ ينسخ RNA إلى DNA. والمضادّ الحيويّ لا ينفع معه لأنّه ليس بكتيريا.", yt:"شرح الفيروسات ودورة التحلل والاندماج احياء اول ثانوي"},
    {id:"b32", name:"3-2 البكتيريا", tip:"بدائيّة النوى: لا نواةَ محاطةً بغشاءٍ ولا عضيّاتٍ غشائيّة، وكروموسومٌ حلقيٌّ مع بلازميدات. جدار الحقيقيّة ببتيدوجلايكان (يكشفه جرام). تتكاثر بالانشطار الثنائيّ، وتتبادل الجينات بالاقتران، وتصبر بالجرثومة الداخليّة. ودورها البيئيّ: التحليل وتثبيت النيتروجين.", yt:"شرح البكتيريا وتركيبها وتكاثرها احياء اول ثانوي"},
    {id:"b41", name:"4-1 مدخل إلى الطلائعيّات", tip:"مملكةٌ جامعة: حقيقيّة النوى وليست نباتًا ولا حيوانًا ولا فطرًا. ثلاثة أقسام: شبيهةٌ بالنبات (طحالب ذاتيّة التغذية)، وشبيهةٌ بالحيوان (أوّليّات مستهلكة)، وشبيهةٌ بالفطر (محلّلة). والحركة بالأهداب (براميسيوم) أو السوط (يوغلينا) أو الأقدام الكاذبة (أميبا).", yt:"شرح مدخل إلى الطلائعيات وأنواعها احياء اول ثانوي"},
    {id:"b42", name:"4-2 تنوّع الطلائعيّات", tip:"الدياتومات جدارها سليكا في مصراعين. والدوّامات السوطيّة بسوطين وتسبّب المدّ الأحمر. والطحالب البنّيّة عديدة الخلايا (ممسك لا جذر). والحمراء يُستخرج منها الآجار. والخضراء أقرب أسلاف النبات. والأعفان الغرويّة والمائيّة شبيهةٌ بالفطر.", yt:"شرح تنوع الطلائعيات الدياتومات والطحالب احياء اول ثانوي"},
    {id:"b51", name:"5-1 مدخل إلى الفطريّات", tip:"تغذيةٌ بالهضم الخارجيّ ثمّ الامتصاص، وجدارٌ من الكايتين. والخيط الفطريّ وحدة البناء، وشبكتُه الغزل الفطريّ، وما نراه من عيش الغراب جسمٌ ثمريّ. والأشنة تكافلُ فطرٍ وطحلب، والمايكورايزا تكافلُ فطرٍ وجذور نبات.", yt:"شرح مدخل إلى الفطريات وتركيبها وتغذيتها احياء اول ثانوي"},
    {id:"b52", name:"5-2 تنوّع الفطريّات وبيئتها", tip:"الاقترانيّة: خيوطٌ بلا حواجز وبوغٌ اقترانيّ (عفن الخبز). والكيسيّة: أبواغٌ في كيس (الخميرة والكمأة). والدعاميّة: أبواغٌ على دعامات (عيش الغراب والصدأ). والناقصة: لم يُعرف تكاثرها الجنسيّ بعد.", yt:"شرح تنوع الفطريات الكيسية والدعامية احياء اول ثانوي"},
    {id:"b61", name:"6-1 خصائص الحيوانات", tip:"الحيوان: عديد الخلايا، حقيقيّ النوى، غير ذاتيّ التغذية، بلا جدارٍ خلويّ، ويهضم داخليًّا. والتماثل الشعاعيّ للثابت أو الطافي، والجانبيّ للمتحرّك ويصاحبه تمركز الحواسّ في الرأس. والطبقات الجرثوميّة ثلاث: إكتوديرم وميزوديرم وإندوديرم.", yt:"شرح خصائص الحيوانات والتماثل احياء اول ثانوي"},
    {id:"b62", name:"6-2 مستويات بناء جسم الحيوان", tip:"الهياكل ثلاثة: مائيّ (دودة الأرض)، وخارجيّ (المفصليّات، يحتاج انسلاخًا)، وداخليّ (الفقاريّات، ينمو مع الجسم). والدوريّ مفتوحٌ (يغمر الأعضاء) أو مغلقٌ (يبقى في الأوعية، أكفأ). والتجاويف: عديمة ← كاذبة ← حقيقيّة.", yt:"شرح مستويات بناء جسم الحيوان والتجويف الجسمي احياء اول ثانوي"},
    {id:"b63", name:"6-3 الإسفنجيّات واللاسعات", tip:"الإسفنج مرشّحٌ بلا أنسجةٍ حقيقيّة: خلايا طوقيّة مسوّطة، ومسامّ للدخول وفتحةٌ عليا للخروج، وشويكاتٌ دعامة. واللاسعات أوّل ذوات الأنسجة الحقيقيّة: تماثلٌ شعاعيّ، وخلايا لاسعة، وطورا بوليب (ثابت) وميدوزا (سابح)، وتجويفٌ بفتحةٍ واحدة.", yt:"شرح الإسفنجيات واللاسعات احياء اول ثانوي"},
    {id:"b71", name:"7-1 الديدان المفلطحة", tip:"أوّل ذوات التماثل الجانبيّ، وعديمة التجويف، ولا جهاز دوريَّ لها — ولهذا جسمها مسطّحٌ ليقصر مسار الانتشار. والبلاناريا حرّةٌ لها بقعتان عينيّتان وخلايا لهبيّة. والشريطيّة طفيليّةٌ برأسٍ بممصّاتٍ وبلا جهازٍ هضميّ. والبلهارسيا تنتقل عبر قواقع المياه العذبة.", yt:"شرح الديدان المفلطحة البلاناريا والشريطية احياء اول ثانوي"},
    {id:"b72", name:"7-2 الديدان الأسطوانيّة والدوّارات", tip:"تجويفٌ كاذب، وأوّل قناةٍ هضميّةٍ كاملةٍ بفتحتين، وكيوتيكل يُنسلخ. ومنها الإسكارس (بيضٌ في غذاءٍ ملوّث) والخطّافيّة (تخترق الجلد) والفيلاريا (ينقلها البعوض). والدوّارات مجهريّةٌ لها تاجٌ هدبيٌّ يبدو دائرًا.", yt:"شرح الديدان الأسطوانية والدوارات احياء اول ثانوي"},
    {id:"b73", name:"7-3 الرخويّات", tip:"جسمٌ رخوٌ غير مقسّم: قدمٌ وكتلةٌ حشويّةٌ وعباءةٌ تفرز الصدفة، ومِبرَدٌ يكشط الغذاء (يغيب في المرشِّحات). ثلاث طوائف: بطنيّات القدم (حلزون)، وذوات المصراعين (محار، مرشّحات بلا مِبرَد)، والرأسقدميّات (أخطبوط، جهازٌ مغلقٌ ودفعٌ نفّاث).", yt:"شرح الرخويات بطنيات القدم وذوات المصراعين احياء اول ثانوي"},
    {id:"b74", name:"7-4 الديدان الحلقيّة", tip:"ثلاث صفاتٍ معًا: تقسّمٌ حقيقيّ، وتجويفٌ حقيقيّ، وجهازٌ دوريٌّ مغلق. ودودة الأرض تتنفّس بجلدها الرطب، وتتحرّك بعضلاتٍ طوليّةٍ ودائريّةٍ مع الأهلاب، وتُخرج بالنخريات، وتتكاثر بالحزام السرجيّ وهي خنثى متبادلة.", yt:"شرح الديدان الحلقية ودودة الأرض احياء اول ثانوي"},
    {id:"b81", name:"8-1 خصائص المفصليّات", tip:"أكبر شعبة: هيكلٌ خارجيٌّ من الكايتين يستلزم الانسلاخ، وزوائد مفصليّةٌ متخصّصة، وجهازٌ دوريٌّ مفتوح. والتنفّس: قصباتٌ في الحشرات، وخياشيم في القشريّات، ورئاتٌ كتابيّةٌ في العنكبيّات. والتحوّل كاملٌ (بيضة ← يرقة ← عذراء ← بالغ) أو ناقصٌ (بلا عذراء).", yt:"شرح خصائص المفصليات والهيكل الخارجي احياء اول ثانوي"},
    {id:"b82", name:"8-2 تنوّع المفصليّات", tip:"الحشرات: رأسٌ وصدرٌ وبطن، ستّ أرجل، زوج قرون استشعار، وغالبًا أجنحة. والعنكبيّات: رأسٌ صدريٌّ وبطن، ثماني أرجل، بلا قرونٍ ولا أجنحة. والقشريّات: زوجا قرونٍ وخياشيم. وعديدات الأرجل: أمّ أربعٍ وأربعين (زوجٌ لكلّ عقلةٍ، مفترسة) وأمّ أربعةٍ وأربعين (زوجان، آكلة نبات).", yt:"شرح تنوع المفصليات الحشرات والعنكبيات والقشريات احياء اول ثانوي"},
    {id:"b83", name:"8-3 الحشرات وأشباهها", tip:"أجزاء الفم تدلّ على الغذاء: ماضغةٌ (جراد)، وخرطومٌ ملتفٌّ (فراشة)، وإبرةٌ ثاقبةٌ ماصّة (بعوضة). والحشرات الاجتماعيّة (نحل ونمل) فيها تقسيم عملٍ وطبقات، وتتواصل بالفرمونات وبرقصة النحل. ودورها: تلقيحٌ ونقلُ أمراضٍ وغذاءٌ لغيرها.", yt:"شرح الحشرات وأجزاء الفم والحشرات الاجتماعية احياء اول ثانوي"}
  ];

  var ALL_IDS = ["all1","all2","all3","all4","all5","all6","all7","all8"];

  /* الاختبار الشامل يُغذّي «علاجي» بوسم كلّ سؤالٍ باسم مولّده — انظر الشرح
     الكامل في chem10.html وmath9.html. */
  function topicOfGen(name, fn){
    if(!window.__g2t){
      var m={}, pairs=[];
      Object.keys(CFG).forEach(function(id){
        if(ALL_IDS.indexOf(id)>-1 || id==="rem") return;
        (CFG[id].gens||[]).forEach(function(g){ if(!g) return; if(g.name) m[g.name]=id; pairs.push([g,id]); });
      });
      window.__g2t=m; window.__g2tp=pairs;
    }
    if(name && window.__g2t[name]) return window.__g2t[name];
    if(fn){ for(var i=0;i<window.__g2tp.length;i++) if(window.__g2tp[i][0]===fn) return window.__g2tp[i][1]; }
    return null;
  }
  function saveTopicTallies(tally){
    Object.keys(tally).forEach(function(tid){
      var v=tally[tid]; if(!v.t) return;
      var prev=null; try{ prev=JSON.parse(localStorage.getItem(remKey(tid))); }catch(e){}
      /* نتيجةُ درسٍ اختُبر وحده لا تُطمَس بتقديرٍ من الشامل */
      if(prev && typeof prev.pct==="number" && !prev.from) return;
      try{ localStorage.setItem(remKey(tid), JSON.stringify(
        { pct:Math.round(v.c/v.t*100), n:v.t, from:"all" })); }catch(e){}
    });
  }

  function remKey(id){ return "rem_"+REM_PAGE+"_"+who+"_"+id; }
  function renderRem(){
    var sec=panelOf("rem");
    var arr=REMTOPICS.map(function(t){ var s=null; try{ s=JSON.parse(localStorage.getItem(remKey(t.id))); }catch(e){} return {t:t, pct:(s&&typeof s.pct==="number")?s.pct:null, est:!!(s&&s.from==="all"), n:(s&&s.n)||null}; });
    var done=arr.filter(function(x){return x.pct!=null;}).sort(function(a,b){return a.pct-b.pct;});
    var html='<div class="intro">💪 <b>علاجي</b> — نرتّب الدروس من الأضعف للأقوى ونركّز على ضعفك. (يتحدّث بعد ما تختبر كل درس.)</div>';
    if(!done.length){ html+='<div class="q" style="text-align:center">لسّا ما اختبرت الدروس. جرّب دروس '+REM_LABEL+' ويرجع هنا يعرض أضعف درس مع نصيحة وزر مراجعة.</div>'; }
    else { done.forEach(function(x){ var weak=x.pct<70, col=weak?'var(--bad)':(x.pct<85?'#b45309':'var(--good)');
      html+='<div class="q"><div style="display:flex;justify-content:space-between;font-weight:800"><span>'+x.t.name+(x.est?' <span style="font-weight:400;font-size:.78rem;color:var(--muted)">تقديريّ من الشامل ('+(x.n===1?'سؤال واحد':x.n===2?'سؤالان':x.n+' أسئلة')+')</span>':'')+'</span><span style="color:'+col+'">'+x.pct+'%'+(weak?' ⚠️':(x.pct>=85?' ✅':''))+'</span></div>'+
        (weak?('<div style="margin-top:8px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.92rem">💡 '+x.t.tip+'</div><div style="margin-top:8px"><a href="https://www.youtube.com/results?search_query='+encodeURIComponent('عين دروس '+(x.t.yt||x.t.name))+'" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none;background:#dc2626;color:#fff;padding:9px 14px;border-radius:11px;font-weight:800">🎬 شاهد شرح</a></div>'):'')+
        '<button class="reset" data-go="'+x.t.id+'" style="margin-top:8px">'+(x.est?'اختبر «':'راجع «')+x.t.name+'» ←</button></div>'; }); }
    var un=arr.filter(function(x){return x.pct==null;});
    if(un.length){ html+='<div class="intro" style="margin-top:10px">📌 دروس ما جرّبتها بعد: '+un.map(function(x){return x.t.name;}).join(" · ")+'</div>'; }
    html+='<div style="text-align:center;margin-top:10px"><button data-remreset style="background:transparent;border:0;color:var(--muted);font-size:.8rem;cursor:pointer;text-decoration:underline;font-family:inherit">تصفير سجل العلاجي</button></div>';
    sec.innerHTML=html;
    sec.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goTo(b.dataset.go); }); });
    var rr=sec.querySelector("[data-remreset]"); if(rr) rr.addEventListener("click",function(){ REMTOPICS.forEach(function(t){ try{localStorage.removeItem(remKey(t.id));}catch(e){} }); renderRem(); });
  }

  function showPanel(id){
    leaveCur();
    document.querySelectorAll(".panel").forEach(function(p){ p.classList.remove("active"); });
    var pan = panelOf(id);
    pan.classList.add("active");
    curId = id;
    if(id==="rem"){ renderRem(); }
    else if(!pan.innerHTML || (pan._done && pan._done())) render(id);
  }
  function drawTabs(){
    var ch = CHAPS[curCh], t = document.getElementById("tabs");
    t.innerHTML = ch.ids.map(function(id){
      return '<button data-tab="'+id+'" aria-selected="'+(id===curId?"true":"false")+'">'+CFG[id].tab+'</button>';
    }).join("") + '<button data-tab="rem" aria-selected="'+(curId==="rem"?"true":"false")+'">علاجي 💪</button>';
    t.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        t.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected","false"); });
        b.setAttribute("aria-selected","true");
        showPanel(b.dataset.tab);
      });
    });
    document.getElementById("unit").innerHTML = ch.unit;
  }
  function drawChap(){
    var e = document.getElementById("chapsel");
    e.innerHTML = Object.keys(CHAPS).map(function(c){
      return '<button data-ch="'+c+'" aria-selected="'+(c===curCh?"true":"false")+'">'+CHAPS[c].name+'</button>';
    }).join("");
    e.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        if(curCh===b.dataset.ch) return;
        leaveCur(); curCh=b.dataset.ch; curId=CHAPS[curCh].ids[0];
        drawChap(); drawTabs(); showPanel(curId);
      });
    });
  }
  function chapOf(id){
    var found = null;
    Object.keys(CHAPS).forEach(function(c){ if(CHAPS[c].ids.indexOf(id) >= 0) found = c; });
    return found;
  }
  function goTo(id){
    var c = chapOf(id); if(c) curCh = c;
    curId = id; drawChap(); drawTabs(); showPanel(id);
  }

  drawChap(); drawTabs(); showPanel(curId);
  document.addEventListener("visibilitychange", function(){ if(document.hidden){ leaveCur(); } });
  window.addEventListener("pagehide", function(){ leaveCur(); });

// ===== إنذاران للخروج من الصفحة: أول مرة تنبيه، ثاني مرة تنتهي الجلسة =====
(function(){var ex=0,h=null;
function tst(){var t=document.getElementById("__extoast");if(!t){t=document.createElement("div");t.id="__extoast";t.setAttribute("style","position:fixed;top:0;left:0;right:0;z-index:2147483645;background:#b91c1c;color:#fff;padding:12px;text-align:center;font-weight:800;font-family:Tahoma,sans-serif;direction:rtl");document.body.appendChild(t);}t.innerHTML="⚠️ لا تخرج من الصفحة أثناء الحل! المرة الجاية تنتهي الجلسة.";t.style.display="block";clearTimeout(t._t);t._t=setTimeout(function(){t.style.display="none";},4000);}
function ejc(){if(document.getElementById("__eject"))return;try{leaveCur();}catch(e){}var ov=document.createElement("div");ov.id="__eject";ov.setAttribute("style","position:fixed;inset:0;z-index:2147483646;background:rgba(11,16,22,.97);color:#fff;display:flex;align-items:center;justify-content:center;direction:rtl;font-family:Tahoma,'Segoe UI',system-ui,sans-serif;padding:24px");ov.innerHTML='<div style="text-align:center;max-width:340px"><div style="font-size:3rem">🚫</div><h2 style="margin:12px 0 6px;font-size:1.4rem">انتهت الجلسة</h2><p style="opacity:.88;line-height:1.9">خرجت من صفحة الأسئلة <b>مرتين</b>. لازم تبقى داخل الصفحة أثناء الحل ولا تفتح أي تطبيق ثاني.<br>حدّث الصفحة وابدأ من جديد.</p><button onclick="location.reload()" style="margin-top:16px;padding:12px 24px;border:0;border-radius:12px;background:#3b5bdb;color:#fff;font-weight:800;font-size:1.05rem;cursor:pointer">🔄 إعادة التحميل</button></div>';document.body.appendChild(ov);}
document.addEventListener("visibilitychange",function(){if(document.hidden){h=Date.now();}else if(h!=null){var dur=Date.now()-h;h=null;if(dur<=2000)return;ex++;if(ex>=2)ejc();else tst();}});})();
}
</script>
